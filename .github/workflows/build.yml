name: Build Geode Mod (GD 2.2081)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build (GD 2.2081 - Geode v5.11.2)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Brand Icon, Geode Release Metadata, CMake and v30.0 Source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          if (-not (Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" -Force | Out-Null
          }
          if (Test-Path "main.cpp") {
            Remove-Item -Path "main.cpp" -Force
          }

          # 1. Generate 256x256 Signature Brand Icon for "Bypass Screen Tear" (logo.png)
          $logoPath = Join-Path $PWD "logo.png"
          $csCode = @'
          using System;
          using System.Drawing;
          using System.Drawing.Drawing2D;
          using System.Drawing.Imaging;
          using System.Drawing.Text;

          public static class IconBuilder {
              private static GraphicsPath CreateRoundedRect(RectangleF rect, float radius) {
                  float d = radius * 2f;
                  GraphicsPath path = new GraphicsPath();
                  path.AddArc(rect.X, rect.Y, d, d, 180f, 90f);
                  path.AddArc(rect.Right - d, rect.Y, d, d, 270f, 90f);
                  path.AddArc(rect.Right - d, rect.Bottom - d, d, d, 0f, 90f);
                  path.AddArc(rect.X, rect.Bottom - d, d, d, 90f, 90f);
                  path.CloseFigure();
                  return path;
              }

              private static GraphicsPath CreateHexShield(float cx, float cy, float radius) {
                  GraphicsPath path = new GraphicsPath();
                  PointF[] pts = new PointF[6];
                  for (int i = 0; i < 6; i++) {
                      double angle = (Math.PI / 180.0) * (60.0 * i - 90.0);
                      pts[i] = new PointF(
                          cx + (float)(radius * Math.Cos(angle)),
                          cy + (float)(radius * Math.Sin(angle))
                      );
                  }
                  path.AddPolygon(pts);
                  return path;
              }

              public static void Build(string path) {
                  using (Bitmap bmp = new Bitmap(256, 256, PixelFormat.Format32bppArgb))
                  using (Graphics g = Graphics.FromImage(bmp)) {
                      g.SmoothingMode = SmoothingMode.AntiAlias;
                      g.TextRenderingHint = TextRenderingHint.ClearTypeGridFit;
                      g.PixelOffsetMode = PixelOffsetMode.HighQuality;
                      g.Clear(Color.FromArgb(0, 0, 0, 0));

                      // 1. Outer Rounded Obsidian Chassis
                      RectangleF outerBox = new RectangleF(8f, 8f, 240f, 240f);
                      using (GraphicsPath outerPath = CreateRoundedRect(outerBox, 46f))
                      using (LinearGradientBrush bgBrush = new LinearGradientBrush(
                          outerBox,
                          Color.FromArgb(255, 12, 16, 36),
                          Color.FromArgb(255, 5, 7, 16),
                          135f)) {
                          g.FillPath(bgBrush, outerPath);

                          using (GraphicsPath auraPath = new GraphicsPath()) {
                              auraPath.AddEllipse(18f, 18f, 220f, 220f);
                              using (PathGradientBrush auraBrush = new PathGradientBrush(auraPath)) {
                                  auraBrush.CenterColor = Color.FromArgb(95, 0, 220, 255);
                                  auraBrush.SurroundColors = new Color[] { Color.FromArgb(0, 0, 0, 0) };
                                  g.FillPath(auraBrush, auraPath);
                              }
                          }

                          using (LinearGradientBrush rimGrad = new LinearGradientBrush(
                              outerBox,
                              Color.FromArgb(255, 0, 255, 220),
                              Color.FromArgb(255, 0, 110, 255),
                              45f))
                          using (Pen rimPen = new Pen(rimGrad, 6.5f)) {
                              g.DrawPath(rimPen, outerPath);
                          }
                      }

                      using (GraphicsPath innerFrame = CreateRoundedRect(new RectangleF(18f, 18f, 220f, 220f), 36f))
                      using (Pen innerPen = new Pen(Color.FromArgb(70, 0, 240, 255), 1.8f)) {
                          g.DrawPath(innerPen, innerFrame);
                      }

                      // 2. Center Hexagonal Brand Crest
                      using (GraphicsPath hexOuter = CreateHexShield(128f, 110f, 68f))
                      using (GraphicsPath hexInner = CreateHexShield(128f, 110f, 58f))
                      using (LinearGradientBrush hexFill = new LinearGradientBrush(
                          new RectangleF(60f, 42f, 136f, 136f),
                          Color.FromArgb(255, 18, 36, 74),
                          Color.FromArgb(255, 8, 14, 32),
                          90f))
                      using (LinearGradientBrush hexBorderGrad = new LinearGradientBrush(
                          new RectangleF(60f, 42f, 136f, 136f),
                          Color.FromArgb(255, 0, 255, 190),
                          Color.FromArgb(255, 0, 140, 255),
                          45f))
                      using (Pen hexPen = new Pen(hexBorderGrad, 4f))
                      using (Pen hexInnerPen = new Pen(Color.FromArgb(90, 255, 255, 255), 1.5f)) {
                          g.FillPath(hexFill, hexOuter);
                          g.DrawPath(hexPen, hexOuter);
                          g.DrawPath(hexInnerPen, hexInner);
                      }

                      // 3. Split-Screen Visual Inside Crest (Left: Torn Scanlines, Right: Locked Sync Wave)
                      using (SolidBrush tearCrimson = new SolidBrush(Color.FromArgb(210, 255, 55, 95)))
                      using (SolidBrush tearAmber = new SolidBrush(Color.FromArgb(190, 255, 165, 0))) {
                          g.FillRectangle(tearCrimson, 76f, 84f, 36f, 5f);
                          g.FillRectangle(tearAmber, 84f, 98f, 30f, 4f);
                          g.FillRectangle(tearCrimson, 72f, 112f, 38f, 5f);
                          g.FillRectangle(tearAmber, 80f, 126f, 28f, 4f);
                      }

                      PointF[] syncPulse = new PointF[] {
                          new PointF(122f, 110f),
                          new PointF(138f, 110f),
                          new PointF(148f, 82f),
                          new PointF(162f, 136f),
                          new PointF(172f, 110f),
                          new PointF(184f, 110f)
                      };
                      using (Pen pulseGlow = new Pen(Color.FromArgb(100, 0, 255, 180), 10f))
                      using (Pen pulseCore = new Pen(Color.FromArgb(255, 0, 255, 200), 4.2f)) {
                          pulseGlow.LineJoin = LineJoin.Round;
                          pulseCore.LineJoin = LineJoin.Round;
                          g.DrawLines(pulseGlow, syncPulse);
                          g.DrawLines(pulseCore, syncPulse);
                      }

                      // Dynamic Lightning / Prism Slash ("BYPASS" Blade) Cutting Across the Center
                      PointF[] bladePts = new PointF[] {
                          new PointF(136f, 52f),
                          new PointF(104f, 108f),
                          new PointF(126f, 108f),
                          new PointF(114f, 166f),
                          new PointF(150f, 102f),
                          new PointF(128f, 102f)
                      };
                      using (GraphicsPath bladePath = new GraphicsPath()) {
                          bladePath.AddPolygon(bladePts);
                          using (Pen bladeGlow = new Pen(Color.FromArgb(120, 0, 240, 255), 8f))
                          using (LinearGradientBrush bladeFill = new LinearGradientBrush(
                              new RectangleF(100f, 50f, 55f, 120f),
                              Color.FromArgb(255, 255, 255, 255),
                              Color.FromArgb(255, 0, 240, 255),
                              90f)) {
                              bladeGlow.LineJoin = LineJoin.Round;
                              g.DrawPath(bladeGlow, bladePath);
                              g.FillPath(bladeFill, bladePath);
                          }
                      }

                      // 4. Top Brand Tag: "YINGSEO"
                      using (Font devFont = new Font("Arial", 9.5f, FontStyle.Bold))
                      using (StringFormat sfCenter = new StringFormat() { Alignment = StringAlignment.Center })
                      using (SolidBrush cyanText = new SolidBrush(Color.FromArgb(220, 0, 240, 255))) {
                          g.DrawString("Y I N G S E O", devFont, cyanText, new RectangleF(0f, 24f, 256f, 18f), sfCenter);
                      }

                      // 5. Main Brand Title: "BYPASS" + Bottom Ribbon: "SCREEN TEAR"
                      using (Font mainFont = new Font("Arial", 21f, FontStyle.Bold))
                      using (StringFormat sfCenter = new StringFormat() { Alignment = StringAlignment.Center })
                      using (SolidBrush shadow = new SolidBrush(Color.FromArgb(210, 0, 0, 0)))
                      using (SolidBrush white = new SolidBrush(Color.FromArgb(255, 248, 252, 255))) {
                          g.DrawString("BYPASS", mainFont, shadow, new RectangleF(2f, 172f, 256f, 34f), sfCenter);
                          g.DrawString("BYPASS", mainFont, white, new RectangleF(0f, 170f, 256f, 34f), sfCenter);
                      }

                      RectangleF badgeRect = new RectangleF(32f, 204f, 192f, 30f);
                      using (GraphicsPath badgePath = CreateRoundedRect(badgeRect, 15f))
                      using (LinearGradientBrush badgeFill = new LinearGradientBrush(
                          badgeRect,
                          Color.FromArgb(255, 0, 195, 255),
                          Color.FromArgb(255, 0, 230, 170),
                          0f))
                      using (Pen badgePen = new Pen(Color.FromArgb(255, 210, 255, 255), 1.8f)) {
                          g.FillPath(badgeFill, badgePath);
                          g.DrawPath(badgePen, badgePath);
                      }

                      using (Font subFont = new Font("Arial", 12f, FontStyle.Bold))
                      using (StringFormat sfMid = new StringFormat() { Alignment = StringAlignment.Center, LineAlignment = StringAlignment.Center })
                      using (SolidBrush darkText = new SolidBrush(Color.FromArgb(255, 6, 14, 28))) {
                          g.DrawString("SCREEN TEAR", subFont, darkText, badgeRect, sfMid);
                      }

                      bmp.Save(path, ImageFormat.Png);
                  }
              }
          }
          '@
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition $csCode
          [IconBuilder]::Build($logoPath)

          # 2. Generate Geode-Index Ready about.md (100% English)
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm 'UTC'")
          $aboutLines = @(
            '# <cy>Bypass Screen Tear</c>',
            '',
            '- **<cg>Mod ID:</c>** `yingseo.notear.fps`',
            '- **<cg>Developer:</c>** `YingSeo`',
            '- **<cg>Released:</c>** `2026-11-07`',
            "- **<cy>Updated:</c>** ``$buildDate (v30.0.0)``",
            '- **<cp>Platform:</c>** `Geometry Dash 2.2081 (Geode v5.11.2 - Windows x64)`',
            '',
            '---',
            '',
            '### <cg>Overview</c>',
            '**Bypass Screen Tear** is a production-ready, single-purpose Geode mod that completely eliminates **horizontal screen tearing (glitch lines)** when **Unlock FPS** (120 / 240 / 360 / 480+ FPS) is enabled on a 60Hz display — with **zero slow-motion on high-object levels**, **instant click response**, and **zero stutter during repeated deaths and respawns**.',
            '',
            '### <cy>v30.0 Architecture Highlights</c>',
            '- **Direct 1-Blit Pre-Visit Unlock Pipeline:** Eliminates intermediate staging buffers (`glStageFbo`), cutting VRAM blit bandwidth in half. Frames are blitted directly from `FBO 0` to `glInteropFbo` at the end of `swapBuffers()`, while `wglDXUnlockObjectsNV` is executed strictly inside `CCScheduler::update` *before* `CCNode::visit()` begins — guaranteeing **0.000ms GPU wait** and preventing **Smooth Fix slow-motion** on heavy levels.',
            '- **40% VBlank Late-Latch + Presenter `SetMaximumFrameLatency(1)`:** Captures fresh frames at 40% into the 60Hz VBlank cycle and restricts the isolated presenter swapchain queue depth to 1 frame, delivering instant click/jump response.',
            '- **2-Frame Respawn Cooldown Shield:** Detects CPU spikes during `PlayLayer::destroyPlayer` and `PlayLayer::resetLevel` (`>= 2.2ms`) and grants a 2-tick interop cooldown so repeated deaths and respawns are 100% stutter-free.',
            '- **Core-Separated Hardware V-Sync Presenter:** Pins the presenter thread to a separate logical CPU core so `Present(1, 0)` / `DwmFlush` never preempts the main game thread.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "about.md"), $aboutLines, $utf8NoBom)

          # 3. Generate Geode-Index Ready changelog.md (100% English)
          $changelogLines = @(
            "# v30.0.0 ($buildDate)",
            '- **Fixed Slow-Motion on High-Graphics Levels:** Removed `glStageFbo` (cutting full-screen 1080p VRAM blits in half) and eliminated the synchronous `glBlitFramebuffer` -> `wglDXUnlockObjectsNV` stall that pushed heavy level frame times above 4.16ms and triggered Smooth Fix slow-motion.',
            '- **Guaranteed Pre-Visit WGL Unlock:** Ensured `wglDXUnlockObjectsNV` always completes inside `CCScheduler::update` (after the inter-frame wait and before `glClear` / `CCNode::visit`), so `hInteropObject` is never locked while rendering a frame and never unlocked after `visit()`.',
            '- **Fixed Repeated Death & Respawn Stutter:** Added a 2-tick respawn cooldown shield (`cooldownFramesAfterSpike = 2`) whenever `CCScheduler::update` exceeds `2.2ms`, isolating `PlayLayer::destroyPlayer` and `PlayLayer::resetLevel` from any GPU interop work.',
            '- **Fixed Click / Jump Delay:** Combined Direct 1-Blit capture, 40% VBlank Late-Latch sampling, and isolated `presentDevice` `SetMaximumFrameLatency(1)` to cut visual input latency to the hardware minimum.',
            '- **CPU Core Separation & High Priority Boost:** Elevated process priority and pinned the background presenter thread to a separate logical CPU core via `SetThreadIdealProcessor` so it never preempts the main thread.',
            '',
            '# v23.0.0 - v29.0.0 (2026-11-11)',
            '- Established official **Bypass Screen Tear** (`yingseo.notear.fps`) branding, Hex-Crest icon, and automatic click-through child window fallback.',
            '',
            '# v1.0.0 - v22.0.0 (2026-11-07)',
            '- Initial development of the Dual-Device DXGI Flip-Discard V-Sync presenter engine for Geometry Dash 2.2081.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "changelog.md"), $changelogLines, $utf8NoBom)

          # 4. Generate Geode-Index Compliant mod.json
          $modJsonLines = @(
            '{',
            '    "geode": "5.11.2",',
            '    "gd": {',
            '        "win": "2.2081"',
            '    },',
            '    "id": "yingseo.notear.fps",',
            '    "name": "Bypass Screen Tear",',
            '    "version": "v30.0.0",',
            '    "developer": "YingSeo",',
            '    "description": "Eliminates 100% of screen tearing on Unlock FPS in GD 2.2081 with zero slow-motion, instant click response, and smooth respawns.",',
            '    "early-load": true,',
            '    "tags": [',
            '        "performance",',
            '        "enhancement",',
            '        "universal"',
            '    ]',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "mod.json"), $modJsonLines, $utf8NoBom)

          # 5. Generate CMakeLists.txt
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_EXTENSIONS OFF)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            '',
            'project(BypassScreenTear VERSION 30.0.0)',
            '',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            '',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            '',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            'setup_geode_mod(${PROJECT_NAME})'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "CMakeLists.txt"), $cmakeLines, $utf8NoBom)

          # 6. Generate Production-Grade src/main.cpp (v30.0 Direct 1-Blit Pre-Visit Unlock + 40% Late-Latch + 2-Tick Respawn Shield)
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '#include <Geode/modify/CCScheduler.hpp>',
            '#include <atomic>',
            '#include <thread>',
            '#include <mutex>',
            '#include <cstring>',
            '#include <cstdlib>',
            '#include <cstdint>',
            '',
            'using namespace geode::prelude;',
            '',
            'namespace BypassScreenTearV30 {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    // ABI-exact DXGI & D3D11 structures',
            '    struct DxgiRational { uint32_t Numerator, Denominator; };',
            '    struct DxgiModeDesc {',
            '        uint32_t Width, Height;',
            '        DxgiRational RefreshRate;',
            '        uint32_t Format, ScanlineOrdering, Scaling;',
            '    };',
            '    struct DxgiSampleDesc { uint32_t Count, Quality; };',
            '    struct DxgiSwapChainDesc {',
            '        DxgiModeDesc BufferDesc;',
            '        DxgiSampleDesc SampleDesc;',
            '        uint32_t BufferUsage, BufferCount;',
            '        HWND OutputWindow;',
            '        int Windowed;',
            '        uint32_t SwapEffect, Flags;',
            '    };',
            '    struct D3D11Texture2DDesc {',
            '        uint32_t Width, Height, MipLevels, ArraySize, Format;',
            '        DxgiSampleDesc SampleDesc;',
            '        uint32_t Usage, BindFlags, CPUAccessFlags, MiscFlags;',
            '    };',
            '    struct DxgiAdapterDesc1 {',
            '        wchar_t Description[128];',
            '        uint32_t VendorId, DeviceId, SubSysId, Revision;',
            '        size_t DedicatedVideoMemory, DedicatedSystemMemory, SharedSystemMemory;',
            '        LUID AdapterLuid;',
            '        uint32_t Flags;',
            '    };',
            '    struct DwmMargins { int cxLeftWidth, cxRightWidth, cyTopHeight, cyBottomHeight; };',
            '',
            '    static const GUID kIID_IDXGIFactory1     = { 0x770aae78, 0xf26f, 0x4dba, { 0xa8, 0x29, 0x25, 0x3c, 0x83, 0xd1, 0xb3, 0x87 } };',
            '    static const GUID kIID_IDXGIDevice1      = { 0x77db970f, 0x6276, 0x48ba, { 0xba, 0x28, 0x07, 0x01, 0x43, 0xb4, 0x39, 0x2c } };',
            '    static const GUID kIID_IDXGIResource     = { 0x035f3ab4, 0x482e, 0x4e50, { 0xb4, 0x1f, 0x8a, 0x7f, 0x8b, 0xd8, 0x96, 0x0b } };',
            '    static const GUID kIID_ID3D11Texture2D   = { 0x6f15aaf2, 0xd208, 0x4e89, { 0x9a, 0xb4, 0x48, 0x95, 0x35, 0xd3, 0x4f, 0x9c } };',
            '    static const GUID kIID_ID3D10Multithread = { 0x9b7e4e00, 0x342c, 0x4106, { 0xa1, 0x9f, 0x4f, 0x27, 0x04, 0xf6, 0x89, 0xf0 } };',
            '',
            '    // COM VTable Helpers',
            '    using PFN_QI            = long(__stdcall*)(void*, const GUID*, void**);',
            '    using PFN_AddRef        = unsigned long(__stdcall*)(void*);',
            '    using PFN_Release       = unsigned long(__stdcall*)(void*);',
            '    using PFN_MakeWinAssoc  = long(__stdcall*)(void*, HWND, uint32_t);',
            '    using PFN_CreateSC      = long(__stdcall*)(void*, void*, DxgiSwapChainDesc*, void**);',
            '    using PFN_EnumAdapters1 = long(__stdcall*)(void*, uint32_t, void**);',
            '    using PFN_GetDesc1      = long(__stdcall*)(void*, DxgiAdapterDesc1*);',
            '    using PFN_Present       = long(__stdcall*)(void*, uint32_t, uint32_t);',
            '    using PFN_GetBuffer     = long(__stdcall*)(void*, uint32_t, const GUID*, void**);',
            '    using PFN_CreateTex2D   = long(__stdcall*)(void*, const D3D11Texture2DDesc*, const void*, void**);',
            '    using PFN_OpenSharedRes = long(__stdcall*)(void*, HANDLE, const GUID*, void**);',
            '    using PFN_GetSharedHdl  = long(__stdcall*)(void*, HANDLE*);',
            '    using PFN_CopyResource  = void(__stdcall*)(void*, void*, void*);',
            '    using PFN_Flush         = void(__stdcall*)(void*);',
            '    using PFN_SetMaxLatency = long(__stdcall*)(void*, uint32_t);',
            '    using PFN_SetMTProt     = int(__stdcall*)(void*, int);',
            '',
            '    inline long comQI(void* o, const GUID* id, void** out) { return reinterpret_cast<PFN_QI>((*reinterpret_cast<void***>(o))[0])(o, id, out); }',
            '    inline void comAddRef(void* o) { if (o) reinterpret_cast<PFN_AddRef>((*reinterpret_cast<void***>(o))[1])(o); }',
            '    inline void comRelease(void*& o) { if (o) { reinterpret_cast<PFN_Release>((*reinterpret_cast<void***>(o))[2])(o); o = nullptr; } }',
            '    inline void setDeviceMaxLatency1(void* dev) {',
            '        void* dxgiDev1 = nullptr;',
            '        if (dev && comQI(dev, &kIID_IDXGIDevice1, &dxgiDev1) >= 0 && dxgiDev1) {',
            '            reinterpret_cast<PFN_SetMaxLatency>((*reinterpret_cast<void***>(dxgiDev1))[12])(dxgiDev1, 1);',
            '            comRelease(dxgiDev1);',
            '        }',
            '    }',
            '    inline void enableMTProtected(void* dev) {',
            '        void* mt = nullptr;',
            '        if (dev && comQI(dev, &kIID_ID3D10Multithread, &mt) >= 0 && mt) {',
            '            reinterpret_cast<PFN_SetMTProt>((*reinterpret_cast<void***>(mt))[4])(mt, 1);',
            '            comRelease(mt);',
            '        }',
            '    }',
            '',
            '    // OpenGL Constants',
            '    constexpr uint32_t kGL_VENDOR                     = 0x1F00;',
            '    constexpr uint32_t kGL_READ_FRAMEBUFFER           = 0x8CA8;',
            '    constexpr uint32_t kGL_DRAW_FRAMEBUFFER           = 0x8CA9;',
            '    constexpr uint32_t kGL_READ_FRAMEBUFFER_BINDING   = 0x8CAA;',
            '    constexpr uint32_t kGL_DRAW_FRAMEBUFFER_BINDING   = 0x8CA6;',
            '    constexpr uint32_t kGL_RENDERBUFFER_BINDING       = 0x8CA7;',
            '    constexpr uint32_t kGL_RENDERBUFFER               = 0x8D41;',
            '    constexpr uint32_t kGL_TEXTURE_2D                 = 0x0DE1;',
            '    constexpr uint32_t kGL_COLOR_ATTACHMENT0          = 0x8CE0;',
            '    constexpr uint32_t kGL_FRAMEBUFFER_COMPLETE       = 0x8CD5;',
            '    constexpr uint32_t kGL_COLOR_BUFFER_BIT           = 0x00004000;',
            '    constexpr uint32_t kGL_NEAREST                    = 0x2600;',
            '    constexpr uint32_t kGL_SCISSOR_TEST               = 0x0C11;',
            '    constexpr uint32_t kGL_BACK                       = 0x0405;',
            '    constexpr uint32_t kGL_SYNC_GPU_COMMANDS_COMPLETE = 0x9117;',
            '    constexpr uint32_t kGL_ALREADY_SIGNALED           = 0x911A;',
            '    constexpr uint32_t kGL_CONDITION_SATISFIED        = 0x911C;',
            '    constexpr uint32_t kWGL_ACCESS_READ_WRITE_NV      = 0x0001;',
            '',
            '    // Dynamic Function Pointers',
            '    long(__stdcall* pCreateDXGIFactory1)(const GUID*, void**) = nullptr;',
            '    long(__stdcall* pD3D11CreateDevice)(void*, uint32_t, HMODULE, uint32_t, const uint32_t*, uint32_t, uint32_t, void**, uint32_t*, void**) = nullptr;',
            '    long(__stdcall* pDwmFlush)(void) = nullptr;',
            '    long(__stdcall* pDwmExtendFrame)(HWND, const DwmMargins*) = nullptr;',
            '    int(__stdcall* pGetDeviceCaps)(HDC, int) = nullptr;',
            '    long(__stdcall* pChangeDisplaySettingsA)(void*, unsigned long) = nullptr;',
            '',
            '    void*(__stdcall* pGetProcAddress)(const char*) = nullptr;',
            '    HDC(__stdcall* pGetCurrentDC)(void) = nullptr;',
            '    HGLRC(__stdcall* pGetCurrentContext)(void) = nullptr;',
            '    int(__stdcall* pWglSwapIntervalEXT)(int) = nullptr;',
            '    HANDLE(__stdcall* pWglDXOpenDeviceNV)(void*) = nullptr;',
            '    int(__stdcall* pWglDXCloseDeviceNV)(HANDLE) = nullptr;',
            '    HANDLE(__stdcall* pWglDXRegisterObjectNV)(HANDLE, void*, uint32_t, uint32_t, uint32_t) = nullptr;',
            '    int(__stdcall* pWglDXUnregisterObjectNV)(HANDLE, HANDLE) = nullptr;',
            '    int(__stdcall* pWglDXLockObjectsNV)(HANDLE, int32_t, HANDLE*) = nullptr;',
            '    int(__stdcall* pWglDXUnlockObjectsNV)(HANDLE, int32_t, HANDLE*) = nullptr;',
            '',
            '    const unsigned char*(__stdcall* pGlGetString)(uint32_t) = nullptr;',
            '    void(__stdcall* pGlGetIntegerv)(uint32_t, int32_t*) = nullptr;',
            '    unsigned char(__stdcall* pGlIsEnabled)(uint32_t) = nullptr;',
