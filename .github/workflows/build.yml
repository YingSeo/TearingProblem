            '    }',
            '',
            '    void cleanAllNvidiaProfiles() {',
            '        _putenv_s("OGL_CPL_PREFER_DXPRESENT", "0");',
            '        SetEnvironmentVariableA("OGL_CPL_PREFER_DXPRESENT", "0");',
            '        SetEnvironmentVariableW(L"OGL_CPL_PREFER_DXPRESENT", L"0");',
            '',
            '        HMODULE hNvapi = GetModuleHandleA("nvapi64.dll");',
            '        if (!hNvapi) hNvapi = LoadLibraryA("nvapi64.dll");',
            '        if (!hNvapi) return;',
            '',
            '        using PFN_QueryInterface = void*(__cdecl*)(uint32_t);',
            '        auto qi = reinterpret_cast<PFN_QueryInterface>(GetProcAddress(hNvapi, "nvapi_QueryInterface"));',
            '        if (!qi) return;',
            '',
            '        auto nvInit = reinterpret_cast<int(__cdecl*)(void)>(qi(0x0150E828));',
            '        auto createSess = reinterpret_cast<int(__cdecl*)(void**)>(qi(0x0694D52E));',
            '        auto destroySess = reinterpret_cast<int(__cdecl*)(void*)>(qi(0xDAD9CFF8));',
            '        auto loadSet = reinterpret_cast<int(__cdecl*)(void*)>(qi(0x375DBD6B));',
            '        auto saveSet = reinterpret_cast<int(__cdecl*)(void*)>(qi(0xFCBC7E14));',
            '        auto getBase = reinterpret_cast<int(__cdecl*)(void*, void**)>(qi(0xDA8466A0));',
            '        auto findProf = reinterpret_cast<int(__cdecl*)(void*, const wchar_t*, void**)>(qi(0x7E4A9A0B));',
            '        auto setSet = reinterpret_cast<int(__cdecl*)(void*, void*, void*)>(qi(0x577DD202));',
            '',
            '        if (!nvInit || !createSess || !destroySess || !loadSet || !saveSet || !getBase || !setSet) return;',
            '        if (nvInit() != 0) return;',
            '',
            '        void* hSess = nullptr;',
            '        if (createSess(&hSess) != 0 || !hSess) return;',
            '        if (loadSet(hSess) == 0) {',
            '            struct NvSetting { uint32_t ver; uint16_t name[2048]; uint32_t id, type, loc, pre, val; uint8_t b1[4100]; uint32_t cur; uint8_t b2[4096]; };',
            '            auto resetProf = [&](void* p) {',
            '                if (!p) return;',
            '                NvSetting s{}; s.ver = 12320u | (1u << 16); s.id = 0x20D690F8u;',
            '                setSet(hSess, p, &s);',
            '            };',
            '            void* hBase = nullptr;',
            '            if (getBase(hSess, &hBase) == 0) resetProf(hBase);',
            '            if (findProf) {',
            '                void* hGd = nullptr;',
            '                if (findProf(hSess, L"Geometry Dash", &hGd) == 0) resetProf(hGd);',
            '            }',
            '            saveSet(hSess);',
            '        }',
            '        destroySess(hSess);',
            '    }',
            '',
            '    bool loadAllApis() {',
            '        if (apisLoaded) return interopSupported;',
            '        apisLoaded = true;',
            '',
            '        LARGE_INTEGER freq{}, now{};',
            '        QueryPerformanceFrequency(&freq);',
            '        QueryPerformanceCounter(&now);',
            '        qpcFreq = freq.QuadPart;',
            '        refreshPeriodTicks.store(qpcFreq / 60, std::memory_order_relaxed);',
            '        lastVBlankEdgeQpc.store(now.QuadPart, std::memory_order_relaxed);',
            '        lastStageQpc = now.QuadPart;',
            '        lastCallQpc = now.QuadPart;',
            '',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto pTimeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"))) {',
            '                pTimeBegin(1);',
            '            }',
            '        }',
            '        if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '            pDwmFlush = reinterpret_cast<PFN_DwmFlush>(GetProcAddress(hDwm, "DwmFlush"));',
            '            pDwmExtendFrame = reinterpret_cast<PFN_DwmExtendFrame>(GetProcAddress(hDwm, "DwmExtendFrameIntoClientArea"));',
            '        }',
            '        if (HMODULE hGdi = GetModuleHandleA("gdi32.dll")) {',
            '            pGetDeviceCaps = reinterpret_cast<PFN_GetDeviceCaps>(GetProcAddress(hGdi, "GetDeviceCaps"));',
            '        }',
            '        if (HMODULE hUser = GetModuleHandleA("user32.dll")) {',
            '            pChangeDisplaySettingsA = reinterpret_cast<PFN_ChangeDisplaySettingsA>(GetProcAddress(hUser, "ChangeDisplaySettingsA"));',
            '        }',
            '',
            '        HMODULE hDxgi = LoadLibraryA("dxgi.dll");',
            '        HMODULE hD3D11 = LoadLibraryA("d3d11.dll");',
            '        HMODULE hGl = GetModuleHandleA("opengl32.dll");',
            '        if (!hDxgi || !hD3D11 || !hGl) return (interopSupported = false);',
            '',
            '        pCreateDXGIFactory1 = reinterpret_cast<PFN_CreateDXGIFactory1>(GetProcAddress(hDxgi, "CreateDXGIFactory1"));',
            '        pD3D11CreateDevice = reinterpret_cast<PFN_D3D11CreateDevice>(GetProcAddress(hD3D11, "D3D11CreateDevice"));',
            '        pGetProcAddress = reinterpret_cast<PFN_wglGetProcAddress>(GetProcAddress(hGl, "wglGetProcAddress"));',
            '        pGetCurrentDC = reinterpret_cast<PFN_wglGetCurrentDC>(GetProcAddress(hGl, "wglGetCurrentDC"));',
            '        pGetCurrentContext = reinterpret_cast<PFN_wglGetCurrentContext>(GetProcAddress(hGl, "wglGetCurrentContext"));',
            '',
            '        pGlGetString = reinterpret_cast<PFN_glGetString>(GetProcAddress(hGl, "glGetString"));',
            '        pGlGetIntegerv = reinterpret_cast<PFN_glGetIntegerv>(GetProcAddress(hGl, "glGetIntegerv"));',
            '        pGlIsEnabled = reinterpret_cast<PFN_glIsEnabled>(GetProcAddress(hGl, "glIsEnabled"));',
            '        pGlEnable = reinterpret_cast<PFN_glEnable>(GetProcAddress(hGl, "glEnable"));',
            '        pGlDisable = reinterpret_cast<PFN_glDisable>(GetProcAddress(hGl, "glDisable"));',
            '        pGlReadBuffer = reinterpret_cast<PFN_glReadBuffer>(GetProcAddress(hGl, "glReadBuffer"));',
            '        pGlFlush = reinterpret_cast<PFN_glFlush>(GetProcAddress(hGl, "glFlush"));',
            '        pGlGenTextures = reinterpret_cast<PFN_glGenTextures>(GetProcAddress(hGl, "glGenTextures"));',
            '        pGlDeleteTextures = reinterpret_cast<PFN_glDeleteTextures>(GetProcAddress(hGl, "glDeleteTextures"));',
            '        pGlBindTexture = reinterpret_cast<PFN_glBindTexture>(GetProcAddress(hGl, "glBindTexture"));',
            '',
            '        if (!pCreateDXGIFactory1 || !pD3D11CreateDevice || !pGetProcAddress || !pGetCurrentDC || !pGetCurrentContext) {',
            '            return (interopSupported = false);',
            '        }',
            '',
            '        pWglSwapIntervalEXT = reinterpret_cast<PFN_wglSwapIntervalEXT>(pGetProcAddress("wglSwapIntervalEXT"));',
            '        pWglDXOpenDeviceNV = reinterpret_cast<PFN_wglDXOpenDeviceNV>(pGetProcAddress("wglDXOpenDeviceNV"));',
            '        pWglDXCloseDeviceNV = reinterpret_cast<PFN_wglDXCloseDeviceNV>(pGetProcAddress("wglDXCloseDeviceNV"));',
            '        pWglDXRegisterObjectNV = reinterpret_cast<PFN_wglDXRegisterObjectNV>(pGetProcAddress("wglDXRegisterObjectNV"));',
            '        pWglDXUnregisterObjectNV = reinterpret_cast<PFN_wglDXUnregisterObjectNV>(pGetProcAddress("wglDXUnregisterObjectNV"));',
            '        pWglDXLockObjectsNV = reinterpret_cast<PFN_wglDXLockObjectsNV>(pGetProcAddress("wglDXLockObjectsNV"));',
            '        pWglDXUnlockObjectsNV = reinterpret_cast<PFN_wglDXUnlockObjectsNV>(pGetProcAddress("wglDXUnlockObjectsNV"));',
            '',
            '        pGlGenFramebuffers = reinterpret_cast<PFN_glGenFramebuffers>(pGetProcAddress("glGenFramebuffers"));',
            '        pGlDeleteFramebuffers = reinterpret_cast<PFN_glDeleteFramebuffers>(pGetProcAddress("glDeleteFramebuffers"));',
            '        pGlBindFramebuffer = reinterpret_cast<PFN_glBindFramebuffer>(pGetProcAddress("glBindFramebuffer"));',
            '        pGlCheckFramebufferStatus = reinterpret_cast<PFN_glCheckFramebufferStatus>(pGetProcAddress("glCheckFramebufferStatus"));',
            '        pGlGenRenderbuffers = reinterpret_cast<PFN_glGenRenderbuffers>(pGetProcAddress("glGenRenderbuffers"));',
            '        pGlDeleteRenderbuffers = reinterpret_cast<PFN_glDeleteRenderbuffers>(pGetProcAddress("glDeleteRenderbuffers"));',
            '        pGlBindRenderbuffer = reinterpret_cast<PFN_glBindRenderbuffer>(pGetProcAddress("glBindRenderbuffer"));',
            '        pGlRenderbufferStorage = reinterpret_cast<PFN_glRenderbufferStorage>(pGetProcAddress("glRenderbufferStorage"));',
            '        pGlFramebufferRenderbuffer = reinterpret_cast<PFN_glFramebufferRenderbuffer>(pGetProcAddress("glFramebufferRenderbuffer"));',
            '        pGlFramebufferTexture2D = reinterpret_cast<PFN_glFramebufferTexture2D>(pGetProcAddress("glFramebufferTexture2D"));',
            '        pGlBlitFramebuffer = reinterpret_cast<PFN_glBlitFramebuffer>(pGetProcAddress("glBlitFramebuffer"));',
            '',
            '        pGlFenceSync = reinterpret_cast<PFN_glFenceSync>(pGetProcAddress("glFenceSync"));',
            '        pGlClientWaitSync = reinterpret_cast<PFN_glClientWaitSync>(pGetProcAddress("glClientWaitSync"));',
            '        pGlDeleteSync = reinterpret_cast<PFN_glDeleteSync>(pGetProcAddress("glDeleteSync"));',
            '',
            '        if (!pWglDXOpenDeviceNV || !pWglDXRegisterObjectNV || !pWglDXLockObjectsNV || !pWglDXUnlockObjectsNV ||',
            '            !pGlGenFramebuffers || !pGlBindFramebuffer || !pGlBlitFramebuffer) {',
            '            return (interopSupported = false);',
            '        }',
            '        return true;',
            '    }',
            '',
            '    void destroyResourcesLocked() {',
            '        bridgeActive.store(false, std::memory_order_release);',
            '        latestReadySlot.store(-1, std::memory_order_relaxed);',
            '        presentingSlot.store(-1, std::memory_order_relaxed);',
            '',
            '        if (stageFence && pGlDeleteSync) {',
            '            pGlDeleteSync(stageFence);',
            '            stageFence = nullptr;',
            '        }',
            '        stageInFlight = false;',
            '',
            '        if (glStageFbo && pGlDeleteFramebuffers) { pGlDeleteFramebuffers(1, &glStageFbo); glStageFbo = 0; }',
            '        if (glStageRbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &glStageRbo); glStageRbo = 0; }',
            '',
            '        if (hInteropDevice && hInteropObject && pWglDXUnregisterObjectNV) {',
            '            pWglDXUnregisterObjectNV(hInteropDevice, hInteropObject);',
            '        }',
            '        hInteropObject = nullptr;',
            '',
            '        if (glInteropFbo && pGlDeleteFramebuffers) { pGlDeleteFramebuffers(1, &glInteropFbo); glInteropFbo = 0; }',
            '        if (glInteropRbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &glInteropRbo); glInteropRbo = 0; }',
            '        if (glInteropTex && pGlDeleteTextures) { pGlDeleteTextures(1, &glInteropTex); glInteropTex = 0; }',
            '',
            '        if (hInteropDevice && pWglDXCloseDeviceNV) {',
            '            pWglDXCloseDeviceNV(hInteropDevice);',
            '        }',
            '        hInteropDevice = nullptr;',
            '',
            '        for (int i = 0; i < 3; ++i) {',
            '            if (singleDeviceMode) ringTexPresent[i] = nullptr;',
            '            else comRelease(ringTexPresent[i]);',
            '            comRelease(ringTexMain[i]);',
            '        }',
            '',
            '        comRelease(interopCaptureTex);',
            '        comRelease(dxgiSwapChain);',
            '',
            '        if (singleDeviceMode) { presentContext = nullptr; presentDevice = nullptr; }',
            '        else { comRelease(presentContext); comRelease(presentDevice); }',
            '        comRelease(interopContext);',
            '        comRelease(interopDevice);',
            '        singleDeviceMode = false;',
            '    }',
            '',
            '    void prepareBorderlessWindow(HWND hwnd, HDC hdc) {',
            '        if (hdc && pGetDeviceCaps) {',
            '            int hz = pGetDeviceCaps(hdc, 116);',
            '            if (hz >= 30 && hz <= 360 && qpcFreq > 0) {',
            '                refreshPeriodTicks.store(qpcFreq / hz, std::memory_order_relaxed);',
            '            }',
            '        }',
            '        HMONITOR hMon = MonitorFromWindow(hwnd, MONITOR_DEFAULTTONEAREST);',
            '        MONITORINFO mi{}; mi.cbSize = sizeof(MONITORINFO);',
            '        if (GetMonitorInfoA(hMon, &mi)) {',
            '            RECT wr{};',
            '            if (GetWindowRect(hwnd, &wr)) {',
            '                int monW = mi.rcMonitor.right - mi.rcMonitor.left;',
            '                int monH = mi.rcMonitor.bottom - mi.rcMonitor.top;',
            '                if ((wr.right - wr.left) >= monW - 4 && (wr.bottom - wr.top) >= monH - 4) {',
            '                    if (pChangeDisplaySettingsA) pChangeDisplaySettingsA(nullptr, 0);',
            '                    LONG_PTR style = GetWindowLongPtrA(hwnd, GWL_STYLE);',
            '                    style &= ~(WS_CAPTION | WS_THICKFRAME | WS_MINIMIZEBOX | WS_MAXIMIZEBOX | WS_SYSMENU);',
            '                    style |= WS_POPUP | WS_VISIBLE;',
            '                    SetWindowLongPtrA(hwnd, GWL_STYLE, style);',
            '                    SetWindowPos(hwnd, HWND_TOP, mi.rcMonitor.left, mi.rcMonitor.top, monW, monH,',
            '                                 SWP_NOOWNERZORDER | SWP_NOACTIVATE | SWP_FRAMECHANGED | SWP_SHOWWINDOW);',
            '                }',
            '            }',
            '        }',
            '        if (pDwmExtendFrame) {',
            '            DwmMargins margins{0, 0, 0, 1};',
            '            pDwmExtendFrame(hwnd, &margins);',
            '        }',
            '    }',
            '',
            '    HWND ensureChildSwapWindow(HWND hwndParent, uint32_t w, uint32_t h) {',
            '        HINSTANCE hInst = GetModuleHandleA(nullptr);',
            '        if (!childClassRegistered) {',
            '            WNDCLASSEXA wc{}; wc.cbSize = sizeof(WNDCLASSEXA); wc.style = CS_OWNDC;',
            '            wc.lpfnWndProc = ChildSwapWndProc; wc.hInstance = hInst;',
            '            wc.lpszClassName = "GeodeBypassTearV27Child";',
            '            RegisterClassExA(&wc);',
            '            childClassRegistered = true;',
            '        }',
            '        LONG_PTR parentStyle = GetWindowLongPtrA(hwndParent, GWL_STYLE);',
            '        if (!(parentStyle & WS_CLIPCHILDREN)) {',
            '            SetWindowLongPtrA(hwndParent, GWL_STYLE, parentStyle | WS_CLIPCHILDREN | WS_CLIPSIBLINGS);',
            '        }',
            '        if (!childSwapHwnd || !IsWindow(childSwapHwnd) || GetParent(childSwapHwnd) != hwndParent) {',
            '            if (childSwapHwnd && IsWindow(childSwapHwnd)) DestroyWindow(childSwapHwnd);',
            '            childSwapHwnd = CreateWindowExA(',
            '                WS_EX_NOPARENTNOTIFY | WS_EX_TRANSPARENT, "GeodeBypassTearV27Child", "",',
            '                WS_CHILD | WS_VISIBLE | WS_CLIPSIBLINGS | WS_DISABLED,',
            '                0, 0, static_cast<int>(w), static_cast<int>(h), hwndParent, nullptr, hInst, nullptr);',
            '        } else {',
            '            SetWindowPos(childSwapHwnd, HWND_TOP, 0, 0, static_cast<int>(w), static_cast<int>(h), SWP_NOACTIVATE | SWP_SHOWWINDOW);',
            '        }',
            '        return childSwapHwnd;',
            '    }',
            '',
            '    // Dedicated Background V-Sync Presenter Thread',
            '    void presenterThreadLoop() {',
            '        SetThreadPriority(GetCurrentThread(), THREAD_PRIORITY_TIME_CRITICAL);',
            '',
            '        while (true) {',
            '            WaitForSingleObject(hFrameReadyEvent, 35);',
            '',
            '            if (!bridgeActive.load(std::memory_order_acquire)) {',
            '                vblankReadyForStage.store(true, std::memory_order_release);',
            '                continue;',
            '            }',
            '',
            '            int slot = latestReadySlot.exchange(-1, std::memory_order_acq_rel);',
            '            if (slot < 0 || slot >= 3) {',
            '                LARGE_INTEGER now{};',
            '                QueryPerformanceCounter(&now);',
            '                lastVBlankEdgeQpc.store(now.QuadPart, std::memory_order_release);',
            '                vblankReadyForStage.store(true, std::memory_order_release);',
            '                continue;',
            '            }',
            '            presentingSlot.store(slot, std::memory_order_release);',
            '',
            '            std::unique_lock<std::mutex> lock(bridgeMutex);',
            '            if (!bridgeActive.load(std::memory_order_relaxed) || !dxgiSwapChain || !presentContext || !ringTexPresent[slot]) {',
            '                presentingSlot.store(-1, std::memory_order_release);',
            '                vblankReadyForStage.store(true, std::memory_order_release);',
            '                continue;',
            '            }',
