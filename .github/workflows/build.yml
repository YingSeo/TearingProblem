name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build (GD 2.2081)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Icon, Docs, Config and Source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          if (-not (Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" -Force | Out-Null
          }
          if (Test-Path "main.cpp") {
            Remove-Item -Path "main.cpp" -Force
          }

          # 1. Generate 256x256 logo.png without Font overload errors
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(256, 256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(255, 12, 16, 30))

          $bBgInner = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 20, 28, 52))
          $g.FillRectangle($bBgInner, 24, 24, 208, 208)

          $pCyan = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 0, 229, 255), 8)
          $pPurple = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 124, 77, 255), 4)
          $pGreen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 0, 255, 170), 8)

          $g.DrawRectangle($pCyan, 16, 16, 224, 224)
          $g.DrawRectangle($pPurple, 28, 28, 200, 200)

          # Monitor Frame Icon
          $g.DrawRectangle($pCyan, 52, 60, 152, 98)
          $bCyan = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 0, 229, 255))
          $g.FillRectangle($bCyan, 112, 158, 32, 20)
          $g.FillRectangle($bCyan, 80, 178, 96, 12)

          # VBlank Sync Pulse Wave inside Monitor
          $g.DrawLine($pGreen, 66, 109, 102, 109)
          $g.DrawLine($pGreen, 102, 109, 118, 76)
          $g.DrawLine($pGreen, 118, 76, 138, 142)
          $g.DrawLine($pGreen, 138, 142, 154, 109)
          $g.DrawLine($pGreen, 154, 109, 190, 109)

          $g.Dispose()
          $bmp.Save((Join-Path $PWD "logo.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

          # 2. Generate about.md for Description tab
          $aboutLines = @(
            '# <cy>NoTear FPS</c>',
            '',
            'Automatically eliminates **screen tearing (horizontal glitch lines)** when **Unlock FPS** is enabled in Geometry Dash 2.2081.',
            '',
            '### <cg>How it works:</c>',
            '- **Full Unlock FPS Physics:** Keeps game physics, collisions, and click input running at 100% of your unlocked FPS (120 / 240 / 360 / 480 FPS).',
            '- **Hardware VBlank Lock:** Completes OpenGL rendering via `glFinish` and locks buffer presentation to the exact monitor VBlank interval (`wglSwapIntervalEXT` + `DwmFlush`).',
            '- **Plug and Play:** Works automatically in the background with zero configuration or menus.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "about.md"), $aboutLines, $utf8NoBom)

          # 3. Generate changelog.md for Changelog tab
          $changelogLines = @(
            '# v2.1.0',
            '- Fixed mod icon, description, changelog, and tags display in Geode.',
            '- Fixed automatic activation on startup (no longer stuck in Disabled state).',
            '- Upgraded VBlank phase lock with glFinish and DwmFlush fallback to completely eliminate screen tearing.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "changelog.md"), $changelogLines, $utf8NoBom)

          # 4. Generate mod.json
          $modJsonLines = @(
            '{',
            '    "geode": "5.3.0",',
            '    "gd": {',
            '        "win": "2.2081"',
            '    },',
            '    "id": "yingseo.notear-fps-pro",',
            '    "name": "NoTear FPS",',
            '    "version": "v2.1.0",',
            '    "developer": "YingSeo",',
            '    "description": "Automatically fixes screen tearing when Unlock FPS is enabled in Geometry Dash 2.2081.",',
            '    "tags": [',
            '        "performance",',
            '        "enhancement",',
            '        "universal"',
            '    ]',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "mod.json"), $modJsonLines, $utf8NoBom)

          # 5. Generate CMakeLists.txt with automatic Geode SDK version sync
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_EXTENSIONS OFF)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            '',
            'project(NoTearFPS VERSION 2.1.0)',
            '',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            '',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            '',
            'if (EXISTS "$ENV{GEODE_SDK}/VERSION")',
            '    file(READ "$ENV{GEODE_SDK}/VERSION" RAW_SDK_VER)',
            '    string(STRIP "${RAW_SDK_VER}" RAW_SDK_VER)',
            '    string(REGEX REPLACE "^v" "" EXACT_GEODE_VER "${RAW_SDK_VER}")',
            '    file(READ "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" MOD_JSON_TEXT)',
            '    string(REGEX REPLACE "\"geode\"[ \t]*:[ \t]*\"[^\"]+\"" "\"geode\": \"${EXACT_GEODE_VER}\"" MOD_JSON_TEXT "${MOD_JSON_TEXT}")',
            '    file(WRITE "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" "${MOD_JSON_TEXT}")',
            'endif()',
            '',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            '',
            'if (DEFINED GEODE_GD_VERSION AND NOT "${GEODE_GD_VERSION}" STREQUAL "")',
            '    file(READ "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" MOD_JSON_TEXT)',
            '    string(REGEX REPLACE "\"win\"[ \t]*:[ \t]*\"[^\"]+\"" "\"win\": \"${GEODE_GD_VERSION}\"" MOD_JSON_TEXT "${MOD_JSON_TEXT}")',
            '    file(WRITE "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" "${MOD_JSON_TEXT}")',
            'endif()',
            '',
            'setup_geode_mod(${PROJECT_NAME})'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "CMakeLists.txt"), $cmakeLines, $utf8NoBom)

          # 6. Generate src/main.cpp
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCDirector.hpp>',
            '#include <Geode/modify/CCScheduler.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '',
            'using namespace geode::prelude;',
            '',
            'namespace TearFix {',
            '    int64_t qpcFreq = 0;',
            '    int64_t lastVBlankQpc = 0;',
            '    int64_t refreshPeriodTicks = 0;',
            '',
            '    bool initialized = false;',
            '    bool shouldPresentFrame = true;',
            '    bool useDwmVBlankSync = false;',
            '',
            '    cocos2d::CCScene* hiddenScene = nullptr;',
            '    bool savedSceneVisible = true;',
            '    cocos2d::CCScene* lastScenePtr = nullptr;',
            '    uint32_t frameCounter = 0;',
            '',
            '    #ifdef GEODE_IS_WINDOWS',
            '    using PFN_timeBeginPeriod = unsigned int(__stdcall*)(unsigned int);',
            '    using PFN_DwmFlush = long(__stdcall*)(void);',
            '    using PFN_GetDeviceCaps = int(__stdcall*)(HDC, int);',
            '    using PFN_wglGetProcAddress = void*(__stdcall*)(const char*);',
            '    using PFN_wglGetCurrentDC = HDC(__stdcall*)(void);',
            '    using PFN_wglSwapIntervalEXT = int(__stdcall*)(int);',
            '    using PFN_glFinish = void(__stdcall*)(void);',
            '',
            '    PFN_DwmFlush pDwmFlush = nullptr;',
            '    PFN_GetDeviceCaps pGetDeviceCaps = nullptr;',
            '    PFN_wglGetProcAddress pGetProcAddress = nullptr;',
            '    PFN_wglGetCurrentDC pGetCurrentDC = nullptr;',
            '    PFN_wglSwapIntervalEXT pSwapInterval = nullptr;',
            '    PFN_glFinish pGlFinish = nullptr;',
            '    bool glResolved = false;',
            '',
            '    void ensureInit() {',
            '        if (initialized) return;',
            '        initialized = true;',
            '',
            '        LARGE_INTEGER freq{}, now{};',
            '        QueryPerformanceFrequency(&freq);',
            '        QueryPerformanceCounter(&now);',
            '        qpcFreq = freq.QuadPart;',
            '        lastVBlankQpc = now.QuadPart;',
            '        refreshPeriodTicks = qpcFreq / 60;',
            '',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto pTimeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"))) {',
            '                pTimeBegin(1);',
            '            }',
            '        }',
            '        if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '            pDwmFlush = reinterpret_cast<PFN_DwmFlush>(GetProcAddress(hDwm, "DwmFlush"));',
            '        }',
            '        if (HMODULE hGdi = GetModuleHandleA("gdi32.dll")) {',
            '            pGetDeviceCaps = reinterpret_cast<PFN_GetDeviceCaps>(GetProcAddress(hGdi, "GetDeviceCaps"));',
            '        }',
            '    }',
            '',
            '    void syncAndPresent(cocos2d::CCEGLView* view) {',
            '        if (!glResolved) {',
            '            glResolved = true;',
            '            if (HMODULE hGl = GetModuleHandleA("opengl32.dll")) {',
            '                pGlFinish = reinterpret_cast<PFN_glFinish>(GetProcAddress(hGl, "glFinish"));',
            '                pGetCurrentDC = reinterpret_cast<PFN_wglGetCurrentDC>(GetProcAddress(hGl, "wglGetCurrentDC"));',
            '                pGetProcAddress = reinterpret_cast<PFN_wglGetProcAddress>(GetProcAddress(hGl, "wglGetProcAddress"));',
            '            }',
            '        }',
            '',
            '        if (!pSwapInterval && pGetProcAddress) {',
            '            pSwapInterval = reinterpret_cast<PFN_wglSwapIntervalEXT>(pGetProcAddress("wglSwapIntervalEXT"));',
            '        }',
            '',
            '        if ((++frameCounter == 1 || frameCounter % 180 == 0) && pGetCurrentDC && pGetDeviceCaps) {',
            '            if (HDC hdc = pGetCurrentDC()) {',
            '                int hz = pGetDeviceCaps(hdc, 116);',
            '                if (hz >= 30 && hz <= 360) {',
            '                    refreshPeriodTicks = qpcFreq / hz;',
            '                }',
            '            }',
            '        }',
            '',
            '        // 1. Lock driver SwapInterval to VBlank (1)',
            '        if (pSwapInterval) {',
            '            pSwapInterval(1);',
            '        }',
            '',
            '        // 2. Finish all GPU draw commands in backbuffer before VBlank flip',
            '        if (pGlFinish) {',
            '            pGlFinish();',
            '        }',
            '',
            '        // 3. If Optimus / driver ignores wglSwapIntervalEXT(1), sync directly to DWM VBlank',
            '        if (useDwmVBlankSync && pDwmFlush) {',
            '            pDwmFlush();',
            '        }',
            '',
            '        view->CCEGLView::swapBuffers();',
            '',
            '        LARGE_INTEGER afterSwap{};',
            '        QueryPerformanceCounter(&afterSwap);',
            '        int64_t cycleTicks = afterSwap.QuadPart - lastVBlankQpc;',
            '',
            '        if (!useDwmVBlankSync && cycleTicks < (refreshPeriodTicks * 90) / 100) {',
            '            useDwmVBlankSync = true;',
            '        }',
            '        lastVBlankQpc = afterSwap.QuadPart;',
            '    }',
            '    #endif',
            '',
            '    void restoreSceneVisibility() {',
            '        if (hiddenScene != nullptr) {',
            '            hiddenScene->setVisible(savedSceneVisible);',
            '            hiddenScene = nullptr;',
            '        }',
            '    }',
            '}',
            '',
            'class $modify(TearFixDirector, cocos2d::CCDirector) {',
            '    void drawScene() {',
            '        TearFix::restoreSceneVisibility();',
            '        CCDirector::drawScene();',
            '        TearFix::restoreSceneVisibility();',
            '    }',
            '};',
            '',
            'class $modify(TearFixScheduler, cocos2d::CCScheduler) {',
            '    void update(float dt) {',
            '        // 1. Run Physics, Collisions & Input at full Unlock FPS (120/240/360/480Hz)',
            '        CCScheduler::update(dt);',
            '',
            '        #ifdef GEODE_IS_WINDOWS',
            '        TearFix::ensureInit();',
            '',
            '        auto* dir = cocos2d::CCDirector::sharedDirector();',
            '        if (!dir) return;',
            '',
            '        cocos2d::CCScene* scene = dir->getRunningScene();',
            '        bool sceneChanged = (scene == nullptr) || (scene != TearFix::lastScenePtr);',
            '        TearFix::lastScenePtr = scene;',
            '',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '        int64_t sinceLastVBlank = now.QuadPart - TearFix::lastVBlankQpc;',
            '        int64_t threshold = (TearFix::refreshPeriodTicks * 82) / 100;',
            '',
            '        if (sceneChanged || dir->isPaused() || sinceLastVBlank >= threshold) {',
            '            TearFix::shouldPresentFrame = true;',
            '        } else {',
            '            // Intermediate physics tick: skip OpenGL scene rendering to prevent tearing & GPU load',
            '            TearFix::shouldPresentFrame = false;',
            '            if (scene) {',
            '                TearFix::savedSceneVisible = scene->isVisible();',
            '                scene->setVisible(false);',
            '                TearFix::hiddenScene = scene;',
            '            }',
            '        }',
            '        #endif',
            '    }',
            '};',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    void swapBuffers() {',
            '        TearFix::restoreSceneVisibility();',
            '',
            '        if (!TearFix::shouldPresentFrame) {',
            '            return;',
            '        }',
            '',
            '        #ifdef GEODE_IS_WINDOWS',
            '        TearFix::syncAndPresent(this);',
            '        #else',
            '        CCEGLView::swapBuffers();',
            '        #endif',
            '    }',
            '};'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest

      - name: Collect Built .geode Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null
          $geodeFiles = Get-ChildItem -Path $PWD -Filter "*.geode" -Recurse
          if (-not $geodeFiles) {
            Write-Error "No .geode file found after build!"
            exit 1
          }
          foreach ($file in $geodeFiles) {
            Copy-Item -Path $file.FullName -Destination (Join-Path $PWD "artifact\$($file.Name)") -Force
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-v2.1.0
          path: artifact/*.geode
