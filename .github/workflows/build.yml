            '    };',
            '',
            '    static const GUID kIID_IDXGIFactory1 = {',
            '        0x770aae78, 0xf26f, 0x4dba, { 0xa8, 0x29, 0x25, 0x3c, 0x83, 0xd1, 0xb3, 0x87 }',
            '    };',
            '    static const GUID kIID_IDXGIResource = {',
            '        0x035f3ab4, 0x482e, 0x4e50, { 0xb4, 0x1f, 0x8a, 0x7f, 0x8b, 0xd8, 0x96, 0x0b }',
            '    };',
            '    static const GUID kIID_ID3D11Texture2D = {',
            '        0x6f15aaf2, 0xd208, 0x4e89, { 0x9a, 0xb4, 0x48, 0x95, 0x35, 0xd3, 0x4f, 0x9c }',
            '    };',
            '    static const GUID kIID_ID3D10Multithread = {',
            '        0x9b7e4e00, 0x342c, 0x4106, { 0xa1, 0x9f, 0x4f, 0x27, 0x04, 0xf6, 0x89, 0xf0 }',
            '    };',
            '',
            '    // COM VTable Wrappers',
            '    using PFN_UnknownQueryInterface = long(__stdcall*)(void*, const GUID*, void**);',
            '    using PFN_UnknownAddRef = unsigned long(__stdcall*)(void*);',
            '    using PFN_UnknownRelease = unsigned long(__stdcall*)(void*);',
            '    using PFN_FactoryMakeWindowAssociation = long(__stdcall*)(void*, HWND, uint32_t);',
            '    using PFN_FactoryCreateSwapChain = long(__stdcall*)(void*, void*, DxgiSwapChainDesc*, void**);',
            '    using PFN_Factory1EnumAdapters1 = long(__stdcall*)(void*, uint32_t, void**);',
            '    using PFN_Adapter1GetDesc1 = long(__stdcall*)(void*, DxgiAdapterDesc1*);',
            '    using PFN_SwapChainPresent = long(__stdcall*)(void*, uint32_t, uint32_t);',
