            '',
            '    void resetNvidiaAllowTearingFlag() {',
            '        _putenv_s("OGL_CPL_PREFER_DXPRESENT", "0");',
            '        SetEnvironmentVariableA("OGL_CPL_PREFER_DXPRESENT", "0");',
            '',
            '        HMODULE hNvapi = GetModuleHandleA("nvapi64.dll");',
            '        if (!hNvapi) hNvapi = LoadLibraryA("nvapi64.dll");',
            '        if (!hNvapi) return;',
            '',
            '        using PFN_QueryInterface = void*(__cdecl*)(uint32_t);',
            '        auto queryInterface = reinterpret_cast<PFN_QueryInterface>(GetProcAddress(hNvapi, "nvapi_QueryInterface"));',
            '        if (!queryInterface) return;',
            '',
            '        using PFN_Init = int(__cdecl*)(void);',
            '        using PFN_CreateSession = int(__cdecl*)(void**);',
            '        using PFN_DestroySession = int(__cdecl*)(void*);',
            '        using PFN_LoadSettings = int(__cdecl*)(void*);',
            '        using PFN_SaveSettings = int(__cdecl*)(void*);',
            '        using PFN_GetBaseProfile = int(__cdecl*)(void*, void**);',
            '        using PFN_DeleteSetting = int(__cdecl*)(void*, void*, uint32_t);',
            '',
            '        auto nvInit = reinterpret_cast<PFN_Init>(queryInterface(0x0150E828));',
            '        auto createSession = reinterpret_cast<PFN_CreateSession>(queryInterface(0x0694D52E));',
            '        auto destroySession = reinterpret_cast<PFN_DestroySession>(queryInterface(0xDAD9CFF8));',
            '        auto loadSettings = reinterpret_cast<PFN_LoadSettings>(queryInterface(0x375DBD6B));',
            '        auto saveSettings = reinterpret_cast<PFN_SaveSettings>(queryInterface(0xFCBC7E14));',
            '        auto getBaseProfile = reinterpret_cast<PFN_GetBaseProfile>(queryInterface(0xDA8466A0));',
            '        auto deleteSetting = reinterpret_cast<PFN_DeleteSetting>(queryInterface(0xE5A9A6B2));',
            '',
            '        if (nvInit && createSession && destroySession && loadSettings && saveSettings && getBaseProfile && deleteSetting) {',
            '            if (nvInit() == 0) {',
            '                void* hSession = nullptr;',
            '                if (createSession(&hSession) == 0 && hSession) {',
            '                    if (loadSettings(hSession) == 0) {',
            '                        void* hProfile = nullptr;',
            '                        if (getBaseProfile(hSession, &hProfile) == 0 && hProfile) {',
            '                            if (deleteSetting(hSession, hProfile, 0x20D690F8u) == 0) {',
            '                                saveSettings(hSession);',
            '                            }',
            '                        }',
            '                    }',
            '                    destroySession(hSession);',
            '                }',
            '            }',
            '        }',
            '    }',
            '',
            '    bool loadAllApis() {',
            '        if (apisLoaded) return (pCreateDXGIFactory1 && pD3D11CreateDevice && pGetCurrentDC && pGetCurrentContext);',
            '        apisLoaded = true;',
            '',
            '        LARGE_INTEGER freq{};',
            '        QueryPerformanceFrequency(&freq);',
            '        qpcFreq = freq.QuadPart;',
            '        refreshPeriodTicks = qpcFreq / 60;',
            '',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto pTimeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"))) {',
            '                pTimeBegin(1);',
            '            }',
            '        }',
            '        if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '            pDwmFlush = reinterpret_cast<PFN_DwmFlush>(GetProcAddress(hDwm, "DwmFlush"));',
            '            pDwmExtendFrame = reinterpret_cast<PFN_DwmExtendFrameIntoClientArea>(GetProcAddress(hDwm, "DwmExtendFrameIntoClientArea"));',
            '        }',
            '        if (HMODULE hGdi = GetModuleHandleA("gdi32.dll")) {',
            '            pGetDeviceCaps = reinterpret_cast<PFN_GetDeviceCaps>(GetProcAddress(hGdi, "GetDeviceCaps"));',
            '        }',
            '        if (HMODULE hUser = GetModuleHandleA("user32.dll")) {',
            '            pChangeDisplaySettingsA = reinterpret_cast<PFN_ChangeDisplaySettingsA>(GetProcAddress(hUser, "ChangeDisplaySettingsA"));',
            '        }',
            '',
            '        HMODULE hDxgi = LoadLibraryA("dxgi.dll");',
            '        HMODULE hD3D11 = LoadLibraryA("d3d11.dll");',
            '        HMODULE hGl = GetModuleHandleA("opengl32.dll");',
            '        if (!hDxgi || !hD3D11 || !hGl) return false;',
            '',
            '        pCreateDXGIFactory1 = reinterpret_cast<PFN_CreateDXGIFactory1>(GetProcAddress(hDxgi, "CreateDXGIFactory1"));',
            '        pD3D11CreateDevice = reinterpret_cast<PFN_D3D11CreateDevice>(GetProcAddress(hD3D11, "D3D11CreateDevice"));',
            '',
            '        pGetProcAddress = reinterpret_cast<PFN_wglGetProcAddress>(GetProcAddress(hGl, "wglGetProcAddress"));',
            '        pGetCurrentDC = reinterpret_cast<PFN_wglGetCurrentDC>(GetProcAddress(hGl, "wglGetCurrentDC"));',
            '        pGetCurrentContext = reinterpret_cast<PFN_wglGetCurrentContext>(GetProcAddress(hGl, "wglGetCurrentContext"));',
            '',
            '        pGlGetString = reinterpret_cast<PFN_glGetString>(GetProcAddress(hGl, "glGetString"));',
            '        pGlGetIntegerv = reinterpret_cast<PFN_glGetIntegerv>(GetProcAddress(hGl, "glGetIntegerv"));',
            '        pGlIsEnabled = reinterpret_cast<PFN_glIsEnabled>(GetProcAddress(hGl, "glIsEnabled"));',
            '        pGlEnable = reinterpret_cast<PFN_glEnable>(GetProcAddress(hGl, "glEnable"));',
            '        pGlDisable = reinterpret_cast<PFN_glDisable>(GetProcAddress(hGl, "glDisable"));',
            '        pGlReadBuffer = reinterpret_cast<PFN_glReadBuffer>(GetProcAddress(hGl, "glReadBuffer"));',
            '        pGlReadPixels = reinterpret_cast<PFN_glReadPixels>(GetProcAddress(hGl, "glReadPixels"));',
            '        pGlGenTextures = reinterpret_cast<PFN_glGenTextures>(GetProcAddress(hGl, "glGenTextures"));',
            '        pGlDeleteTextures = reinterpret_cast<PFN_glDeleteTextures>(GetProcAddress(hGl, "glDeleteTextures"));',
            '        pGlBindTexture = reinterpret_cast<PFN_glBindTexture>(GetProcAddress(hGl, "glBindTexture"));',
            '',
            '        if (!pCreateDXGIFactory1 || !pD3D11CreateDevice || !pGetProcAddress || !pGetCurrentDC || !pGetCurrentContext) {',
            '            return false;',
            '        }',
            '',
            '        pWglSwapIntervalEXT = reinterpret_cast<PFN_wglSwapIntervalEXT>(pGetProcAddress("wglSwapIntervalEXT"));',
            '        pWglDXOpenDeviceNV = reinterpret_cast<PFN_wglDXOpenDeviceNV>(pGetProcAddress("wglDXOpenDeviceNV"));',
            '        pWglDXCloseDeviceNV = reinterpret_cast<PFN_wglDXCloseDeviceNV>(pGetProcAddress("wglDXCloseDeviceNV"));',
            '        pWglDXRegisterObjectNV = reinterpret_cast<PFN_wglDXRegisterObjectNV>(pGetProcAddress("wglDXRegisterObjectNV"));',
            '        pWglDXUnregisterObjectNV = reinterpret_cast<PFN_wglDXUnregisterObjectNV>(pGetProcAddress("wglDXUnregisterObjectNV"));',
            '        pWglDXLockObjectsNV = reinterpret_cast<PFN_wglDXLockObjectsNV>(pGetProcAddress("wglDXLockObjectsNV"));',
            '        pWglDXUnlockObjectsNV = reinterpret_cast<PFN_wglDXUnlockObjectsNV>(pGetProcAddress("wglDXUnlockObjectsNV"));',
            '',
            '        pGlGenFramebuffers = reinterpret_cast<PFN_glGenFramebuffers>(pGetProcAddress("glGenFramebuffers"));',
            '        pGlDeleteFramebuffers = reinterpret_cast<PFN_glDeleteFramebuffers>(pGetProcAddress("glDeleteFramebuffers"));',
            '        pGlBindFramebuffer = reinterpret_cast<PFN_glBindFramebuffer>(pGetProcAddress("glBindFramebuffer"));',
            '        pGlCheckFramebufferStatus = reinterpret_cast<PFN_glCheckFramebufferStatus>(pGetProcAddress("glCheckFramebufferStatus"));',
            '        pGlGenRenderbuffers = reinterpret_cast<PFN_glGenRenderbuffers>(pGetProcAddress("glGenRenderbuffers"));',
            '        pGlDeleteRenderbuffers = reinterpret_cast<PFN_glDeleteRenderbuffers>(pGetProcAddress("glDeleteRenderbuffers"));',
            '        pGlBindRenderbuffer = reinterpret_cast<PFN_glBindRenderbuffer>(pGetProcAddress("glBindRenderbuffer"));',
            '        pGlFramebufferRenderbuffer = reinterpret_cast<PFN_glFramebufferRenderbuffer>(pGetProcAddress("glFramebufferRenderbuffer"));',
            '        pGlFramebufferTexture2D = reinterpret_cast<PFN_glFramebufferTexture2D>(pGetProcAddress("glFramebufferTexture2D"));',
            '        pGlBlitFramebuffer = reinterpret_cast<PFN_glBlitFramebuffer>(pGetProcAddress("glBlitFramebuffer"));',
            '',
            '        pGlGenBuffers = reinterpret_cast<PFN_glGenBuffers>(pGetProcAddress("glGenBuffers"));',
            '        pGlDeleteBuffers = reinterpret_cast<PFN_glDeleteBuffers>(pGetProcAddress("glDeleteBuffers"));',
            '        pGlBindBuffer = reinterpret_cast<PFN_glBindBuffer>(pGetProcAddress("glBindBuffer"));',
            '        pGlBufferData = reinterpret_cast<PFN_glBufferData>(pGetProcAddress("glBufferData"));',
            '        pGlMapBuffer = reinterpret_cast<PFN_glMapBuffer>(pGetProcAddress("glMapBuffer"));',
            '        pGlUnmapBuffer = reinterpret_cast<PFN_glUnmapBuffer>(pGetProcAddress("glUnmapBuffer"));',
            '',
            '        return true;',
            '    }',
            '',
            '    void destroyResourcesLocked() {',
            '        bridgeActive.store(false, std::memory_order_release);',
            '        latestReadySlot.store(-1, std::memory_order_relaxed);',
            '        presentingSlot.store(-1, std::memory_order_relaxed);',
            '',
            '        if (hInteropDevice && hInteropObject && pWglDXUnregisterObjectNV) {',
            '            pWglDXUnregisterObjectNV(hInteropDevice, hInteropObject);',
            '        }',
            '        hInteropObject = nullptr;',
            '',
            '        if (glInteropFbo && pGlDeleteFramebuffers) {',
            '            pGlDeleteFramebuffers(1, &glInteropFbo);',
            '            glInteropFbo = 0;',
            '        }',
            '        if (glInteropRbo && pGlDeleteRenderbuffers) {',
            '            pGlDeleteRenderbuffers(1, &glInteropRbo);',
            '            glInteropRbo = 0;',
            '        }',
            '        if (glInteropTex && pGlDeleteTextures) {',
            '            pGlDeleteTextures(1, &glInteropTex);',
            '            glInteropTex = 0;',
            '        }',
            '        if (hInteropDevice && pWglDXCloseDeviceNV) {',
            '            pWglDXCloseDeviceNV(hInteropDevice);',
            '        }',
            '        hInteropDevice = nullptr;',
            '',
            '        if (glPbo[0] && pGlDeleteBuffers) {',
            '            pGlDeleteBuffers(2, glPbo);',
            '            glPbo[0] = 0;',
            '            glPbo[1] = 0;',
            '        }',
            '        pboPrimed = false;',
            '',
            '        for (int i = 0; i < 3; ++i) {',
            '            if (singleDeviceMode) {',
            '                ringTexPresent[i] = nullptr;',
            '            } else {',
            '                comRelease(ringTexPresent[i]);',
            '            }',
            '            comRelease(ringTexMain[i]);',
            '            cpuRingBuffers[i].clear();',
            '        }',
            '',
            '        comRelease(interopCaptureTex);',
            '        comRelease(dxgiSwapChain);',
            '',
            '        if (singleDeviceMode) {',
            '            presentContext = nullptr;',
            '            presentDevice = nullptr;',
            '        } else {',
            '            comRelease(presentContext);',
            '            comRelease(presentDevice);',
            '        }',
            '        comRelease(interopContext);',
            '        comRelease(interopDevice);',
            '        singleDeviceMode = false;',
            '        activeTier.store(0, std::memory_order_relaxed);',
            '    }',
            '',
            '    void prepareBorderlessWindow(HWND hwnd, HDC hdc) {',
            '        if (hdc && pGetDeviceCaps) {',
            '            int hz = pGetDeviceCaps(hdc, 116); // VREFRESH = 116',
            '            if (hz >= 30 && hz <= 360 && qpcFreq > 0) {',
            '                refreshPeriodTicks = qpcFreq / hz;',
            '            }',
            '        }',
            '',
            '        HMONITOR hMon = MonitorFromWindow(hwnd, MONITOR_DEFAULTTONEAREST);',
            '        MONITORINFO mi{};',
            '        mi.cbSize = sizeof(MONITORINFO);',
            '        if (GetMonitorInfoA(hMon, &mi)) {',
            '            RECT wr{};',
            '            if (GetWindowRect(hwnd, &wr)) {',
            '                int monW = mi.rcMonitor.right - mi.rcMonitor.left;',
            '                int monH = mi.rcMonitor.bottom - mi.rcMonitor.top;',
            '                if ((wr.right - wr.left) >= monW - 4 && (wr.bottom - wr.top) >= monH - 4) {',
            '                    if (pChangeDisplaySettingsA) {',
            '                        pChangeDisplaySettingsA(nullptr, 0);',
            '                    }',
            '                    LONG_PTR style = GetWindowLongPtrA(hwnd, GWL_STYLE);',
            '                    style &= ~(WS_CAPTION | WS_THICKFRAME | WS_MINIMIZEBOX | WS_MAXIMIZEBOX | WS_SYSMENU);',
            '                    style |= WS_POPUP | WS_VISIBLE;',
            '                    SetWindowLongPtrA(hwnd, GWL_STYLE, style);',
            '                    SetWindowPos(',
            '                        hwnd, HWND_TOP,',
            '                        mi.rcMonitor.left, mi.rcMonitor.top,',
            '                        monW, monH,',
            '                        SWP_NOOWNERZORDER | SWP_NOACTIVATE | SWP_FRAMECHANGED | SWP_SHOWWINDOW',
            '                    );',
            '                }',
            '            }',
            '        }',
            '',
            '        if (pDwmExtendFrame) {',
            '            DwmMargins margins{0, 0, 0, 1};',
            '            pDwmExtendFrame(hwnd, &margins);',
            '        }',
            '    }',
            '',
            '    // Dedicated Background Presenter Thread: Locks presentation strictly to Hardware VBlank',
            '    void presenterThreadLoop() {',
            '        SetThreadPriority(GetCurrentThread(), THREAD_PRIORITY_TIME_CRITICAL);',
            '',
            '        while (true) {',
            '            WaitForSingleObject(hFrameReadyEvent, 16);',
            '',
            '            if (!bridgeActive.load(std::memory_order_acquire)) {',
            '                continue;',
            '            }',
            '',
            '            int slot = latestReadySlot.exchange(-1, std::memory_order_acq_rel);',
            '            if (slot < 0 || slot >= 3) {',
            '                continue;',
            '            }',
            '            presentingSlot.store(slot, std::memory_order_release);',
            '',
            '            std::unique_lock<std::mutex> lock(bridgeMutex);',
            '            if (!bridgeActive.load(std::memory_order_relaxed) || !dxgiSwapChain || !presentContext) {',
            '                presentingSlot.store(-1, std::memory_order_release);',
            '                continue;',
            '            }',
            '',
            '            int tier = activeTier.load(std::memory_order_relaxed);',
            '            void* backBuffer = nullptr;',
            '            if (swapChainGetBuffer(dxgiSwapChain, 0, &kIID_ID3D11Texture2D, &backBuffer) >= 0 && backBuffer) {',
            '                if (tier == 1 && ringTexPresent[slot]) {',
            '                    contextCopyResource(presentContext, backBuffer, ringTexPresent[slot]);',
            '                } else if (tier == 2 && !cpuRingBuffers[slot].empty()) {',
            '                    contextUpdateSubresource(',
            '                        presentContext, backBuffer,',
            '                        cpuRingBuffers[slot].data(),',
            '                        surfaceWidth * 4,',
            '                        surfaceWidth * surfaceHeight * 4',
            '                    );',
            '                }',
            '                comRelease(backBuffer);',
            '            }',
            '',
            '            void* sc = dxgiSwapChain;',
            '            comAddRef(sc);',
            '            presentingSlot.store(-1, std::memory_order_release);',
            '            lock.unlock();',
            '',
            '            LARGE_INTEGER beforePresent{}, afterPresent{};',
            '            QueryPerformanceCounter(&beforePresent);',
            '',
            '            // REAL HARDWARE V-SYNC (SyncInterval = 1) ON DEDICATED BACKGROUND THREAD!',
            '            swapChainPresent(sc, 1, 0);',
            '            comRelease(sc);',
            '',
            '            QueryPerformanceCounter(&afterPresent);',
            '            int64_t presentElapsed = afterPresent.QuadPart - beforePresent.QuadPart;',
            '',
            '            // Optimus Hybrid GPU Safeguard: If dGPU Present(1, 0) returned without blocking on the iGPU panel,',
            '            // lock the presenter thread directly to the physical monitor VBlank via DwmFlush()!',
            '            if (pDwmFlush && refreshPeriodTicks > 0 && presentElapsed < (refreshPeriodTicks / 4)) {',
            '                pDwmFlush();',
            '            }',
            '        }',
            '    }',
            '',
            '    void ensurePresenterThreadStarted() {',
            '        bool expected = false;',
            '        if (presenterThreadStarted.compare_exchange_strong(expected, true)) {',
            '            hFrameReadyEvent = CreateEventA(nullptr, FALSE, FALSE, nullptr);',
            '            std::thread(presenterThreadLoop).detach();',
            '        }',
            '    }',
            '',
            '    uint32_t detectPreferredGlVendorId() {',
            '        if (!pGlGetString) return 0;',
            '        const char* vendor = reinterpret_cast<const char*>(pGlGetString(kGL_VENDOR));',
            '        if (!vendor) return 0;',
            '        if (std::strstr(vendor, "NVIDIA") || std::strstr(vendor, "nvidia")) return 0x10DE;',
            '        if (std::strstr(vendor, "Intel") || std::strstr(vendor, "INTEL")) return 0x8086;',
            '        if (std::strstr(vendor, "AMD") || std::strstr(vendor, "ATI")) return 0x1002;',
            '        return 0;',
            '    }',
            '',
            '    bool createFlipSwapChainOnWindow(void* factory, HWND hwnd, uint32_t w, uint32_t h) {',
            '        DxgiSwapChainDesc sd{};',
            '        sd.BufferDesc.Width = w;',
            '        sd.BufferDesc.Height = h;',
            '        sd.BufferDesc.RefreshRate.Numerator = 0;',
            '        sd.BufferDesc.RefreshRate.Denominator = 1;',
            '        sd.BufferDesc.Format = 87;          // DXGI_FORMAT_B8G8R8A8_UNORM',
            '        sd.SampleDesc.Count = 1;',
            '        sd.SampleDesc.Quality = 0;',
            '        sd.BufferUsage = 0x20;              // DXGI_USAGE_RENDER_TARGET_OUTPUT',
            '        sd.BufferCount = 3;                 // 3-buffer Flip Queue',
            '        sd.OutputWindow = hwnd;',
            '        sd.Windowed = 1;                    // TRUE',
            '        sd.SwapEffect = 4;                  // DXGI_SWAP_EFFECT_FLIP_DISCARD (4)',
            '        sd.Flags = 0;                       // 0 = NO ALLOW_TEARING -> 100% VBlank locked!',
            '',
            '        long hr = factoryCreateSwapChain(factory, presentDevice, &sd, &dxgiSwapChain);',
            '        if (hr < 0 || !dxgiSwapChain) {',
            '            sd.SwapEffect = 3;              // DXGI_SWAP_EFFECT_FLIP_SEQUENTIAL (3)',
            '            hr = factoryCreateSwapChain(factory, presentDevice, &sd, &dxgiSwapChain);',
            '        }',
            '        if (hr >= 0 && dxgiSwapChain) {',
            '            factoryMakeWindowAssociation(factory, hwnd, 1 | 2); // DXGI_MWA_NO_WINDOW_CHANGES | DXGI_MWA_NO_ALT_ENTER',
            '            return true;',
            '        }',
            '        return false;',
            '    }',
            '',
            '    // Tier 1: Hardware WGL_NV_DX_interop2 + DXGI_SWAP_EFFECT_FLIP_DISCARD',
            '    bool tryInitTier1Interop(HWND hwnd, uint32_t w, uint32_t h) {',
            '        if (!pWglDXOpenDeviceNV || !pWglDXRegisterObjectNV || !pWglDXLockObjectsNV || !pWglDXUnlockObjectsNV ||',
            '            !pGlGenFramebuffers || !pGlBindFramebuffer || !pGlBlitFramebuffer) {',
            '            return false;',
            '        }',
            '',
            '        void* factory = nullptr;',
            '        if (pCreateDXGIFactory1(&kIID_IDXGIFactory1, &factory) < 0 || !factory) {',
            '            return false;',
            '        }',
            '',
            '        uint32_t preferredVendor = detectPreferredGlVendorId();',
            '        void* matchedAdapter = nullptr;',
            '',
            '        for (int pass = 0; pass < 2 && !matchedAdapter; ++pass) {',
            '            for (uint32_t idx = 0; ; ++idx) {',
            '                void* cand = nullptr;',
            '                if (factoryEnumAdapters1(factory, idx, &cand) < 0 || !cand) break;',
            '',
            '                DxgiAdapterDesc1 desc{};',
            '                adapterGetDesc1(cand, &desc);',
            '                bool isPreferred = (preferredVendor != 0 && desc.VendorId == preferredVendor);',
            '                if ((pass == 0 && !isPreferred) || (pass == 1 && isPreferred && preferredVendor != 0)) {',
            '                    comRelease(cand);',
            '                    continue;',
            '                }',
            '',
            '                void* testDev = nullptr;',
            '                void* testCtx = nullptr;',
            '                uint32_t flOut = 0;',
            '                if (pD3D11CreateDevice(cand, 0, nullptr, 0x20, nullptr, 0, 7, &testDev, &flOut, &testCtx) >= 0 && testDev) {',
            '                    HANDLE hDev = pWglDXOpenDeviceNV(testDev);',
            '                    if (hDev) {',
            '                        D3D11Texture2DDesc capDesc{};',
            '                        capDesc.Width = w;',
            '                        capDesc.Height = h;',
            '                        capDesc.MipLevels = 1;',
            '                        capDesc.ArraySize = 1;',
            '                        capDesc.Format = 87; // DXGI_FORMAT_B8G8R8A8_UNORM',
            '                        capDesc.SampleDesc.Count = 1;',
            '                        capDesc.Usage = 0;   // D3D11_USAGE_DEFAULT',
            '                        capDesc.BindFlags = 0x20 | 0x08; // RENDER_TARGET | SHADER_RESOURCE',
            '                        capDesc.MiscFlags = 0;',
            '',
            '                        void* capTex = nullptr;',
            '                        if (deviceCreateTexture2D(testDev, &capDesc, &capTex) >= 0 && capTex) {',
            '                            uint32_t rbo = 0, tex = 0;',
            '                            HANDLE hObj = nullptr;',
            '                            bool usingRbo = false;',
            '',
            '                            // CRITICAL: Call glBindRenderbuffer BEFORE wglDXRegisterObjectNV!',
            '                            if (pGlGenRenderbuffers && pGlBindRenderbuffer && pGlFramebufferRenderbuffer) {',
            '                                int32_t prevRbo = 0;',
            '                                pGlGetIntegerv(kGL_RENDERBUFFER_BINDING, &prevRbo);',
            '                                pGlGenRenderbuffers(1, &rbo);',
            '                                pGlBindRenderbuffer(kGL_RENDERBUFFER, rbo);',
            '                                pGlBindRenderbuffer(kGL_RENDERBUFFER, static_cast<uint32_t>(prevRbo));',
            '                                hObj = pWglDXRegisterObjectNV(hDev, capTex, rbo, kGL_RENDERBUFFER, kWGL_ACCESS_READ_WRITE_NV);',
            '                                if (hObj) usingRbo = true;',
            '                            }',
            '',
            '                            if (!hObj && pGlGenTextures && pGlBindTexture && pGlFramebufferTexture2D) {',
            '                                if (rbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &rbo); rbo = 0; }',
            '                                pGlGenTextures(1, &tex);',
            '                                pGlBindTexture(kGL_TEXTURE_2D, tex);',
            '                                pGlBindTexture(kGL_TEXTURE_2D, 0);',
            '                                hObj = pWglDXRegisterObjectNV(hDev, capTex, tex, kGL_TEXTURE_2D, kWGL_ACCESS_READ_WRITE_NV);',
            '                            }',
            '',
            '                            if (hObj) {',
            '                                uint32_t fbo = 0;',
            '                                int32_t prevDrawFbo = 0;',
            '                                pGlGetIntegerv(kGL_DRAW_FRAMEBUFFER_BINDING, &prevDrawFbo);',
            '                                pGlGenFramebuffers(1, &fbo);',
            '                                if (pWglDXLockObjectsNV(hDev, 1, &hObj)) {',
            '                                    pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, fbo);',
            '                                    if (usingRbo) {',
            '                                        pGlFramebufferRenderbuffer(kGL_DRAW_FRAMEBUFFER, kGL_COLOR_ATTACHMENT0, kGL_RENDERBUFFER, rbo);',
            '                                    } else {',
            '                                        pGlFramebufferTexture2D(kGL_DRAW_FRAMEBUFFER, kGL_COLOR_ATTACHMENT0, kGL_TEXTURE_2D, tex, 0);',
            '                                    }',
            '                                    uint32_t status = pGlCheckFramebufferStatus ? pGlCheckFramebufferStatus(kGL_DRAW_FRAMEBUFFER) : kGL_FRAMEBUFFER_COMPLETE;',
            '                                    pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevDrawFbo));',
            '                                    pWglDXUnlockObjectsNV(hDev, 1, &hObj);',
            '',
            '                                    if (status == kGL_FRAMEBUFFER_COMPLETE) {',
            '                                        interopDevice = testDev;',
            '                                        interopContext = testCtx;',
            '                                        hInteropDevice = hDev;',
            '                                        interopCaptureTex = capTex;',
            '                                        hInteropObject = hObj;',
            '                                        glInteropFbo = fbo;',
            '                                        glInteropRbo = rbo;',
            '                                        glInteropTex = tex;',
            '                                        matchedAdapter = cand;',
            '                                        break;',
            '                                    }',
            '                                }',
            '                                pGlDeleteFramebuffers(1, &fbo);',
            '                                pWglDXUnregisterObjectNV(hDev, hObj);',
            '                            }',
            '                            if (rbo && pGlDeleteRenderbuffers) pGlDeleteRenderbuffers(1, &rbo);',
            '                            if (tex && pGlDeleteTextures) pGlDeleteTextures(1, &tex);',
            '                            comRelease(capTex);',
            '                        }',
            '                        pWglDXCloseDeviceNV(hDev);',
            '                    }',
            '                    comRelease(testCtx);',
            '                    comRelease(testDev);',
            '                }',
            '                comRelease(cand);',
            '            }',
            '        }',
            '',
            '        if (!matchedAdapter || !interopDevice || !hInteropObject) {',
            '            comRelease(factory);',
            '            return false;',
            '        }',
            '',
            '        // Try dual-device shared ring buffer so Present(1, 0) on presentDevice never locks interopDevice',
            '        uint32_t flOut = 0;',
            '        bool dualDeviceOk = (pD3D11CreateDevice(matchedAdapter, 0, nullptr, 0x20, nullptr, 0, 7, &presentDevice, &flOut, &presentContext) >= 0) &&',
            '                            presentDevice && presentContext;',
            '',
            '        if (dualDeviceOk) {',
            '            D3D11Texture2DDesc ringDesc{};',
            '            ringDesc.Width = w;',
            '            ringDesc.Height = h;',
            '            ringDesc.MipLevels = 1;',
            '            ringDesc.ArraySize = 1;',
            '            ringDesc.Format = 87;',
            '            ringDesc.SampleDesc.Count = 1;',
            '            ringDesc.Usage = 0;',
            '            ringDesc.BindFlags = 0x20 | 0x08;',
            '            ringDesc.MiscFlags = 2; // D3D11_RESOURCE_MISC_SHARED',
            '',
            '            for (int i = 0; i < 3; ++i) {',
            '                void* dxgiRes = nullptr;',
            '                HANDLE sharedHandle = nullptr;',
            '                if (deviceCreateTexture2D(interopDevice, &ringDesc, &ringTexMain[i]) < 0 || !ringTexMain[i] ||',
            '                    comQueryInterface(ringTexMain[i], &kIID_IDXGIResource, &dxgiRes) < 0 || !dxgiRes ||',
            '                    resourceGetSharedHandle(dxgiRes, &sharedHandle) < 0 || !sharedHandle ||',
            '                    deviceOpenSharedResource(presentDevice, sharedHandle, &kIID_ID3D11Texture2D, &ringTexPresent[i]) < 0 || !ringTexPresent[i]) {',
            '                    comRelease(dxgiRes);',
            '                    dualDeviceOk = false;',
            '                    break;',
            '                }',
            '                comRelease(dxgiRes);',
            '            }',
            '        }',
            '',
            '        if (!dualDeviceOk) {',
            '            for (int i = 0; i < 3; ++i) {',
            '                comRelease(ringTexPresent[i]);',
            '                comRelease(ringTexMain[i]);',
            '            }',
            '            comRelease(presentContext);',
            '            comRelease(presentDevice);',
            '',
            '            enableMultithreadDevice(interopDevice);',
            '            presentDevice = interopDevice;',
            '            presentContext = interopContext;',
            '            singleDeviceMode = true;',
            '',
            '            D3D11Texture2DDesc ringDesc{};',
            '            ringDesc.Width = w;',
            '            ringDesc.Height = h;',
            '            ringDesc.MipLevels = 1;',
            '            ringDesc.ArraySize = 1;',
            '            ringDesc.Format = 87;',
            '            ringDesc.SampleDesc.Count = 1;',
            '            ringDesc.Usage = 0;',
            '            ringDesc.BindFlags = 0x08; // D3D11_BIND_SHADER_RESOURCE',
            '            ringDesc.MiscFlags = 0;',
            '',
            '            for (int i = 0; i < 3; ++i) {',
            '                if (deviceCreateTexture2D(interopDevice, &ringDesc, &ringTexMain[i]) < 0 || !ringTexMain[i]) {',
            '                    comRelease(matchedAdapter);',
            '                    comRelease(factory);',
            '                    return false;',
            '                }',
            '                ringTexPresent[i] = ringTexMain[i];',
            '            }',
            '        }',
            '',
            '        comRelease(matchedAdapter);',
            '        bool scOk = createFlipSwapChainOnWindow(factory, hwnd, w, h);',
            '        comRelease(factory);',
            '',
            '        if (!scOk) return false;',
            '        activeTier.store(1, std::memory_order_relaxed);',
            '        return true;',
            '    }',
            '',
            '    // Tier 2 Fallback: Async PBO DMA -> DXGI Flip-Discard V-Sync SwapChain',
            '    bool tryInitTier2PboDxgi(HWND hwnd, uint32_t w, uint32_t h) {',
            '        void* factory = nullptr;',
            '        if (pCreateDXGIFactory1(&kIID_IDXGIFactory1, &factory) < 0 || !factory) {',
            '            return false;',
            '        }',
            '',
            '        uint32_t flOut = 0;',
            '        if (pD3D11CreateDevice(nullptr, 1, nullptr, 0x20, nullptr, 0, 7, &presentDevice, &flOut, &presentContext) < 0 || !presentDevice) {',
            '            comRelease(factory);',
            '            return false;',
            '        }',
            '',
            '        bool scOk = createFlipSwapChainOnWindow(factory, hwnd, w, h);',
            '        comRelease(factory);',
            '        if (!scOk) return false;',
            '',
            '        size_t frameBytes = static_cast<size_t>(w) * static_cast<size_t>(h) * 4;',
            '        for (int i = 0; i < 3; ++i) {',
            '            cpuRingBuffers[i].resize(frameBytes);',
            '        }',
            '',
            '        if (pGlGenBuffers && pGlBindBuffer && pGlBufferData && pGlMapBuffer && pGlUnmapBuffer) {',
            '            int32_t prevPbo = 0;',
            '            pGlGetIntegerv(kGL_PIXEL_PACK_BUFFER_BINDING, &prevPbo);',
            '            pGlGenBuffers(2, glPbo);',
            '            for (int i = 0; i < 2; ++i) {',
            '                pGlBindBuffer(kGL_PIXEL_PACK_BUFFER, glPbo[i]);',
            '                pGlBufferData(kGL_PIXEL_PACK_BUFFER, static_cast<ptrdiff_t>(frameBytes), nullptr, kGL_STREAM_READ);',
            '            }',
            '            pGlBindBuffer(kGL_PIXEL_PACK_BUFFER, static_cast<uint32_t>(prevPbo));',
            '        }',
            '',
            '        pboWriteIdx = 0;',
            '        pboPrimed = false;',
            '        activeTier.store(2, std::memory_order_relaxed);',
            '        return true;',
            '    }',
            '',
            '    bool rebuildSurface(HWND hwnd, HDC mainDC, HGLRC hglrc, uint32_t w, uint32_t h) {',
            '        ensurePresenterThreadStarted();',
            '        std::lock_guard<std::mutex> lock(bridgeMutex);',
            '        destroyResourcesLocked();',
            '',
            '        prepareBorderlessWindow(hwnd, mainDC);',
            '',
            '        if (pWglSwapIntervalEXT) {',
            '            pWglSwapIntervalEXT(0);',
            '        }',
            '',
            '        bool ok = tryInitTier1Interop(hwnd, w, h);',
            '        if (!ok) {',
            '            destroyResourcesLocked();',
            '            ok = tryInitTier2PboDxgi(hwnd, w, h);',
            '        }',
            '        if (!ok) {',
            '            destroyResourcesLocked();',
            '            return false;',
            '        }',
            '',
            '        trackedHwnd = hwnd;',
            '        trackedGlrc = hglrc;',
            '        surfaceWidth = w;',
            '        surfaceHeight = h;',
            '        bridgeActive.store(true, std::memory_order_release);',
            '        return true;',
            '    }',
            '',
            '    int pickFreeWriteSlot() {',
            '        int busyPresent = presentingSlot.load(std::memory_order_acquire);',
            '        int busyLatest = latestReadySlot.load(std::memory_order_acquire);',
            '        for (int offset = 1; offset <= 3; ++offset) {',
            '            int candidate = (lastWrittenSlot + offset) % 3;',
            '            if (candidate != busyPresent && candidate != busyLatest) {',
            '                lastWrittenSlot = candidate;',
            '                return candidate;',
            '            }',
            '        }',
            '        return (lastWrittenSlot + 1) % 3;',
            '    }',
            '',
            '    bool submitFrameNonBlocking() {',
            '        if (!loadAllApis()) return false;',
            '',
            '        HDC mainDC = pGetCurrentDC();',
            '        HGLRC hglrc = pGetCurrentContext();',
            '        if (!mainDC || !hglrc) return false;',
            '',
            '        HWND hwnd = WindowFromDC(mainDC);',
            '        if (!hwnd) return false;',
            '',
            '        RECT rc{};',
            '        if (!GetClientRect(hwnd, &rc)) return false;',
            '        uint32_t w = static_cast<uint32_t>(rc.right - rc.left);',
            '        uint32_t h = static_cast<uint32_t>(rc.bottom - rc.top);',
            '        if (w == 0 || h == 0) {',
            '            return true; // Window minimized',
            '        }',
            '',
            '        if (!bridgeActive.load(std::memory_order_acquire) ||',
            '            hwnd != trackedHwnd || hglrc != trackedGlrc || w != surfaceWidth || h != surfaceHeight) {',
            '            if (!rebuildSurface(hwnd, mainDC, hglrc, w, h)) {',
            '                return false;',
            '            }',
            '        }',
            '',
            '        int tier = activeTier.load(std::memory_order_relaxed);',
            '        if (tier == 1) {',
            '            int writeSlot = pickFreeWriteSlot();',
            '',
            '            int32_t prevReadFbo = 0, prevDrawFbo = 0;',
            '            pGlGetIntegerv(kGL_READ_FRAMEBUFFER_BINDING, &prevReadFbo);',
            '            pGlGetIntegerv(kGL_DRAW_FRAMEBUFFER_BINDING, &prevDrawFbo);',
            '            unsigned char scissorWasOn = pGlIsEnabled ? pGlIsEnabled(kGL_SCISSOR_TEST) : 0;',
            '            if (scissorWasOn && pGlDisable) pGlDisable(kGL_SCISSOR_TEST);',
            '',
            '            if (!pWglDXLockObjectsNV(hInteropDevice, 1, &hInteropObject)) {',
            '                if (scissorWasOn && pGlEnable) pGlEnable(kGL_SCISSOR_TEST);',
            '                return false;',
            '            }',
            '',
            '            pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, 0);',
            '            if (pGlReadBuffer) pGlReadBuffer(kGL_BACK);',
            '            pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, glInteropFbo);',
            '            pGlBlitFramebuffer(',
            '                0, 0, static_cast<int32_t>(w), static_cast<int32_t>(h),',
            '                0, static_cast<int32_t>(h), static_cast<int32_t>(w), 0,',
            '                kGL_COLOR_BUFFER_BIT, kGL_NEAREST',
            '            );',
            '',
            '            pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, static_cast<uint32_t>(prevReadFbo));',
            '            pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevDrawFbo));',
            '            if (scissorWasOn && pGlEnable) pGlEnable(kGL_SCISSOR_TEST);',
            '',
            '            pWglDXUnlockObjectsNV(hInteropDevice, 1, &hInteropObject);',
            '',
            '            contextCopyResource(interopContext, ringTexMain[writeSlot], interopCaptureTex);',
            '            contextFlush(interopContext);',
            '',
            '            latestReadySlot.store(writeSlot, std::memory_order_release);',
            '            SetEvent(hFrameReadyEvent);',
            '            return true;',
            '        } else if (tier == 2) {',
            '            LARGE_INTEGER now{};',
            '            QueryPerformanceCounter(&now);',
            '            if (now.QuadPart - lastPboReadQpc < (refreshPeriodTicks * 85) / 100) {',
            '                return true;',
            '            }',
            '            lastPboReadQpc = now.QuadPart;',
            '',
            '            int writeSlot = pickFreeWriteSlot();',
            '            size_t rowBytes = static_cast<size_t>(w) * 4;',
            '',
            '            int32_t prevReadFbo = 0;',
            '            pGlGetIntegerv(kGL_READ_FRAMEBUFFER_BINDING, &prevReadFbo);',
            '            if (pGlBindFramebuffer) pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, 0);',
            '            if (pGlReadBuffer) pGlReadBuffer(kGL_BACK);',
            '',
            '            if (glPbo[0] && pGlBindBuffer && pGlMapBuffer && pGlUnmapBuffer && pGlReadPixels) {',
            '                int32_t prevPbo = 0;',
            '                pGlGetIntegerv(kGL_PIXEL_PACK_BUFFER_BINDING, &prevPbo);',
            '                int readIdx = 1 - pboWriteIdx;',
            '',
            '                pGlBindBuffer(kGL_PIXEL_PACK_BUFFER, glPbo[pboWriteIdx]);',
            '                pGlReadPixels(0, 0, static_cast<int32_t>(w), static_cast<int32_t>(h), kGL_BGRA, kGL_UNSIGNED_BYTE, nullptr);',
            '',
            '                if (pboPrimed) {',
            '                    pGlBindBuffer(kGL_PIXEL_PACK_BUFFER, glPbo[readIdx]);',
            '                    if (const uint8_t* src = reinterpret_cast<const uint8_t*>(pGlMapBuffer(kGL_PIXEL_PACK_BUFFER, kGL_READ_ONLY))) {',
            '                        uint8_t* dst = cpuRingBuffers[writeSlot].data();',
            '                        for (uint32_t y = 0; y < h; ++y) {',
            '                            std::memcpy(dst + y * rowBytes, src + (h - 1 - y) * rowBytes, rowBytes);',
            '                        }',
            '                        pGlUnmapBuffer(kGL_PIXEL_PACK_BUFFER);',
            '                        latestReadySlot.store(writeSlot, std::memory_order_release);',
            '                        SetEvent(hFrameReadyEvent);',
            '                    }',
            '                }',
            '                pboPrimed = true;',
            '                pboWriteIdx = readIdx;',
            '                pGlBindBuffer(kGL_PIXEL_PACK_BUFFER, static_cast<uint32_t>(prevPbo));',
            '            }',
            '            if (pGlBindFramebuffer) pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, static_cast<uint32_t>(prevReadFbo));',
            '            return true;',
            '        }',
            '        return false;',
            '    }',
            '    #endif',
            '}',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    static void onModify(auto& self) {',
            '        (void)self.setHookPriority("cocos2d::CCEGLView::swapBuffers", 1000000);',
            '    }',
            '',
            '    void swapBuffers() {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        if (AsyncDxgiV8::submitFrameNonBlocking()) {',
            '            return;',
            '        }',
            '        #endif',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    std::thread(AsyncDxgiV8::resetNvidiaAllowTearingFlag).detach();',
            '    #endif',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod for GD 2.2081 (Geode SDK v5.11.2)
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2

      - name: Verify and Package Complete .geode Archive for GD 2.2081
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null

          $geodeCandidate = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.geode" -Recurse |
                            Sort-Object Length -Descending |
                            Select-Object -First 1

          if (-not $geodeCandidate) {
            Write-Error "No .geode file found in build directory!"
            exit 1
          }

          $destGeode = Join-Path $PWD "artifact\yingseo.notear-fps-22081.geode"
          Copy-Item -Path $geodeCandidate.FullName -Destination $destGeode -Force

          $zip = [System.IO.Compression.ZipFile]::Open($destGeode, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $hasDll = $false
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -like "*.dll" -and $entry.Length -gt 4096) {
                $hasDll = $true
              }
            }

            if (-not $hasDll) {
              $dllFile = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.dll" -Recurse |
                         Where-Object { $_.Name -like "*NoTear*" -or $_.Name -like "*yingseo*" } |
                         Sort-Object Length -Descending |
                         Select-Object -First 1
              if ($dllFile) {
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $dllFile.FullName, "yingseo.notear-fps-22081.dll") | Out-Null
              }
            }

            foreach ($asset in @("mod.json", "logo.png", "about.md", "changelog.md")) {
              $assetPath = Join-Path $PWD $asset
              if (Test-Path $assetPath) {
                $existing = $zip.GetEntry($asset)
                if ($existing) { $existing.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $assetPath, $asset) | Out-Null
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-GD-2.2081-v8.0.0
          path: artifact/*.geode
