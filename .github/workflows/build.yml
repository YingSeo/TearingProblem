            '',
            '    void destroyResourcesLocked() {',
            '        bridgeActive.store(false, std::memory_order_release);',
            '        latestReadySlot.store(-1, std::memory_order_relaxed);',
            '        presentingSlot.store(-1, std::memory_order_relaxed);',
            '',
            '        if (stageFence && pGlDeleteSync) {',
            '            pGlDeleteSync(stageFence);',
            '            stageFence = nullptr;',
            '        }',
            '        stageInFlight = false;',
            '',
            '        if (glStageFbo && pGlDeleteFramebuffers) { pGlDeleteFramebuffers(1, &glStageFbo); glStageFbo = 0; }',
            '        if (glStageRbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &glStageRbo); glStageRbo = 0; }',
            '',
            '        for (int i = 0; i < 3; ++i) {',
            '            if (hInteropDevice && hRingInteropObj[i] && pWglDXUnregisterObjectNV) {',
            '                pWglDXUnregisterObjectNV(hInteropDevice, hRingInteropObj[i]);',
            '            }',
            '            hRingInteropObj[i] = nullptr;',
            '            if (glRingFbo[i] && pGlDeleteFramebuffers) { pGlDeleteFramebuffers(1, &glRingFbo[i]); glRingFbo[i] = 0; }',
            '            if (glRingRbo[i] && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &glRingRbo[i]); glRingRbo[i] = 0; }',
            '            if (glRingTex[i] && pGlDeleteTextures) { pGlDeleteTextures(1, &glRingTex[i]); glRingTex[i] = 0; }',
            '            comRelease(d3dRingTex[i]);',
            '        }',
            '',
            '        if (hInteropDevice && hFallbackInteropObj && pWglDXUnregisterObjectNV) {',
            '            pWglDXUnregisterObjectNV(hInteropDevice, hFallbackInteropObj);',
            '        }',
            '        hFallbackInteropObj = nullptr;',
            '        if (glFallbackFbo && pGlDeleteFramebuffers) { pGlDeleteFramebuffers(1, &glFallbackFbo); glFallbackFbo = 0; }',
            '        if (glFallbackRbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &glFallbackRbo); glFallbackRbo = 0; }',
            '        if (glFallbackTex && pGlDeleteTextures) { pGlDeleteTextures(1, &glFallbackTex); glFallbackTex = 0; }',
            '        comRelease(fallbackCaptureTex);',
            '',
            '        if (hInteropDevice && pWglDXCloseDeviceNV) {',
            '            pWglDXCloseDeviceNV(hInteropDevice);',
            '        }',
            '        hInteropDevice = nullptr;',
            '',
            '        comRelease(dxgiSwapChain);',
            '        comRelease(d3dContext);',
            '        comRelease(d3dDevice);',
            '        multiRingInteropActive = false;',
            '    }',
            '',
            '    void prepareBorderlessWindow(HWND hwnd, HDC hdc) {',
            '        if (hdc && pGetDeviceCaps) {',
            '            int hz = pGetDeviceCaps(hdc, 116);',
            '            if (hz >= 30 && hz <= 360 && qpcFreq > 0) {',
            '                refreshPeriodTicks.store(qpcFreq / hz, std::memory_order_relaxed);',
            '            }',
            '        }',
            '        HMONITOR hMon = MonitorFromWindow(hwnd, MONITOR_DEFAULTTONEAREST);',
            '        MONITORINFO mi{}; mi.cbSize = sizeof(MONITORINFO);',
            '        if (GetMonitorInfoA(hMon, &mi)) {',
            '            RECT wr{};',
            '            if (GetWindowRect(hwnd, &wr)) {',
            '                int monW = mi.rcMonitor.right - mi.rcMonitor.left;',
            '                int monH = mi.rcMonitor.bottom - mi.rcMonitor.top;',
            '                if ((wr.right - wr.left) >= monW - 4 && (wr.bottom - wr.top) >= monH - 4) {',
            '                    if (pChangeDisplaySettingsA) pChangeDisplaySettingsA(nullptr, 0);',
            '                    LONG_PTR style = GetWindowLongPtrA(hwnd, GWL_STYLE);',
            '                    style &= ~(WS_CAPTION | WS_THICKFRAME | WS_MINIMIZEBOX | WS_MAXIMIZEBOX | WS_SYSMENU);',
            '                    style |= WS_POPUP | WS_VISIBLE;',
            '                    SetWindowLongPtrA(hwnd, GWL_STYLE, style);',
            '                    SetWindowPos(hwnd, HWND_TOP, mi.rcMonitor.left, mi.rcMonitor.top, monW, monH,',
            '                                 SWP_NOOWNERZORDER | SWP_NOACTIVATE | SWP_FRAMECHANGED | SWP_SHOWWINDOW);',
            '                }',
            '            }',
            '        }',
            '        if (pDwmExtendFrame) {',
            '            DwmMargins margins{0, 0, 0, 1};',
            '            pDwmExtendFrame(hwnd, &margins);',
            '        }',
            '    }',
            '',
            '    HWND ensureChildSwapWindow(HWND hwndParent, uint32_t w, uint32_t h) {',
            '        HINSTANCE hInst = GetModuleHandleA(nullptr);',
            '        if (!childClassRegistered) {',
            '            WNDCLASSEXA wc{}; wc.cbSize = sizeof(WNDCLASSEXA); wc.style = CS_OWNDC;',
            '            wc.lpfnWndProc = ChildSwapWndProc; wc.hInstance = hInst;',
            '            wc.lpszClassName = "GeodeBypassTearV24Child";',
            '            RegisterClassExA(&wc);',
            '            childClassRegistered = true;',
            '        }',
            '        LONG_PTR parentStyle = GetWindowLongPtrA(hwndParent, GWL_STYLE);',
            '        if (!(parentStyle & WS_CLIPCHILDREN)) {',
            '            SetWindowLongPtrA(hwndParent, GWL_STYLE, parentStyle | WS_CLIPCHILDREN | WS_CLIPSIBLINGS);',
            '        }',
            '        if (!childSwapHwnd || !IsWindow(childSwapHwnd) || GetParent(childSwapHwnd) != hwndParent) {',
            '            if (childSwapHwnd && IsWindow(childSwapHwnd)) DestroyWindow(childSwapHwnd);',
            '            childSwapHwnd = CreateWindowExA(',
            '                WS_EX_NOPARENTNOTIFY | WS_EX_TRANSPARENT, "GeodeBypassTearV24Child", "",',
            '                WS_CHILD | WS_VISIBLE | WS_CLIPSIBLINGS | WS_DISABLED,',
            '                0, 0, static_cast<int>(w), static_cast<int>(h), hwndParent, nullptr, hInst, nullptr);',
            '        } else {',
            '            SetWindowPos(childSwapHwnd, HWND_TOP, 0, 0, static_cast<int>(w), static_cast<int>(h), SWP_NOACTIVATE | SWP_SHOWWINDOW);',
            '        }',
            '        return childSwapHwnd;',
            '    }',
            '',
            '    // Dedicated Background V-Sync Presenter Thread:',
            '    // Exclusively owns d3dContext during gameplay so the Main Thread has ZERO D3D11 overhead!',
            '    void presenterThreadLoop() {',
            '        SetThreadPriority(GetCurrentThread(), THREAD_PRIORITY_HIGHEST);',
            '',
            '        while (true) {',
            '            WaitForSingleObject(hFrameReadyEvent, 35);',
            '',
            '            if (!bridgeActive.load(std::memory_order_acquire)) {',
            '                vblankReadyForStage.store(true, std::memory_order_release);',
            '                continue;',
            '            }',
            '',
            '            int slot = latestReadySlot.exchange(-1, std::memory_order_acq_rel);',
            '            if (slot < 0 || slot >= 3) {',
            '                vblankReadyForStage.store(true, std::memory_order_release);',
            '                continue;',
            '            }',
            '            presentingSlot.store(slot, std::memory_order_release);',
            '',
            '            std::unique_lock<std::mutex> lock(bridgeMutex);',
            '            if (!bridgeActive.load(std::memory_order_relaxed) || !dxgiSwapChain || !d3dContext || !d3dRingTex[slot]) {',
            '                presentingSlot.store(-1, std::memory_order_release);',
            '                vblankReadyForStage.store(true, std::memory_order_release);',
            '                continue;',
            '            }',
            '',
            '            void* backBuffer = nullptr;',
            '            if (reinterpret_cast<PFN_GetBuffer>((*reinterpret_cast<void***>(dxgiSwapChain))[9])(dxgiSwapChain, 0, &kIID_ID3D11Texture2D, &backBuffer) >= 0 && backBuffer) {',
            '                reinterpret_cast<PFN_CopyResource>((*reinterpret_cast<void***>(d3dContext))[47])(d3dContext, backBuffer, d3dRingTex[slot]);',
            '                comRelease(backBuffer);',
            '            }',
            '',
            '            void* sc = dxgiSwapChain;',
            '            comAddRef(sc);',
            '            presentingSlot.store(-1, std::memory_order_release);',
            '            lock.unlock();',
            '',
            '            LARGE_INTEGER beforePresent{}, afterPresent{};',
            '            QueryPerformanceCounter(&beforePresent);',
            '',
            '            // Hardware V-Sync Present(1, 0) on dedicated background thread',
            '            reinterpret_cast<PFN_Present>((*reinterpret_cast<void***>(sc))[8])(sc, 1, 0);',
            '            comRelease(sc);',
            '',
            '            QueryPerformanceCounter(&afterPresent);',
            '            int64_t presentElapsed = afterPresent.QuadPart - beforePresent.QuadPart;',
            '            int64_t period = refreshPeriodTicks.load(std::memory_order_relaxed);',
            '',
            '            if (pDwmFlush && period > 0 && presentElapsed < (period / 4)) {',
            '                pDwmFlush();',
            '            }',
            '',
            '            vblankReadyForStage.store(true, std::memory_order_release);',
            '        }',
            '    }',
            '',
            '    void ensurePresenterThreadStarted() {',
            '        bool expected = false;',
            '        if (presenterThreadStarted.compare_exchange_strong(expected, true)) {',
            '            hFrameReadyEvent = CreateEventA(nullptr, FALSE, FALSE, nullptr);',
            '            std::thread(presenterThreadLoop).detach();',
            '        }',
            '    }',
            '',
            '    uint32_t detectPreferredGlVendorId() {',
            '        if (!pGlGetString) return 0;',
            '        const char* v = reinterpret_cast<const char*>(pGlGetString(kGL_VENDOR));',
            '        if (!v) return 0;',
            '        if (std::strstr(v, "NVIDIA") || std::strstr(v, "nvidia")) return 0x10DE;',
            '        if (std::strstr(v, "Intel") || std::strstr(v, "INTEL")) return 0x8086;',
            '        if (std::strstr(v, "AMD") || std::strstr(v, "ATI")) return 0x1002;',
            '        return 0;',
            '    }',
            '',
            '    bool createFlipSwapChainOnWindow(void* factory, HWND hwnd, uint32_t w, uint32_t h) {',
            '        DxgiSwapChainDesc sd{};',
            '        sd.BufferDesc.Width = w;',
            '        sd.BufferDesc.Height = h;',
            '        sd.BufferDesc.RefreshRate.Numerator = 0;',
            '        sd.BufferDesc.RefreshRate.Denominator = 1;',
            '        sd.BufferDesc.Format = 87;          // DXGI_FORMAT_B8G8R8A8_UNORM',
            '        sd.SampleDesc.Count = 1;',
            '        sd.SampleDesc.Quality = 0;',
            '        sd.BufferUsage = 0x20;              // DXGI_USAGE_RENDER_TARGET_OUTPUT',
            '        sd.BufferCount = 3;                 // 3-buffer Flip-Discard',
            '        sd.OutputWindow = hwnd;',
            '        sd.Windowed = 1;',
            '        sd.SwapEffect = 4;                  // DXGI_SWAP_EFFECT_FLIP_DISCARD',
            '        sd.Flags = 0;                       // 0 = NO ALLOW_TEARING',
            '',
            '        auto createSc = reinterpret_cast<PFN_CreateSwapChain>((*reinterpret_cast<void***>(factory))[10]);',
            '        long hr = createSc(factory, d3dDevice, &sd, &dxgiSwapChain);',
            '        if (hr < 0 || !dxgiSwapChain) {',
            '            sd.SwapEffect = 3;',
            '            hr = createSc(factory, d3dDevice, &sd, &dxgiSwapChain);',
            '        }',
            '        if (hr < 0 || !dxgiSwapChain) {',
            '            HWND child = ensureChildSwapWindow(hwnd, w, h);',
            '            if (child) {',
            '                sd.OutputWindow = child;',
            '                sd.SwapEffect = 4;',
            '                hr = createSc(factory, d3dDevice, &sd, &dxgiSwapChain);',
            '                if (hr < 0 || !dxgiSwapChain) {',
            '                    sd.SwapEffect = 3;',
            '                    hr = createSc(factory, d3dDevice, &sd, &dxgiSwapChain);',
            '                }',
            '            }',
            '        } else if (childSwapHwnd && IsWindow(childSwapHwnd)) {',
            '            ShowWindow(childSwapHwnd, SW_HIDE);',
            '        }',
            '',
            '        if (hr >= 0 && dxgiSwapChain) {',
            '            reinterpret_cast<PFN_MakeWinAssoc>((*reinterpret_cast<void***>(factory))[8])(factory, sd.OutputWindow, 1 | 2);',
            '            return true;',
            '        }',
            '        return false;',
            '    }',
            '',
            '    void initPureGlStageBuffer(uint32_t w, uint32_t h) {',
            '        if (!pGlGenFramebuffers || !pGlGenRenderbuffers || !pGlBindRenderbuffer ||',
            '            !pGlRenderbufferStorage || !pGlFramebufferRenderbuffer || !pGlCheckFramebufferStatus) {',
            '            return;',
            '        }',
            '        int32_t prevDrawFbo = 0, prevRbo = 0;',
            '        pGlGetIntegerv(kGL_DRAW_FRAMEBUFFER_BINDING, &prevDrawFbo);',
            '        pGlGetIntegerv(kGL_RENDERBUFFER_BINDING, &prevRbo);',
            '',
            '        pGlGenFramebuffers(1, &glStageFbo);',
            '        pGlGenRenderbuffers(1, &glStageRbo);',
            '',
            '        pGlBindRenderbuffer(kGL_RENDERBUFFER, glStageRbo);',
            '        pGlRenderbufferStorage(kGL_RENDERBUFFER, kGL_RGBA8, static_cast<int32_t>(w), static_cast<int32_t>(h));',
            '',
            '        pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, glStageFbo);',
            '        pGlFramebufferRenderbuffer(kGL_DRAW_FRAMEBUFFER, kGL_COLOR_ATTACHMENT0, kGL_RENDERBUFFER, glStageRbo);',
            '',
            '        if (pGlCheckFramebufferStatus(kGL_DRAW_FRAMEBUFFER) != kGL_FRAMEBUFFER_COMPLETE) {',
            '            pGlDeleteFramebuffers(1, &glStageFbo);',
            '            pGlDeleteRenderbuffers(1, &glStageRbo);',
            '            glStageFbo = 0;',
            '            glStageRbo = 0;',
            '        }',
            '',
            '        pGlBindRenderbuffer(kGL_RENDERBUFFER, static_cast<uint32_t>(prevRbo));',
            '        pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevDrawFbo));',
            '    }',
            '',
            '    // Helper to register a single MiscFlags=0 D3D11 texture with WGL_NV_DX_interop2',
            '    bool registerWglInteropTarget(HANDLE hDev, void* d3dTex, uint32_t& outRbo, uint32_t& outTex, uint32_t& outFbo, HANDLE& outObj) {',
            '        bool usingRbo = false;',
            '        outRbo = 0; outTex = 0; outFbo = 0; outObj = nullptr;',
            '',
            '        if (pGlGenRenderbuffers && pGlBindRenderbuffer && pGlFramebufferRenderbuffer) {',
            '            int32_t prevRbo = 0;',
            '            pGlGetIntegerv(kGL_RENDERBUFFER_BINDING, &prevRbo);',
            '            pGlGenRenderbuffers(1, &outRbo);',
            '            pGlBindRenderbuffer(kGL_RENDERBUFFER, outRbo);',
            '            pGlBindRenderbuffer(kGL_RENDERBUFFER, static_cast<uint32_t>(prevRbo));',
            '            outObj = pWglDXRegisterObjectNV(hDev, d3dTex, outRbo, kGL_RENDERBUFFER, kWGL_ACCESS_READ_WRITE_NV);',
            '            if (outObj) usingRbo = true;',
            '        }',
            '',
            '        if (!outObj && pGlGenTextures && pGlBindTexture && pGlFramebufferTexture2D) {',
            '            if (outRbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &outRbo); outRbo = 0; }',
            '            pGlGenTextures(1, &outTex);',
            '            pGlBindTexture(kGL_TEXTURE_2D, outTex);',
            '            pGlBindTexture(kGL_TEXTURE_2D, 0);',
            '            outObj = pWglDXRegisterObjectNV(hDev, d3dTex, outTex, kGL_TEXTURE_2D, kWGL_ACCESS_READ_WRITE_NV);',
            '        }',
            '',
            '        if (!outObj) {',
            '            if (outRbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &outRbo); outRbo = 0; }',
            '            if (outTex && pGlDeleteTextures) { pGlDeleteTextures(1, &outTex); outTex = 0; }',
            '            return false;',
            '        }',
            '',
            '        int32_t prevDrawFbo = 0;',
            '        pGlGetIntegerv(kGL_DRAW_FRAMEBUFFER_BINDING, &prevDrawFbo);',
            '        pGlGenFramebuffers(1, &outFbo);',
            '',
            '        if (!pWglDXLockObjectsNV(hDev, 1, &outObj)) {',
            '            pGlDeleteFramebuffers(1, &outFbo); outFbo = 0;',
            '            pWglDXUnregisterObjectNV(hDev, outObj); outObj = nullptr;',
            '            if (outRbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &outRbo); outRbo = 0; }',
            '            if (outTex && pGlDeleteTextures) { pGlDeleteTextures(1, &outTex); outTex = 0; }',
            '            return false;',
            '        }',
            '',
            '        pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, outFbo);',
            '        if (usingRbo) {',
            '            pGlFramebufferRenderbuffer(kGL_DRAW_FRAMEBUFFER, kGL_COLOR_ATTACHMENT0, kGL_RENDERBUFFER, outRbo);',
            '        } else {',
            '            pGlFramebufferTexture2D(kGL_DRAW_FRAMEBUFFER, kGL_COLOR_ATTACHMENT0, kGL_TEXTURE_2D, outTex, 0);',
            '        }',
            '        uint32_t status = pGlCheckFramebufferStatus ? pGlCheckFramebufferStatus(kGL_DRAW_FRAMEBUFFER) : kGL_FRAMEBUFFER_COMPLETE;',
            '        pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevDrawFbo));',
            '        pWglDXUnlockObjectsNV(hDev, 1, &outObj);',
            '',
            '        if (status != kGL_FRAMEBUFFER_COMPLETE) {',
            '            pGlDeleteFramebuffers(1, &outFbo); outFbo = 0;',
            '            pWglDXUnregisterObjectNV(hDev, outObj); outObj = nullptr;',
            '            if (outRbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &outRbo); outRbo = 0; }',
            '            if (outTex && pGlDeleteTextures) { pGlDeleteTextures(1, &outTex); outTex = 0; }',
            '            return false;',
            '        }',
            '        return true;',
            '    }',
            '',
            '    bool tryInitInteropRing(HWND hwnd, uint32_t w, uint32_t h) {',
            '        void* factory = nullptr;',
            '        if (pCreateDXGIFactory1(&kIID_IDXGIFactory1, &factory) < 0 || !factory) return false;',
            '',
            '        uint32_t preferredVendor = detectPreferredGlVendorId();',
            '        bool deviceFound = false;',
            '',
            '        D3D11Texture2DDesc texDesc{};',
            '        texDesc.Width = w; texDesc.Height = h; texDesc.MipLevels = 1; texDesc.ArraySize = 1;',
            '        texDesc.Format = 87; texDesc.SampleDesc.Count = 1; texDesc.Usage = 0;',
            '        texDesc.BindFlags = 0x20 | 0x08; // RENDER_TARGET | SHADER_RESOURCE',
            '        texDesc.MiscFlags = 0;           // MiscFlags = 0 guarantees 100% WGL_NV_DX_interop2 compatibility!',
            '',
            '        for (int pass = 0; pass < 2 && !deviceFound; ++pass) {',
            '            for (uint32_t idx = 0; ; ++idx) {',
            '                void* cand = nullptr;',
            '                if (reinterpret_cast<PFN_EnumAdapters1>((*reinterpret_cast<void***>(factory))[12])(factory, idx, &cand) < 0 || !cand) break;',
            '',
            '                DxgiAdapterDesc1 desc{};',
            '                reinterpret_cast<PFN_GetDesc1>((*reinterpret_cast<void***>(cand))[10])(cand, &desc);',
            '                bool isPref = (preferredVendor != 0 && desc.VendorId == preferredVendor);',
            '                if ((pass == 0 && !isPref) || (pass == 1 && isPref && preferredVendor != 0)) {',
            '                    comRelease(cand);',
            '                    continue;',
            '                }',
            '',
            '                void* testDev = nullptr;',
            '                void* testCtx = nullptr;',
            '                uint32_t flOut = 0;',
            '                if (pD3D11CreateDevice(cand, 0, nullptr, 0x20, nullptr, 0, 7, &testDev, &flOut, &testCtx) >= 0 && testDev) {',
            '                    enableMTProtected(testDev);',
            '                    HANDLE hDev = pWglDXOpenDeviceNV(testDev);',
            '                    if (hDev) {',
            '                        void* tex0 = nullptr;',
            '                        if (reinterpret_cast<PFN_CreateTex2D>((*reinterpret_cast<void***>(testDev))[5])(testDev, &texDesc, nullptr, &tex0) >= 0 && tex0) {',
            '                            uint32_t rbo0 = 0, gltex0 = 0, fbo0 = 0;',
            '                            HANDLE hObj0 = nullptr;',
            '                            if (registerWglInteropTarget(hDev, tex0, rbo0, gltex0, fbo0, hObj0)) {',
            '                                d3dDevice = testDev; d3dContext = testCtx; hInteropDevice = hDev;',
            '                                d3dRingTex[0] = tex0; hRingInteropObj[0] = hObj0;',
            '                                glRingFbo[0] = fbo0; glRingRbo[0] = rbo0; glRingTex[0] = gltex0;',
            '                                deviceFound = true;',
            '                                comRelease(cand);',
            '                                break;',
            '                            }',
            '                            comRelease(tex0);',
            '                        }',
            '                        pWglDXCloseDeviceNV(hDev);',
            '                    }',
            '                    comRelease(testCtx); comRelease(testDev);',
            '                }',
            '                comRelease(cand);',
            '            }',
            '        }',
            '',
            '        if (!deviceFound || !d3dDevice || !hInteropDevice) {',
            '            comRelease(factory);',
            '            return false;',
            '        }',
            '',
            '        // Allocate ring textures 1 and 2 (MiscFlags = 0) and register directly with WGL_NV_DX_interop2',
            '        for (int i = 1; i < 3; ++i) {',
            '            if (reinterpret_cast<PFN_CreateTex2D>((*reinterpret_cast<void***>(d3dDevice))[5])(d3dDevice, &texDesc, nullptr, &d3dRingTex[i]) < 0 || !d3dRingTex[i]) {',
            '                comRelease(factory);',
            '                return false;',
            '            }',
            '        }',
            '',
            '        multiRingInteropActive = true;',
            '        for (int i = 1; i < 3; ++i) {',
            '            if (!registerWglInteropTarget(hInteropDevice, d3dRingTex[i], glRingRbo[i], glRingTex[i], glRingFbo[i], hRingInteropObj[i])) {',
            '                multiRingInteropActive = false;',
            '                break;',
            '            }',
            '        }',
            '',
            '        // If driver only supports 1 registered WGL interop object, use slot 0 as fallbackCaptureTex',
            '        if (!multiRingInteropActive) {',
            '            for (int i = 1; i < 3; ++i) {',
            '                if (hRingInteropObj[i]) { pWglDXUnregisterObjectNV(hInteropDevice, hRingInteropObj[i]); hRingInteropObj[i] = nullptr; }',
            '                if (glRingFbo[i]) { pGlDeleteFramebuffers(1, &glRingFbo[i]); glRingFbo[i] = 0; }',
            '                if (glRingRbo[i]) { pGlDeleteRenderbuffers(1, &glRingRbo[i]); glRingRbo[i] = 0; }',
            '                if (glRingTex[i]) { pGlDeleteTextures(1, &glRingTex[i]); glRingTex[i] = 0; }',
            '            }',
            '            fallbackCaptureTex = d3dRingTex[0];',
            '            hFallbackInteropObj = hRingInteropObj[0];',
            '            glFallbackFbo = glRingFbo[0];',
            '            glFallbackRbo = glRingRbo[0];',
            '            glFallbackTex = glRingTex[0];',
            '            hRingInteropObj[0] = nullptr; glRingFbo[0] = 0; glRingRbo[0] = 0; glRingTex[0] = 0;',
            '',
            '            d3dRingTex[0] = nullptr;',
            '            if (reinterpret_cast<PFN_CreateTex2D>((*reinterpret_cast<void***>(d3dDevice))[5])(d3dDevice, &texDesc, nullptr, &d3dRingTex[0]) < 0 || !d3dRingTex[0]) {',
            '                comRelease(factory);',
            '                return false;',
            '            }',
            '        }',
            '',
            '        bool scOk = createFlipSwapChainOnWindow(factory, hwnd, w, h);',
            '        comRelease(factory);',
            '        if (!scOk) return false;',
            '',
            '        initPureGlStageBuffer(w, h);',
            '        return true;',
            '    }',
            '',
            '    bool rebuildSurface(HWND hwnd, HDC mainDC, HGLRC hglrc, uint32_t w, uint32_t h) {',
            '        ensurePresenterThreadStarted();',
            '        std::lock_guard<std::mutex> lock(bridgeMutex);',
            '        destroyResourcesLocked();',
            '        prepareBorderlessWindow(hwnd, mainDC);',
            '        if (pWglSwapIntervalEXT) pWglSwapIntervalEXT(0);',
            '',
            '        if (!tryInitInteropRing(hwnd, w, h)) {',
            '            destroyResourcesLocked();',
            '            return (interopSupported = false);',
            '        }',
            '',
            '        trackedHwnd = hwnd; cachedDC = mainDC; trackedGlrc = hglrc;',
            '        surfaceWidth = w; surfaceHeight = h;',
            '        vblankReadyForStage.store(true, std::memory_order_release);',
            '        bridgeActive.store(true, std::memory_order_release);',
            '        return true;',
            '    }',
            '',
            '    int pickFreeWriteSlot() {',
            '        int busyPresent = presentingSlot.load(std::memory_order_acquire);',
            '        int busyLatest = latestReadySlot.load(std::memory_order_acquire);',
            '        for (int offset = 1; offset <= 3; ++offset) {',
            '            int cand = (lastWrittenSlot + offset) % 3;',
            '            if (cand != busyPresent && cand != busyLatest) {',
            '                lastWrittenSlot = cand;',
            '                return cand;',
            '            }',
            '        }',
            '        return (lastWrittenSlot + 1) % 3;',
            '    }',
            '',
            '    // Transfers either glStageFbo (flipY=false) or FBO 0 (flipY=true) directly into DXGI Ring Slot:',
            '    // When multiRingInteropActive is true, performs ZERO D3D11 CopyResource and ZERO D3D11 Flush on Main Thread!',
            '    bool transferGlSourceToDxgiRing(uint32_t srcFbo, bool flipY) {',
            '        int writeSlot = pickFreeWriteSlot();',
            '',
            '        int32_t prevReadFbo = 0, prevDrawFbo = 0;',
            '        pGlGetIntegerv(kGL_READ_FRAMEBUFFER_BINDING, &prevReadFbo);',
            '        pGlGetIntegerv(kGL_DRAW_FRAMEBUFFER_BINDING, &prevDrawFbo);',
            '        unsigned char scissorWasOn = pGlIsEnabled ? pGlIsEnabled(kGL_SCISSOR_TEST) : 0;',
            '        if (scissorWasOn && pGlDisable) pGlDisable(kGL_SCISSOR_TEST);',
            '',
            '        HANDLE targetObj = multiRingInteropActive ? hRingInteropObj[writeSlot] : hFallbackInteropObj;',
            '        uint32_t targetFbo = multiRingInteropActive ? glRingFbo[writeSlot] : glFallbackFbo;',
            '',
            '        bool ok = false;',
            '        if (pWglDXLockObjectsNV(hInteropDevice, 1, &targetObj)) {',
            '            pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, srcFbo);',
            '            if (srcFbo == 0 && pGlReadBuffer) pGlReadBuffer(kGL_BACK);',
            '            pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, targetFbo);',
            '',
            '            int32_t srcY0 = flipY ? static_cast<int32_t>(surfaceHeight) : 0;',
            '            int32_t srcY1 = flipY ? 0 : static_cast<int32_t>(surfaceHeight);',
            '            pGlBlitFramebuffer(',
            '                0, 0, static_cast<int32_t>(surfaceWidth), static_cast<int32_t>(surfaceHeight),',
            '                0, srcY0, static_cast<int32_t>(surfaceWidth), srcY1,',
            '                kGL_COLOR_BUFFER_BIT, kGL_NEAREST',
            '            );',
            '            pWglDXUnlockObjectsNV(hInteropDevice, 1, &targetObj);',
            '',
            '            if (!multiRingInteropActive) {',
            '                std::lock_guard<std::mutex> lock(bridgeMutex);',
            '                reinterpret_cast<PFN_CopyResource>((*reinterpret_cast<void***>(d3dContext))[47])(d3dContext, d3dRingTex[writeSlot], fallbackCaptureTex);',
            '            }',
            '',
            '            latestReadySlot.store(writeSlot, std::memory_order_release);',
            '            SetEvent(hFrameReadyEvent);',
            '            ok = true;',
            '        } else {',
            '            vblankReadyForStage.store(true, std::memory_order_release);',
            '        }',
            '',
            '        pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, static_cast<uint32_t>(prevReadFbo));',
            '        pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevDrawFbo));',
            '        if (scissorWasOn && pGlEnable) pGlEnable(kGL_SCISSOR_TEST);',
            '        return ok;',
            '    }',
            '',
            '    // Runs strictly in onSchedulerPostUpdate() (BEFORE visit() submits new draw calls):',
            '    // Because the OpenGL command queue is 100% idle here and stageFence is ALREADY_SIGNALED,',
            '    // wglDXLock/Unlock executes in 3 microseconds with ZERO micro-stutter!',
            '    bool pollStageAndTransferIdle(int64_t nowQpc, int64_t period, bool forceTransferNow) {',
            '        if (!stageInFlight) return false;',
            '',
            '        if (stageFence && pGlClientWaitSync) {',
            '            uint32_t res = pGlClientWaitSync(stageFence, 0, 0); // 0ns timeout = ZERO CPU STALL!',
            '            bool timedOut = (nowQpc - stageStartQpc >= period * 2);',
            '            if (res != kGL_ALREADY_SIGNALED && res != kGL_CONDITION_SATISFIED && !forceTransferNow && !timedOut) {',
            '                return false;',
            '            }',
            '            pGlDeleteSync(stageFence);',
            '            stageFence = nullptr;',
            '        }',
            '        stageInFlight = false;',
            '',
            '        // Always transfer the staged frame (never discard it on timeout!)',
            '        return transferGlSourceToDxgiRing(glStageFbo, false);',
            '    }',
            '',
            '    void cancelPendingStage() {',
            '        if (!stageInFlight) return;',
            '        if (stageFence && pGlDeleteSync) {',
            '            pGlDeleteSync(stageFence);',
            '            stageFence = nullptr;',
            '        }',
            '        stageInFlight = false;',
            '    }',
            '',
            '    // Runs at the END of CCScheduler::update(dt) (after physics/respawn, RIGHT BEFORE visit()):',
            '    void onSchedulerPostUpdate() {',
            '        if (!stageInFlight || !bridgeActive.load(std::memory_order_relaxed)) return;',
            '        if (!pGetCurrentContext || pGetCurrentContext() != trackedGlrc) return;',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '        int64_t period = refreshPeriodTicks.load(std::memory_order_relaxed);',
            '        pollStageAndTransferIdle(now.QuadPart, period, false);',
            '    }',
            '',
            '    bool submitFrameV24() {',
            '        if (!interopSupported) return false;',
            '',
            '        auto* dir = cocos2d::CCDirector::sharedDirector();',
            '        auto* curScene = dir ? dir->getRunningScene() : nullptr;',
            '',
            '        // 1. One-Time Startup Loading Screen Latch:',
            '        if (!startupLoadingComplete) {',
            '            if (!curScene || curScene->getChildByType<LoadingLayer>(0) != nullptr) {',
            '                return false;',
            '            }',
            '            startupLoadingComplete = true;',
            '            lastRunningScene = curScene;',
            '        }',
            '',
            '        // 2. Detect Level Load (onPlay), Level Exit (onQuit), or Scene Transitions:',
            '        if (curScene != lastRunningScene || (dir && dir->getNextScene() != nullptr)) {',
            '            lastRunningScene = curScene;',
            '            transitionHoldFrames = 18; // Use immediate same-frame presentation for the next 18 frames',
            '        }',
            '        if (transitionHoldFrames > 0) {',
            '            --transitionHoldFrames;',
            '        }',
            '',
            '        if (!loadAllApis()) return false;',
            '',
            '        HDC mainDC = pGetCurrentDC();',
            '        HGLRC hglrc = pGetCurrentContext();',
            '        if (!mainDC || !hglrc) return false;',
            '',
            '        uint32_t w = surfaceWidth;',
            '        uint32_t h = surfaceHeight;',
            '        HWND hwnd = trackedHwnd;',
            '',
            '        if (mainDC != cachedDC || !hwnd || (++rectCheckCounter & 31u) == 0u) {',
            '            hwnd = WindowFromDC(mainDC);',
            '            if (!hwnd) return false;',
            '            RECT rc{};',
            '            if (!GetClientRect(hwnd, &rc)) return false;',
            '            w = static_cast<uint32_t>(rc.right - rc.left);',
            '            h = static_cast<uint32_t>(rc.bottom - rc.top);',
            '        }',
            '        if (w == 0 || h == 0) return true;',
            '',
            '        if (!bridgeActive.load(std::memory_order_acquire) ||',
            '            hwnd != trackedHwnd || hglrc != trackedGlrc || w != surfaceWidth || h != surfaceHeight) {',
            '            if (!rebuildSurface(hwnd, mainDC, hglrc, w, h)) return false;',
            '        }',
            '',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '',
            '        int64_t callDelta = now.QuadPart - lastCallQpc;',
            '        lastCallQpc = now.QuadPart;',
            '        int64_t period = refreshPeriodTicks.load(std::memory_order_relaxed);',
            '',
            '        // 3. Hysteresis Detector for 60Hz Callers vs Unlocked 240+ FPS',
            '        bool isSlowOrLoadingTick = (callDelta >= (period * 68) / 100);',
            '        if (isSlowOrLoadingTick) {',
            '            consecutiveHighRateFrames = 0;',
            '            if (++consecutive60HzFrames >= 4) {',
            '                is60HzCallerMode = true;',
            '            }',
            '        } else if (callDelta > 0 && callDelta <= (period * 58) / 100) {',
            '            consecutive60HzFrames = 0;',
            '            if (++consecutiveHighRateFrames >= 2) {',
            '                is60HzCallerMode = false;',
            '            }',
            '        }',
            '',
            '        // 4. Immediate Same-Frame Path for Level Load (onPlay), Level Exit (onQuit), Transitions, and 60Hz Menus:',
            '        //    Presents the current frame immediately on the same tick so clicking Load Level or Exit Level',
            '        //    never traps a frame in glStageFbo during PlayLayer::init() or PlayLayer::~PlayLayer()!',
            '        bool useImmediatePresent = (transitionHoldFrames > 0) || is60HzCallerMode || (callDelta >= period * 2) || !glStageFbo;',
            '        if (useImmediatePresent) {',
            '            cancelPendingStage();',
            '            vblankReadyForStage.store(false, std::memory_order_relaxed);',
            '            lastStageQpc = now.QuadPart;',
            '            transferGlSourceToDxgiRing(0, true);',
            '            return true;',
            '        }',
            '',
            '        // 5. High-FPS Gameplay Path (120 / 240 / 360 / 480 FPS):',
            '        //    Do NOT call transferGlSourceToDxgiRing inside swapBuffers() (right after visit()),',
            '        //    unless stageInFlight has been waiting for > 2 full VBlank periods!',
            '        if (stageInFlight) {',
            '            if (now.QuadPart - stageStartQpc >= period * 2) {',
            '                pollStageAndTransferIdle(now.QuadPart, period, true);',
            '            }',
            '            return true; // Let onSchedulerPostUpdate() transfer it when the OpenGL queue is 100% idle!',
            '        }',
            '',
            '        int64_t sinceLastStage = now.QuadPart - lastStageQpc;',
            '        bool shouldStage = vblankReadyForStage.load(std::memory_order_acquire) ||',
            '                           (sinceLastStage >= (period * 95) / 100);',
            '',
            '        if (!shouldStage) {',
            '            return true; // Intermediate 240Hz tick: return in 0.0000ms!',
            '        }',
            '',
            '        vblankReadyForStage.store(false, std::memory_order_relaxed);',
            '        lastStageQpc = now.QuadPart;',
            '',
            '        int32_t prevReadFbo = 0, prevDrawFbo = 0;',
            '        pGlGetIntegerv(kGL_READ_FRAMEBUFFER_BINDING, &prevReadFbo);',
            '        pGlGetIntegerv(kGL_DRAW_FRAMEBUFFER_BINDING, &prevDrawFbo);',
            '        unsigned char scissorWasOn = pGlIsEnabled ? pGlIsEnabled(kGL_SCISSOR_TEST) : 0;',
            '        if (scissorWasOn && pGlDisable) pGlDisable(kGL_SCISSOR_TEST);',
            '',
            '        // Pure-OpenGL async stage (FBO 0 -> glStageFbo with Y-flip):',
            '        // Zero DXGI lock during swapBuffers(); onSchedulerPostUpdate() will transfer it once signaled!',
            '        pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, 0);',
            '        if (pGlReadBuffer) pGlReadBuffer(kGL_BACK);',
            '        pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, glStageFbo);',
            '        pGlBlitFramebuffer(',
            '            0, 0, static_cast<int32_t>(w), static_cast<int32_t>(h),',
            '            0, static_cast<int32_t>(h), static_cast<int32_t>(w), 0,',
            '            kGL_COLOR_BUFFER_BIT, kGL_NEAREST',
            '        );',
            '',
            '        pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, static_cast<uint32_t>(prevReadFbo));',
            '        pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevDrawFbo));',
            '        if (scissorWasOn && pGlEnable) pGlEnable(kGL_SCISSOR_TEST);',
            '',
            '        stageFence = pGlFenceSync(kGL_SYNC_GPU_COMMANDS_COMPLETE, 0);',
            '        stageStartQpc = now.QuadPart;',
            '        stageInFlight = true;',
            '        if (pGlFlush) pGlFlush();',
            '        return true;',
            '    }',
            '    #endif',
            '}',
            '',
            'class $modify(TearFixScheduler, cocos2d::CCScheduler) {',
            '    void update(float dt) {',
            '        CCScheduler::update(dt);',
            '        #ifdef GEODE_IS_WINDOWS',
            '        // Transfer completed stage right AFTER CPU update and BEFORE visit() submits new draw calls!',
            '        BypassScreenTearV24::onSchedulerPostUpdate();',
            '        #endif',
            '    }',
            '};',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    static void onModify(auto& self) {',
            '        (void)self.setHookPriority("cocos2d::CCEGLView::swapBuffers", 1000000);',
            '    }',
            '',
            '    void swapBuffers() {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        if (BypassScreenTearV24::submitFrameV24()) {',
            '            return;',
            '        }',
            '        #endif',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    BypassScreenTearV24::cleanAllNvidiaProfiles();',
            '    #endif',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod for GD 2.2081 (Geode SDK v5.11.2)
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2

      - name: Verify and Package yingseo.notear.fps.geode Archive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null

          $geodeCandidate = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.geode" -Recurse |
                            Sort-Object Length -Descending |
                            Select-Object -First 1

          if (-not $geodeCandidate) {
            Write-Error "No .geode file found in build directory!"
            exit 1
          }

          $destGeode = Join-Path $PWD "artifact\yingseo.notear.fps.geode"
          Copy-Item -Path $geodeCandidate.FullName -Destination $destGeode -Force

          $zip = [System.IO.Compression.ZipFile]::Open($destGeode, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $hasDll = $false
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -eq "yingseo.notear.fps.dll" -and $entry.Length -gt 4096) {
                $hasDll = $true
              }
            }

            if (-not $hasDll) {
              $dllFile = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.dll" -Recurse |
                         Where-Object { $_.Name -like "*Bypass*" -or $_.Name -like "*yingseo*" } |
                         Sort-Object Length -Descending |
                         Select-Object -First 1
              if ($dllFile) {
                $oldDll = $zip.GetEntry("yingseo.notear.fps.dll")
                if ($oldDll) { $oldDll.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $dllFile.FullName, "yingseo.notear.fps.dll") | Out-Null
              }
            }

            foreach ($asset in @("mod.json", "logo.png", "about.md", "changelog.md")) {
              $assetPath = Join-Path $PWD $asset
              if (Test-Path $assetPath) {
                $existing = $zip.GetEntry($asset)
                if ($existing) { $existing.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $assetPath, $asset) | Out-Null
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bypass-Screen-Tear-v24.0.0
          path: artifact/yingseo.notear.fps.geode
