name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build (GD 2.2081)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Generate Full Project & Sync Geode SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          # 1. Tao thu muc src va xoa file cu tranh xung dot
          if (-not (Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" | Out-Null
          }
          if (Test-Path "main.cpp") {
            Remove-Item -Path "main.cpp" -Force
          }

          # 2. Lay phien ban Geode SDK moi nhat
          $headers = @{ "User-Agent" = "GeodeModBuilder" }
          if ($env:GH_TOKEN) { $headers["Authorization"] = "Bearer $env:GH_TOKEN" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/geode/releases/latest" -Headers $headers
          $sdkVer = $release.tag_name.TrimStart('v')
          Write-Host "Using Geode SDK version: $sdkVer"

          # 3. Ghi file mod.json chuan
          $modJson = @"
          {
              "geode": "$sdkVer",
              "gd": {
                  "win": "2.2081"
              },
              "id": "yingseo.notear-fps",
              "name": "NoTear FPS Auto",
              "version": "v1.0.0",
              "developer": "YingSeo",
              "description": "Tu dong triet tieu xe hinh (Screen Tearing) khi Unlock FPS ngay khi vao game."
          }
          "@
          [System.IO.File]::WriteAllText((Join-Path $PWD "mod.json"), $modJson, $utf8NoBom)

          # 4. Ghi file CMakeLists.txt day du thu vien lien ket Windows
          $cmake = @'
          cmake_minimum_required(VERSION 3.21)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(CMAKE_CXX_VISIBILITY_PRESET hidden)

          project(NoTearFPS VERSION 1.0.0)

          add_library(${PROJECT_NAME} SHARED src/main.cpp)

          if (NOT DEFINED ENV{GEODE_SDK})
              message(FATAL_ERROR "Unable to find Geode SDK!")
          endif()

          add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)

          if (WIN32)
              target_link_libraries(${PROJECT_NAME} PRIVATE opengl32 dwmapi user32 gdi32 winmm)
          endif()

          setup_geode_mod(${PROJECT_NAME})
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD "CMakeLists.txt"), $cmake, $utf8NoBom)

          # 5. Ghi file src/main.cpp (Tu dong bat 100% khi vao game, khong can nut bam)
          $mainCpp = @'
          #include <Geode/Geode.hpp>
          #include <Geode/modify/CCDirector.hpp>
          #include <Geode/modify/CCScheduler.hpp>
          #include <Geode/modify/CCEGLView.hpp>

          #ifdef GEODE_IS_WINDOWS
          #pragma comment(lib, "opengl32.lib")
          #pragma comment(lib, "dwmapi.lib")
          #pragma comment(lib, "user32.lib")
          #pragma comment(lib, "gdi32.lib")
          #pragma comment(lib, "winmm.lib")
          #endif

          using namespace geode::prelude;

          namespace AutoNoTear {
              bool shouldPresentFrame = true;
              bool sceneHiddenByMod = false;
              bool savedSceneVisibility = true;

              #ifdef GEODE_IS_WINDOWS
              LARGE_INTEGER qpcFreq{};
              LARGE_INTEGER nextPresentQpc{};
              int64_t refreshPeriodTicks = 0;
              bool initialized = false;
              bool borderlessApplied = false;

              using PFNWGLSWAPINTERVALEXTPROC = BOOL(WINAPI*)(int);
              using PFNWGLGETPROCADDRESS = PROC(WINAPI*)(LPCSTR);
              using PFNWGLGETCURRENTDC = HDC(WINAPI*)(void);
              using PFNTIMEBEGINPERIOD = UINT(WINAPI*)(UINT);

              PFNWGLSWAPINTERVALEXTPROC pSwapInterval = nullptr;
              PFNWGLGETCURRENTDC pGetCurrentDC = nullptr;
              bool glHooked = false;

              void initEngine() {
                  if (initialized) return;
                  initialized = true;

                  QueryPerformanceFrequency(&qpcFreq);
                  QueryPerformanceCounter(&nextPresentQpc);

                  if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {
                      if (auto pTimeBegin = reinterpret_cast<PFNTIMEBEGINPERIOD>(
                              GetProcAddress(hWinmm, "timeBeginPeriod"))) {
                          pTimeBegin(1);
                      }
                  }

                  DEVMODEA dm{};
                  dm.dmSize = sizeof(DEVMODEA);
                  double hz = 60.0;
                  if (EnumDisplaySettingsA(nullptr, ENUM_CURRENT_SETTINGS, &dm) && dm.dmDisplayFrequency >= 30) {
                      hz = static_cast<double>(dm.dmDisplayFrequency);
                  }
                  refreshPeriodTicks = static_cast<int64_t>(static_cast<double>(qpcFreq.QuadPart) / hz);
              }

              void ensureBorderlessFlip(HWND hwnd) {
                  if (!hwnd || borderlessApplied) return;
                  borderlessApplied = true;

                  HMONITOR hMon = MonitorFromWindow(hwnd, MONITOR_DEFAULTTONEAREST);
                  MONITORINFO mi{};
                  mi.cbSize = sizeof(MONITORINFO);
                  if (GetMonitorInfoA(hMon, &mi)) {
                      RECT winRect{};
                      GetWindowRect(hwnd, &winRect);
                      int monW = mi.rcMonitor.right - mi.rcMonitor.left;
                      int monH = mi.rcMonitor.bottom - mi.rcMonitor.top;
                      int winW = winRect.right - winRect.left;
                      int winH = winRect.bottom - winRect.top;

                      if (winW >= monW - 16 && winH >= monH - 16) {
                          LONG_PTR style = GetWindowLongPtrA(hwnd, GWL_STYLE);
                          style &= ~(WS_CAPTION | WS_THICKFRAME | WS_MINIMIZEBOX | WS_MAXIMIZEBOX | WS_SYSMENU);
                          style |= WS_POPUP | WS_VISIBLE;
                          SetWindowLongPtrA(hwnd, GWL_STYLE, style);

                          SetWindowPos(
                              hwnd, HWND_TOP,
                              mi.rcMonitor.left, mi.rcMonitor.top,
                              monW, monH,
                              SWP_FRAMECHANGED | SWP_NOOWNERZORDER | SWP_SHOWWINDOW
                          );
                      }
                  }
              }

              void syncVBlankPhase() {
                  if (!glHooked) {
                      glHooked = true;
                      if (HMODULE hGl = GetModuleHandleA("opengl32.dll")) {
                          pGetCurrentDC = reinterpret_cast<PFNWGLGETCURRENTDC>(
                              GetProcAddress(hGl, "wglGetCurrentDC")
                          );
                          auto pGetProc = reinterpret_cast<PFNWGLGETPROCADDRESS>(
                              GetProcAddress(hGl, "wglGetProcAddress")
                          );
                          if (pGetProc) {
                              pSwapInterval = reinterpret_cast<PFNWGLSWAPINTERVALEXTPROC>(
                                  pGetProc("wglSwapIntervalEXT")
                              );
                          }
                      }
                  }

                  if (!borderlessApplied && pGetCurrentDC) {
                      if (HDC hdc = pGetCurrentDC()) {
                          ensureBorderlessFlip(WindowFromDC(hdc));
                      }
                  }

                  if (pSwapInterval) {
                      pSwapInterval(0);
                  }

                  LARGE_INTEGER now{};
                  QueryPerformanceCounter(&now);
                  int64_t remainingTicks = nextPresentQpc.QuadPart - now.QuadPart;
                  double remainingMs = (static_cast<double>(remainingTicks) * 1000.0) /
                                       static_cast<double>(qpcFreq.QuadPart);

                  if (remainingMs > 0.0 && remainingMs < 1.8) {
                      while (true) {
                          QueryPerformanceCounter(&now);
                          if (now.QuadPart >= nextPresentQpc.QuadPart) break;
                          YieldProcessor();
                      }
                  }
              }
              #endif

              void restoreScene(cocos2d::CCDirector* director) {
                  if (sceneHiddenByMod && director) {
                      if (auto* scene = director->getRunningScene()) {
                          scene->setVisible(savedSceneVisibility);
                      }
                      sceneHiddenByMod = false;
                  }
              }
          }

          class $modify(AutoNoTearDirector, cocos2d::CCDirector) {
              void drawScene() {
                  #ifdef GEODE_IS_WINDOWS
                  AutoNoTear::initEngine();

                  LARGE_INTEGER now{};
                  QueryPerformanceCounter(&now);

                  if (now.QuadPart >= AutoNoTear::nextPresentQpc.QuadPart) {
                      AutoNoTear::shouldPresentFrame = true;
                      AutoNoTear::nextPresentQpc.QuadPart += AutoNoTear::refreshPeriodTicks;
                      if (now.QuadPart >= AutoNoTear::nextPresentQpc.QuadPart) {
                          AutoNoTear::nextPresentQpc.QuadPart = now.QuadPart + AutoNoTear::refreshPeriodTicks;
                      }
                  } else {
                      AutoNoTear::shouldPresentFrame = false;
                  }
                  #endif

                  CCDirector::drawScene();
                  AutoNoTear::restoreScene(this);
              }
          };

          class $modify(AutoNoTearScheduler, cocos2d::CCScheduler) {
              void update(float dt) {
                  CCScheduler::update(dt);

                  if (!AutoNoTear::shouldPresentFrame) {
                      if (auto* dir = cocos2d::CCDirector::sharedDirector()) {
                          if (auto* scene = dir->getRunningScene()) {
                              AutoNoTear::savedSceneVisibility = scene->isVisible();
                              scene->setVisible(false);
                              AutoNoTear::sceneHiddenByMod = true;
                          }
                      }
                  }
              }
          };

          class $modify(AutoNoTearEGLView, cocos2d::CCEGLView) {
              void swapBuffers() {
                  AutoNoTear::restoreScene(cocos2d::CCDirector::sharedDirector());

                  if (!AutoNoTear::shouldPresentFrame) {
                      return;
                  }

                  #ifdef GEODE_IS_WINDOWS
                  AutoNoTear::syncVBlankPhase();
                  #endif

                  CCEGLView::swapBuffers();
              }
          };

          $on_mod(Loaded) {
              #ifdef GEODE_IS_WINDOWS
              AutoNoTear::initEngine();
              #endif
          }
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD "src/main.cpp"), $mainCpp, $utf8NoBom)

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: latest
          use-lto: false

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-Auto
          path: |
            **/*.geode
          if-no-files-found: error
