name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build (GD 2.2081)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Icon, Docs, Config & Anti-Tear Source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          if (-not (Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" -Force | Out-Null
          }
          if (Test-Path "main.cpp") {
            Remove-Item -Path "main.cpp" -Force
          }

          # 1. Tao logo.png (256x256) chuan cu phap PowerShell (-ArgumentList)
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap -ArgumentList 256, 256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
          $g.Clear([System.Drawing.Color]::FromArgb(255, 12, 16, 28))

          $penCyan = New-Object System.Drawing.Pen -ArgumentList ([System.Drawing.Color]::FromArgb(255, 0, 229, 255)), 8
          $penPurple = New-Object System.Drawing.Pen -ArgumentList ([System.Drawing.Color]::FromArgb(255, 110, 40, 255)), 4
          $g.DrawRectangle($penCyan, 14, 14, 228, 228)
          $g.DrawRectangle($penPurple, 26, 26, 204, 204)

          $penWave = New-Object System.Drawing.Pen -ArgumentList ([System.Drawing.Color]::FromArgb(255, 0, 255, 180)), 7
          $g.DrawLine($penWave, 42, 128, 94, 128)
          $g.DrawLine($penWave, 94, 128, 114, 76)
          $g.DrawLine($penWave, 114, 76, 142, 180)
          $g.DrawLine($penWave, 142, 180, 162, 128)
          $g.DrawLine($penWave, 162, 128, 214, 128)

          $fontTitle = New-Object System.Drawing.Font -ArgumentList "Arial", 22, ([System.Drawing.FontStyle]::Bold)
          $fontSub = New-Object System.Drawing.Font -ArgumentList "Arial", 13, ([System.Drawing.FontStyle]::Bold)
          $brushWhite = New-Object System.Drawing.SolidBrush -ArgumentList ([System.Drawing.Color]::FromArgb(255, 255, 255, 255))
          $brushCyan = New-Object System.Drawing.SolidBrush -ArgumentList ([System.Drawing.Color]::FromArgb(255, 0, 229, 255))
          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center

          $rectTitle = New-Object System.Drawing.RectangleF -ArgumentList 0, 38, 256, 42
          $rectSub = New-Object System.Drawing.RectangleF -ArgumentList 0, 186, 256, 36
          $g.DrawString("NO TEAR", $fontTitle, $brushWhite, $rectTitle, $sf)
          $g.DrawString("FPS SYNC", $fontSub, $brushCyan, $rectSub, $sf)

          $g.Dispose()
          $logoPath = Join-Path $PWD "logo.png"
          $bmp.Save($logoPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

          if (-not (Test-Path $logoPath)) {
            Write-Error "Failed to create logo.png!"
            exit 1
          }

          # 2. Tao about.md de hien thi day du trong tab Description cua Geode
          $aboutLines = @(
            '# <cy>NoTear FPS</c>',
            '',
            'Tu dong triet tieu hoan toan hien tuong **xe man hinh / soc nhieu ngang (Screen Tearing)** khi bat **Unlock FPS** trong Geometry Dash 2.2081.',
            '',
            '### <cg>Cac tinh nang tu dong:</c>',
            '- **DWM Composed Anti-Tear Lock:** Ngat che do Direct-Flip gay xe hinh tren Windows 11, ep khung hinh di qua bo dem ba (Triple-Buffered VBlank) cua DWM.',
            '- **Smart Render Pacing:** Giu nguyen 100% toc do vat ly va do nhay click o 120 / 240 / 360 / 480 FPS nhung dong bo dau ra OpenGL khop voi tan so quet man hinh.',
            '- **Zero Input Lag & Plug-and-Play:** Tu dong chay ngam ngay khi vao game, khong can nut bam hay cau hinh.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "about.md"), $aboutLines, $utf8NoBom)

          # 3. Tao changelog.md de hien thi trong tab Changelog cua Geode
          $changelogLines = @(
            '# v2.0.0',
            '- Sua loi mod bi Geode tu dong chuyen sang trang thai Disabled.',
            '- Bổ sung đầy đủ Icon (logo.png), Description (about.md) và Tags.',
            '- Nang cap DWM Composed Flip & glFinish VBlank Pacing xoa triet de soc nhieu man hinh khi Unlock FPS.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "changelog.md"), $changelogLines, $utf8NoBom)

          # 4. Tao mod.json voi ID moi (tu dong Enabled khi cai) va day du Tags
          $modJsonLines = @(
            '{',
            '    "geode": "5.3.0",',
            '    "gd": {',
            '        "win": "2.2081"',
            '    },',
            '    "id": "yingseo.notear-fps-v2",',
            '    "name": "NoTear FPS",',
            '    "version": "v2.0.0",',
            '    "developer": "YingSeo",',
            '    "description": "Tu dong triet tieu soc nhieu va xe man hinh (Screen Tearing) khi bat Unlock FPS trong Geometry Dash 2.2081.",',
            '    "early-load": true,',
            '    "tags": [',
            '        "performance",',
            '        "enhancement",',
            '        "universal"',
            '    ]',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "mod.json"), $modJsonLines, $utf8NoBom)

          # 5. Tao CMakeLists.txt tu dong khop phien ban Geode SDK moi nhat
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_EXTENSIONS OFF)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            '',
            'project(NoTearFPS VERSION 2.0.0)',
            '',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            '',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            '',
            'if (EXISTS "$ENV{GEODE_SDK}/VERSION")',
            '    file(READ "$ENV{GEODE_SDK}/VERSION" RAW_SDK_VER)',
            '    string(STRIP "${RAW_SDK_VER}" RAW_SDK_VER)',
            '    string(REGEX REPLACE "^v" "" EXACT_GEODE_VER "${RAW_SDK_VER}")',
            '    file(READ "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" MOD_JSON_TEXT)',
            '    string(REGEX REPLACE "\"geode\"[ \t]*:[ \t]*\"[^\"]+\"" "\"geode\": \"${EXACT_GEODE_VER}\"" MOD_JSON_TEXT "${MOD_JSON_TEXT}")',
            '    file(WRITE "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" "${MOD_JSON_TEXT}")',
            'endif()',
            '',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            '',
            'if (DEFINED GEODE_GD_VERSION AND NOT "${GEODE_GD_VERSION}" STREQUAL "")',
            '    file(READ "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" MOD_JSON_TEXT)',
            '    string(REGEX REPLACE "\"win\"[ \t]*:[ \t]*\"[^\"]+\"" "\"win\": \"${GEODE_GD_VERSION}\"" MOD_JSON_TEXT "${MOD_JSON_TEXT}")',
            '    file(WRITE "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" "${MOD_JSON_TEXT}")',
            'endif()',
            '',
            'setup_geode_mod(${PROJECT_NAME})'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "CMakeLists.txt"), $cmakeLines, $utf8NoBom)

          # 6. Tao src/main.cpp (Khong dung luong ngam gay crash, DWM Composed Flip + Render Pacing)
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCDirector.hpp>',
            '#include <Geode/modify/CCScheduler.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '',
            'using namespace geode::prelude;',
            '',
            'namespace TearFix {',
            '    int64_t qpcFreq = 0;',
            '    int64_t lastTickQpc = 0;',
            '    int64_t nextPresentQpc = 0;',
            '    int64_t refreshPeriodTicks = 0;',
            '',
            '    bool initialized = false;',
            '    bool shouldPresentFrame = true;',
            '    bool overrideSchedulerDt = false;',
            '    float currentStepDt = 1.0f / 240.0f;',
            '    cocos2d::CCScene* lastScenePtr = nullptr;',
            '',
            '    #ifdef GEODE_IS_WINDOWS',
            '    using PFN_timeBeginPeriod = unsigned int(__stdcall*)(unsigned int);',
            '    using PFN_wglGetProcAddress = void*(__stdcall*)(const char*);',
            '    using PFN_wglGetCurrentDC = HDC(__stdcall*)(void);',
            '    using PFN_wglSwapIntervalEXT = int(__stdcall*)(int);',
            '    using PFN_glFinish = void(__stdcall*)(void);',
            '    using PFN_GetDeviceCaps = int(__stdcall*)(HDC, int);',
            '    using PFN_ChangeDisplaySettingsA = long(__stdcall*)(void*, unsigned long);',
            '',
            '    PFN_wglGetProcAddress pGetProcAddress = nullptr;',
            '    PFN_wglGetCurrentDC pGetCurrentDC = nullptr;',
            '    PFN_wglSwapIntervalEXT pSwapInterval = nullptr;',
            '    PFN_glFinish pGlFinish = nullptr;',
            '    PFN_GetDeviceCaps pGetDeviceCaps = nullptr;',
            '    PFN_ChangeDisplaySettingsA pChangeDisplaySettingsA = nullptr;',
            '',
            '    bool glResolved = false;',
            '    HWND cachedHwnd = nullptr;',
            '    uint32_t windowCheckCounter = 0;',
            '',
            '    void ensureInitialized() {',
            '        if (initialized) return;',
            '        initialized = true;',
            '',
            '        LARGE_INTEGER freq{}, now{};',
            '        QueryPerformanceFrequency(&freq);',
            '        QueryPerformanceCounter(&now);',
            '        qpcFreq = freq.QuadPart;',
            '        lastTickQpc = now.QuadPart;',
            '        nextPresentQpc = now.QuadPart;',
            '        refreshPeriodTicks = qpcFreq / 60;',
            '',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto pTimeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"))) {',
            '                pTimeBegin(1);',
            '            }',
            '        }',
            '        if (HMODULE hGdi = GetModuleHandleA("gdi32.dll")) {',
            '            pGetDeviceCaps = reinterpret_cast<PFN_GetDeviceCaps>(GetProcAddress(hGdi, "GetDeviceCaps"));',
            '        }',
            '        if (HMODULE hUser = GetModuleHandleA("user32.dll")) {',
            '            pChangeDisplaySettingsA = reinterpret_cast<PFN_ChangeDisplaySettingsA>(GetProcAddress(hUser, "ChangeDisplaySettingsA"));',
            '        }',
            '    }',
            '',
            '    // Chuyen cua so Fullscreen sang DWM Composed Borderless (monH + 1)',
            '    // de chan Windows 11 Direct-Flip gay xe hinh khi tat V-Sync',
            '    void enforceDwmComposedWindow(HDC hdc) {',
            '        if (!hdc) return;',
            '        HWND hwnd = WindowFromDC(hdc);',
            '        if (!hwnd) return;',
            '',
            '        HMONITOR hMon = MonitorFromWindow(hwnd, MONITOR_DEFAULTTONEAREST);',
            '        MONITORINFO mi{};',
            '        mi.cbSize = sizeof(MONITORINFO);',
            '        if (!GetMonitorInfoA(hMon, &mi)) return;',
            '',
            '        int monW = mi.rcMonitor.right - mi.rcMonitor.left;',
            '        int monH = mi.rcMonitor.bottom - mi.rcMonitor.top;',
            '',
            '        RECT winRect{};',
            '        if (!GetWindowRect(hwnd, &winRect)) return;',
            '        int winW = winRect.right - winRect.left;',
            '        int winH = winRect.bottom - winRect.top;',
            '',
            '        // Neu cua so dang o che do Fullscreen (khop kich thuoc man hinh),',
            '        // dat chieu cao monH + 1 (le duoi 1px ngoai man hinh) de ep Windows 11 DWM',
            '        // kich hoat Triple-Buffered Composition chong xe hinh 100%',
            '        if (winW >= monW - 4 && winH == monH) {',
            '            if (pChangeDisplaySettingsA) {',
            '                pChangeDisplaySettingsA(nullptr, 0);',
            '            }',
            '            LONG_PTR style = GetWindowLongPtrA(hwnd, GWL_STYLE);',
            '            style &= ~(WS_CAPTION | WS_THICKFRAME | WS_MINIMIZEBOX | WS_MAXIMIZEBOX | WS_SYSMENU);',
            '            style |= WS_POPUP | WS_VISIBLE;',
            '            SetWindowLongPtrA(hwnd, GWL_STYLE, style);',
            '',
            '            SetWindowPos(',
            '                hwnd, HWND_TOP,',
            '                mi.rcMonitor.left, mi.rcMonitor.top,',
            '                monW, monH + 1,',
            '                SWP_FRAMECHANGED | SWP_NOOWNERZORDER | SWP_SHOWWINDOW',
            '            );',
            '        }',
            '    }',
            '',
            '    void preparePresentAndSync() {',
            '        if (!glResolved) {',
            '            glResolved = true;',
            '            if (HMODULE hGl = GetModuleHandleA("opengl32.dll")) {',
            '                pGlFinish = reinterpret_cast<PFN_glFinish>(GetProcAddress(hGl, "glFinish"));',
            '                pGetCurrentDC = reinterpret_cast<PFN_wglGetCurrentDC>(GetProcAddress(hGl, "wglGetCurrentDC"));',
            '                pGetProcAddress = reinterpret_cast<PFN_wglGetProcAddress>(GetProcAddress(hGl, "wglGetProcAddress"));',
            '            }',
            '        }',
            '',
            '        if (!pSwapInterval && pGetProcAddress) {',
            '            pSwapInterval = reinterpret_cast<PFN_wglSwapIntervalEXT>(pGetProcAddress("wglSwapIntervalEXT"));',
            '        }',
            '',
            '        HDC hdc = pGetCurrentDC ? pGetCurrentDC() : nullptr;',
            '        if (hdc && (++windowCheckCounter == 1 || windowCheckCounter % 120 == 0)) {',
            '            // Doc tan so quet man hinh thuc te (VREFRESH = 116)',
            '            if (pGetDeviceCaps) {',
            '                int hz = pGetDeviceCaps(hdc, 116);',
            '                if (hz >= 30 && hz <= 360) {',
            '                    refreshPeriodTicks = qpcFreq / hz;',
            '                }',
            '            }',
            '            enforceDwmComposedWindow(hdc);',
            '        }',
            '',
            '        if (pSwapInterval) {',
            '            pSwapInterval(0);',
            '        }',
            '',
            '        // Bat GPU ve xong 100% khung hinh vao Backbuffer truoc khi dua sang DWM',
            '        if (pGlFinish) {',
            '            pGlFinish();',
            '        }',
            '    }',
            '    #endif',
            '}',
            '',
            'class $modify(TearFixDirector, cocos2d::CCDirector) {',
            '    void drawScene() {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        TearFix::ensureInitialized();',
            '',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '',
            '        int64_t elapsedTicks = now.QuadPart - TearFix::lastTickQpc;',
            '        TearFix::lastTickQpc = now.QuadPart;',
            '',
            '        double realDt = static_cast<double>(elapsedTicks) / static_cast<double>(TearFix::qpcFreq);',
            '        if (realDt <= 0.0001 || realDt > 0.1) {',
            '            realDt = 1.0 / 240.0;',
            '        }',
            '        TearFix::currentStepDt = static_cast<float>(realDt);',
            '',
            '        cocos2d::CCScene* currentScene = this->getRunningScene();',
            '        bool sceneChanged = (currentScene == nullptr) || (currentScene != TearFix::lastScenePtr) || (this->m_pNextScene != nullptr);',
            '        TearFix::lastScenePtr = currentScene;',
            '',
            '        if (sceneChanged || this->isPaused() || now.QuadPart >= TearFix::nextPresentQpc) {',
            '            TearFix::shouldPresentFrame = true;',
            '            TearFix::nextPresentQpc += TearFix::refreshPeriodTicks;',
            '            if (now.QuadPart >= TearFix::nextPresentQpc) {',
            '                TearFix::nextPresentQpc = now.QuadPart + TearFix::refreshPeriodTicks;',
            '            }',
            '            TearFix::overrideSchedulerDt = true;',
            '            CCDirector::drawScene();',
            '            TearFix::overrideSchedulerDt = false;',
            '        } else {',
            '            // Tick vat ly trung gian: Giu nguyen Physics & Input o Unlock FPS, bo qua ve thua',
            '            TearFix::shouldPresentFrame = false;',
            '            if (auto* sched = this->getScheduler()) {',
            '                sched->update(TearFix::currentStepDt);',
            '            }',
            '        }',
            '        #else',
            '        CCDirector::drawScene();',
            '        #endif',
            '    }',
            '};',
            '',
            'class $modify(TearFixScheduler, cocos2d::CCScheduler) {',
            '    void update(float dt) {',
            '        if (TearFix::overrideSchedulerDt) {',
            '            dt = TearFix::currentStepDt;',
            '            TearFix::overrideSchedulerDt = false;',
            '        }',
            '        CCScheduler::update(dt);',
            '    }',
            '};',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    void swapBuffers() {',
            '        if (!TearFix::shouldPresentFrame) {',
            '            return;',
            '        }',
            '        #ifdef GEODE_IS_WINDOWS',
            '        TearFix::preparePresentAndSync();',
            '        #endif',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest

      - name: Collect Built .geode Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null
          $geodeFiles = Get-ChildItem -Path $PWD -Filter "*.geode" -Recurse
          if (-not $geodeFiles) {
            Write-Error "No .geode file found after build!"
            exit 1
          }
          foreach ($file in $geodeFiles) {
            Copy-Item -Path $file.FullName -Destination (Join-Path $PWD "artifact\$($file.Name)") -Force
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-v2.0.0
          path: artifact/*.geode
