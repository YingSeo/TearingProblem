            '        LARGE_INTEGER freq{}, now{};',
            '        QueryPerformanceFrequency(&freq);',
            '        QueryPerformanceCounter(&now);',
            '        qpcFreq = freq.QuadPart;',
            '        refreshPeriodTicks.store(qpcFreq / 60, std::memory_order_relaxed);',
            '        lastVBlankQpc.store(now.QuadPart, std::memory_order_relaxed);',
            '        lastCaptureQpc = lastCallQpc = now.QuadPart;',
            '',
            '        // Elevate process priority and pin Main Thread to Core 0 so Windows 11 never throttles high-graphics levels',
            '        SetPriorityClass(GetCurrentProcess(), HIGH_PRIORITY_CLASS);',
            '        SetThreadPriority(GetCurrentThread(), THREAD_PRIORITY_ABOVE_NORMAL);',
            '        SetThreadIdealProcessor(GetCurrentThread(), 0);',
            '',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto tb = reinterpret_cast<unsigned int(__stdcall*)(unsigned int)>(GetProcAddress(hWinmm, "timeBeginPeriod"))) tb(1);',
            '        }',
            '        if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '            pDwmFlush       = reinterpret_cast<decltype(pDwmFlush)>(GetProcAddress(hDwm, "DwmFlush"));',
            '            pDwmExtendFrame = reinterpret_cast<decltype(pDwmExtendFrame)>(GetProcAddress(hDwm, "DwmExtendFrameIntoClientArea"));',
            '        }',
            '        if (HMODULE hGdi = GetModuleHandleA("gdi32.dll")) {',
            '            pGetDeviceCaps = reinterpret_cast<decltype(pGetDeviceCaps)>(GetProcAddress(hGdi, "GetDeviceCaps"));',
            '        }',
            '        if (HMODULE hUser = GetModuleHandleA("user32.dll")) {',
            '            pChangeDisplaySettingsA = reinterpret_cast<decltype(pChangeDisplaySettingsA)>(GetProcAddress(hUser, "ChangeDisplaySettingsA"));',
            '        }',
