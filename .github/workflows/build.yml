            '    }',
            '    inline void enableMultithreadDevice(void* dev) {',
            '        void* mt = nullptr;',
            '        if (comQueryInterface(dev, &kIID_ID3D10Multithread, &mt) >= 0 && mt) {',
            '            auto vtbl = *reinterpret_cast<void***>(mt);',
            '            reinterpret_cast<PFN_MultithreadSetProtected>(vtbl[4])(mt, 1);',
