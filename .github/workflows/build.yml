            '',
            '    PFN_wglGetProcAddress pGetProcAddress = nullptr;',
            '    PFN_wglGetCurrentDC pGetCurrentDC = nullptr;',
            '    PFN_wglGetCurrentContext pGetCurrentContext = nullptr;',
            '    PFN_wglSwapIntervalEXT pWglSwapIntervalEXT = nullptr;',
            '    PFN_wglDXOpenDeviceNV pWglDXOpenDeviceNV = nullptr;',
            '    PFN_wglDXCloseDeviceNV pWglDXCloseDeviceNV = nullptr;',
            '    PFN_wglDXRegisterObjectNV pWglDXRegisterObjectNV = nullptr;',
            '    PFN_wglDXUnregisterObjectNV pWglDXUnregisterObjectNV = nullptr;',
            '    PFN_wglDXLockObjectsNV pWglDXLockObjectsNV = nullptr;',
            '    PFN_wglDXUnlockObjectsNV pWglDXUnlockObjectsNV = nullptr;',
            '',
            '    PFN_glGetString pGlGetString = nullptr;',
            '    PFN_glGetIntegerv pGlGetIntegerv = nullptr;',
            '    PFN_glIsEnabled pGlIsEnabled = nullptr;',
            '    PFN_glEnable pGlEnable = nullptr;',
            '    PFN_glDisable pGlDisable = nullptr;',
            '    PFN_glReadBuffer pGlReadBuffer = nullptr;',
            '    PFN_glFlush pGlFlush = nullptr;',
            '    PFN_glGenTextures pGlGenTextures = nullptr;',
            '    PFN_glDeleteTextures pGlDeleteTextures = nullptr;',
            '    PFN_glBindTexture pGlBindTexture = nullptr;',
            '',
            '    PFN_glGenFramebuffers pGlGenFramebuffers = nullptr;',
            '    PFN_glDeleteFramebuffers pGlDeleteFramebuffers = nullptr;',
            '    PFN_glBindFramebuffer pGlBindFramebuffer = nullptr;',
            '    PFN_glCheckFramebufferStatus pGlCheckFramebufferStatus = nullptr;',
            '    PFN_glGenRenderbuffers pGlGenRenderbuffers = nullptr;',
            '    PFN_glDeleteRenderbuffers pGlDeleteRenderbuffers = nullptr;',
            '    PFN_glBindRenderbuffer pGlBindRenderbuffer = nullptr;',
            '    PFN_glRenderbufferStorage pGlRenderbufferStorage = nullptr;',
            '    PFN_glFramebufferRenderbuffer pGlFramebufferRenderbuffer = nullptr;',
            '    PFN_glFramebufferTexture2D pGlFramebufferTexture2D = nullptr;',
            '    PFN_glBlitFramebuffer pGlBlitFramebuffer = nullptr;',
            '',
            '    PFN_glFenceSync pGlFenceSync = nullptr;',
            '    PFN_glClientWaitSync pGlClientWaitSync = nullptr;',
            '    PFN_glDeleteSync pGlDeleteSync = nullptr;',
            '',
            '    // Synchronization & Pipeline State',
            '    bool apisLoaded = false;',
            '    bool interopSupported = true;',
            '    bool childClassRegistered = false;',
            '',
            '    int64_t qpcFreq = 0;',
            '    std::atomic<int64_t> refreshPeriodTicks{0};',
            '    std::atomic<int64_t> lastVBlankQpc{0};',
            '    std::atomic<bool> presenterReadyForCapture{true};',
            '',
            '    int64_t lastCaptureQpc = 0;',
            '    int64_t lastCallQpc = 0;',
            '    int64_t avgCallDeltaQpc = 0;',
            '',
            '    std::mutex bridgeMutex;',
            '    HANDLE hFrameReadyEvent = nullptr;',
            '    std::atomic<bool> presenterThreadStarted{false};',
            '    std::atomic<bool> bridgeActive{false};',
            '',
