name: Build Geode Mod (GD 2.2081)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build (GD 2.2081 - Geode v5.11.2)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Icon, Metadata, CMake and Optimized VBlank Anti-Tear Source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          if (-not (Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" -Force | Out-Null
          }
          if (Test-Path "main.cpp") {
            Remove-Item -Path "main.cpp" -Force
          }

          # 1. Tao Icon 256x256 RGBA PNG (logo.png)
          $logoPath = Join-Path $PWD "logo.png"
          $csCode = @'
          using System;
          using System.Drawing;
          using System.Drawing.Drawing2D;
          using System.Drawing.Imaging;
          using System.Drawing.Text;

          public static class IconBuilder {
              public static void Build(string path) {
                  using (Bitmap bmp = new Bitmap(256, 256, PixelFormat.Format32bppArgb))
                  using (Graphics g = Graphics.FromImage(bmp)) {
                      g.SmoothingMode = SmoothingMode.AntiAlias;
                      g.TextRenderingHint = TextRenderingHint.AntiAliasGridFit;
                      g.Clear(Color.FromArgb(255, 10, 14, 26));

                      using (LinearGradientBrush bg = new LinearGradientBrush(
                          new Rectangle(16, 16, 224, 224),
                          Color.FromArgb(255, 18, 30, 62),
                          Color.FromArgb(255, 10, 14, 28),
                          45f)) {
                          g.FillRectangle(bg, 16, 16, 224, 224);
                      }

                      using (Pen pCyan = new Pen(Color.FromArgb(255, 0, 229, 255), 8f))
                      using (Pen pPurple = new Pen(Color.FromArgb(255, 124, 77, 255), 4f))
                      using (Pen pGreen = new Pen(Color.FromArgb(255, 0, 255, 170), 7f)) {
                          g.DrawRectangle(pCyan, 16, 16, 224, 224);
                          g.DrawRectangle(pPurple, 28, 28, 200, 200);

                          Point[] pulse = new Point[] {
                              new Point(42, 128),
                              new Point(92, 128),
                              new Point(112, 74),
                              new Point(144, 182),
                              new Point(164, 128),
                              new Point(214, 128)
                          };
                          g.DrawLines(pGreen, pulse);
                      }

                      using (Font f1 = new Font("Arial", 22f, FontStyle.Bold))
                      using (Font f2 = new Font("Arial", 13f, FontStyle.Bold))
                      using (SolidBrush bWhite = new SolidBrush(Color.FromArgb(255, 245, 250, 255)))
                      using (SolidBrush bCyan = new SolidBrush(Color.FromArgb(255, 0, 229, 255)))
                      using (StringFormat sf = new StringFormat()) {
                          sf.Alignment = StringAlignment.Center;
                          g.DrawString("NO TEAR", f1, bWhite, new RectangleF(0f, 36f, 256f, 44f), sf);
                          g.DrawString("GD 2.2081", f2, bCyan, new RectangleF(0f, 186f, 256f, 36f), sf);
                      }

                      bmp.Save(path, ImageFormat.Png);
                  }
              }
          }
          '@
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition $csCode
          [IconBuilder]::Build($logoPath)

          # 2. Tao about.md
          $aboutLines = @(
            '# <cy>NoTear FPS (GD 2.2081)</c>',
            '',
            'Eliminates **screen tearing (horizontal glitch lines)** when **Unlock FPS** is enabled in **Geometry Dash 2.2081** with zero game slowdown and zero crashes.',
            '',
            '### <cg>v4.1 Highlights:</c>',
            '- **Hardware qpcVBlank Phase-Lock:** Synchronizes buffer swaps directly to the monitor vertical blanking interval via `DwmGetCompositionTimingInfo` and `glFinish`.',
            '- **DWM Composed Flip Mode:** Prevents Windows 11 legacy OpenGL Direct-Flip tearing.',
            '- **100% Bismuth & Mod Compatibility:** Uses a single `CCEGLView::swapBuffers` hook with zero `CCScene` or `DeltaTime` interference.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "about.md"), $aboutLines, $utf8NoBom)

          # 3. Tao changelog.md
          $changelogLines = @(
            '# v4.1.0 (For GD 2.2081)',
            '- Fixed GitHub Actions clang-cl compilation error by using standard C++23 thread primitives.',
            '- Fixed crash (0xFFFFFFFFFFFFFFFF) and removed frame-drop slowdown when running with Bismuth (iliashdz.bismuth).',
            '- Added direct hardware qpcVBlank phase alignment + DWM Composed Flip window configuration.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "changelog.md"), $changelogLines, $utf8NoBom)

          # 4. Tao mod.json khoa cung cho Geode 5.11.2 va GD 2.2081
          $modJsonLines = @(
            '{',
            '    "geode": "5.11.2",',
            '    "gd": {',
            '        "win": "2.2081"',
            '    },',
            '    "id": "yingseo.notear-fps-22081",',
            '    "name": "NoTear FPS",',
            '    "version": "v4.1.0",',
            '    "developer": "YingSeo",',
            '    "description": "Eliminates screen tearing when Unlock FPS is enabled in Geometry Dash 2.2081.",',
            '    "early-load": true,',
            '    "tags": [',
            '        "performance",',
            '        "enhancement",',
            '        "universal"',
            '    ]',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "mod.json"), $modJsonLines, $utf8NoBom)

          # 5. Tao CMakeLists.txt (Giu nguyen cau truc da build thanh cong)
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_EXTENSIONS OFF)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            '',
            'project(NoTearFPS VERSION 4.1.0)',
            '',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            '',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            '',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            'setup_geode_mod(${PROJECT_NAME})'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "CMakeLists.txt"), $cmakeLines, $utf8NoBom)

          # 6. Tao src/main.cpp (Single Hook CCEGLView::swapBuffers + Hardware qpcVBlank + Zero Slowdown)
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '#include <atomic>',
            '#include <thread>',
            '#include <chrono>',
            '#include <cstdlib>',
            '',
            'using namespace geode::prelude;',
            '',
            'namespace TearFix {',
            '    #pragma pack(push, 1)',
            '    struct DwmRatio {',
            '        uint32_t uiNumerator;',
            '        uint32_t uiDenominator;',
            '    };',
            '    struct DwmTimingInfo {',
            '        uint32_t cbSize;',
            '        DwmRatio rateRefresh;',
            '        uint64_t qpcRefreshPeriod;',
            '        DwmRatio rateCompose;',
            '        uint64_t qpcVBlank;',
            '        uint64_t cRefresh;',
            '        uint32_t cDXRefresh;',
            '        uint64_t qpcCompose;',
            '        uint64_t cFrame;',
            '        uint32_t cDXPresent;',
            '        uint64_t cRefreshFrame;',
            '        uint64_t cFrameSubmitted;',
            '        uint32_t cDXPresentSubmitted;',
            '        uint64_t cFrameConfirmed;',
            '        uint32_t cDXPresentConfirmed;',
            '        uint64_t cRefreshConfirmed;',
            '        uint32_t cDXRefreshConfirmed;',
            '        uint64_t cFramesLate;',
            '        uint32_t cFramesOutstanding;',
            '        uint64_t cFrameDisplayed;',
            '        uint64_t qpcFrameDisplayed;',
            '        uint64_t cRefreshFrameDisplayed;',
            '        uint64_t cFrameComplete;',
            '        uint64_t qpcFrameComplete;',
            '        uint64_t cFramePending;',
            '        uint64_t qpcFramePending;',
            '        uint64_t cFramesDisplayed;',
            '        uint64_t cFramesComplete;',
            '        uint64_t cFramesPending;',
            '        uint64_t cFramesAvailable;',
            '        uint64_t cFramesDropped;',
            '        uint64_t cFramesMissed;',
            '        uint64_t cRefreshNextDisplayed;',
            '        uint64_t cRefreshNextPresented;',
            '        uint64_t cRefreshesDisplayed;',
            '        uint64_t cRefreshesPresented;',
            '        uint64_t cRefreshStarted;',
            '        uint64_t cPixelsReceived;',
            '        uint64_t cPixelsDrawn;',
            '        uint64_t cBuffersEmpty;',
            '    };',
            '    #pragma pack(pop)',
            '',
            '    struct DwmMargins {',
            '        int cxLeftWidth;',
            '        int cxRightWidth;',
            '        int cyTopHeight;',
            '        int cyBottomHeight;',
            '    };',
            '',
            '    std::atomic<int64_t> latestVBlankQpc{0};',
            '    std::atomic<int64_t> refreshPeriodQpc{0};',
            '    std::atomic<uint64_t> vblankTicket{1};',
            '    std::atomic<bool> workerStarted{false};',
            '',
            '    int64_t qpcFreq = 0;',
            '    int64_t lastSwapCallQpc = 0;',
            '    int64_t lastPresentedQpc = 0;',
            '    int64_t avgCallDeltaQpc = 0;',
            '    uint64_t lastPresentedTicket = 0;',
            '',
            '    #ifdef GEODE_IS_WINDOWS',
            '    using PFN_timeBeginPeriod = unsigned int(__stdcall*)(unsigned int);',
            '    using PFN_DwmFlush = long(__stdcall*)(void);',
            '    using PFN_DwmGetCompositionTimingInfo = long(__stdcall*)(HWND, DwmTimingInfo*);',
            '    using PFN_DwmExtendFrameIntoClientArea = long(__stdcall*)(HWND, const DwmMargins*);',
            '    using PFN_ChangeDisplaySettingsA = long(__stdcall*)(void*, unsigned long);',
            '    using PFN_GetDeviceCaps = int(__stdcall*)(HDC, int);',
            '    using PFN_wglGetProcAddress = void*(__stdcall*)(const char*);',
            '    using PFN_wglGetCurrentDC = HDC(__stdcall*)(void);',
            '    using PFN_wglSwapIntervalEXT = int(__stdcall*)(int);',
            '    using PFN_glFinish = void(__stdcall*)(void);',
            '    using PFN_glFlush = void(__stdcall*)(void);',
            '',
            '    PFN_DwmGetCompositionTimingInfo pGetTimingInfo = nullptr;',
            '    PFN_DwmExtendFrameIntoClientArea pExtendFrame = nullptr;',
            '    PFN_ChangeDisplaySettingsA pChangeDisplaySettingsA = nullptr;',
            '    PFN_GetDeviceCaps pGetDeviceCaps = nullptr;',
            '    PFN_wglGetProcAddress pGetProcAddress = nullptr;',
            '    PFN_wglGetCurrentDC pGetCurrentDC = nullptr;',
            '    PFN_wglSwapIntervalEXT pSwapInterval = nullptr;',
            '    PFN_glFinish pGlFinish = nullptr;',
            '    PFN_glFlush pGlFlush = nullptr;',
            '',
            '    bool glResolved = false;',
            '    HWND configuredHwnd = nullptr;',
            '    int currentSwapInterval = -999;',
            '',
            '    void initEngine() {',
            '        bool expected = false;',
            '        if (!workerStarted.compare_exchange_strong(expected, true)) return;',
            '',
            '        // Request driver DXGI Swapchain presentation layer for OpenGL',
            '        _putenv_s("OGL_CPL_PREFER_DXPRESENT", "1");',
            '        SetEnvironmentVariableA("OGL_CPL_PREFER_DXPRESENT", "1");',
            '',
            '        LARGE_INTEGER freq{}, now{};',
            '        QueryPerformanceFrequency(&freq);',
            '        QueryPerformanceCounter(&now);',
            '        qpcFreq = freq.QuadPart;',
            '        lastSwapCallQpc = now.QuadPart;',
            '        lastPresentedQpc = now.QuadPart;',
            '        avgCallDeltaQpc = qpcFreq / 240;',
            '',
            '        latestVBlankQpc.store(now.QuadPart, std::memory_order_relaxed);',
            '        refreshPeriodQpc.store(qpcFreq / 60, std::memory_order_relaxed);',
            '',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto pTimeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"))) {',
            '                pTimeBegin(1);',
            '            }',
            '        }',
            '        if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '            pGetTimingInfo = reinterpret_cast<PFN_DwmGetCompositionTimingInfo>(GetProcAddress(hDwm, "DwmGetCompositionTimingInfo"));',
            '            pExtendFrame = reinterpret_cast<PFN_DwmExtendFrameIntoClientArea>(GetProcAddress(hDwm, "DwmExtendFrameIntoClientArea"));',
            '        }',
            '        if (HMODULE hUser = GetModuleHandleA("user32.dll")) {',
            '            pChangeDisplaySettingsA = reinterpret_cast<PFN_ChangeDisplaySettingsA>(GetProcAddress(hUser, "ChangeDisplaySettingsA"));',
            '        }',
            '        if (HMODULE hGdi = GetModuleHandleA("gdi32.dll")) {',
            '            pGetDeviceCaps = reinterpret_cast<PFN_GetDeviceCaps>(GetProcAddress(hGdi, "GetDeviceCaps"));',
            '        }',
            '',
            '        // Background hardware VBlank clock thread (0% CPU usage)',
            '        std::thread([]() {',
            '            PFN_DwmFlush localFlush = nullptr;',
            '            PFN_DwmGetCompositionTimingInfo localTiming = nullptr;',
            '            if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '                localFlush = reinterpret_cast<PFN_DwmFlush>(GetProcAddress(hDwm, "DwmFlush"));',
            '                localTiming = reinterpret_cast<PFN_DwmGetCompositionTimingInfo>(GetProcAddress(hDwm, "DwmGetCompositionTimingInfo"));',
            '            }',
            '',
            '            LARGE_INTEGER f{};',
            '            QueryPerformanceFrequency(&f);',
            '            int64_t lFreq = f.QuadPart;',
            '            int64_t prevEdge = 0;',
            '            int64_t smoothPeriod = lFreq / 60;',
            '',
            '            while (true) {',
            '                if (localFlush && localFlush() == 0) {',
            '                    LARGE_INTEGER edge{};',
            '                    QueryPerformanceCounter(&edge);',
            '                    int64_t vblankQpc = edge.QuadPart;',
            '',
            '                    if (localTiming) {',
            '                        DwmTimingInfo info{};',
            '                        info.cbSize = sizeof(DwmTimingInfo);',
            '                        if (localTiming(nullptr, &info) == 0 && info.qpcRefreshPeriod > 0) {',
            '                            int64_t p = static_cast<int64_t>(info.qpcRefreshPeriod);',
            '                            if (p >= (lFreq / 500) && p <= (lFreq / 30)) {',
            '                                smoothPeriod = p;',
            '                                refreshPeriodQpc.store(smoothPeriod, std::memory_order_relaxed);',
            '                            }',
            '                            if (info.qpcVBlank > 0) {',
            '                                vblankQpc = static_cast<int64_t>(info.qpcVBlank);',
            '                            }',
            '                        }',
            '                    } else if (prevEdge > 0) {',
            '                        int64_t diff = edge.QuadPart - prevEdge;',
            '                        if (diff >= (lFreq / 360) && diff <= (lFreq / 40)) {',
            '                            smoothPeriod = (smoothPeriod * 7 + diff) / 8;',
            '                            refreshPeriodQpc.store(smoothPeriod, std::memory_order_relaxed);',
            '                        }',
            '                    }',
            '',
            '                    prevEdge = edge.QuadPart;',
            '                    latestVBlankQpc.store(vblankQpc, std::memory_order_release);',
            '                    vblankTicket.fetch_add(1, std::memory_order_release);',
            '                } else {',
            '                    std::this_thread::sleep_for(std::chrono::milliseconds(16));',
            '                    LARGE_INTEGER edge{};',
            '                    QueryPerformanceCounter(&edge);',
            '                    latestVBlankQpc.store(edge.QuadPart, std::memory_order_release);',
            '                    vblankTicket.fetch_add(1, std::memory_order_release);',
            '                }',
            '            }',
            '        }).detach();',
            '    }',
            '',
            '    void ensureTearFreeWindowMode(HDC hdc) {',
            '        if (!hdc) return;',
            '        HWND hwnd = WindowFromDC(hdc);',
            '        if (!hwnd || hwnd == configuredHwnd) return;',
            '        configuredHwnd = hwnd;',
            '        currentSwapInterval = -999;',
            '',
            '        if (pGetDeviceCaps) {',
            '            int hz = pGetDeviceCaps(hdc, 116);',
            '            if (hz >= 30 && hz <= 360) {',
            '                refreshPeriodQpc.store(qpcFreq / hz, std::memory_order_relaxed);',
            '            }',
            '        }',
            '',
            '        // Exit legacy Exclusive Fullscreen so DWM manages tear-free VBlank composition',
            '        HMONITOR hMon = MonitorFromWindow(hwnd, MONITOR_DEFAULTTONEAREST);',
            '        MONITORINFO mi{};',
            '        mi.cbSize = sizeof(MONITORINFO);',
            '        if (GetMonitorInfoA(hMon, &mi)) {',
            '            RECT wr{};',
            '            if (GetWindowRect(hwnd, &wr)) {',
            '                int monW = mi.rcMonitor.right - mi.rcMonitor.left;',
            '                int monH = mi.rcMonitor.bottom - mi.rcMonitor.top;',
            '                if ((wr.right - wr.left) >= monW - 4 && (wr.bottom - wr.top) >= monH - 4) {',
            '                    if (pChangeDisplaySettingsA) {',
            '                        pChangeDisplaySettingsA(nullptr, 0);',
            '                    }',
            '                    SetWindowPos(',
            '                        hwnd, HWND_TOP,',
            '                        mi.rcMonitor.left, mi.rcMonitor.top,',
            '                        monW, monH,',
            '                        SWP_NOOWNERZORDER | SWP_NOACTIVATE | SWP_FRAMECHANGED',
            '                    );',
            '                }',
            '            }',
            '        }',
            '',
            '        if (pExtendFrame) {',
            '            DwmMargins margins{0, 0, 0, 1};',
            '            pExtendFrame(hwnd, &margins);',
            '        }',
            '    }',
            '',
            '    bool filterAndSyncSwap() {',
            '        initEngine();',
            '',
            '        if (!glResolved) {',
            '            glResolved = true;',
            '            if (HMODULE hGl = GetModuleHandleA("opengl32.dll")) {',
            '                pGlFinish = reinterpret_cast<PFN_glFinish>(GetProcAddress(hGl, "glFinish"));',
            '                pGlFlush = reinterpret_cast<PFN_glFlush>(GetProcAddress(hGl, "glFlush"));',
            '                pGetCurrentDC = reinterpret_cast<PFN_wglGetCurrentDC>(GetProcAddress(hGl, "wglGetCurrentDC"));',
            '                pGetProcAddress = reinterpret_cast<PFN_wglGetProcAddress>(GetProcAddress(hGl, "wglGetProcAddress"));',
            '            }',
            '        }',
            '        if (!pSwapInterval && pGetProcAddress) {',
            '            pSwapInterval = reinterpret_cast<PFN_wglSwapIntervalEXT>(pGetProcAddress("wglSwapIntervalEXT"));',
            '        }',
            '        if (pGetCurrentDC) {',
            '            ensureTearFreeWindowMode(pGetCurrentDC());',
            '        }',
            '',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '',
            '        int64_t callDelta = now.QuadPart - lastSwapCallQpc;',
            '        lastSwapCallQpc = now.QuadPart;',
            '',
            '        int64_t period = refreshPeriodQpc.load(std::memory_order_relaxed);',
            '        if (callDelta > (qpcFreq / 2000) && callDelta < (period * 2)) {',
            '            avgCallDeltaQpc = (avgCallDeltaQpc * 7 + callDelta) / 8;',
            '        }',
            '',
            '        // Check if an external mod (such as Bismuth DifferenceMode) is already pacing swapBuffers to ~60Hz',
            '        bool externalFrameDivider = (avgCallDeltaQpc >= (period * 72) / 100);',
            '',
            '        if (!externalFrameDivider) {',
            '            // Raw Unlock FPS (120 / 240 / 360 / 480 FPS):',
            '            // Keep driver V-Sync at 0 so the main loop never stalls, and gate swaps to once per VBlank',
            '            if (pSwapInterval && currentSwapInterval != 0) {',
            '                pSwapInterval(0);',
            '                currentSwapInterval = 0;',
            '            }',
            '',
            '            uint64_t curTicket = vblankTicket.load(std::memory_order_acquire);',
            '            int64_t sinceLastPresent = now.QuadPart - lastPresentedQpc;',
            '            int64_t minGate = period - (avgCallDeltaQpc * 115) / 100;',
            '            if (minGate < (period * 60) / 100) {',
            '                minGate = (period * 60) / 100;',
            '            }',
            '',
            '            if (curTicket <= lastPresentedTicket && sinceLastPresent < minGate) {',
            '                return false;',
            '            }',
            '            lastPresentedTicket = curTicket;',
            '        } else {',
            '            // Bismuth DifferenceMode is active (already calling swapBuffers once per refresh period):',
            '            // Never skip frames; keep non-blocking interval and phase-align to hardware VBlank below',
            '            if (pSwapInterval && currentSwapInterval != 0) {',
            '                pSwapInterval(0);',
            '                currentSwapInterval = 0;',
            '            }',
            '        }',
            '',
            '        // Complete all pending OpenGL commands in the backbuffer before flipping',
            '        if (pGlFinish) {',
            '            pGlFinish();',
            '        } else if (pGlFlush) {',
            '            pGlFlush();',
            '        }',
            '',
            '        // Sub-millisecond phase alignment to the hardware qpcVBlank edge',
            '        QueryPerformanceCounter(&now);',
            '        int64_t vblankBase = latestVBlankQpc.load(std::memory_order_acquire);',
            '        int64_t nextVBlank = vblankBase + period;',
            '        if (now.QuadPart >= nextVBlank) {',
            '            int64_t elapsed = (now.QuadPart - vblankBase) / period + 1;',
            '            nextVBlank = vblankBase + elapsed * period;',
            '        }',
            '',
            '        int64_t remTicks = nextVBlank - now.QuadPart;',
            '        double remMs = (static_cast<double>(remTicks) * 1000.0) / static_cast<double>(qpcFreq);',
            '',
            '        if (remMs > 0.0 && remMs <= 1.4) {',
            '            while (true) {',
            '                QueryPerformanceCounter(&now);',
            '                if (now.QuadPart >= nextVBlank) break;',
            '                std::this_thread::yield();',
            '            }',
            '        } else if (externalFrameDivider && remMs > 1.4 && remMs < 14.8) {',
            '            // Smoothly walk Bismuth 60Hz render clock into the VBlank window (0.45ms micro-step)',
            '            int64_t stepTarget = now.QuadPart + (450LL * qpcFreq) / 1000000LL;',
            '            while (true) {',
            '                QueryPerformanceCounter(&now);',
            '                if (now.QuadPart >= stepTarget) break;',
            '                std::this_thread::yield();',
            '            }',
            '        }',
            '',
            '        lastPresentedQpc = now.QuadPart;',
            '        return true;',
            '    }',
            '    #endif',
            '}',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    static void onModify(auto& self) {',
            '        (void)self.setHookPriority("cocos2d::CCEGLView::swapBuffers", 1000000);',
            '    }',
            '',
            '    void swapBuffers() {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        if (!TearFix::filterAndSyncSwap()) {',
            '            return;',
            '        }',
            '        #endif',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    TearFix::initEngine();',
            '    #endif',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod for GD 2.2081 (Geode SDK v5.11.2)
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2

      - name: Verify and Package Complete .geode Archive for GD 2.2081
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null

          $geodeCandidate = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.geode" -Recurse |
                            Sort-Object Length -Descending |
                            Select-Object -First 1

          if (-not $geodeCandidate) {
            Write-Error "No .geode file found in build directory!"
            exit 1
          }

          $destGeode = Join-Path $PWD "artifact\yingseo.notear-fps-22081.geode"
          Copy-Item -Path $geodeCandidate.FullName -Destination $destGeode -Force

          $zip = [System.IO.Compression.ZipFile]::Open($destGeode, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $hasDll = $false
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -like "*.dll" -and $entry.Length -gt 4096) {
                $hasDll = $true
              }
            }

            if (-not $hasDll) {
              $dllFile = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.dll" -Recurse |
                         Where-Object { $_.Name -like "*NoTear*" -or $_.Name -like "*yingseo*" } |
                         Sort-Object Length -Descending |
                         Select-Object -First 1
              if ($dllFile) {
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $dllFile.FullName, "yingseo.notear-fps-22081.dll") | Out-Null
              }
            }

            foreach ($asset in @("mod.json", "logo.png", "about.md", "changelog.md")) {
              $assetPath = Join-Path $PWD $asset
              if (Test-Path $assetPath) {
                $existing = $zip.GetEntry($asset)
                if ($existing) { $existing.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $assetPath, $asset) | Out-Null
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-GD-2.2081-v4.1.0
          path: artifact/*.geode
