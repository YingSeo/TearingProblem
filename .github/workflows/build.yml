name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Windows Build (GD 2.2081)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Geode SDK Version (UTF-8 No BOM)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/geode/releases/latest"
          $sdkVer = $release.tag_name.TrimStart('v')
          Write-Host "Syncing mod.json to Geode SDK version: $sdkVer"
          $modPath = Join-Path $PWD "mod.json"
          $json = Get-Content $modPath -Raw | ConvertFrom-Json
          $json.geode = $sdkVer
          $outString = $json | ConvertTo-Json -Depth 10
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($modPath, $outString, $utf8NoBom)

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: latest
          build-config: Release

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-2.2081
          path: ${{ steps.build.outputs.build-output }}
