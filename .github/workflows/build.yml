name: Build Geode Mod (GD 2.2081)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build (GD 2.2081 - Geode v5.11.2)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Icon, Metadata, CMake and Zero-Lag Anti-Tear Source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          if (-not (Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" -Force | Out-Null
          }
          if (Test-Path "main.cpp") {
            Remove-Item -Path "main.cpp" -Force
          }

          # 1. Tao Icon 256x256 RGBA PNG (logo.png)
          $logoPath = Join-Path $PWD "logo.png"
          $csCode = @'
          using System;
          using System.Drawing;
          using System.Drawing.Drawing2D;
          using System.Drawing.Imaging;
          using System.Drawing.Text;

          public static class IconBuilder {
              public static void Build(string path) {
                  using (Bitmap bmp = new Bitmap(256, 256, PixelFormat.Format32bppArgb))
                  using (Graphics g = Graphics.FromImage(bmp)) {
                      g.SmoothingMode = SmoothingMode.AntiAlias;
                      g.TextRenderingHint = TextRenderingHint.AntiAliasGridFit;
                      g.Clear(Color.FromArgb(255, 12, 16, 30));

                      using (LinearGradientBrush bg = new LinearGradientBrush(
                          new Rectangle(16, 16, 224, 224),
                          Color.FromArgb(255, 20, 32, 64),
                          Color.FromArgb(255, 10, 14, 28),
                          45f)) {
                          g.FillRectangle(bg, 16, 16, 224, 224);
                      }

                      using (Pen pCyan = new Pen(Color.FromArgb(255, 0, 229, 255), 8f))
                      using (Pen pPurple = new Pen(Color.FromArgb(255, 124, 77, 255), 4f))
                      using (Pen pGreen = new Pen(Color.FromArgb(255, 0, 255, 170), 7f)) {
                          g.DrawRectangle(pCyan, 16, 16, 224, 224);
                          g.DrawRectangle(pPurple, 28, 28, 200, 200);

                          Point[] pulse = new Point[] {
                              new Point(42, 128),
                              new Point(92, 128),
                              new Point(112, 74),
                              new Point(144, 182),
                              new Point(164, 128),
                              new Point(214, 128)
                          };
                          g.DrawLines(pGreen, pulse);
                      }

                      using (Font f1 = new Font("Arial", 22f, FontStyle.Bold))
                      using (Font f2 = new Font("Arial", 13f, FontStyle.Bold))
                      using (SolidBrush bWhite = new SolidBrush(Color.FromArgb(255, 245, 250, 255)))
                      using (SolidBrush bCyan = new SolidBrush(Color.FromArgb(255, 0, 229, 255)))
                      using (StringFormat sf = new StringFormat()) {
                          sf.Alignment = StringAlignment.Center;
                          g.DrawString("NO TEAR", f1, bWhite, new RectangleF(0f, 36f, 256f, 44f), sf);
                          g.DrawString("GD 2.2081", f2, bCyan, new RectangleF(0f, 186f, 256f, 36f), sf);
                      }

                      bmp.Save(path, ImageFormat.Png);
                  }
              }
          }
          '@
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition $csCode
          [IconBuilder]::Build($logoPath)

          # 2. Tao about.md
          $aboutLines = @(
            '# <cy>NoTear FPS (GD 2.2081)</c>',
            '',
            'Eliminates **screen tearing (horizontal glitch lines)** when **Unlock FPS** is enabled in **Geometry Dash 2.2081** without affecting game speed or FPS.',
            '',
            '### <cg>Core Features:</c>',
            '- **100% Native Game Speed:** Never modifies `DeltaTime` and never blocks the main thread (zero slowdowns, zero Smooth Fix issues).',
            '- **DWM Composed Flip + VBlank Gate:** Disables tearing Direct-Flip and presents strictly once per hardware VBlank cycle.',
            '- **Zero Lag & Zero Conflicts:** Compatible with all other Geode mods with zero menus or configuration.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "about.md"), $aboutLines, $utf8NoBom)

          # 3. Tao changelog.md
          $changelogLines = @(
            '# v3.2.0 (For GD 2.2081)',
            '- Fixed game slowdown caused by main-thread blocking (removed glFinish, DwmGetCompositionTimingInfo IPC, and spinlocks).',
            '- Preserved 100% native CCDirector::calculateDeltaTime() and CCScheduler::update() execution on every tick.',
            '- Added DXGI Swapchain layer hint + DWM Direct-Flip blocker + background VBlank gate to completely eliminate screen tearing.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "changelog.md"), $changelogLines, $utf8NoBom)

          # 4. Tao mod.json khoa cung cho Geode 5.11.2 va GD 2.2081
          $modJsonLines = @(
            '{',
            '    "geode": "5.11.2",',
            '    "gd": {',
            '        "win": "2.2081"',
            '    },',
            '    "id": "yingseo.notear-fps-22081",',
            '    "name": "NoTear FPS",',
            '    "version": "v3.2.0",',
            '    "developer": "YingSeo",',
            '    "description": "Eliminates screen tearing when Unlock FPS is enabled in Geometry Dash 2.2081 with zero slowdown.",',
            '    "early-load": true,',
            '    "tags": [',
            '        "performance",',
            '        "enhancement",',
            '        "universal"',
            '    ]',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "mod.json"), $modJsonLines, $utf8NoBom)

          # 5. Tao CMakeLists.txt
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_EXTENSIONS OFF)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            '',
            'project(NoTearFPS VERSION 3.2.0)',
            '',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            '',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            '',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            'setup_geode_mod(${PROJECT_NAME})'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "CMakeLists.txt"), $cmakeLines, $utf8NoBom)

          # 6. Tao src/main.cpp (Zero Main-Thread Stall + DWM Composed Flip + Post-VBlank Gate)
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCDirector.hpp>',
            '#include <Geode/modify/CCScheduler.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '#include <atomic>',
            '#include <thread>',
            '#include <chrono>',
            '#include <cstdlib>',
            '',
            'using namespace geode::prelude;',
            '',
            'namespace TearFix {',
            '    struct DwmMargins {',
            '        int cxLeftWidth;',
            '        int cxRightWidth;',
            '        int cyTopHeight;',
            '        int cyBottomHeight;',
            '    };',
            '',
            '    std::atomic<uint64_t> vblankTicket{1};',
            '    std::atomic<int64_t> refreshPeriodTicks{0};',
            '    std::atomic<bool> workerStarted{false};',
            '',
            '    uint64_t lastPresentedTicket = 0;',
            '    int64_t qpcFreq = 0;',
            '    int64_t lastPresentQpc = 0;',
            '',
            '    bool shouldPresentFrame = true;',
            '    cocos2d::CCScene* hiddenScene = nullptr;',
            '    bool savedSceneVisible = true;',
            '    cocos2d::CCScene* lastScenePtr = nullptr;',
            '',
            '    #ifdef GEODE_IS_WINDOWS',
            '    using PFN_timeBeginPeriod = unsigned int(__stdcall*)(unsigned int);',
            '    using PFN_DwmFlush = long(__stdcall*)(void);',
            '    using PFN_DwmExtendFrameIntoClientArea = long(__stdcall*)(HWND, const DwmMargins*);',
            '    using PFN_ChangeDisplaySettingsA = long(__stdcall*)(void*, unsigned long);',
            '    using PFN_GetDeviceCaps = int(__stdcall*)(HDC, int);',
            '    using PFN_wglGetProcAddress = void*(__stdcall*)(const char*);',
            '    using PFN_wglGetCurrentDC = HDC(__stdcall*)(void);',
            '    using PFN_wglSwapIntervalEXT = int(__stdcall*)(int);',
            '    using PFN_glFlush = void(__stdcall*)(void);',
            '',
            '    PFN_DwmExtendFrameIntoClientArea pExtendFrame = nullptr;',
            '    PFN_ChangeDisplaySettingsA pChangeDisplaySettingsA = nullptr;',
            '    PFN_GetDeviceCaps pGetDeviceCaps = nullptr;',
            '    PFN_wglGetProcAddress pGetProcAddress = nullptr;',
            '    PFN_wglGetCurrentDC pGetCurrentDC = nullptr;',
            '    PFN_wglSwapIntervalEXT pSwapInterval = nullptr;',
            '    PFN_glFlush pGlFlush = nullptr;',
            '',
            '    bool glResolved = false;',
            '    HWND trackedGameHwnd = nullptr;',
            '    HWND antiDirectFlipOverlay = nullptr;',
            '    int lastAppliedInterval = -999;',
            '',
            '    void initEngine() {',
            '        bool expected = false;',
            '        if (!workerStarted.compare_exchange_strong(expected, true)) return;',
            '',
            '        // Enable NVIDIA/Driver DXGI Swapchain Layering (prevents OpenGL tearing on Windows 11)',
            '        _putenv_s("OGL_CPL_PREFER_DXPRESENT", "1");',
            '        SetEnvironmentVariableA("OGL_CPL_PREFER_DXPRESENT", "1");',
            '',
            '        LARGE_INTEGER freq{}, now{};',
            '        QueryPerformanceFrequency(&freq);',
            '        QueryPerformanceCounter(&now);',
            '        qpcFreq = freq.QuadPart;',
            '        lastPresentQpc = now.QuadPart;',
            '        refreshPeriodTicks.store(qpcFreq / 60, std::memory_order_relaxed);',
            '',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto pTimeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"))) {',
            '                pTimeBegin(1);',
            '            }',
            '        }',
            '        if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '            pExtendFrame = reinterpret_cast<PFN_DwmExtendFrameIntoClientArea>(GetProcAddress(hDwm, "DwmExtendFrameIntoClientArea"));',
            '        }',
            '        if (HMODULE hUser = GetModuleHandleA("user32.dll")) {',
            '            pChangeDisplaySettingsA = reinterpret_cast<PFN_ChangeDisplaySettingsA>(GetProcAddress(hUser, "ChangeDisplaySettingsA"));',
            '        }',
            '        if (HMODULE hGdi = GetModuleHandleA("gdi32.dll")) {',
            '            pGetDeviceCaps = reinterpret_cast<PFN_GetDeviceCaps>(GetProcAddress(hGdi, "GetDeviceCaps"));',
            '        }',
            '',
            '        // Background VBlank listener thread (0% CPU, zero main-thread blocking)',
            '        std::thread([]() {',
            '            PFN_DwmFlush localDwmFlush = nullptr;',
            '            if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '                localDwmFlush = reinterpret_cast<PFN_DwmFlush>(GetProcAddress(hDwm, "DwmFlush"));',
            '            }',
            '',
            '            LARGE_INTEGER f{};',
            '            QueryPerformanceFrequency(&f);',
            '            int64_t lFreq = f.QuadPart;',
            '            int64_t prevQpc = 0;',
            '            int64_t smoothPeriod = lFreq / 60;',
            '',
            '            while (true) {',
            '                if (localDwmFlush && localDwmFlush() == 0) {',
            '                    LARGE_INTEGER t{};',
            '                    QueryPerformanceCounter(&t);',
            '                    if (prevQpc > 0) {',
            '                        int64_t diff = t.QuadPart - prevQpc;',
            '                        if (diff >= (lFreq / 360) && diff <= (lFreq / 40)) {',
            '                            smoothPeriod = (smoothPeriod * 7 + diff) / 8;',
            '                            refreshPeriodTicks.store(smoothPeriod, std::memory_order_relaxed);',
            '                        }',
            '                    }',
            '                    prevQpc = t.QuadPart;',
            '                    vblankTicket.fetch_add(1, std::memory_order_release);',
            '                } else {',
            '                    std::this_thread::sleep_for(std::chrono::milliseconds(16));',
            '                    vblankTicket.fetch_add(1, std::memory_order_release);',
            '                }',
            '            }',
            '        }).detach();',
            '    }',
            '',
            '    // Disables Exclusive Fullscreen & Direct-Flip so Windows 11 DWM composes the window tear-free on VBlank',
            '    void configureTearFreeWindow(HDC hdc) {',
            '        if (!hdc) return;',
            '        HWND hwnd = WindowFromDC(hdc);',
            '        if (!hwnd || hwnd == trackedGameHwnd) return;',
            '        trackedGameHwnd = hwnd;',
            '        lastAppliedInterval = -999;',
            '',
            '        if (pGetDeviceCaps) {',
            '            int hz = pGetDeviceCaps(hdc, 116);',
            '            if (hz >= 30 && hz <= 360) {',
            '                refreshPeriodTicks.store(qpcFreq / hz, std::memory_order_relaxed);',
            '            }',
            '        }',
            '',
            '        // 1. Exit legacy Exclusive Fullscreen (CDS_FULLSCREEN) so DWM controls VBlank scanout',
            '        HMONITOR hMon = MonitorFromWindow(hwnd, MONITOR_DEFAULTTONEAREST);',
            '        MONITORINFO mi{};',
            '        mi.cbSize = sizeof(MONITORINFO);',
            '        if (GetMonitorInfoA(hMon, &mi)) {',
            '            RECT wr{};',
            '            if (GetWindowRect(hwnd, &wr)) {',
            '                int monW = mi.rcMonitor.right - mi.rcMonitor.left;',
            '                int monH = mi.rcMonitor.bottom - mi.rcMonitor.top;',
            '                if ((wr.right - wr.left) >= monW - 4 && (wr.bottom - wr.top) >= monH - 4) {',
            '                    if (pChangeDisplaySettingsA) {',
            '                        pChangeDisplaySettingsA(nullptr, 0);',
            '                    }',
            '                    SetWindowPos(',
            '                        hwnd, HWND_TOP,',
            '                        mi.rcMonitor.left, mi.rcMonitor.top,',
            '                        monW, monH,',
            '                        SWP_NOOWNERZORDER | SWP_NOACTIVATE | SWP_FRAMECHANGED',
            '                    );',
            '                }',
            '            }',
            '        }',
            '',
            '        if (pExtendFrame) {',
            '            DwmMargins margins{0, 0, 0, 1};',
            '            pExtendFrame(hwnd, &margins);',
            '        }',
            '',
            '        // 2. Create a 1x1 invisible click-through owned popup at (0,0) to prevent Windows 11',
            '        // from promoting the OpenGL window into tearing Direct-Flip / Independent-Flip mode',
            '        if (antiDirectFlipOverlay && IsWindow(antiDirectFlipOverlay)) {',
            '            DestroyWindow(antiDirectFlipOverlay);',
            '            antiDirectFlipOverlay = nullptr;',
            '        }',
            '        antiDirectFlipOverlay = CreateWindowExA(',
            '            0x00080000L | 0x00000020L | 0x00000080L | 0x08000000L, // WS_EX_LAYERED | WS_EX_TRANSPARENT | WS_EX_TOOLWINDOW | WS_EX_NOACTIVATE',
            '            "STATIC",',
            '            "",',
            '            0x80000000L, // WS_POPUP',
            '            0, 0, 1, 1,',
            '            hwnd,',
            '            nullptr,',
            '            GetModuleHandleA(nullptr),',
            '            nullptr',
            '        );',
            '        if (antiDirectFlipOverlay) {',
            '            SetLayeredWindowAttributes(antiDirectFlipOverlay, 0, 1, 0x00000002); // LWA_ALPHA = 1/255 (invisible)',
            '            ShowWindow(antiDirectFlipOverlay, 4); // SW_SHOWNOACTIVATE',
            '        }',
            '    }',
            '',
            '    void prepareNonBlockingSwap() {',
            '        if (!glResolved) {',
            '            glResolved = true;',
            '            if (HMODULE hGl = GetModuleHandleA("opengl32.dll")) {',
            '                pGlFlush = reinterpret_cast<PFN_glFlush>(GetProcAddress(hGl, "glFlush"));',
            '                pGetCurrentDC = reinterpret_cast<PFN_wglGetCurrentDC>(GetProcAddress(hGl, "wglGetCurrentDC"));',
            '                pGetProcAddress = reinterpret_cast<PFN_wglGetProcAddress>(GetProcAddress(hGl, "wglGetProcAddress"));',
            '            }',
            '        }',
            '',
            '        if (!pSwapInterval && pGetProcAddress) {',
            '            pSwapInterval = reinterpret_cast<PFN_wglSwapIntervalEXT>(pGetProcAddress("wglSwapIntervalEXT"));',
            '        }',
            '',
            '        if (pGetCurrentDC) {',
            '            configureTearFreeWindow(pGetCurrentDC());',
            '        }',
            '',
            '        // Never block the main thread with driver V-Sync (keep 0 so physics runs at full unlocked FPS)',
            '        if (pSwapInterval && lastAppliedInterval != 0) {',
            '            pSwapInterval(0);',
            '            lastAppliedInterval = 0;',
            '        }',
            '',
            '        if (pGlFlush) {',
            '            pGlFlush();',
            '        }',
            '    }',
            '    #endif',
            '',
            '    void restoreSceneVisibility() {',
            '        if (hiddenScene != nullptr) {',
            '            hiddenScene->setVisible(savedSceneVisible);',
            '            hiddenScene = nullptr;',
            '        }',
            '    }',
            '}',
            '',
            'class $modify(TearFixDirector, cocos2d::CCDirector) {',
            '    void drawScene() {',
            '        TearFix::restoreSceneVisibility();',
            '',
            '        #ifdef GEODE_IS_WINDOWS',
            '        TearFix::initEngine();',
            '',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '',
            '        cocos2d::CCScene* currentScene = this->getRunningScene();',
            '        bool forceRender = (currentScene == nullptr) ||',
            '                           (currentScene != TearFix::lastScenePtr) ||',
            '                           (this->m_pNextScene != nullptr) ||',
            '                           this->isPaused();',
            '        TearFix::lastScenePtr = currentScene;',
            '',
            '        uint64_t curTicket = TearFix::vblankTicket.load(std::memory_order_acquire);',
            '        int64_t period = TearFix::refreshPeriodTicks.load(std::memory_order_relaxed);',
            '        int64_t elapsedSincePresent = now.QuadPart - TearFix::lastPresentQpc;',
            '',
            '        // Present strictly once right at the start of each new VBlank cycle',
            '        if (forceRender || curTicket > TearFix::lastPresentedTicket || elapsedSincePresent >= period) {',
            '            TearFix::lastPresentedTicket = curTicket;',
            '            TearFix::lastPresentQpc = now.QuadPart;',
            '            TearFix::shouldPresentFrame = true;',
            '        } else {',
            '            TearFix::shouldPresentFrame = false;',
            '        }',
            '        #endif',
            '',
            '        // Always call original CCDirector::drawScene() so calculateDeltaTime() and Smooth Fix run 100% natively',
            '        CCDirector::drawScene();',
            '        TearFix::restoreSceneVisibility();',
            '    }',
            '};',
            '',
            'class $modify(TearFixScheduler, cocos2d::CCScheduler) {',
            '    static void onModify(auto& self) {',
            '        (void)self.setHookPriority("cocos2d::CCScheduler::update", -100000);',
            '    }',
            '',
            '    void update(float dt) {',
            '        // Run 100% native physics, input, and all other mods untouched',
            '        CCScheduler::update(dt);',
            '',
            '        #ifdef GEODE_IS_WINDOWS',
            '        if (!TearFix::shouldPresentFrame) {',
            '            if (auto* dir = cocos2d::CCDirector::sharedDirector()) {',
            '                if (auto* scene = dir->getRunningScene()) {',
            '                    TearFix::savedSceneVisible = scene->isVisible();',
            '                    scene->setVisible(false);',
            '                    TearFix::hiddenScene = scene;',
            '                }',
            '            }',
            '        }',
            '        #endif',
            '    }',
            '};',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    static void onModify(auto& self) {',
            '        (void)self.setHookPriority("cocos2d::CCEGLView::swapBuffers", -100000);',
            '    }',
            '',
            '    void swapBuffers() {',
            '        TearFix::restoreSceneVisibility();',
            '',
            '        if (!TearFix::shouldPresentFrame) {',
            '            return;',
            '        }',
            '',
            '        #ifdef GEODE_IS_WINDOWS',
            '        TearFix::prepareNonBlockingSwap();',
            '        #endif',
            '',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    TearFix::initEngine();',
            '    #endif',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod for GD 2.2081 (Geode SDK v5.11.2)
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2

      - name: Verify and Package Complete .geode Archive for GD 2.2081
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null

          $geodeCandidate = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.geode" -Recurse |
                            Sort-Object Length -Descending |
                            Select-Object -First 1

          if (-not $geodeCandidate) {
            Write-Error "No .geode file found in build directory!"
            exit 1
          }

          $destGeode = Join-Path $PWD "artifact\yingseo.notear-fps-22081.geode"
          Copy-Item -Path $geodeCandidate.FullName -Destination $destGeode -Force

          $zip = [System.IO.Compression.ZipFile]::Open($destGeode, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $hasDll = $false
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -like "*.dll" -and $entry.Length -gt 4096) {
                $hasDll = $true
              }
            }

            if (-not $hasDll) {
              $dllFile = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.dll" -Recurse |
                         Where-Object { $_.Name -like "*NoTear*" -or $_.Name -like "*yingseo*" } |
                         Sort-Object Length -Descending |
                         Select-Object -First 1
              if ($dllFile) {
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $dllFile.FullName, "yingseo.notear-fps-22081.dll") | Out-Null
              }
            }

            foreach ($asset in @("mod.json", "logo.png", "about.md", "changelog.md")) {
              $assetPath = Join-Path $PWD $asset
              if (Test-Path $assetPath) {
                $existing = $zip.GetEntry($asset)
                if ($existing) { $existing.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $assetPath, $asset) | Out-Null
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-GD-2.2081-v3.2.0
          path: artifact/*.geode
