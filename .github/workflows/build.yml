name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build (GD 2.2081)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Icon, Config & Hardware VBlank Lock Source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          if (-not (Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" -Force | Out-Null
          }
          if (Test-Path "main.cpp") {
            Remove-Item -Path "main.cpp" -Force
          }

          # 1. Tao icon logo.png (256x256)
          try {
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap(256, 256)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
            $g.Clear([System.Drawing.Color]::FromArgb(255, 10, 14, 26))

            $penOuter = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 0, 229, 255), 8)
            $penInner = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 98, 0, 234), 4)
            $g.DrawRectangle($penOuter, 14, 14, 228, 228)
            $g.DrawRectangle($penInner, 26, 26, 204, 204)

            $penWave = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 0, 255, 190), 7)
            $g.DrawLine($penWave, 40, 128, 94, 128)
            $g.DrawLine($penWave, 94, 128, 114, 76)
            $g.DrawLine($penWave, 114, 76, 142, 180)
            $g.DrawLine($penWave, 142, 180, 162, 128)
            $g.DrawLine($penWave, 162, 128, 216, 128)

            $fontTitle = New-Object System.Drawing.Font("Segoe UI", 22, [System.Drawing.FontStyle]::Bold)
            $fontSub = New-Object System.Drawing.Font("Segoe UI", 12, [System.Drawing.FontStyle]::Bold)
            $brushCyan = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 0, 229, 255))
            $brushWhite = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 245, 250, 255))
            $sf = New-Object System.Drawing.StringFormat
            $sf.Alignment = [System.Drawing.StringAlignment]::Center

            $g.DrawString("NO TEAR", $fontTitle, $brushWhite, (New-Object System.Drawing.RectangleF(0, 36, 256, 45)), $sf)
            $g.DrawString("VBLANK LOCK", $fontSub, $brushCyan, (New-Object System.Drawing.RectangleF(0, 188, 256, 35)), $sf)

            $g.Dispose()
            $bmp.Save((Join-Path $PWD "logo.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          } catch {
            Write-Warning "Icon generation warning: $_"
          }

          # 2. Tao mod.json
          $modJsonLines = @(
            '{',
            '    "geode": "5.3.0",',
            '    "gd": {',
            '        "win": "2.2081"',
            '    },',
            '    "id": "yingseo.notear-fps",',
            '    "name": "NoTear FPS",',
            '    "version": "v1.1.0",',
            '    "developer": "YingSeo",',
            '    "description": "Khoa cung VBlank chong soc nhieu va xe man hinh (Screen Tearing) khi bat Unlock FPS trong Geometry Dash 2.2081."',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "mod.json"), $modJsonLines, $utf8NoBom)

          # 3. Tao CMakeLists.txt tu dong khop phien ban Geode SDK moi nhat
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_EXTENSIONS OFF)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            '',
            'project(NoTearFPS VERSION 1.1.0)',
            '',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            '',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            '',
            'if (EXISTS "$ENV{GEODE_SDK}/VERSION")',
            '    file(READ "$ENV{GEODE_SDK}/VERSION" RAW_SDK_VER)',
            '    string(STRIP "${RAW_SDK_VER}" RAW_SDK_VER)',
            '    string(REGEX REPLACE "^v" "" EXACT_GEODE_VER "${RAW_SDK_VER}")',
            '    file(READ "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" MOD_JSON_TEXT)',
            '    string(REGEX REPLACE "\"geode\"[ \t]*:[ \t]*\"[^\"]+\"" "\"geode\": \"${EXACT_GEODE_VER}\"" MOD_JSON_TEXT "${MOD_JSON_TEXT}")',
            '    file(WRITE "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" "${MOD_JSON_TEXT}")',
            'endif()',
            '',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            '',
            'if (DEFINED GEODE_GD_VERSION AND NOT "${GEODE_GD_VERSION}" STREQUAL "")',
            '    file(READ "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" MOD_JSON_TEXT)',
            '    string(REGEX REPLACE "\"win\"[ \t]*:[ \t]*\"[^\"]+\"" "\"win\": \"${GEODE_GD_VERSION}\"" MOD_JSON_TEXT "${MOD_JSON_TEXT}")',
            '    file(WRITE "${CMAKE_CURRENT_SOURCE_DIR}/mod.json" "${MOD_JSON_TEXT}")',
            'endif()',
            '',
            'setup_geode_mod(${PROJECT_NAME})'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "CMakeLists.txt"), $cmakeLines, $utf8NoBom)

          # 4. Tao src/main.cpp (Hardware V-Sync wglSwapIntervalEXT(1) + glFinish + Optimus DwmFlush Lock)
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCDirector.hpp>',
            '#include <Geode/modify/CCScheduler.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '#include <atomic>',
            '#include <thread>',
            '#include <chrono>',
            '',
            'using namespace geode::prelude;',
            '',
            'namespace TearFixEngine {',
            '    std::atomic<int64_t> vblankPeriodTicks{0};',
            '    std::atomic<bool> workerStarted{false};',
            '',
            '    int64_t qpcFreq = 0;',
            '    int64_t lastTickQpc = 0;',
            '    int64_t lastPresentQpc = 0;',
            '    int64_t targetTickTicks = 0;',
            '    double targetTickDt = 1.0 / 240.0;',
            '',
            '    bool shouldPresentFrame = true;',
            '    bool overrideSchedulerDt = false;',
            '    float currentStepDt = 1.0f / 240.0f;',
            '    cocos2d::CCScene* lastScenePtr = nullptr;',
            '    bool needsDwmPreSync = false;',
            '',
            '    #ifdef GEODE_IS_WINDOWS',
            '    using PFN_DwmFlush = long(__stdcall*)(void);',
            '    using PFN_timeBeginPeriod = unsigned int(__stdcall*)(unsigned int);',
            '    using PFN_wglGetProcAddress = void*(__stdcall*)(const char*);',
            '    using PFN_wglSwapIntervalEXT = int(__stdcall*)(int);',
            '    using PFN_glFinish = void(__stdcall*)(void);',
            '    using PFN_glFlush = void(__stdcall*)(void);',
            '',
            '    PFN_wglGetProcAddress pGetProcAddress = nullptr;',
            '    PFN_wglSwapIntervalEXT pSwapInterval = nullptr;',
            '    PFN_glFinish pGlFinish = nullptr;',
            '    PFN_glFlush pGlFlush = nullptr;',
            '    PFN_DwmFlush pDwmFlush = nullptr;',
            '    bool apisInitialized = false;',
            '',
            '    void initEngine() {',
            '        bool expected = false;',
            '        if (!workerStarted.compare_exchange_strong(expected, true)) return;',
            '',
            '        LARGE_INTEGER freq{};',
            '        QueryPerformanceFrequency(&freq);',
            '        qpcFreq = freq.QuadPart;',
            '',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '        lastTickQpc = now.QuadPart;',
            '        lastPresentQpc = now.QuadPart;',
            '',
            '        vblankPeriodTicks.store(qpcFreq / 60, std::memory_order_relaxed);',
            '        targetTickTicks = qpcFreq / 240;',
            '',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto pTimeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"))) {',
            '                pTimeBegin(1);',
            '            }',
            '        }',
            '',
            '        if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '            pDwmFlush = reinterpret_cast<PFN_DwmFlush>(GetProcAddress(hDwm, "DwmFlush"));',
            '        }',
            '',
            '        // Luong do chu ky VBlank thuc te cua man hinh (60Hz/75Hz/120Hz/144Hz)',
            '        std::thread([]() {',
            '            PFN_DwmFlush localFlush = nullptr;',
            '            if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '                localFlush = reinterpret_cast<PFN_DwmFlush>(GetProcAddress(hDwm, "DwmFlush"));',
            '            }',
            '            if (!localFlush) return;',
            '',
            '            LARGE_INTEGER f{};',
            '            QueryPerformanceFrequency(&f);',
            '            int64_t lFreq = f.QuadPart;',
            '            int64_t prevQpc = 0;',
            '            int64_t smoothedPeriod = lFreq / 60;',
            '',
            '            while (true) {',
            '                if (localFlush() == 0) {',
            '                    LARGE_INTEGER t{};',
            '                    QueryPerformanceCounter(&t);',
            '                    if (prevQpc > 0) {',
            '                        int64_t diff = t.QuadPart - prevQpc;',
            '                        if (diff >= (lFreq / 360) && diff <= (lFreq / 45)) {',
            '                            smoothedPeriod = (smoothedPeriod * 7 + diff) / 8;',
            '                            vblankPeriodTicks.store(smoothedPeriod, std::memory_order_relaxed);',
            '                        }',
            '                    }',
            '                    prevQpc = t.QuadPart;',
            '                } else {',
            '                    std::this_thread::sleep_for(std::chrono::milliseconds(16));',
            '                }',
            '            }',
            '        }).detach();',
            '    }',
            '',
            '    void lockVBlankBeforeSwap() {',
            '        if (!apisInitialized) {',
            '            apisInitialized = true;',
            '            if (HMODULE hGl = GetModuleHandleA("opengl32.dll")) {',
            '                pGlFinish = reinterpret_cast<PFN_glFinish>(GetProcAddress(hGl, "glFinish"));',
            '                pGlFlush = reinterpret_cast<PFN_glFlush>(GetProcAddress(hGl, "glFlush"));',
            '                pGetProcAddress = reinterpret_cast<PFN_wglGetProcAddress>(GetProcAddress(hGl, "wglGetProcAddress"));',
            '            }',
            '        }',
            '',
            '        if (!pSwapInterval && pGetProcAddress) {',
            '            pSwapInterval = reinterpret_cast<PFN_wglSwapIntervalEXT>(pGetProcAddress("wglSwapIntervalEXT"));',
            '        }',
            '',
            '        // 1. Ep GPU (MX350) hoan tat 100% lenh ve vao Backbuffer truoc khi lat hinh',
            '        if (pGlFinish) {',
            '            pGlFinish();',
            '        } else if (pGlFlush) {',
            '            pGlFlush();',
            '        }',
            '',
            '        // 2. Bat Hardware V-Sync (1) de khoa cung diem lat khung hinh vao VBlank',
            '        if (pSwapInterval) {',
            '            pSwapInterval(1);',
            '        }',
            '',
            '        // 3. Neu tren Laptop Optimus (MX350 -> iGPU) driver OpenGL khong tu chan VBlank,',
            '        // dung DwmFlush() de doi dung xung VBlank cua man hinh chinh roi moi SwapBuffers',
            '        if (needsDwmPreSync && pDwmFlush) {',
            '            pDwmFlush();',
            '        }',
            '    }',
            '',
            '    void onSwapFinished(int64_t beforeSwapQpc, int64_t afterSwapQpc) {',
            '        int64_t period = vblankPeriodTicks.load(std::memory_order_relaxed);',
            '        int64_t totalCycle = afterSwapQpc - lastPresentQpc;',
            '        int64_t swapDuration = afterSwapQpc - beforeSwapQpc;',
            '',
            '        // Neu wglSwapIntervalEXT(1) khong chan VBlank (totalCycle < 80% chu ky quet),',
            '        // tu dong bat khoa DwmFlush() cho cac khung hinh tiep theo',
            '        if (!needsDwmPreSync && totalCycle < (period * 80) / 100 && swapDuration < (period / 10)) {',
            '            needsDwmPreSync = true;',
            '        } else if (needsDwmPreSync && swapDuration > (period * 130) / 100) {',
            '            // Tranh doi kep neu ca DwmFlush va wglSwapIntervalEXT(1) cung chan',
            '            needsDwmPreSync = false;',
            '        }',
            '',
            '        lastPresentQpc = afterSwapQpc;',
            '    }',
            '    #endif',
            '}',
            '',
            'class $modify(TearFixDirector, cocos2d::CCDirector) {',
            '    void drawScene() {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        TearFixEngine::initEngine();',
            '',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '',
            '        int64_t elapsedTicks = now.QuadPart - TearFixEngine::lastTickQpc;',
            '        TearFixEngine::lastTickQpc = now.QuadPart;',
            '',
            '        double realDt = static_cast<double>(elapsedTicks) / static_cast<double>(TearFixEngine::qpcFreq);',
            '        if (realDt <= 0.0001 || realDt > 0.1) {',
            '            realDt = TearFixEngine::targetTickDt;',
            '        }',
            '',
            '        cocos2d::CCScene* currentScene = this->getRunningScene();',
            '        bool sceneChanged = (currentScene == nullptr) || (currentScene != TearFixEngine::lastScenePtr);',
            '        TearFixEngine::lastScenePtr = currentScene;',
            '',
            '        int64_t periodTicks = TearFixEngine::vblankPeriodTicks.load(std::memory_order_relaxed);',
            '        int64_t sinceLastPresent = now.QuadPart - TearFixEngine::lastPresentQpc;',
            '        int64_t renderThreshold = periodTicks - (TearFixEngine::targetTickTicks * 115) / 100;',
            '        if (renderThreshold < (periodTicks / 2)) {',
            '            renderThreshold = periodTicks / 2;',
            '        }',
            '',
            '        // Tinh so buoc vat ly can chay (bu sub-step neu V-Sync giu khung hinh)',
            '        int steps = 1;',
            '        if (TearFixEngine::targetTickDt > 0.0005 && realDt > TearFixEngine::targetTickDt * 1.55 && realDt < 0.05) {',
            '            steps = static_cast<int>((realDt / TearFixEngine::targetTickDt) + 0.5);',
            '            if (steps < 1) steps = 1;',
            '            if (steps > 12) steps = 12;',
            '        }',
            '        float stepDt = static_cast<float>(realDt / static_cast<double>(steps));',
            '',
            '        if (sceneChanged || this->isPaused() || sinceLastPresent >= renderThreshold) {',
            '            // Chay cac sub-step vat ly truoc (neu co)',
            '            if (!this->isPaused()) {',
            '                if (auto* sched = this->getScheduler()) {',
            '                    for (int i = 1; i < steps; ++i) {',
            '                        sched->update(stepDt);',
            '                    }',
            '                }',
            '            }',
            '            // Tick cuoi cung: Vua cap nhat vat ly vua ve khung hinh va SwapBuffers dung VBlank',
            '            TearFixEngine::shouldPresentFrame = true;',
            '            TearFixEngine::currentStepDt = stepDt;',
            '            TearFixEngine::overrideSchedulerDt = true;',
            '            CCDirector::drawScene();',
            '            TearFixEngine::overrideSchedulerDt = false;',
            '        } else {',
            '            // Tick vat ly trung gian: Cap nhat mau toc do Unlock FPS va chay Physics, bo qua Render',
            '            if (elapsedTicks >= (TearFixEngine::qpcFreq / 1000) && elapsedTicks <= (periodTicks * 80) / 100) {',
            '                TearFixEngine::targetTickTicks = (TearFixEngine::targetTickTicks * 7 + elapsedTicks) / 8;',
            '                TearFixEngine::targetTickDt = static_cast<double>(TearFixEngine::targetTickTicks) /',
            '                                             static_cast<double>(TearFixEngine::qpcFreq);',
            '            }',
            '            TearFixEngine::shouldPresentFrame = false;',
            '            if (auto* sched = this->getScheduler()) {',
            '                for (int i = 0; i < steps; ++i) {',
            '                    sched->update(stepDt);',
            '                }',
            '            }',
            '        }',
            '        #else',
            '        CCDirector::drawScene();',
            '        #endif',
            '    }',
            '};',
            '',
            'class $modify(TearFixScheduler, cocos2d::CCScheduler) {',
            '    void update(float dt) {',
            '        if (TearFixEngine::overrideSchedulerDt) {',
            '            dt = TearFixEngine::currentStepDt;',
            '            TearFixEngine::overrideSchedulerDt = false;',
            '        }',
            '        CCScheduler::update(dt);',
            '    }',
            '};',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    void swapBuffers() {',
            '        if (!TearFixEngine::shouldPresentFrame) {',
            '            return;',
            '        }',
            '        #ifdef GEODE_IS_WINDOWS',
            '        LARGE_INTEGER beforeSwap{}, afterSwap{};',
            '        QueryPerformanceCounter(&beforeSwap);',
            '',
            '        TearFixEngine::lockVBlankBeforeSwap();',
            '        CCEGLView::swapBuffers();',
            '',
            '        QueryPerformanceCounter(&afterSwap);',
            '        TearFixEngine::onSwapFinished(beforeSwap.QuadPart, afterSwap.QuadPart);',
            '        #else',
            '        CCEGLView::swapBuffers();',
            '        #endif',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    TearFixEngine::initEngine();',
            '    #endif',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest

      - name: Collect Built .geode Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null
          $geodeFiles = Get-ChildItem -Path $PWD -Filter "*.geode" -Recurse
          if (-not $geodeFiles) {
            Write-Error "No .geode file found after build!"
            exit 1
          }
          foreach ($file in $geodeFiles) {
            Copy-Item -Path $file.FullName -Destination (Join-Path $PWD "artifact\$($file.Name)") -Force
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-2.2081
          path: artifact/*.geode
