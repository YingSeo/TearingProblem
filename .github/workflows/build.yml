            '            pGlGenFramebuffers(1, &glStageFbo); pGlGenRenderbuffers(1, &glStageRbo);',
            '            pGlBindRenderbuffer(kGL_RENDERBUFFER, glStageRbo);',
            '            pGlRenderbufferStorage(kGL_RENDERBUFFER, kGL_RGBA8, static_cast<int32_t>(w), static_cast<int32_t>(h));',
            '            pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, glStageFbo);',
            '            pGlFramebufferRenderbuffer(kGL_DRAW_FRAMEBUFFER, kGL_COLOR_ATTACHMENT0, kGL_RENDERBUFFER, glStageRbo);',
            '            if (pGlCheckFramebufferStatus(kGL_DRAW_FRAMEBUFFER) != kGL_FRAMEBUFFER_COMPLETE) {',
            '                pGlDeleteFramebuffers(1, &glStageFbo); pGlDeleteRenderbuffers(1, &glStageRbo);',
            '                glStageFbo = glStageRbo = 0;',
            '            }',
            '            pGlBindRenderbuffer(kGL_RENDERBUFFER, static_cast<uint32_t>(prevRbo));',
            '            pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevFbo));',
            '        }',
            '',
            '        trackedHwnd = hwnd; cachedDC = hdc; trackedGlrc = hglrc; surfaceWidth = w; surfaceHeight = h;',
            '        vblankReadyForStage.store(true, std::memory_order_release);',
            '        bridgeActive.store(true, std::memory_order_release);',
            '        return true;',
            '    }',
            '',
            '    int pickFreeWriteSlot() {',
            '        int bp = presentingSlot.load(std::memory_order_acquire);',
            '        int bl = latestReadySlot.load(std::memory_order_acquire);',
            '        for (int o = 1; o <= 3; ++o) {',
            '            int c = (lastWrittenSlot + o) % 3;',
            '            if (c != bp && c != bl) return (lastWrittenSlot = c);',
            '        }',
            '        return (lastWrittenSlot + 1) % 3;',
            '    }',
            '',
            '    void blitSourceToDxgi(uint32_t srcFbo, bool flipY) {',
            '        int32_t prevR = 0, prevD = 0;',
            '        pGlGetIntegerv(kGL_READ_FRAMEBUFFER_BINDING, &prevR);',
            '        pGlGetIntegerv(kGL_DRAW_FRAMEBUFFER_BINDING, &prevD);',
            '        unsigned char scOn = pGlIsEnabled ? pGlIsEnabled(kGL_SCISSOR_TEST) : 0;',
            '        if (scOn && pGlDisable) pGlDisable(kGL_SCISSOR_TEST);',
            '',
            '        if (pWglDXLockObjectsNV(hInteropDevice, 1, &hInteropObject)) {',
            '            pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, srcFbo);',
            '            if (srcFbo == 0 && pGlReadBuffer) pGlReadBuffer(kGL_BACK);',
            '            pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, glInteropFbo);',
            '            int32_t y0 = flipY ? static_cast<int32_t>(surfaceHeight) : 0;',
            '            int32_t y1 = flipY ? 0 : static_cast<int32_t>(surfaceHeight);',
            '            pGlBlitFramebuffer(0, 0, static_cast<int32_t>(surfaceWidth), static_cast<int32_t>(surfaceHeight),',
            '                               0, y0, static_cast<int32_t>(surfaceWidth), y1, kGL_COLOR_BUFFER_BIT, kGL_NEAREST);',
            '            pWglDXUnlockObjectsNV(hInteropDevice, 1, &hInteropObject);',
            '',
            '            int slot = pickFreeWriteSlot();',
            '            reinterpret_cast<PFN_CopyResource>((*reinterpret_cast<void***>(interopContext))[47])(interopContext, ringTexMain[slot], interopCaptureTex);',
            '            reinterpret_cast<PFN_Flush>((*reinterpret_cast<void***>(interopContext))[111])(interopContext);',
            '            latestReadySlot.store(slot, std::memory_order_release);',
            '            SetEvent(hFrameReadyEvent);',
            '        } else {',
            '            vblankReadyForStage.store(true, std::memory_order_release);',
            '        }',
            '',
            '        pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, static_cast<uint32_t>(prevR));',
            '        pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevD));',
            '        if (scOn && pGlEnable) pGlEnable(kGL_SCISSOR_TEST);',
            '    }',
            '',
            '    bool pollStageAndTransferToDxgi(int64_t nowQpc, int64_t period) {',
            '        if (!stageInFlight) return false;',
            '        if (stageFence && pGlClientWaitSync) {',
            '            uint32_t res = pGlClientWaitSync(stageFence, 0, 0);',
            '            if (res != kGL_ALREADY_SIGNALED && res != kGL_CONDITION_SATISFIED) {',
            '                if (nowQpc - stageStartQpc >= period * 3) {',
            '                    cancelStage();',
            '                    vblankReadyForStage.store(true, std::memory_order_release);',
            '                }',
            '                return false;',
            '            }',
            '            pGlDeleteSync(stageFence);',
            '            stageFence = nullptr;',
            '        }',
            '        stageInFlight = false;',
            '        blitSourceToDxgi(glStageFbo, false);',
            '        return true;',
            '    }',
            '',
            '    void onSchedulerPreUpdate() {',
            '        inGameplayLevel = (PlayLayer::get() != nullptr) || (LevelEditorLayer::get() != nullptr);',
            '        if (inGameplayLevel) activatedInLevel = true;',
            '        if (!bridgeActive.load(std::memory_order_relaxed)) return;',
            '        LARGE_INTEGER now{}; QueryPerformanceCounter(&now);',
            '        schedStartQpc = now.QuadPart;',
            '        // Transfer completed stage BEFORE PlayLayer::resetLevel() (respawn) and BEFORE visit()!',
            '        if (stageInFlight && pGetCurrentContext && pGetCurrentContext() == trackedGlrc) {',
            '            pollStageAndTransferToDxgi(now.QuadPart, refreshPeriodTicks.load(std::memory_order_relaxed));',
            '        }',
            '    }',
            '',
            '    void onSchedulerPostUpdate() {',
            '        if (!bridgeActive.load(std::memory_order_relaxed)) return;',
            '        LARGE_INTEGER now{}; QueryPerformanceCounter(&now);',
            '        if (inGameplayLevel && (now.QuadPart - schedStartQpc) >= (qpcFreq * 30) / 10000) {',
            '            skipHeavyRespawnTick = true; // Bypass staging on heavy death/respawn CPU tick',
            '        }',
            '        if (stageInFlight && pGetCurrentContext && pGetCurrentContext() == trackedGlrc) {',
            '            pollStageAndTransferToDxgi(now.QuadPart, refreshPeriodTicks.load(std::memory_order_relaxed));',
            '        }',
            '    }',
            '',
            '    bool submitFrameV28() {',
            '        if (!interopSupported) return false;',
            '',
            '        // Stay 100% dormant until the user enters a level (PlayLayer / LevelEditorLayer) for the first time!',
            '        if (!activatedInLevel) {',
            '            if (!PlayLayer::get() && !LevelEditorLayer::get()) return false;',
            '            activatedInLevel = inGameplayLevel = true;',
            '        }',
            '',
            '        if (!loadApis()) return false;',
            '        HDC mainDC = pGetCurrentDC();',
            '        HGLRC hglrc = pGetCurrentContext();',
            '        if (!mainDC || !hglrc) return false;',
            '',
            '        uint32_t w = surfaceWidth, h = surfaceHeight;',
            '        HWND hwnd = trackedHwnd;',
            '        if (mainDC != cachedDC || !hwnd || (++rectCounter & 31u) == 0u) {',
            '            hwnd = WindowFromDC(mainDC);',
            '            if (!hwnd) return false;',
            '            RECT rc{};',
            '            if (!GetClientRect(hwnd, &rc)) return false;',
            '            w = static_cast<uint32_t>(rc.right - rc.left);',
            '            h = static_cast<uint32_t>(rc.bottom - rc.top);',
            '        }',
            '        if (w == 0 || h == 0) return true;',
            '',
            '        if (!bridgeActive.load(std::memory_order_acquire) || hwnd != trackedHwnd || hglrc != trackedGlrc || w != surfaceWidth || h != surfaceHeight) {',
            '            if (!rebuildSurface(hwnd, mainDC, hglrc, w, h)) return false;',
            '        }',
            '',
            '        LARGE_INTEGER now{}; QueryPerformanceCounter(&now);',
            '        int64_t callDelta = now.QuadPart - lastCallQpc;',
            '        lastCallQpc = now.QuadPart;',
            '        int64_t period = refreshPeriodTicks.load(std::memory_order_relaxed);',
            '',
            '        // Outside a level (Menus / Level Select / Load Level Button): bypass glStageFbo and present directly!',
            '        if (!inGameplayLevel) {',
            '            cancelStage();',
            '            if (vblankReadyForStage.load(std::memory_order_acquire) || (now.QuadPart - lastStageQpc) >= (period * 95) / 100 || callDelta >= period) {',
            '                vblankReadyForStage.store(false, std::memory_order_relaxed);',
            '                lastStageQpc = now.QuadPart;',
            '                blitSourceToDxgi(0, true);',
            '            }',
            '            return true;',
            '        }',
            '',
            '        // Inside a level: Proven v23.0 Zero-Lock Staging Pipeline',
            '        if (stageInFlight) pollStageAndTransferToDxgi(now.QuadPart, period);',
            '',
            '        if (skipHeavyRespawnTick) {',
            '            skipHeavyRespawnTick = false;',
            '            return true;',
            '        }',
            '',
            '        if (callDelta >= (period * 72) / 100) {',
            '            consecutiveHighRateFrames = 0;',
            '            if (++consecutive60HzFrames >= 6) is60HzCallerMode = true;',
            '        } else if (callDelta > 0 && callDelta <= (period * 58) / 100) {',
            '            consecutive60HzFrames = 0;',
            '            if (++consecutiveHighRateFrames >= 2) is60HzCallerMode = false;',
            '        }',
            '',
            '        if (stageInFlight) return true;',
            '',
            '        bool shouldStage = is60HzCallerMode || vblankReadyForStage.load(std::memory_order_acquire) || ((now.QuadPart - lastStageQpc) >= (period * 95) / 100);',
            '        if (!shouldStage) return true;',
            '',
            '        vblankReadyForStage.store(false, std::memory_order_relaxed);',
            '        lastStageQpc = now.QuadPart;',
            '',
            '        if (glStageFbo && pGlFenceSync && pGlClientWaitSync && pGlDeleteSync) {',
            '            int32_t prevR = 0, prevD = 0;',
            '            pGlGetIntegerv(kGL_READ_FRAMEBUFFER_BINDING, &prevR);',
            '            pGlGetIntegerv(kGL_DRAW_FRAMEBUFFER_BINDING, &prevD);',
            '            unsigned char scOn = pGlIsEnabled ? pGlIsEnabled(kGL_SCISSOR_TEST) : 0;',
            '            if (scOn && pGlDisable) pGlDisable(kGL_SCISSOR_TEST);',
            '',
            '            pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, 0);',
            '            if (pGlReadBuffer) pGlReadBuffer(kGL_BACK);',
            '            pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, glStageFbo);',
            '            pGlBlitFramebuffer(0, 0, static_cast<int32_t>(w), static_cast<int32_t>(h),',
            '                               0, static_cast<int32_t>(h), static_cast<int32_t>(w), 0, kGL_COLOR_BUFFER_BIT, kGL_NEAREST);',
            '',
            '            pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, static_cast<uint32_t>(prevR));',
            '            pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevD));',
            '            if (scOn && pGlEnable) pGlEnable(kGL_SCISSOR_TEST);',
            '',
            '            stageFence = pGlFenceSync(kGL_SYNC_GPU_COMMANDS_COMPLETE, 0);',
            '            stageStartQpc = now.QuadPart;',
            '            stageInFlight = true;',
            '            if (pGlFlush) pGlFlush();',
            '            return true;',
            '        }',
            '',
            '        blitSourceToDxgi(0, true);',
            '        return true;',
            '    }',
            '    #endif',
            '}',
            '',
            'class $modify(TearFixScheduler, cocos2d::CCScheduler) {',
            '    void update(float dt) {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        BypassScreenTearV28::onSchedulerPreUpdate();',
            '        #endif',
            '        CCScheduler::update(dt);',
            '        #ifdef GEODE_IS_WINDOWS',
            '        BypassScreenTearV28::onSchedulerPostUpdate();',
            '        #endif',
            '    }',
            '};',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    static void onModify(auto& self) {',
            '        (void)self.setHookPriority("cocos2d::CCEGLView::swapBuffers", 1000000);',
            '    }',
            '    void swapBuffers() {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        if (BypassScreenTearV28::submitFrameV28()) return;',
            '        #endif',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    BypassScreenTearV28::cleanNvidiaProfile();',
            '    #endif',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod for GD 2.2081 (Geode SDK v5.11.2)
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2

      - name: Verify and Package yingseo.notear.fps.geode Archive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null

          $geodeCandidate = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.geode" -Recurse |
                            Sort-Object Length -Descending |
                            Select-Object -First 1

          if (-not $geodeCandidate) {
            Write-Error "No .geode file found in build directory!"
            exit 1
          }

          $destGeode = Join-Path $PWD "artifact\yingseo.notear.fps.geode"
          Copy-Item -Path $geodeCandidate.FullName -Destination $destGeode -Force

          $zip = [System.IO.Compression.ZipFile]::Open($destGeode, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $hasDll = $false
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -eq "yingseo.notear.fps.dll" -and $entry.Length -gt 4096) {
                $hasDll = $true
              }
            }

            if (-not $hasDll) {
              $dllFile = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.dll" -Recurse |
                         Where-Object { $_.Name -like "*Bypass*" -or $_.Name -like "*yingseo*" } |
                         Sort-Object Length -Descending |
                         Select-Object -First 1
              if ($dllFile) {
                $oldDll = $zip.GetEntry("yingseo.notear.fps.dll")
                if ($oldDll) { $oldDll.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $dllFile.FullName, "yingseo.notear.fps.dll") | Out-Null
              }
            }

            foreach ($asset in @("mod.json", "logo.png", "about.md", "changelog.md")) {
              $assetPath = Join-Path $PWD $asset
              if (Test-Path $assetPath) {
                $existing = $zip.GetEntry($asset)
                if ($existing) { $existing.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $assetPath, $asset) | Out-Null
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bypass-Screen-Tear-v28.0.0
          path: artifact/yingseo.notear.fps.geode
