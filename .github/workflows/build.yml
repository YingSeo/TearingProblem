name: Build Geode Mod (GD 2.2081)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build (GD 2.2081 - Geode v5.11.2)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Icon, Metadata, CMake and Crash-Free PLL VBlank Source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          if (-not (Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" -Force | Out-Null
          }
          if (Test-Path "main.cpp") {
            Remove-Item -Path "main.cpp" -Force
          }

          # 1. Generate 256x256 RGBA PNG Icon (logo.png)
          $logoPath = Join-Path $PWD "logo.png"
          $csCode = @'
          using System;
          using System.Drawing;
          using System.Drawing.Drawing2D;
          using System.Drawing.Imaging;
          using System.Drawing.Text;

          public static class IconBuilder {
              public static void Build(string path) {
                  using (Bitmap bmp = new Bitmap(256, 256, PixelFormat.Format32bppArgb))
                  using (Graphics g = Graphics.FromImage(bmp)) {
                      g.SmoothingMode = SmoothingMode.AntiAlias;
                      g.TextRenderingHint = TextRenderingHint.AntiAliasGridFit;
                      g.Clear(Color.FromArgb(255, 10, 14, 26));

                      using (LinearGradientBrush bg = new LinearGradientBrush(
                          new Rectangle(16, 16, 224, 224),
                          Color.FromArgb(255, 18, 30, 62),
                          Color.FromArgb(255, 10, 14, 28),
                          45f)) {
                          g.FillRectangle(bg, 16, 16, 224, 224);
                      }

                      using (Pen pCyan = new Pen(Color.FromArgb(255, 0, 229, 255), 8f))
                      using (Pen pPurple = new Pen(Color.FromArgb(255, 124, 77, 255), 4f))
                      using (Pen pGreen = new Pen(Color.FromArgb(255, 0, 255, 170), 7f)) {
                          g.DrawRectangle(pCyan, 16, 16, 224, 224);
                          g.DrawRectangle(pPurple, 28, 28, 200, 200);

                          Point[] pulse = new Point[] {
                              new Point(42, 128),
                              new Point(92, 128),
                              new Point(112, 74),
                              new Point(144, 182),
                              new Point(164, 128),
                              new Point(214, 128)
                          };
                          g.DrawLines(pGreen, pulse);
                      }

                      using (Font f1 = new Font("Arial", 22f, FontStyle.Bold))
                      using (Font f2 = new Font("Arial", 13f, FontStyle.Bold))
                      using (SolidBrush bWhite = new SolidBrush(Color.FromArgb(255, 245, 250, 255)))
                      using (SolidBrush bCyan = new SolidBrush(Color.FromArgb(255, 0, 229, 255)))
                      using (StringFormat sf = new StringFormat()) {
                          sf.Alignment = StringAlignment.Center;
                          g.DrawString("NO TEAR", f1, bWhite, new RectangleF(0f, 36f, 256f, 44f), sf);
                          g.DrawString("PLL V4.0", f2, bCyan, new RectangleF(0f, 186f, 256f, 36f), sf);
                      }

                      bmp.Save(path, ImageFormat.Png);
                  }
              }
          }
          '@
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition $csCode
          [IconBuilder]::Build($logoPath)

          # 2. Generate about.md
          $aboutLines = @(
            '# <cy>NoTear FPS v4.0 (GD 2.2081)</c>',
            '',
            'Eliminates **screen tearing (horizontal glitch lines)** when **Unlock FPS** is enabled in **Geometry Dash 2.2081**.',
            '',
            '### <cg>v4.0 Architecture:</c>',
            '- **PLL VBlank Phase-Lock:** Automatically phase-locks `SwapBuffers` to the hardware VBlank edge with sub-millisecond precision.',
            '- **NVIDIA DXGI Flip-Model & Win11 Upgrade:** Automatically enables DXGI Swapchain layering (`0x20D690F8`) and Windows 11 Flip-Model presentation.',
            '- **100% Mod Compatibility:** Uses a single non-intrusive `CCEGLView::swapBuffers` hook — zero conflicts with **Bismuth**, Eclipse, Mega Hack, CBF, or Globed.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "about.md"), $aboutLines, $utf8NoBom)

          # 3. Generate changelog.md
          $changelogLines = @(
            '# v4.0.0 (For GD 2.2081)',
            '- Fixed EXCEPTION_ACCESS_VIOLATION (0xFFFFFFFFFFFFFFFF) crash during scene transitions and when running alongside Bismuth (iliashdz.bismuth).',
            '- Removed all CCDirector and CCScheduler hooks that conflicted with Bismuth DifferenceMode.',
            '- Added Phase-Locked Loop (PLL) VBlank Synchronizer + automatic NVIDIA DXGI Swapchain profile activation.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "changelog.md"), $changelogLines, $utf8NoBom)

          # 4. Generate mod.json strictly for Geode 5.11.2 and GD 2.2081
          $modJsonLines = @(
            '{',
            '    "geode": "5.11.2",',
            '    "gd": {',
            '        "win": "2.2081"',
            '    },',
            '    "id": "yingseo.notear-fps-22081",',
            '    "name": "NoTear FPS",',
            '    "version": "v4.0.0",',
            '    "developer": "YingSeo",',
            '    "description": "Eliminates screen tearing when Unlock FPS is enabled in Geometry Dash 2.2081 (100% Bismuth compatible).",',
            '    "early-load": true,',
            '    "tags": [',
            '        "performance",',
            '        "enhancement",',
            '        "universal"',
            '    ]',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "mod.json"), $modJsonLines, $utf8NoBom)

          # 5. Generate CMakeLists.txt
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_EXTENSIONS OFF)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            '',
            'project(NoTearFPS VERSION 4.0.0)',
            '',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            '',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            '',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            '',
            'if (WIN32)',
            '    target_link_libraries(${PROJECT_NAME} PRIVATE opengl32 user32 gdi32 advapi32)',
            'endif()',
            '',
            'setup_geode_mod(${PROJECT_NAME})'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "CMakeLists.txt"), $cmakeLines, $utf8NoBom)

          # 6. Generate src/main.cpp (Crash-Free Single-Hook PLL VBlank Engine + NVAPI DXGI Layering)
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '#include <atomic>',
            '#include <thread>',
            '#include <chrono>',
            '#include <cstdlib>',
            '',
            'using namespace geode::prelude;',
            '',
            'namespace TearFix {',
            '    std::atomic<int64_t> latestVBlankQpc{0};',
            '    std::atomic<int64_t> vblankPeriodQpc{0};',
            '    std::atomic<uint64_t> vblankSeq{0};',
            '    std::atomic<bool> engineStarted{false};',
            '',
            '    int64_t qpcFreq = 0;',
            '    int64_t lastCallQpc = 0;',
            '    int64_t lastPresentedQpc = 0;',
            '    int64_t avgCallIntervalQpc = 0;',
            '    uint64_t lastPresentedSeq = 0;',
            '',
            '    #ifdef GEODE_IS_WINDOWS',
            '    using PFN_timeBeginPeriod = unsigned int(__stdcall*)(unsigned int);',
            '    using PFN_DwmFlush = long(__stdcall*)(void);',
            '    using PFN_GetDeviceCaps = int(__stdcall*)(HDC, int);',
            '    using PFN_wglGetProcAddress = void*(__stdcall*)(const char*);',
            '    using PFN_wglGetCurrentDC = HDC(__stdcall*)(void);',
            '    using PFN_wglSwapIntervalEXT = int(__stdcall*)(int);',
            '    using PFN_glFinish = void(__stdcall*)(void);',
            '    using PFN_glFlush = void(__stdcall*)(void);',
            '',
            '    PFN_GetDeviceCaps pGetDeviceCaps = nullptr;',
            '    PFN_wglGetProcAddress pGetProcAddress = nullptr;',
            '    PFN_wglGetCurrentDC pGetCurrentDC = nullptr;',
            '    PFN_wglSwapIntervalEXT pSwapInterval = nullptr;',
            '    PFN_glFinish pGlFinish = nullptr;',
            '    PFN_glFlush pGlFlush = nullptr;',
            '    bool glResolved = false;',
            '    int lastIntervalSet = -999;',
            '    uint32_t swapCounter = 0;',
            '',
            '    // Enable Windows 11 DXGI Flip-Model Upgrade (SwapEffectUpgradeEnable=1) in HKCU',
            '    void enableWindows11FlipModelUpgrade() {',
            '        wchar_t exePath[MAX_PATH]{};',
            '        if (GetModuleFileNameW(nullptr, exePath, MAX_PATH) == 0) return;',
            '',
            '        HKEY hKey = nullptr;',
            '        if (RegCreateKeyExW(',
            '                HKEY_CURRENT_USER,',
            '                L"Software\\Microsoft\\DirectX\\UserGpuPreferences",',
            '                0, nullptr, 0, KEY_SET_VALUE, nullptr, &hKey, nullptr) == ERROR_SUCCESS) {',
            '            const wchar_t* val = L"SwapEffectUpgradeEnable=1;GpuPreference=2;";',
            '            DWORD byteLen = static_cast<DWORD>((wcslen(val) + 1) * sizeof(wchar_t));',
            '            RegSetValueExW(hKey, exePath, 0, REG_SZ, reinterpret_cast<const BYTE*>(val), byteLen);',
            '            RegCloseKey(hKey);',
            '        }',
            '    }',
            '',
            '    // Enable NVIDIA OpenGL "Prefer layered on DXGI Swapchain" (0x20D690F8 = 1) via nvapi64.dll',
            '    void enableNvidiaDxgiSwapchainProfile() {',
            '        HMODULE hNvapi = LoadLibraryA("nvapi64.dll");',
            '        if (!hNvapi) return;',
            '',
            '        using PFN_nvapi_QueryInterface = void*(__cdecl*)(uint32_t);',
            '        auto queryInterface = reinterpret_cast<PFN_nvapi_QueryInterface>(',
            '            GetProcAddress(hNvapi, "nvapi_QueryInterface")',
            '        );',
            '        if (!queryInterface) return;',
            '',
            '        using PFN_Initialize = int(__cdecl*)(void);',
            '        using PFN_DRS_CreateSession = int(__cdecl*)(void**);',
            '        using PFN_DRS_DestroySession = int(__cdecl*)(void*);',
            '        using PFN_DRS_LoadSettings = int(__cdecl*)(void*);',
            '        using PFN_DRS_SaveSettings = int(__cdecl*)(void*);',
            '        using PFN_DRS_GetBaseProfile = int(__cdecl*)(void*, void**);',
            '        using PFN_DRS_SetSetting = int(__cdecl*)(void*, void*, void*);',
            '',
            '        auto nvInit = reinterpret_cast<PFN_Initialize>(queryInterface(0x0150E828));',
            '        auto createSession = reinterpret_cast<PFN_DRS_CreateSession>(queryInterface(0x0694D52E));',
            '        auto destroySession = reinterpret_cast<PFN_DRS_DestroySession>(queryInterface(0xDAD9CFF8));',
            '        auto loadSettings = reinterpret_cast<PFN_DRS_LoadSettings>(queryInterface(0x375DBD6B));',
            '        auto saveSettings = reinterpret_cast<PFN_DRS_SaveSettings>(queryInterface(0xFCBC7E14));',
            '        auto getBaseProfile = reinterpret_cast<PFN_DRS_GetBaseProfile>(queryInterface(0xDA8466A0));',
            '        auto setSetting = reinterpret_cast<PFN_DRS_SetSetting>(queryInterface(0x577DD202));',
            '',
            '        if (!nvInit || !createSession || !destroySession || !loadSettings || !saveSettings || !getBaseProfile || !setSetting) {',
            '            return;',
            '        }',
            '',
            '        if (nvInit() != 0) return;',
            '        void* hSession = nullptr;',
            '        if (createSession(&hSession) != 0 || !hSession) return;',
            '',
            '        if (loadSettings(hSession) == 0) {',
            '            void* hProfile = nullptr;',
            '            if (getBaseProfile(hSession, &hProfile) == 0 && hProfile) {',
            '                struct NvDrsSettingV1 {',
            '                    uint32_t version;',
            '                    wchar_t settingName[2048];',
            '                    uint32_t settingId;',
            '                    uint32_t settingType;',
            '                    uint32_t settingLocation;',
            '                    uint32_t isCurrentPredefined;',
            '                    uint32_t isPredefinedValid;',
            '                    uint32_t u32PredefinedValue;',
            '                    uint8_t padPredefined[4092];',
            '                    uint32_t u32CurrentValue;',
            '                    uint8_t padCurrent[4092];',
            '                };',
            '                NvDrsSettingV1 setting{};',
            '                setting.version = static_cast<uint32_t>(sizeof(NvDrsSettingV1)) | (1u << 16);',
            '                setting.settingId = 0x20D690F8u; // OGL_CPL_PREFER_DXPRESENT_ID',
            '                setting.settingType = 0u;        // NVDRS_DWORD_TYPE',
            '                setting.u32CurrentValue = 1u;    // OGL_CPL_PREFER_DXPRESENT_PREFER_ENABLED',
            '                setting.u32PredefinedValue = 1u;',
            '                if (setSetting(hSession, hProfile, &setting) == 0) {',
            '                    saveSettings(hSession);',
            '                }',
            '            }',
            '        }',
            '        destroySession(hSession);',
            '    }',
            '',
            '    void initEngine() {',
            '        bool expected = false;',
            '        if (!engineStarted.compare_exchange_strong(expected, true)) return;',
            '',
            '        _putenv_s("OGL_CPL_PREFER_DXPRESENT", "1");',
            '        SetEnvironmentVariableA("OGL_CPL_PREFER_DXPRESENT", "1");',
            '',
            '        LARGE_INTEGER freq{}, now{};',
            '        QueryPerformanceFrequency(&freq);',
            '        QueryPerformanceCounter(&now);',
            '        qpcFreq = freq.QuadPart;',
            '        lastCallQpc = now.QuadPart;',
            '        lastPresentedQpc = now.QuadPart;',
            '        avgCallIntervalQpc = qpcFreq / 60;',
            '',
            '        latestVBlankQpc.store(now.QuadPart, std::memory_order_relaxed);',
            '        vblankPeriodQpc.store(qpcFreq / 60, std::memory_order_relaxed);',
            '',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto pTimeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"))) {',
            '                pTimeBegin(1);',
            '            }',
            '        }',
            '        if (HMODULE hGdi = GetModuleHandleA("gdi32.dll")) {',
            '            pGetDeviceCaps = reinterpret_cast<PFN_GetDeviceCaps>(GetProcAddress(hGdi, "GetDeviceCaps"));',
            '        }',
            '',
            '        // Background hardware VBlank tracker + one-time driver profile setup',
            '        std::thread([]() {',
            '            enableWindows11FlipModelUpgrade();',
            '            enableNvidiaDxgiSwapchainProfile();',
            '',
            '            PFN_DwmFlush localDwmFlush = nullptr;',
            '            if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '                localDwmFlush = reinterpret_cast<PFN_DwmFlush>(GetProcAddress(hDwm, "DwmFlush"));',
            '            }',
            '',
            '            LARGE_INTEGER f{};',
            '            QueryPerformanceFrequency(&f);',
            '            int64_t lFreq = f.QuadPart;',
            '            int64_t prevEdge = 0;',
            '            int64_t smoothPeriod = lFreq / 60;',
            '',
            '            while (true) {',
            '                if (localDwmFlush && localDwmFlush() == 0) {',
            '                    LARGE_INTEGER edge{};',
            '                    QueryPerformanceCounter(&edge);',
            '                    if (prevEdge > 0) {',
            '                        int64_t diff = edge.QuadPart - prevEdge;',
            '                        if (diff >= (lFreq / 360) && diff <= (lFreq / 40)) {',
            '                            smoothPeriod = (smoothPeriod * 7 + diff) / 8;',
            '                            vblankPeriodQpc.store(smoothPeriod, std::memory_order_relaxed);',
            '                        }',
            '                    }',
            '                    prevEdge = edge.QuadPart;',
            '                    latestVBlankQpc.store(edge.QuadPart, std::memory_order_release);',
            '                    vblankSeq.fetch_add(1, std::memory_order_release);',
            '                } else {',
            '                    std::this_thread::sleep_for(std::chrono::milliseconds(16));',
            '                    LARGE_INTEGER edge{};',
            '                    QueryPerformanceCounter(&edge);',
            '                    latestVBlankQpc.store(edge.QuadPart, std::memory_order_release);',
            '                    vblankSeq.fetch_add(1, std::memory_order_release);',
            '                }',
            '            }',
            '        }).detach();',
            '    }',
            '',
            '    // Returns true if this swapBuffers call should present to the screen, aligned to VBlank',
            '    bool shouldPresentAndAlignVBlank() {',
            '        initEngine();',
            '',
            '        if (!glResolved) {',
            '            glResolved = true;',
            '            if (HMODULE hGl = GetModuleHandleA("opengl32.dll")) {',
            '                pGlFinish = reinterpret_cast<PFN_glFinish>(GetProcAddress(hGl, "glFinish"));',
            '                pGlFlush = reinterpret_cast<PFN_glFlush>(GetProcAddress(hGl, "glFlush"));',
            '                pGetCurrentDC = reinterpret_cast<PFN_wglGetCurrentDC>(GetProcAddress(hGl, "wglGetCurrentDC"));',
            '                pGetProcAddress = reinterpret_cast<PFN_wglGetProcAddress>(GetProcAddress(hGl, "wglGetProcAddress"));',
            '            }',
            '        }',
            '        if (!pSwapInterval && pGetProcAddress) {',
            '            pSwapInterval = reinterpret_cast<PFN_wglSwapIntervalEXT>(pGetProcAddress("wglSwapIntervalEXT"));',
            '        }',
            '',
            '        if ((++swapCounter == 1 || swapCounter % 240 == 0) && pGetCurrentDC && pGetDeviceCaps) {',
            '            if (HDC hdc = pGetCurrentDC()) {',
            '                int hz = pGetDeviceCaps(hdc, 116);',
            '                if (hz >= 30 && hz <= 360) {',
            '                    vblankPeriodQpc.store(qpcFreq / hz, std::memory_order_relaxed);',
            '                }',
            '            }',
            '        }',
            '',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '',
            '        int64_t callDelta = now.QuadPart - lastCallQpc;',
            '        lastCallQpc = now.QuadPart;',
            '',
            '        int64_t period = vblankPeriodQpc.load(std::memory_order_relaxed);',
            '        if (callDelta > (qpcFreq / 2000) && callDelta < (period * 2)) {',
            '            avgCallIntervalQpc = (avgCallIntervalQpc * 7 + callDelta) / 8;',
            '        }',
            '',
            '        // Keep driver V-Sync at 0 so main thread never blocks for 16.67ms',
            '        if (pSwapInterval && lastIntervalSet != 0) {',
            '            pSwapInterval(0);',
            '            lastIntervalSet = 0;',
            '        }',
            '',
            '        int64_t vblankOrigin = latestVBlankQpc.load(std::memory_order_acquire);',
            '        int64_t nextVBlank = vblankOrigin + period;',
            '        if (now.QuadPart >= nextVBlank) {',
            '            int64_t passed = (now.QuadPart - vblankOrigin) / period + 1;',
            '            nextVBlank = vblankOrigin + passed * period;',
            '        }',
            '        int64_t remToVBlank = nextVBlank - now.QuadPart;',
            '        double remMs = (static_cast<double>(remToVBlank) * 1000.0) / static_cast<double>(qpcFreq);',
            '',
            '        // Detect whether an external Draw-Divide mod (e.g. Bismuth DifferenceMode) is already pacing swapBuffers',
            '        bool externalDividerActive = (avgCallIntervalQpc >= (period * 75) / 100);',
            '',
            '        if (!externalDividerActive) {',
            '            // Raw Unlock FPS (120 / 240 / 360 / 480 FPS):',
            '            // Only present on the tick closest to the upcoming VBlank edge, skip mid-scanout swaps',
            '            int64_t sinceLastPresent = now.QuadPart - lastPresentedQpc;',
            '            int64_t gateThreshold = period - (avgCallIntervalQpc * 115) / 100;',
            '            if (gateThreshold < (period * 55) / 100) {',
            '                gateThreshold = (period * 55) / 100;',
            '            }',
            '            if (sinceLastPresent < gateThreshold) {',
            '                return false;',
            '            }',
            '        }',
            '',
            '        // Flush GPU draw commands into backbuffer before aligning to the VBlank edge',
            '        if (pGlFinish) {',
            '            pGlFinish();',
            '        } else if (pGlFlush) {',
            '            pGlFlush();',
            '        }',
            '',
            '        QueryPerformanceCounter(&now);',
            '        remToVBlank = nextVBlank - now.QuadPart;',
            '        remMs = (static_cast<double>(remToVBlank) * 1000.0) / static_cast<double>(qpcFreq);',
            '',
            '        if (remMs > 0.0 && remMs <= 1.6) {',
            '            // Inside the VBlank capture window (< 1.6ms): lock directly onto the exact VBlank edge',
            '            while (true) {',
            '                QueryPerformanceCounter(&now);',
            '                if (now.QuadPart >= nextVBlank) break;',
            '                YieldProcessor();',
            '            }',
            '        } else if (externalDividerActive && remMs > 1.6 && remMs < 14.8) {',
            '            // Bismuth DifferenceMode is firing mid-scanout: apply a gentle 0.55ms PLL phase nudge',
            '            // so its 60Hz clock smoothly walks into the VBlank window within ~0.2s with zero slowdown',
            '            int64_t nudgeTarget = now.QuadPart + (550LL * qpcFreq) / 1000000LL;',
            '            while (true) {',
            '                QueryPerformanceCounter(&now);',
            '                if (now.QuadPart >= nudgeTarget) break;',
            '                YieldProcessor();',
            '            }',
            '        }',
            '',
            '        lastPresentedQpc = now.QuadPart;',
            '        return true;',
            '    }',
            '    #endif',
            '}',
            '',
            '// Single ultra-clean hook at Priority::Last (zero CCScene pointer touches, zero Bismuth conflicts)',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    static void onModify(auto& self) {',
            '        (void)self.setHookPriority("cocos2d::CCEGLView::swapBuffers", 1000000);',
            '    }',
            '',
            '    void swapBuffers() {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        if (!TearFix::shouldPresentAndAlignVBlank()) {',
            '            return;',
            '        }',
            '        #endif',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    TearFix::initEngine();',
            '    #endif',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod for GD 2.2081 (Geode SDK v5.11.2)
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2

      - name: Verify and Package Complete .geode Archive for GD 2.2081
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null

          $geodeCandidate = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.geode" -Recurse |
                            Sort-Object Length -Descending |
                            Select-Object -First 1

          if (-not $geodeCandidate) {
            Write-Error "No .geode file found in build directory!"
            exit 1
          }

          $destGeode = Join-Path $PWD "artifact\yingseo.notear-fps-22081.geode"
          Copy-Item -Path $geodeCandidate.FullName -Destination $destGeode -Force

          $zip = [System.IO.Compression.ZipFile]::Open($destGeode, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $hasDll = $false
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -like "*.dll" -and $entry.Length -gt 4096) {
                $hasDll = $true
              }
            }

            if (-not $hasDll) {
              $dllFile = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.dll" -Recurse |
                         Where-Object { $_.Name -like "*NoTear*" -or $_.Name -like "*yingseo*" } |
                         Sort-Object Length -Descending |
                         Select-Object -First 1
              if ($dllFile) {
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $dllFile.FullName, "yingseo.notear-fps-22081.dll") | Out-Null
              }
            }

            foreach ($asset in @("mod.json", "logo.png", "about.md", "changelog.md")) {
              $assetPath = Join-Path $PWD $asset
              if (Test-Path $assetPath) {
                $existing = $zip.GetEntry($asset)
                if ($existing) { $existing.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $assetPath, $asset) | Out-Null
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-GD-2.2081-v4.0.0
          path: artifact/*.geode
