name: Build Geode Mod (GD 2.2081)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build (GD 2.2081 - Geode v5.11.2)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Icon, Metadata, CMake and v13.0 Zero-Lag DXGI Flip-Discard Source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          if (-not (Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" -Force | Out-Null
          }
          if (Test-Path "main.cpp") {
            Remove-Item -Path "main.cpp" -Force
          }

          # 1. Tao Icon 256x256 RGBA PNG (logo.png)
          $logoPath = Join-Path $PWD "logo.png"
          $csCode = @'
          using System;
          using System.Drawing;
          using System.Drawing.Drawing2D;
          using System.Drawing.Imaging;
          using System.Drawing.Text;

          public static class IconBuilder {
              public static void Build(string path) {
                  using (Bitmap bmp = new Bitmap(256, 256, PixelFormat.Format32bppArgb))
                  using (Graphics g = Graphics.FromImage(bmp)) {
                      g.SmoothingMode = SmoothingMode.AntiAlias;
                      g.TextRenderingHint = TextRenderingHint.AntiAliasGridFit;
                      g.Clear(Color.FromArgb(255, 10, 14, 26));

                      using (LinearGradientBrush bg = new LinearGradientBrush(
                          new Rectangle(16, 16, 224, 224),
                          Color.FromArgb(255, 12, 42, 86),
                          Color.FromArgb(255, 8, 12, 24),
                          45f)) {
                          g.FillRectangle(bg, 16, 16, 224, 224);
                      }

                      using (Pen pCyan = new Pen(Color.FromArgb(255, 0, 229, 255), 8f))
                      using (Pen pPurple = new Pen(Color.FromArgb(255, 124, 77, 255), 4f))
                      using (Pen pGreen = new Pen(Color.FromArgb(255, 0, 255, 170), 7f)) {
                          g.DrawRectangle(pCyan, 16, 16, 224, 224);
                          g.DrawRectangle(pPurple, 28, 28, 200, 200);

                          Point[] pulse = new Point[] {
                              new Point(42, 128),
                              new Point(92, 128),
                              new Point(112, 74),
                              new Point(144, 182),
                              new Point(164, 128),
                              new Point(214, 128)
                          };
                          g.DrawLines(pGreen, pulse);
                      }

                      using (Font f1 = new Font("Arial", 22f, FontStyle.Bold))
                      using (Font f2 = new Font("Arial", 13f, FontStyle.Bold))
                      using (SolidBrush bWhite = new SolidBrush(Color.FromArgb(255, 245, 250, 255)))
                      using (SolidBrush bCyan = new SolidBrush(Color.FromArgb(255, 0, 229, 255)))
                      using (StringFormat sf = new StringFormat()) {
                          sf.Alignment = StringAlignment.Center;
                          g.DrawString("NO TEAR", f1, bWhite, new RectangleF(0f, 36f, 256f, 44f), sf);
                          g.DrawString("PURE V13", f2, bCyan, new RectangleF(0f, 186f, 256f, 36f), sf);
                      }

                      bmp.Save(path, ImageFormat.Png);
                  }
              }
          }
          '@
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition $csCode
          [IconBuilder]::Build($logoPath)

          # 2. Tao about.md
          $aboutLines = @(
            '# <cy>NoTear FPS v13.0 (Zero-Lag 60Hz DXGI Flip-Discard)</c>',
            '',
            'Single-purpose mod that eliminates **screen tearing (horizontal glitch lines)** when **Unlock FPS** is enabled in **Geometry Dash 2.2081** with **0% FPS drops and 0.00ms lag**.',
            '',
            '### <cg>How v13.0 Works:</c>',
            '- **Native Driver DXGI Flip-Model Activation:** Enables `OGL_CPL_PREFER_DXPRESENT` (`0x20D690F8 = 1`) and Windows 11 `SwapEffectUpgradeEnable=1` outside the Loader Lock before OpenGL initializes.',
            '- **Hardware `IDXGIFactory5` & `IDXGISwapChain3` Kernel Hook:** Disables `DXGI_FEATURE_PRESENT_ALLOW_TEARING`, strips `0x800` / `0x200` tearing flags, and upgrades the native swapchain to a 4-buffer `DXGI_SWAP_EFFECT_FLIP_DISCARD` queue.',
            '- **Zero Frame Skipping & Zero Copies:** Never skips frames, never blocks the main thread, and never copies textures.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "about.md"), $aboutLines, $utf8NoBom)

          # 3. Tao changelog.md
          $changelogLines = @(
            '# v13.0.0 (For GD 2.2081)',
            '- Removed WGL_NV_DX_interop2 (wglDXLockObjectsNV) and 60Hz frame-skipping from v12.0 that caused lag and FPS drops.',
            '- Fixed the v11.0 DllMain Loader Lock bug that prevented NVAPI and DXGI VTable hooks from initializing.',
            '- Fixed the 12296-byte NVDRS_APPLICATION_V1 struct size so geometrydash.exe custom Optimus profiles in NVIDIA Control Panel are updated.',
            '- Added IDXGIFactory5::CheckFeatureSupport, IDXGISwapChain3::ResizeBuffers1, and IDXGISwapChain::SetFullscreenState hooks with 4-buffer Flip-Discard.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "changelog.md"), $changelogLines, $utf8NoBom)

          # 4. Tao mod.json khoa cung cho Geode 5.11.2 va GD 2.2081
          $modJsonLines = @(
            '{',
            '    "geode": "5.11.2",',
            '    "gd": {',
            '        "win": "2.2081"',
            '    },',
            '    "id": "yingseo.notear-fps-22081",',
            '    "name": "NoTear FPS",',
            '    "version": "v13.0.0",',
            '    "developer": "YingSeo",',
            '    "description": "Eliminates screen tearing on Unlock FPS with zero lag and zero frame drops.",',
            '    "early-load": true,',
            '    "tags": [',
            '        "performance",',
            '        "enhancement",',
            '        "universal"',
            '    ]',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "mod.json"), $modJsonLines, $utf8NoBom)

          # 5. Tao CMakeLists.txt
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_EXTENSIONS OFF)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            '',
            'project(NoTearFPS VERSION 13.0.0)',
            '',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            '',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            '',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            'setup_geode_mod(${PROJECT_NAME})'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "CMakeLists.txt"), $cmakeLines, $utf8NoBom)

          # 6. Tao src/main.cpp (v13.0 Pure Native DXGI Flip-Discard Interceptor - Zero Lag, Zero Frame Drops)
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '#include <atomic>',
            '#include <cstdint>',
            '#include <cstdlib>',
            '#include <cstring>',
            '',
            'using namespace geode::prelude;',
            '',
            'namespace PureNoTearV13 {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    // ABI-exact DXGI structures (zero external header conflicts)',
            '    struct DxgiRational {',
            '        uint32_t Numerator;',
            '        uint32_t Denominator;',
            '    };',
            '    struct DxgiModeDesc {',
            '        uint32_t Width;',
            '        uint32_t Height;',
            '        DxgiRational RefreshRate;',
            '        uint32_t Format;',
            '        uint32_t ScanlineOrdering;',
            '        uint32_t Scaling;',
            '    };',
            '    struct DxgiSampleDesc {',
            '        uint32_t Count;',
            '        uint32_t Quality;',
            '    };',
            '    struct DxgiSwapChainDesc {',
            '        DxgiModeDesc BufferDesc;',
            '        DxgiSampleDesc SampleDesc;',
            '        uint32_t BufferUsage;',
            '        uint32_t BufferCount;',
            '        HWND OutputWindow;',
            '        int Windowed;',
            '        uint32_t SwapEffect;',
            '        uint32_t Flags;',
            '    };',
            '    struct DxgiSwapChainDesc1 {',
            '        uint32_t Width;',
            '        uint32_t Height;',
            '        uint32_t Format;',
            '        int Stereo;',
            '        DxgiSampleDesc SampleDesc;',
            '        uint32_t BufferUsage;',
            '        uint32_t BufferCount;',
            '        uint32_t Scaling;',
            '        uint32_t SwapEffect;',
            '        uint32_t AlphaMode;',
            '        uint32_t Flags;',
            '    };',
            '    struct DwmMargins {',
            '        int cxLeftWidth;',
            '        int cxRightWidth;',
            '        int cyTopHeight;',
            '        int cyBottomHeight;',
            '    };',
            '',
            '    static const GUID kIID_IDXGIFactory2 = {',
            '        0x50c83a1c, 0xe072, 0x4c48, { 0x87, 0xb0, 0x36, 0x30, 0xfa, 0x36, 0xa6, 0xd0 }',
            '    };',
            '    static const GUID kIID_IDXGIFactory5 = {',
            '        0x7632e1f5, 0xee65, 0x4dca, { 0x87, 0xfd, 0x84, 0xcd, 0x75, 0xf8, 0x83, 0x8d }',
            '    };',
            '    static const GUID kIID_IDXGISwapChain1 = {',
            '        0x790a45f7, 0x0d42, 0x4876, { 0x98, 0x3a, 0x0a, 0x55, 0xcf, 0xe6, 0xf4, 0xaa }',
            '    };',
            '    static const GUID kIID_IDXGISwapChain3 = {',
            '        0x94d99bdb, 0xf1f8, 0x4ab0, { 0xb2, 0x36, 0x7d, 0xa0, 0x17, 0x0e, 0xda, 0xb1 }',
            '    };',
            '',
            '    // COM VTable function pointer types',
            '    using PFN_UnknownQueryInterface = long(__stdcall*)(void*, const GUID*, void**);',
            '    using PFN_UnknownRelease = unsigned long(__stdcall*)(void*);',
            '    using PFN_FactoryMakeWindowAssociation = long(__stdcall*)(void*, HWND, uint32_t);',
            '    using PFN_FactoryCreateSwapChain = long(__stdcall*)(void*, void*, DxgiSwapChainDesc*, void**);',
            '    using PFN_Factory2CreateSwapChainForHwnd = long(__stdcall*)(void*, void*, HWND, const DxgiSwapChainDesc1*, const void*, void*, void**);',
            '    using PFN_Factory5CheckFeatureSupport = long(__stdcall*)(void*, uint32_t, void*, uint32_t);',
            '',
            '    using PFN_SwapChainPresent = long(__stdcall*)(void*, uint32_t, uint32_t);',
            '    using PFN_SwapChainSetFullscreenState = long(__stdcall*)(void*, int, void*);',
            '    using PFN_SwapChainResizeBuffers = long(__stdcall*)(void*, uint32_t, uint32_t, uint32_t, uint32_t, uint32_t);',
            '    using PFN_SwapChain1Present1 = long(__stdcall*)(void*, uint32_t, uint32_t, const void*);',
            '    using PFN_SwapChain3ResizeBuffers1 = long(__stdcall*)(void*, uint32_t, uint32_t, uint32_t, uint32_t, uint32_t, const uint32_t*, void* const*);',
            '',
            '    PFN_FactoryCreateSwapChain origCreateSwapChain = nullptr;',
            '    PFN_Factory2CreateSwapChainForHwnd origCreateSwapChainForHwnd = nullptr;',
            '    PFN_Factory5CheckFeatureSupport origCheckFeatureSupport = nullptr;',
            '',
            '    PFN_SwapChainPresent origPresent = nullptr;',
            '    PFN_SwapChainSetFullscreenState origSetFullscreenState = nullptr;',
            '    PFN_SwapChainResizeBuffers origResizeBuffers = nullptr;',
            '    PFN_SwapChain1Present1 origPresent1 = nullptr;',
            '    PFN_SwapChain3ResizeBuffers1 origResizeBuffers1 = nullptr;',
            '',
            '    std::atomic<bool> nvProfileConfigured{false};',
            '    std::atomic<bool> dxgiHooksInstalled{false};',
            '    std::atomic<uint64_t> dxgiPresentsIntercepted{0};',
            '',
            '    inline void comRelease(void*& ptr) {',
            '        if (ptr) {',
            '            auto vtbl = *reinterpret_cast<void***>(ptr);',
            '            reinterpret_cast<PFN_UnknownRelease>(vtbl[2])(ptr);',
            '            ptr = nullptr;',
            '        }',
            '    }',
            '',
            '    inline void hookVtableSlot(void** vtbl, size_t idx, void* detour, void** outOrig) {',
            '        if (!vtbl || !vtbl[idx] || vtbl[idx] == detour) return;',
            '        DWORD oldProt = 0;',
            '        if (VirtualProtect(&vtbl[idx], sizeof(void*), PAGE_EXECUTE_READWRITE, &oldProt)) {',
            '            if (*outOrig == nullptr) {',
            '                *outOrig = vtbl[idx];',
            '            }',
            '            vtbl[idx] = detour;',
            '            VirtualProtect(&vtbl[idx], sizeof(void*), oldProt, &oldProt);',
            '        }',
            '    }',
            '',
            '    // Hook 1: IDXGIFactory5::CheckFeatureSupport (vtable index 28)',
            '    // Reports DXGI_FEATURE_PRESENT_ALLOW_TEARING (0) as FALSE so nvoglv64.dll natively disables tearing!',
            '    long __stdcall Hook_Factory5CheckFeatureSupport(void* self, uint32_t feature, void* pFeatureSupportData, uint32_t featureSupportDataSize) {',
            '        long hr = origCheckFeatureSupport(self, feature, pFeatureSupportData, featureSupportDataSize);',
            '        if (feature == 0 && pFeatureSupportData && featureSupportDataSize >= sizeof(int)) {',
            '            *reinterpret_cast<int*>(pFeatureSupportData) = 0; // FALSE = Disallow tearing!',
            '            return 0; // S_OK',
            '        }',
            '        return hr;',
            '    }',
            '',
            '    // Hook 2: IDXGISwapChain::Present (vtable index 8)',
            '    // Strips DXGI_PRESENT_ALLOW_TEARING (0x200) and keeps SyncInterval = 0 (0.00ms wait, 100% VBlank flip by DWM)',
            '    long __stdcall Hook_SwapChainPresent(void* self, uint32_t syncInterval, uint32_t flags) {',
            '        dxgiPresentsIntercepted.fetch_add(1, std::memory_order_relaxed);',
            '        flags &= ~0x00000200u; // Strip DXGI_PRESENT_ALLOW_TEARING',
            '        if ((flags & 0x00000001u) == 0) { // If not DXGI_PRESENT_TEST',
            '            syncInterval = 0;',
            '        }',
            '        return origPresent(self, syncInterval, flags);',
            '    }',
            '',
            '    // Hook 3: IDXGISwapChain1::Present1 (vtable index 22)',
            '    long __stdcall Hook_SwapChain1Present1(void* self, uint32_t syncInterval, uint32_t presentFlags, const void* pParams) {',
            '        dxgiPresentsIntercepted.fetch_add(1, std::memory_order_relaxed);',
            '        presentFlags &= ~0x00000200u; // Strip DXGI_PRESENT_ALLOW_TEARING',
            '        if ((presentFlags & 0x00000001u) == 0) {',
            '            syncInterval = 0;',
            '        }',
            '        return origPresent1(self, syncInterval, presentFlags, pParams);',
            '    }',
            '',
            '    // Hook 4: IDXGISwapChain::SetFullscreenState (vtable index 10)',
            '    // Prevents SwapChain from entering legacy Exclusive Fullscreen so DWM Composed Flip stays active',
            '    long __stdcall Hook_SwapChainSetFullscreenState(void* self, int fullscreen, void* pTarget) {',
            '        if (fullscreen != 0) {',
            '            return origSetFullscreenState(self, 0, nullptr);',
            '        }',
            '        return origSetFullscreenState(self, fullscreen, pTarget);',
            '    }',
            '',
            '    // Hook 5: IDXGISwapChain::ResizeBuffers (vtable index 13)',
            '    long __stdcall Hook_SwapChainResizeBuffers(void* self, uint32_t bufferCount, uint32_t width, uint32_t height, uint32_t newFormat, uint32_t swapChainFlags) {',
            '        swapChainFlags &= ~0x00000800u; // Strip DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING',
            '        if (bufferCount > 0 && bufferCount < 4) {',
            '            bufferCount = 4;',
            '        }',
            '        long hr = origResizeBuffers(self, bufferCount, width, height, newFormat, swapChainFlags);',
            '        if (hr < 0) {',
            '            hr = origResizeBuffers(self, 3, width, height, newFormat, swapChainFlags);',
            '        }',
            '        return hr;',
            '    }',
            '',
            '    // Hook 6: IDXGISwapChain3::ResizeBuffers1 (vtable index 39)',
            '    long __stdcall Hook_SwapChain3ResizeBuffers1(',
            '        void* self, uint32_t bufferCount, uint32_t width, uint32_t height,',
            '        uint32_t format, uint32_t swapChainFlags, const uint32_t* pCreationNodeMask, void* const* ppPresentQueue) {',
            '        swapChainFlags &= ~0x00000800u; // Strip DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING',
            '        if (bufferCount > 0 && bufferCount < 4 && !pCreationNodeMask && !ppPresentQueue) {',
            '            bufferCount = 4;',
            '        }',
            '        long hr = origResizeBuffers1(self, bufferCount, width, height, format, swapChainFlags, pCreationNodeMask, ppPresentQueue);',
            '        if (hr < 0 && !pCreationNodeMask && !ppPresentQueue) {',
            '            hr = origResizeBuffers1(self, 3, width, height, format, swapChainFlags, pCreationNodeMask, ppPresentQueue);',
            '        }',
            '        return hr;',
            '    }',
            '',
            '    void patchSwapChainVtables(void* swapChain) {',
            '        if (!swapChain) return;',
            '        void** scVtbl = *reinterpret_cast<void***>(swapChain);',
            '        hookVtableSlot(scVtbl, 8, reinterpret_cast<void*>(&Hook_SwapChainPresent), reinterpret_cast<void**>(&origPresent));',
            '        hookVtableSlot(scVtbl, 10, reinterpret_cast<void*>(&Hook_SwapChainSetFullscreenState), reinterpret_cast<void**>(&origSetFullscreenState));',
            '        hookVtableSlot(scVtbl, 13, reinterpret_cast<void*>(&Hook_SwapChainResizeBuffers), reinterpret_cast<void**>(&origResizeBuffers));',
            '',
            '        auto qi = reinterpret_cast<PFN_UnknownQueryInterface>(scVtbl[0]);',
            '        if (qi) {',
            '            void* sc1 = nullptr;',
            '            if (qi(swapChain, &kIID_IDXGISwapChain1, &sc1) >= 0 && sc1) {',
            '                void** sc1Vtbl = *reinterpret_cast<void***>(sc1);',
            '                hookVtableSlot(sc1Vtbl, 22, reinterpret_cast<void*>(&Hook_SwapChain1Present1), reinterpret_cast<void**>(&origPresent1));',
            '                comRelease(sc1);',
            '            }',
            '            void* sc3 = nullptr;',
            '            if (qi(swapChain, &kIID_IDXGISwapChain3, &sc3) >= 0 && sc3) {',
            '                void** sc3Vtbl = *reinterpret_cast<void***>(sc3);',
            '                hookVtableSlot(sc3Vtbl, 39, reinterpret_cast<void*>(&Hook_SwapChain3ResizeBuffers1), reinterpret_cast<void**>(&origResizeBuffers1));',
            '                comRelease(sc3);',
            '            }',
            '        }',
            '    }',
            '',
            '    // Hook 7: IDXGIFactory::CreateSwapChain (vtable index 10)',
            '    long __stdcall Hook_FactoryCreateSwapChain(void* self, void* pDevice, DxgiSwapChainDesc* pDesc, void** ppSwapChain) {',
            '        DxgiSwapChainDesc modDesc{};',
            '        DxgiSwapChainDesc* useDesc = pDesc;',
            '        if (pDesc) {',
            '            modDesc = *pDesc;',
            '            modDesc.Flags &= ~0x00000800u; // Strip DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING',
            '            modDesc.Windowed = 1;',
            '            if (modDesc.SwapEffect == 3 || modDesc.SwapEffect == 4) {',
            '                modDesc.SwapEffect = 4;    // DXGI_SWAP_EFFECT_FLIP_DISCARD',
            '                if (modDesc.BufferCount < 4) {',
            '                    modDesc.BufferCount = 4;',
            '                }',
            '            }',
            '            useDesc = &modDesc;',
            '        }',
            '        long hr = origCreateSwapChain(self, pDevice, useDesc, ppSwapChain);',
            '        if (hr < 0 && pDesc) {',
            '            modDesc.BufferCount = 3;',
            '            hr = origCreateSwapChain(self, pDevice, &modDesc, ppSwapChain);',
            '            if (hr < 0) {',
            '                hr = origCreateSwapChain(self, pDevice, pDesc, ppSwapChain);',
            '            }',
            '        }',
            '        if (hr >= 0 && ppSwapChain && *ppSwapChain) {',
            '            patchSwapChainVtables(*ppSwapChain);',
            '            if (pDesc && pDesc->OutputWindow) {',
            '                auto facVtbl = *reinterpret_cast<void***>(self);',
            '                reinterpret_cast<PFN_FactoryMakeWindowAssociation>(facVtbl[8])(self, pDesc->OutputWindow, 1 | 2);',
            '            }',
            '        }',
            '        return hr;',
            '    }',
            '',
            '    // Hook 8: IDXGIFactory2::CreateSwapChainForHwnd (vtable index 15)',
            '    long __stdcall Hook_Factory2CreateSwapChainForHwnd(',
            '        void* self, void* pDevice, HWND hWnd, const DxgiSwapChainDesc1* pDesc,',
            '        const void* pFullscreenDesc, void* pRestrictToOutput, void** ppSwapChain) {',
            '        DxgiSwapChainDesc1 modDesc{};',
            '        const DxgiSwapChainDesc1* useDesc = pDesc;',
            '        if (pDesc) {',
            '            modDesc = *pDesc;',
            '            modDesc.Flags &= ~0x00000800u; // Strip DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING',
            '            if (modDesc.SwapEffect == 3 || modDesc.SwapEffect == 4) {',
            '                modDesc.SwapEffect = 4;    // DXGI_SWAP_EFFECT_FLIP_DISCARD',
            '                if (modDesc.BufferCount < 4) {',
            '                    modDesc.BufferCount = 4;',
            '                }',
            '            }',
            '            useDesc = &modDesc;',
            '        }',
            '        // Pass nullptr for pFullscreenDesc so SwapChain is always Windowed/Borderless DWM-composed',
            '        long hr = origCreateSwapChainForHwnd(self, pDevice, hWnd, useDesc, nullptr, pRestrictToOutput, ppSwapChain);',
            '        if (hr < 0 && pDesc) {',
            '            modDesc.BufferCount = 3;',
            '            hr = origCreateSwapChainForHwnd(self, pDevice, hWnd, &modDesc, nullptr, pRestrictToOutput, ppSwapChain);',
            '            if (hr < 0) {',
            '                hr = origCreateSwapChainForHwnd(self, pDevice, hWnd, pDesc, pFullscreenDesc, pRestrictToOutput, ppSwapChain);',
            '            }',
            '        }',
            '        if (hr >= 0 && ppSwapChain && *ppSwapChain) {',
            '            patchSwapChainVtables(*ppSwapChain);',
            '            if (hWnd) {',
            '                auto facVtbl = *reinterpret_cast<void***>(self);',
            '                reinterpret_cast<PFN_FactoryMakeWindowAssociation>(facVtbl[8])(self, hWnd, 1 | 2);',
            '            }',
            '        }',
            '        return hr;',
            '    }',
            '',
            '    void patchFactoryVtables(void* factory2) {',
            '        if (!factory2) return;',
            '        void** facVtbl = *reinterpret_cast<void***>(factory2);',
            '        hookVtableSlot(facVtbl, 10, reinterpret_cast<void*>(&Hook_FactoryCreateSwapChain), reinterpret_cast<void**>(&origCreateSwapChain));',
            '        hookVtableSlot(facVtbl, 15, reinterpret_cast<void*>(&Hook_Factory2CreateSwapChainForHwnd), reinterpret_cast<void**>(&origCreateSwapChainForHwnd));',
            '',
            '        auto qi = reinterpret_cast<PFN_UnknownQueryInterface>(facVtbl[0]);',
            '        if (qi) {',
            '            void* fac5 = nullptr;',
            '            if (qi(factory2, &kIID_IDXGIFactory5, &fac5) >= 0 && fac5) {',
            '                void** fac5Vtbl = *reinterpret_cast<void***>(fac5);',
            '                hookVtableSlot(fac5Vtbl, 28, reinterpret_cast<void*>(&Hook_Factory5CheckFeatureSupport), reinterpret_cast<void**>(&origCheckFeatureSupport));',
            '                comRelease(fac5);',
            '            }',
            '        }',
            '    }',
            '',
            '    // Step 1: Write Windows 11 SwapEffectUpgradeEnable=1 to HKCU DirectX UserGpuPreferences',
            '    void enableWindows11DirectXFlipUpgrade() {',
            '        wchar_t exePath[MAX_PATH]{};',
            '        if (GetModuleFileNameW(nullptr, exePath, MAX_PATH) == 0) return;',
            '',
            '        HMODULE hAdvapi = GetModuleHandleA("advapi32.dll");',
            '        if (!hAdvapi) hAdvapi = LoadLibraryA("advapi32.dll");',
            '        if (!hAdvapi) return;',
            '',
            '        using PFN_RegCreateKeyExW = long(__stdcall*)(HKEY, const wchar_t*, unsigned long, wchar_t*, unsigned long, unsigned long, const void*, HKEY*, unsigned long*);',
            '        using PFN_RegSetValueExW = long(__stdcall*)(HKEY, const wchar_t*, unsigned long, unsigned long, const uint8_t*, unsigned long);',
            '        using PFN_RegCloseKey = long(__stdcall*)(HKEY);',
            '',
            '        auto pRegCreateKeyExW = reinterpret_cast<PFN_RegCreateKeyExW>(GetProcAddress(hAdvapi, "RegCreateKeyExW"));',
            '        auto pRegSetValueExW = reinterpret_cast<PFN_RegSetValueExW>(GetProcAddress(hAdvapi, "RegSetValueExW"));',
            '        auto pRegCloseKey = reinterpret_cast<PFN_RegCloseKey>(GetProcAddress(hAdvapi, "RegCloseKey"));',
            '',
            '        if (pRegCreateKeyExW && pRegSetValueExW && pRegCloseKey) {',
            '            HKEY hKey = nullptr;',
            '            if (pRegCreateKeyExW(',
            '                    reinterpret_cast<HKEY>(static_cast<uintptr_t>(0x80000001ULL)), // HKEY_CURRENT_USER',
            '                    L"Software\\Microsoft\\DirectX\\UserGpuPreferences",',
            '                    0, nullptr, 0, 0x0002, nullptr, &hKey, nullptr) == 0 && hKey) {',
            '                const wchar_t* val = L"SwapEffectUpgradeEnable=1;GpuPreference=2;";',
            '                unsigned long byteLen = static_cast<unsigned long>(( std::wcslen(val) + 1 ) * sizeof(wchar_t));',
            '                pRegSetValueExW(hKey, exePath, 0, 1, reinterpret_cast<const uint8_t*>(val), byteLen);',
            '                pRegCloseKey(hKey);',
            '            }',
            '        }',
            '    }',
            '',
            '    // Step 2: Enable NVIDIA DXGI Swapchain (0x20D690F8 = 1) & Triple Buffering (0x20FDD1F9 = 1)',
            '    // with exact 12320-byte NVDRS_SETTING_V1 and exact 12296-byte NVDRS_APPLICATION_V1!',
            '    void configureNvidiaDxgiProfileOutsideLoaderLock() {',
            '        bool expected = false;',
            '        if (!nvProfileConfigured.compare_exchange_strong(expected, true)) return;',
            '',
            '        _putenv_s("OGL_CPL_PREFER_DXPRESENT", "1");',
            '        SetEnvironmentVariableA("OGL_CPL_PREFER_DXPRESENT", "1");',
            '        SetEnvironmentVariableW(L"OGL_CPL_PREFER_DXPRESENT", L"1");',
            '',
            '        enableWindows11DirectXFlipUpgrade();',
            '',
            '        HMODULE hNvapi = GetModuleHandleA("nvapi64.dll");',
            '        if (!hNvapi) hNvapi = LoadLibraryA("nvapi64.dll");',
            '        if (!hNvapi) return;',
            '',
            '        using PFN_QueryInterface = void*(__cdecl*)(uint32_t);',
            '        auto queryInterface = reinterpret_cast<PFN_QueryInterface>(GetProcAddress(hNvapi, "nvapi_QueryInterface"));',
            '        if (!queryInterface) return;',
            '',
            '        using PFN_Init = int(__cdecl*)(void);',
            '        using PFN_CreateSession = int(__cdecl*)(void**);',
            '        using PFN_DestroySession = int(__cdecl*)(void*);',
            '        using PFN_LoadSettings = int(__cdecl*)(void*);',
            '        using PFN_SaveSettings = int(__cdecl*)(void*);',
            '        using PFN_GetBaseProfile = int(__cdecl*)(void*, void**);',
            '        using PFN_GetCurrentGlobalProfile = int(__cdecl*)(void*, void**);',
            '        using PFN_FindProfileByName = int(__cdecl*)(void*, const wchar_t*, void**);',
            '        using PFN_FindApplicationByName = int(__cdecl*)(void*, const wchar_t*, void**, void*);',
            '        using PFN_SetSetting = int(__cdecl*)(void*, void*, void*);',
            '',
            '        auto nvInit = reinterpret_cast<PFN_Init>(queryInterface(0x0150E828));',
            '        auto createSession = reinterpret_cast<PFN_CreateSession>(queryInterface(0x0694D52E));',
            '        auto destroySession = reinterpret_cast<PFN_DestroySession>(queryInterface(0xDAD9CFF8));',
            '        auto loadSettings = reinterpret_cast<PFN_LoadSettings>(queryInterface(0x375DBD6B));',
            '        auto saveSettings = reinterpret_cast<PFN_SaveSettings>(queryInterface(0xFCBC7E14));',
            '        auto getBaseProfile = reinterpret_cast<PFN_GetBaseProfile>(queryInterface(0xDA8466A0));',
            '        auto getCurrentGlobalProfile = reinterpret_cast<PFN_GetCurrentGlobalProfile>(queryInterface(0x617BFF9F));',
            '        auto findProfileByName = reinterpret_cast<PFN_FindProfileByName>(queryInterface(0x7E4A9A0B));',
            '        auto findAppByName = reinterpret_cast<PFN_FindApplicationByName>(queryInterface(0xEEE566B2));',
            '        auto setSetting = reinterpret_cast<PFN_SetSetting>(queryInterface(0x577DD202));',
            '',
            '        if (!nvInit || !createSession || !destroySession || !loadSettings || !saveSettings || !getBaseProfile || !setSetting) {',
            '            return;',
            '        }',
            '        if (nvInit() != 0) return;',
            '',
            '        void* hSession = nullptr;',
            '        if (createSession(&hSession) != 0 || !hSession) return;',
            '',
            '        if (loadSettings(hSession) == 0) {',
            '            // Exact 12320-byte NVDRS_SETTING_V1',
            '            struct NvDrsSettingV1Exact {',
            '                uint32_t version;',
            '                uint16_t settingName[2048];',
            '                uint32_t settingId;',
            '                uint32_t settingType;',
            '                uint32_t settingLocation;',
            '                uint32_t isCurrentPredefined;',
            '                uint32_t isPredefinedValid;',
            '                union {',
            '                    uint32_t u32PredefinedValue;',
            '                    uint8_t binaryPredefined[4100];',
            '                };',
            '                union {',
            '                    uint32_t u32CurrentValue;',
            '                    uint8_t binaryCurrent[4100];',
            '                };',
            '            };',
            '            static_assert(sizeof(NvDrsSettingV1Exact) == 12320, "NVDRS_SETTING_V1 must be 12320 bytes");',
            '',
            '            // Exact 12296-byte NVDRS_APPLICATION_V1 (Fixes the 4116-byte bug in v11.0!)',
            '            struct NvDrsApplicationV1Exact {',
            '                uint32_t version;',
            '                uint32_t isPredefined;',
            '                uint16_t appName[2048];',
            '                uint16_t userFriendlyName[2048];',
            '                uint16_t launcher[2048];',
            '            };',
            '            static_assert(sizeof(NvDrsApplicationV1Exact) == 12296, "NVDRS_APPLICATION_V1 must be 12296 bytes");',
            '',
            '            auto applyToProfile = [&](void* hProf) {',
            '                if (!hProf) return;',
            '                NvDrsSettingV1Exact s{};',
            '                s.version = static_cast<uint32_t>(sizeof(NvDrsSettingV1Exact)) | (1u << 16); // 0x00013020',
            '                s.settingType = 0u; // NVDRS_DWORD_TYPE',
            '',
            '                // 1. OGL_CPL_PREFER_DXPRESENT (0x20D690F8) = 1 (Prefer layered on DXGI Swapchain)',
            '                s.settingId = 0x20D690F8u;',
            '                s.u32CurrentValue = 1u;',
            '                s.u32PredefinedValue = 1u;',
            '                setSetting(hSession, hProf, &s);',
            '',
            '                // 2. OGL_TRIPLE_BUFFER (0x20FDD1F9) = 1 (Triple Buffering On)',
            '                s.settingId = 0x20FDD1F9u;',
            '                s.u32CurrentValue = 1u;',
            '                s.u32PredefinedValue = 1u;',
            '                setSetting(hSession, hProf, &s);',
            '',
            '                // 3. VSYNCMODE (0x00A879CF) = 0x60925292 (Use the 3D application setting)',
            '                s.settingId = 0x00A879CFu;',
            '                s.u32CurrentValue = 0x60925292u;',
            '                s.u32PredefinedValue = 0x60925292u;',
            '                setSetting(hSession, hProf, &s);',
            '',
            '                // 4. VSYNCTEARCONTROL (0x5A375C5E) = 0x96861077 (Standard / Disable Adaptive Tearing)',
            '                s.settingId = 0x5A375C5Eu;',
            '                s.u32CurrentValue = 0x96861077u;',
            '                s.u32PredefinedValue = 0x96861077u;',
            '                setSetting(hSession, hProf, &s);',
            '            };',
            '',
            '            void* hBase = nullptr;',
            '            if (getBaseProfile(hSession, &hBase) == 0 && hBase) {',
            '                applyToProfile(hBase);',
            '            }',
            '            if (getCurrentGlobalProfile) {',
            '                void* hGlobal = nullptr;',
            '                if (getCurrentGlobalProfile(hSession, &hGlobal) == 0 && hGlobal) {',
            '                    applyToProfile(hGlobal);',
            '                }',
            '            }',
            '            if (findProfileByName) {',
            '                wchar_t exePath[MAX_PATH]{};',
            '                GetModuleFileNameW(nullptr, exePath, MAX_PATH);',
            '                const wchar_t* candidates[] = {',
            '                    L"Geometry Dash",',
            '                    L"geometrydash.exe",',
            '                    L"GeometryDash.exe",',
            '                    exePath',
            '                };',
            '                for (const wchar_t* name : candidates) {',
            '                    if (name && name[0]) {',
            '                        void* hProf = nullptr;',
            '                        if (findProfileByName(hSession, name, &hProf) == 0 && hProf) {',
            '                            applyToProfile(hProf);',
            '                        }',
            '                    }',
            '                }',
            '            }',
            '            if (findAppByName) {',
            '                const wchar_t* appNames[] = { L"geometrydash.exe", L"GeometryDash.exe" };',
            '                for (const wchar_t* appName : appNames) {',
            '                    void* hAppProf = nullptr;',
            '                    NvDrsApplicationV1Exact appInfo{};',
            '                    appInfo.version = static_cast<uint32_t>(sizeof(NvDrsApplicationV1Exact)) | (1u << 16); // 0x00013008',
            '                    if (findAppByName(hSession, appName, &hAppProf, &appInfo) == 0 && hAppProf) {',
            '                        applyToProfile(hAppProf);',
            '                    }',
            '                }',
            '            }',
            '            saveSettings(hSession);',
            '        }',
            '        destroySession(hSession);',
            '    }',
            '',
            '    // Step 3: Hook dxgi.dll Factory & SwapChain VTables OUTSIDE DllMain Loader Lock!',
            '    void installDxgiHooksOutsideLoaderLock() {',
            '        if (dxgiHooksInstalled.load(std::memory_order_acquire)) return;',
            '',
            '        HMODULE hDxgi = LoadLibraryA("dxgi.dll");',
            '        HMODULE hD3D11 = LoadLibraryA("d3d11.dll");',
            '        if (!hDxgi || !hD3D11) return;',
            '',
            '        using PFN_CreateDXGIFactory1 = long(__stdcall*)(const GUID*, void**);',
            '        using PFN_CreateDXGIFactory2 = long(__stdcall*)(uint32_t, const GUID*, void**);',
            '        using PFN_D3D11CreateDevice = long(__stdcall*)(',
            '            void*, uint32_t, HMODULE, uint32_t, const uint32_t*, uint32_t, uint32_t,',
            '            void**, uint32_t*, void**);',
            '',
            '        auto pCreateDXGIFactory1 = reinterpret_cast<PFN_CreateDXGIFactory1>(GetProcAddress(hDxgi, "CreateDXGIFactory1"));',
            '        auto pCreateDXGIFactory2 = reinterpret_cast<PFN_CreateDXGIFactory2>(GetProcAddress(hDxgi, "CreateDXGIFactory2"));',
            '        auto pD3D11CreateDevice = reinterpret_cast<PFN_D3D11CreateDevice>(GetProcAddress(hD3D11, "D3D11CreateDevice"));',
            '',
            '        void* factory2 = nullptr;',
            '        if (pCreateDXGIFactory1 && pCreateDXGIFactory1(&kIID_IDXGIFactory2, &factory2) >= 0 && factory2) {',
            '            patchFactoryVtables(factory2);',
            '        }',
            '        if (pCreateDXGIFactory2) {',
            '            void* fac2Alt = nullptr;',
            '            if (pCreateDXGIFactory2(0, &kIID_IDXGIFactory2, &fac2Alt) >= 0 && fac2Alt) {',
            '                patchFactoryVtables(fac2Alt);',
            '                comRelease(fac2Alt);',
            '            }',
            '        }',
            '',
            '        if (factory2 && pD3D11CreateDevice && origCreateSwapChainForHwnd) {',
            '            HINSTANCE hInst = GetModuleHandleA(nullptr);',
            '            WNDCLASSEXA wc{};',
            '            wc.cbSize = sizeof(WNDCLASSEXA);',
            '            wc.lpfnWndProc = DefWindowProcA;',
            '            wc.hInstance = hInst;',
            '            wc.lpszClassName = "GeodeNoTearDummyV13";',
            '            RegisterClassExA(&wc);',
            '',
            '            HWND dummyHwnd = CreateWindowExA(',
            '                0, "GeodeNoTearDummyV13", "", 0x80000000L, // WS_POPUP',
            '                0, 0, 64, 64, nullptr, nullptr, hInst, nullptr',
            '            );',
            '            if (dummyHwnd) {',
            '                void* dummyDev = nullptr;',
            '                void* dummyCtx = nullptr;',
            '                uint32_t flOut = 0;',
            '                if (pD3D11CreateDevice(nullptr, 1, nullptr, 0x20, nullptr, 0, 7, &dummyDev, &flOut, &dummyCtx) >= 0 && dummyDev) {',
            '                    DxgiSwapChainDesc1 scd1{};',
            '                    scd1.Width = 64;',
            '                    scd1.Height = 64;',
            '                    scd1.Format = 87;          // DXGI_FORMAT_B8G8R8A8_UNORM',
            '                    scd1.SampleDesc.Count = 1;',
            '                    scd1.BufferUsage = 0x20;   // DXGI_USAGE_RENDER_TARGET_OUTPUT',
            '                    scd1.BufferCount = 3;',
            '                    scd1.Scaling = 0;          // DXGI_SCALING_STRETCH',
            '                    scd1.SwapEffect = 4;       // DXGI_SWAP_EFFECT_FLIP_DISCARD',
            '                    scd1.AlphaMode = 3;        // DXGI_ALPHA_MODE_IGNORE',
            '                    scd1.Flags = 0;',
            '',
            '                    void* dummySc = nullptr;',
            '                    long hr = origCreateSwapChainForHwnd(factory2, dummyDev, dummyHwnd, &scd1, nullptr, nullptr, &dummySc);',
            '                    if (hr < 0 || !dummySc) {',
            '                        scd1.SwapEffect = 3;   // DXGI_SWAP_EFFECT_FLIP_SEQUENTIAL',
            '                        hr = origCreateSwapChainForHwnd(factory2, dummyDev, dummyHwnd, &scd1, nullptr, nullptr, &dummySc);',
            '                    }',
            '                    if (hr >= 0 && dummySc) {',
            '                        patchSwapChainVtables(dummySc);',
            '                        comRelease(dummySc);',
            '                    }',
            '                    comRelease(dummyCtx);',
            '                    comRelease(dummyDev);',
            '                }',
            '                DestroyWindow(dummyHwnd);',
            '            }',
            '        }',
            '        comRelease(factory2);',
            '',
            '        if (origPresent != nullptr) {',
            '            dxgiHooksInstalled.store(true, std::memory_order_release);',
            '        }',
            '    }',
            '',
            '    void initializeOutsideLoaderLock() {',
            '        using PFN_timeBeginPeriod = unsigned int(__stdcall*)(unsigned int);',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto pTimeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"))) {',
            '                pTimeBegin(1);',
            '            }',
            '        }',
            '        // IMPORTANT: Configure NVIDIA DRS Profile FIRST before loading d3d11.dll/nvldumdx.dll!',
            '        configureNvidiaDxgiProfileOutsideLoaderLock();',
            '        installDxgiHooksOutsideLoaderLock();',
            '    }',
            '',
            '    // Runtime lightweight window & WGL setup (runs once when HWND is created, 0.00ms on subsequent frames)',
            '    using PFN_wglGetProcAddress = void*(__stdcall*)(const char*);',
            '    using PFN_wglGetCurrentDC = HDC(__stdcall*)(void);',
            '    using PFN_wglGetCurrentContext = HGLRC(__stdcall*)(void);',
            '    using PFN_wglMakeCurrent = int(__stdcall*)(HDC, HGLRC);',
            '    using PFN_wglSwapIntervalEXT = int(__stdcall*)(int);',
            '    using PFN_ChangeDisplaySettingsA = long(__stdcall*)(void*, unsigned long);',
            '    using PFN_DwmExtendFrameIntoClientArea = long(__stdcall*)(HWND, const DwmMargins*);',
            '',
            '    PFN_wglGetProcAddress pGetProcAddress = nullptr;',
            '    PFN_wglGetCurrentDC pGetCurrentDC = nullptr;',
            '    PFN_wglGetCurrentContext pGetCurrentContext = nullptr;',
            '    PFN_wglMakeCurrent pMakeCurrent = nullptr;',
            '    PFN_wglSwapIntervalEXT pSwapInterval = nullptr;',
            '    PFN_ChangeDisplaySettingsA pChangeDisplaySettingsA = nullptr;',
            '    PFN_DwmExtendFrameIntoClientArea pDwmExtendFrame = nullptr;',
            '',
            '    bool glApisResolved = false;',
            '    HWND configuredHwnd = nullptr;',
            '    HWND compositionAnchorHwnd = nullptr;',
            '    int appliedInterval = -999;',
            '    uint32_t frameCount = 0;',
            '    bool rebindAttempted = false;',
            '',
            '    void onPreSwapBuffers() {',
            '        if (!dxgiHooksInstalled.load(std::memory_order_acquire)) {',
            '            initializeOutsideLoaderLock();',
            '        }',
            '',
            '        if (!glApisResolved) {',
            '            glApisResolved = true;',
            '            if (HMODULE hGl = GetModuleHandleA("opengl32.dll")) {',
            '                pGetCurrentDC = reinterpret_cast<PFN_wglGetCurrentDC>(GetProcAddress(hGl, "wglGetCurrentDC"));',
            '                pGetCurrentContext = reinterpret_cast<PFN_wglGetCurrentContext>(GetProcAddress(hGl, "wglGetCurrentContext"));',
            '                pMakeCurrent = reinterpret_cast<PFN_wglMakeCurrent>(GetProcAddress(hGl, "wglMakeCurrent"));',
            '                pGetProcAddress = reinterpret_cast<PFN_wglGetProcAddress>(GetProcAddress(hGl, "wglGetProcAddress"));',
            '            }',
            '            if (HMODULE hUser = GetModuleHandleA("user32.dll")) {',
            '                pChangeDisplaySettingsA = reinterpret_cast<PFN_ChangeDisplaySettingsA>(GetProcAddress(hUser, "ChangeDisplaySettingsA"));',
            '            }',
            '            if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '                pDwmExtendFrame = reinterpret_cast<PFN_DwmExtendFrameIntoClientArea>(GetProcAddress(hDwm, "DwmExtendFrameIntoClientArea"));',
            '            }',
            '        }',
            '',
            '        if (!pSwapInterval && pGetProcAddress) {',
            '            pSwapInterval = reinterpret_cast<PFN_wglSwapIntervalEXT>(pGetProcAddress("wglSwapIntervalEXT"));',
            '        }',
            '',
            '        if (pGetCurrentDC) {',
            '            if (HDC hdc = pGetCurrentDC()) {',
            '                HWND hwnd = WindowFromDC(hdc);',
            '                if (hwnd && hwnd != configuredHwnd) {',
            '                    configuredHwnd = hwnd;',
            '                    appliedInterval = -999;',
            '',
            '                    // 1. Exit legacy Exclusive Fullscreen so DWM Composed Flip-Discard works on 60Hz Optimus',
            '                    HMONITOR hMon = MonitorFromWindow(hwnd, MONITOR_DEFAULTTONEAREST);',
            '                    MONITORINFO mi{};',
            '                    mi.cbSize = sizeof(MONITORINFO);',
            '                    if (GetMonitorInfoA(hMon, &mi)) {',
            '                        RECT wr{};',
            '                        if (GetWindowRect(hwnd, &wr)) {',
            '                            int monW = mi.rcMonitor.right - mi.rcMonitor.left;',
            '                            int monH = mi.rcMonitor.bottom - mi.rcMonitor.top;',
            '                            if ((wr.right - wr.left) >= monW - 4 && (wr.bottom - wr.top) >= monH - 4) {',
            '                                if (pChangeDisplaySettingsA) {',
            '                                    pChangeDisplaySettingsA(nullptr, 0);',
            '                                }',
            '                                LONG_PTR style = GetWindowLongPtrA(hwnd, GWL_STYLE);',
            '                                style &= ~(WS_CAPTION | WS_THICKFRAME | WS_MINIMIZEBOX | WS_MAXIMIZEBOX | WS_SYSMENU);',
            '                                style |= WS_POPUP | WS_VISIBLE;',
            '                                SetWindowLongPtrA(hwnd, GWL_STYLE, style);',
            '                                SetWindowPos(',
            '                                    hwnd, HWND_TOP,',
            '                                    mi.rcMonitor.left, mi.rcMonitor.top,',
            '                                    monW, monH,',
            '                                    SWP_NOOWNERZORDER | SWP_NOACTIVATE | SWP_FRAMECHANGED | SWP_SHOWWINDOW',
            '                                );',
            '                            }',
            '                        }',
            '                    }',
            '',
            '                    if (pDwmExtendFrame) {',
            '                        DwmMargins margins{-1, -1, -1, -1};',
            '                        pDwmExtendFrame(hwnd, &margins);',
            '                    }',
            '',
            '                    // 2. Attach 1x1 invisible click-through layered anchor at (0,0) so Windows 11 DWM',
            '                    // keeps the 4-buffer DXGI Flip-Discard SwapChain in tear-free DWM Composed Flip mode',
            '                    if (compositionAnchorHwnd && IsWindow(compositionAnchorHwnd)) {',
            '                        DestroyWindow(compositionAnchorHwnd);',
            '                        compositionAnchorHwnd = nullptr;',
            '                    }',
            '                    compositionAnchorHwnd = CreateWindowExA(',
            '                        0x00080000L | 0x00000020L | 0x00000080L | 0x08000000L,',
            '                        "STATIC", "", 0x80000000L,',
            '                        0, 0, 1, 1, hwnd, nullptr, GetModuleHandleA(nullptr), nullptr',
            '                    );',
            '                    if (compositionAnchorHwnd) {',
            '                        SetLayeredWindowAttributes(compositionAnchorHwnd, 0, 1, 0x00000002);',
            '                        ShowWindow(compositionAnchorHwnd, 4);',
            '                    }',
            '                }',
            '',
            '                // If on the very first run nvoglv64.dll bound the context before DXGI hooks settled,',
            '                // perform a one-time WGL context rebind on frame 3 to trigger DXGI SwapChain creation',
            '                if (++frameCount == 3 && !rebindAttempted && dxgiPresentsIntercepted.load(std::memory_order_relaxed) == 0) {',
            '                    rebindAttempted = true;',
            '                    if (pGetCurrentContext && pMakeCurrent) {',
            '                        if (HGLRC hglrc = pGetCurrentContext()) {',
            '                            pMakeCurrent(nullptr, nullptr);',
            '                            pMakeCurrent(hdc, hglrc);',
            '                        }',
            '                    }',
            '                }',
            '            }',
            '        }',
            '',
            '        // Keep wglSwapIntervalEXT(0) so the main thread runs at 100% full Unlock FPS (0.00ms wait);',
            '        // Hook_SwapChainPresent strips ALLOW_TEARING so the 4-buffer DXGI Flip-Discard SwapChain never tears!',
            '        if (pSwapInterval && appliedInterval != 0) {',
            '            pSwapInterval(0);',
            '            appliedInterval = 0;',
            '        }',
            '    }',
            '    #endif',
            '}',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    static void onModify(auto& self) {',
            '        (void)self.setHookPriority("cocos2d::CCEGLView::swapBuffers", 1000000);',
            '    }',
            '',
            '    void swapBuffers() {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        PureNoTearV13::onPreSwapBuffers();',
            '        #endif',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    // Safely executes outside the Windows Loader Lock BEFORE Geometry Dash creates CCEGLView!',
            '    _putenv_s("OGL_CPL_PREFER_DXPRESENT", "1");',
            '    SetEnvironmentVariableA("OGL_CPL_PREFER_DXPRESENT", "1");',
            '    SetEnvironmentVariableW(L"OGL_CPL_PREFER_DXPRESENT", L"1");',
            '    PureNoTearV13::initializeOutsideLoaderLock();',
            '    #endif',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod for GD 2.2081 (Geode SDK v5.11.2)
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2

      - name: Verify and Package Complete .geode Archive for GD 2.2081
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null

          $geodeCandidate = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.geode" -Recurse |
                            Sort-Object Length -Descending |
                            Select-Object -First 1

          if (-not $geodeCandidate) {
            Write-Error "No .geode file found in build directory!"
            exit 1
          }

          $destGeode = Join-Path $PWD "artifact\yingseo.notear-fps-22081.geode"
          Copy-Item -Path $geodeCandidate.FullName -Destination $destGeode -Force

          $zip = [System.IO.Compression.ZipFile]::Open($destGeode, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $hasDll = $false
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -like "*.dll" -and $entry.Length -gt 4096) {
                $hasDll = $true
              }
            }

            if (-not $hasDll) {
              $dllFile = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.dll" -Recurse |
                         Where-Object { $_.Name -like "*NoTear*" -or $_.Name -like "*yingseo*" } |
                         Sort-Object Length -Descending |
                         Select-Object -First 1
              if ($dllFile) {
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $dllFile.FullName, "yingseo.notear-fps-22081.dll") | Out-Null
              }
            }

            foreach ($asset in @("mod.json", "logo.png", "about.md", "changelog.md")) {
              $assetPath = Join-Path $PWD $asset
              if (Test-Path $assetPath) {
                $existing = $zip.GetEntry($asset)
                if ($existing) { $existing.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $assetPath, $asset) | Out-Null
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-GD-2.2081-v13.0.0
          path: artifact/*.geode
