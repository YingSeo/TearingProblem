name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build (GD 2.2081)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Icon, Config & Anti-Tear Source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          if (-not (Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" -Force | Out-Null
          }
          if (Test-Path "main.cpp") {
            Remove-Item -Path "main.cpp" -Force
          }

          # 1. Lay phien ban Geode SDK moi nhat de khong bao gio bi Outdated
          $headers = @{ "User-Agent" = "GeodeModBuilder" }
          if ($env:GH_TOKEN) { $headers["Authorization"] = "Bearer $env:GH_TOKEN" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/geode/releases/latest" -Headers $headers
          $sdkVer = $release.tag_name.TrimStart('v')
          Write-Host "Target Geode SDK Version: $sdkVer"

          # 2. Tu dong ve Icon logo.png (256x256) dep mat cho Mod
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(256, 256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
          $g.Clear([System.Drawing.Color]::FromArgb(255, 12, 16, 28))

          # Vien khung Neon Cyan & Indigo
          $penOuter = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 0, 229, 255), 8)
          $penInner = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 98, 0, 234), 4)
          $g.DrawRectangle($penOuter, 16, 16, 224, 224)
          $g.DrawRectangle($penInner, 28, 28, 200, 200)

          # Bieu tuong tia dong bo VBlank xoa vet xe ngang
          $penWave = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 0, 255, 200), 7)
          $g.DrawLine($penWave, 44, 128, 96, 128)
          $g.DrawLine($penWave, 96, 128, 116, 78)
          $g.DrawLine($penWave, 116, 78, 140, 178)
          $g.DrawLine($penWave, 140, 178, 160, 128)
          $g.DrawLine($penWave, 160, 128, 212, 128)

          $fontTitle = New-Object System.Drawing.Font("Segoe UI", 22, [System.Drawing.FontStyle]::Bold)
          $fontSub = New-Object System.Drawing.Font("Segoe UI", 13, [System.Drawing.FontStyle]::Bold)
          $brushCyan = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 0, 229, 255))
          $brushWhite = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 240, 248, 255))
          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center

          $g.DrawString("NO TEAR", $fontTitle, $brushWhite, [System.Drawing.RectangleF]::new(0, 38, 256, 45), $sf)
          $g.DrawString("V-SYNC UNLOCK", $fontSub, $brushCyan, [System.Drawing.RectangleF]::new(0, 188, 256, 35), $sf)

          $g.Dispose()
          $bmp.Save((Join-Path $PWD "logo.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

          # 3. Tao mod.json (Khong menu, khong nut bam, tu dong kich hoat)
          $modData = [ordered]@{
            geode       = $sdkVer
            gd          = @{ win = "2.2081" }
            id          = "yingseo.notear-fps"
            name        = "NoTear FPS"
            version     = "v1.0.0"
            developer   = "YingSeo"
            description = "Tu dong fix soc nhieu va xe man hinh (Screen Tearing) khi bat Unlock FPS trong Geometry Dash 2.2081."
          }
          $modJsonStr = $modData | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $PWD "mod.json"), $modJsonStr, $utf8NoBom)

          # 4. Tao CMakeLists.txt chuan C++23
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_EXTENSIONS OFF)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            'project(NoTearFPS VERSION 1.0.0)',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            'if (WIN32)',
            '    target_link_libraries(${PROJECT_NAME} PRIVATE opengl32 dwmapi user32 gdi32 winmm)',
            'endif()',
            'setup_geode_mod(${PROJECT_NAME})'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "CMakeLists.txt"), $cmakeLines, $utf8NoBom)

          # 5. Tao src/main.cpp (Day du #include <Windows.h> va <dwmapi.h>, chi fix Tear Screen)
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCDirector.hpp>',
            '#include <Geode/modify/CCScheduler.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '',
            '#ifdef GEODE_IS_WINDOWS',
            '#ifndef WIN32_LEAN_AND_MEAN',
            '#define WIN32_LEAN_AND_MEAN',
            '#endif',
            '#ifndef NOMINMAX',
            '#define NOMINMAX',
            '#endif',
            '#include <Windows.h>',
            '#include <dwmapi.h>',
            '#endif',
            '',
            'using namespace geode::prelude;',
            '',
            'namespace TearFix {',
            '    bool shouldPresentFrame = true;',
            '    cocos2d::CCScene* hiddenScene = nullptr;',
            '    bool savedVisibility = true;',
            '',
            '    #ifdef GEODE_IS_WINDOWS',
            '    LARGE_INTEGER qpcFreq{};',
            '    LARGE_INTEGER lastPresentQpc{};',
            '    int64_t refreshPeriodTicks = 0;',
            '    int64_t lastVBlankCycle = -1;',
            '    bool initialized = false;',
            '',
            '    using PFNWGLSWAPINTERVALEXTPROC = BOOL(WINAPI*)(int);',
            '    using PFNWGLGETPROCADDRESS = PROC(WINAPI*)(LPCSTR);',
            '    using PFNTIMEBEGINPERIOD = UINT(WINAPI*)(UINT);',
            '',
            '    PFNWGLSWAPINTERVALEXTPROC pSwapInterval = nullptr;',
            '    bool glInitialized = false;',
            '',
            '    void init() {',
            '        if (initialized) return;',
            '        initialized = true;',
            '',
            '        QueryPerformanceFrequency(&qpcFreq);',
            '        QueryPerformanceCounter(&lastPresentQpc);',
            '',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto pTimeBegin = reinterpret_cast<PFNTIMEBEGINPERIOD>(GetProcAddress(hWinmm, "timeBeginPeriod"))) {',
            '                pTimeBegin(1);',
            '            }',
            '        }',
            '',
            '        DEVMODEA dm{};',
            '        dm.dmSize = sizeof(DEVMODEA);',
            '        double hz = 60.0;',
            '        if (EnumDisplaySettingsA(nullptr, ENUM_CURRENT_SETTINGS, &dm) && dm.dmDisplayFrequency >= 30) {',
            '            hz = static_cast<double>(dm.dmDisplayFrequency);',
            '        }',
            '        refreshPeriodTicks = static_cast<int64_t>(static_cast<double>(qpcFreq.QuadPart) / hz);',
            '    }',
            '',
            '    bool evaluatePresentTick(float dt) {',
            '        init();',
            '',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '',
            '        DWM_TIMING_INFO timing{};',
            '        timing.cbSize = sizeof(DWM_TIMING_INFO);',
            '        if (SUCCEEDED(DwmGetCompositionTimingInfo(nullptr, &timing)) && timing.qpcRefreshPeriod > 0) {',
            '            refreshPeriodTicks = static_cast<int64_t>(timing.qpcRefreshPeriod);',
            '            int64_t period = refreshPeriodTicks;',
            '            int64_t origin = static_cast<int64_t>(timing.qpcVBlank) % period;',
            '            int64_t currentCycle = (now.QuadPart - origin) / period;',
            '',
            '            if (currentCycle > lastVBlankCycle) {',
            '                lastVBlankCycle = currentCycle;',
            '                lastPresentQpc = now;',
            '                return true;',
            '            }',
            '            return false;',
            '        }',
            '',
            '        if (now.QuadPart - lastPresentQpc.QuadPart >= refreshPeriodTicks) {',
            '            lastPresentQpc.QuadPart += refreshPeriodTicks;',
            '            if (now.QuadPart - lastPresentQpc.QuadPart >= refreshPeriodTicks) {',
            '                lastPresentQpc = now;',
            '            }',
            '            return true;',
            '        }',
            '        return false;',
            '    }',
            '',
            '    void alignVBlankBeforeSwap() {',
            '        if (!glInitialized) {',
            '            glInitialized = true;',
            '            if (HMODULE hGl = GetModuleHandleA("opengl32.dll")) {',
            '                if (auto pGetProc = reinterpret_cast<PFNWGLGETPROCADDRESS>(GetProcAddress(hGl, "wglGetProcAddress"))) {',
            '                    pSwapInterval = reinterpret_cast<PFNWGLSWAPINTERVALEXTPROC>(pGetProc("wglSwapIntervalEXT"));',
            '                }',
            '            }',
            '        }',
            '',
            '        if (pSwapInterval) {',
            '            pSwapInterval(0);',
            '        }',
            '',
            '        DWM_TIMING_INFO timing{};',
            '        timing.cbSize = sizeof(DWM_TIMING_INFO);',
            '        if (SUCCEEDED(DwmGetCompositionTimingInfo(nullptr, &timing)) && timing.qpcRefreshPeriod > 0) {',
            '            LARGE_INTEGER now{};',
            '            QueryPerformanceCounter(&now);',
            '            int64_t period = static_cast<int64_t>(timing.qpcRefreshPeriod);',
            '            int64_t target = static_cast<int64_t>(timing.qpcVBlank);',
            '            if (now.QuadPart > target) {',
            '                int64_t elapsed = (now.QuadPart - target) / period + 1;',
            '                target += elapsed * period;',
            '            }',
            '            int64_t remTicks = target - now.QuadPart;',
            '            double remMs = (static_cast<double>(remTicks) * 1000.0) / static_cast<double>(qpcFreq.QuadPart);',
            '            if (remMs > 0.0 && remMs < 1.2) {',
            '                while (true) {',
            '                    QueryPerformanceCounter(&now);',
            '                    if (now.QuadPart >= target) break;',
            '                    YieldProcessor();',
            '                }',
            '            }',
            '        }',
            '    }',
            '    #endif',
            '',
            '    void restoreHiddenScene() {',
            '        if (hiddenScene != nullptr) {',
            '            hiddenScene->setVisible(savedVisibility);',
            '            hiddenScene = nullptr;',
            '        }',
            '    }',
            '}',
            '',
            'class $modify(TearFixDirector, cocos2d::CCDirector) {',
            '    void drawScene() {',
            '        TearFix::restoreHiddenScene();',
            '        CCDirector::drawScene();',
            '        TearFix::restoreHiddenScene();',
            '    }',
            '};',
            '',
            'class $modify(TearFixScheduler, cocos2d::CCScheduler) {',
            '    void update(float dt) {',
            '        CCScheduler::update(dt);',
            '',
            '        #ifdef GEODE_IS_WINDOWS',
            '        TearFix::shouldPresentFrame = TearFix::evaluatePresentTick(dt);',
            '        if (!TearFix::shouldPresentFrame) {',
            '            if (auto* dir = cocos2d::CCDirector::sharedDirector()) {',
            '                if (auto* scene = dir->getRunningScene()) {',
            '                    TearFix::savedVisibility = scene->isVisible();',
            '                    scene->setVisible(false);',
            '                    TearFix::hiddenScene = scene;',
            '                }',
            '            }',
            '        }',
            '        #endif',
            '    }',
            '};',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    void swapBuffers() {',
            '        TearFix::restoreHiddenScene();',
            '',
            '        if (!TearFix::shouldPresentFrame) {',
            '            return;',
            '        }',
            '',
            '        #ifdef GEODE_IS_WINDOWS',
            '        TearFix::alignVBlankBeforeSwap();',
            '        #endif',
            '',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    TearFix::init();',
            '    #endif',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: latest
          config: Release

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-2.2081
          path: ${{ steps.build.outputs.build-output }}
