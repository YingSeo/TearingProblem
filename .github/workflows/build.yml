            '',
            '    void cleanAllNvidiaProfiles() {',
            '        _putenv_s("OGL_CPL_PREFER_DXPRESENT", "0");',
            '        SetEnvironmentVariableA("OGL_CPL_PREFER_DXPRESENT", "0");',
            '        SetEnvironmentVariableW(L"OGL_CPL_PREFER_DXPRESENT", L"0");',
            '',
            '        HMODULE hNvapi = GetModuleHandleA("nvapi64.dll");',
            '        if (!hNvapi) hNvapi = LoadLibraryA("nvapi64.dll");',
