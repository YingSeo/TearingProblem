name: Build Geode Mod (GD 2.2081)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build (GD 2.2081 - Geode v5.11.2)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Icon, Metadata, CMake and v9.0 Zero-Lag Safe-Zone Source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          if (-not (Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" -Force | Out-Null
          }
          if (Test-Path "main.cpp") {
            Remove-Item -Path "main.cpp" -Force
          }

          # 1. Tao Icon 256x256 RGBA PNG (logo.png)
          $logoPath = Join-Path $PWD "logo.png"
          $csCode = @'
          using System;
          using System.Drawing;
          using System.Drawing.Drawing2D;
          using System.Drawing.Imaging;
          using System.Drawing.Text;

          public static class IconBuilder {
              public static void Build(string path) {
                  using (Bitmap bmp = new Bitmap(256, 256, PixelFormat.Format32bppArgb))
                  using (Graphics g = Graphics.FromImage(bmp)) {
                      g.SmoothingMode = SmoothingMode.AntiAlias;
                      g.TextRenderingHint = TextRenderingHint.AntiAliasGridFit;
                      g.Clear(Color.FromArgb(255, 10, 14, 26));

                      using (LinearGradientBrush bg = new LinearGradientBrush(
                          new Rectangle(16, 16, 224, 224),
                          Color.FromArgb(255, 14, 36, 76),
                          Color.FromArgb(255, 8, 12, 24),
                          45f)) {
                          g.FillRectangle(bg, 16, 16, 224, 224);
                      }

                      using (Pen pCyan = new Pen(Color.FromArgb(255, 0, 229, 255), 8f))
                      using (Pen pPurple = new Pen(Color.FromArgb(255, 124, 77, 255), 4f))
                      using (Pen pGreen = new Pen(Color.FromArgb(255, 0, 255, 170), 7f)) {
                          g.DrawRectangle(pCyan, 16, 16, 224, 224);
                          g.DrawRectangle(pPurple, 28, 28, 200, 200);

                          Point[] pulse = new Point[] {
                              new Point(42, 128),
                              new Point(92, 128),
                              new Point(112, 74),
                              new Point(144, 182),
                              new Point(164, 128),
                              new Point(214, 128)
                          };
                          g.DrawLines(pGreen, pulse);
                      }

                      using (Font f1 = new Font("Arial", 22f, FontStyle.Bold))
                      using (Font f2 = new Font("Arial", 13f, FontStyle.Bold))
                      using (SolidBrush bWhite = new SolidBrush(Color.FromArgb(255, 245, 250, 255)))
                      using (SolidBrush bCyan = new SolidBrush(Color.FromArgb(255, 0, 229, 255)))
                      using (StringFormat sf = new StringFormat()) {
                          sf.Alignment = StringAlignment.Center;
                          g.DrawString("NO TEAR", f1, bWhite, new RectangleF(0f, 36f, 256f, 44f), sf);
                          g.DrawString("FAST V9.0", f2, bCyan, new RectangleF(0f, 186f, 256f, 36f), sf);
                      }

                      bmp.Save(path, ImageFormat.Png);
                  }
              }
          }
          '@
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition $csCode
          [IconBuilder]::Build($logoPath)

          # 2. Tao about.md
          $aboutLines = @(
            '# <cy>NoTear FPS v9.0 (Zero-Copy Safe-Zone Engine)</c>',
            '',
            'Eliminates **screen tearing (horizontal glitch lines)** when **Unlock FPS** is enabled in **Geometry Dash 2.2081** with **zero lag and zero FPS drops**.',
            '',
            '### <cg>v9.0 Highlights:</c>',
            '- **Zero-Copy Post-VBlank Safe-Zone Gate:** Presents strictly once right after DWM finishes its VBlank scanout pass so the front buffer is 100% stationary when sampled.',
            '- **Native Driver DXGI Swapchain + DWM Composed Mode:** Enables native driver DXGI layering (`0x20D690F8`) and blocks tearing Direct-Flip via an invisible 1x1 layered composition anchor.',
            '- **0.00ms Main-Thread Overhead:** Removed all D3D11/PBO texture copies and `glFinish()` stalls — 100% compatible with **Bismuth**, CBF, Mega Hack, Eclipse, and Globed.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "about.md"), $aboutLines, $utf8NoBom)

          # 3. Tao changelog.md
          $changelogLines = @(
            '# v9.0.0 (For GD 2.2081)',
            '- Fixed severe game lag caused by v8.0 D3D11/PBO frame copying and multithread device locks.',
            '- Switched to a Zero-Copy Post-VBlank Safe-Zone Gate that flips immediately after DwmFlush() with 0.00ms main-thread overhead.',
            '- Re-enabled native NVIDIA DXGI Swapchain layering (0x20D690F8 = 1) + 1x1 DWM composition anchor to block tearing Direct-Flip.'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "changelog.md"), $changelogLines, $utf8NoBom)

          # 4. Tao mod.json khoa cung cho Geode 5.11.2 va GD 2.2081
          $modJsonLines = @(
            '{',
            '    "geode": "5.11.2",',
            '    "gd": {',
            '        "win": "2.2081"',
            '    },',
            '    "id": "yingseo.notear-fps-22081",',
            '    "name": "NoTear FPS",',
            '    "version": "v9.0.0",',
            '    "developer": "YingSeo",',
            '    "description": "Zero-lag, zero-copy VBlank Safe-Zone synchronizer that eliminates screen tearing on Unlock FPS.",',
            '    "early-load": true,',
            '    "tags": [',
            '        "performance",',
            '        "enhancement",',
            '        "universal"',
            '    ]',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "mod.json"), $modJsonLines, $utf8NoBom)

          # 5. Tao CMakeLists.txt
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 23)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_CXX_EXTENSIONS OFF)',
            'set(CMAKE_CXX_VISIBILITY_PRESET hidden)',
            '',
            'project(NoTearFPS VERSION 9.0.0)',
            '',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            '',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            '',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            'setup_geode_mod(${PROJECT_NAME})'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "CMakeLists.txt"), $cmakeLines, $utf8NoBom)

          # 6. Tao src/main.cpp (Zero-Copy Post-VBlank Safe-Zone Gate + DWM Composition Anchor + Native DXGI Profile)
          $cppLines = @(
            '#include <Geode/Geode.hpp>',
            '#include <Geode/modify/CCEGLView.hpp>',
            '#include <atomic>',
            '#include <thread>',
            '#include <chrono>',
            '#include <cstdlib>',
            '#include <cstdint>',
            '',
            'using namespace geode::prelude;',
            '',
            'namespace ZeroLagNoTearV9 {',
            '    struct DwmMargins {',
            '        int cxLeftWidth;',
            '        int cxRightWidth;',
            '        int cyTopHeight;',
            '        int cyBottomHeight;',
            '    };',
            '',
            '    std::atomic<uint64_t> vblankTicket{1};',
            '    std::atomic<int64_t> lastVBlankEdgeQpc{0};',
            '    std::atomic<int64_t> refreshPeriodQpc{0};',
            '    std::atomic<bool> workerRunning{false};',
            '',
            '    uint64_t lastPresentedTicket = 0;',
            '    int64_t qpcFreq = 0;',
            '    int64_t lastCallQpc = 0;',
            '    int64_t lastPresentQpc = 0;',
            '    int64_t avgCallIntervalQpc = 0;',
            '',
            '    #ifdef GEODE_IS_WINDOWS',
            '    using PFN_timeBeginPeriod = unsigned int(__stdcall*)(unsigned int);',
            '    using PFN_DwmFlush = long(__stdcall*)(void);',
            '    using PFN_DwmExtendFrameIntoClientArea = long(__stdcall*)(HWND, const DwmMargins*);',
            '    using PFN_ChangeDisplaySettingsA = long(__stdcall*)(void*, unsigned long);',
            '    using PFN_GetDeviceCaps = int(__stdcall*)(HDC, int);',
            '    using PFN_wglGetProcAddress = void*(__stdcall*)(const char*);',
            '    using PFN_wglGetCurrentDC = HDC(__stdcall*)(void);',
            '    using PFN_wglSwapIntervalEXT = int(__stdcall*)(int);',
            '    using PFN_glFlush = void(__stdcall*)(void);',
            '',
            '    PFN_DwmExtendFrameIntoClientArea pDwmExtendFrame = nullptr;',
            '    PFN_ChangeDisplaySettingsA pChangeDisplaySettingsA = nullptr;',
            '    PFN_GetDeviceCaps pGetDeviceCaps = nullptr;',
            '    PFN_wglGetProcAddress pGetProcAddress = nullptr;',
            '    PFN_wglGetCurrentDC pGetCurrentDC = nullptr;',
            '    PFN_wglSwapIntervalEXT pSwapInterval = nullptr;',
            '    PFN_glFlush pGlFlush = nullptr;',
            '',
            '    bool apisResolved = false;',
            '    HWND configuredHwnd = nullptr;',
            '    HWND compositionAnchorHwnd = nullptr;',
            '    int appliedSwapInterval = -999;',
            '',
            '    // Enable NVIDIA native "Prefer layered on DXGI Swapchain" (0x20D690F8 = 1) in driver profile',
            '    void enableNvidiaNativeDxgiProfile() {',
            '        _putenv_s("OGL_CPL_PREFER_DXPRESENT", "1");',
            '        SetEnvironmentVariableA("OGL_CPL_PREFER_DXPRESENT", "1");',
            '',
            '        HMODULE hNvapi = GetModuleHandleA("nvapi64.dll");',
            '        if (!hNvapi) hNvapi = LoadLibraryA("nvapi64.dll");',
            '        if (!hNvapi) return;',
            '',
            '        using PFN_QueryInterface = void*(__cdecl*)(uint32_t);',
            '        auto queryInterface = reinterpret_cast<PFN_QueryInterface>(GetProcAddress(hNvapi, "nvapi_QueryInterface"));',
            '        if (!queryInterface) return;',
            '',
            '        using PFN_Init = int(__cdecl*)(void);',
            '        using PFN_CreateSession = int(__cdecl*)(void**);',
            '        using PFN_DestroySession = int(__cdecl*)(void*);',
            '        using PFN_LoadSettings = int(__cdecl*)(void*);',
            '        using PFN_SaveSettings = int(__cdecl*)(void*);',
            '        using PFN_GetBaseProfile = int(__cdecl*)(void*, void**);',
            '        using PFN_SetSetting = int(__cdecl*)(void*, void*, void*);',
            '',
            '        auto nvInit = reinterpret_cast<PFN_Init>(queryInterface(0x0150E828));',
            '        auto createSession = reinterpret_cast<PFN_CreateSession>(queryInterface(0x0694D52E));',
            '        auto destroySession = reinterpret_cast<PFN_DestroySession>(queryInterface(0xDAD9CFF8));',
            '        auto loadSettings = reinterpret_cast<PFN_LoadSettings>(queryInterface(0x375DBD6B));',
            '        auto saveSettings = reinterpret_cast<PFN_SaveSettings>(queryInterface(0xFCBC7E14));',
            '        auto getBaseProfile = reinterpret_cast<PFN_GetBaseProfile>(queryInterface(0xDA8466A0));',
            '        auto setSetting = reinterpret_cast<PFN_SetSetting>(queryInterface(0x577DD202));',
            '',
            '        if (!nvInit || !createSession || !destroySession || !loadSettings || !saveSettings || !getBaseProfile || !setSetting) {',
            '            return;',
            '        }',
            '        if (nvInit() != 0) return;',
            '',
            '        void* hSession = nullptr;',
            '        if (createSession(&hSession) != 0 || !hSession) return;',
            '',
            '        if (loadSettings(hSession) == 0) {',
            '            void* hProfile = nullptr;',
            '            if (getBaseProfile(hSession, &hProfile) == 0 && hProfile) {',
            '                struct NvDrsSettingV1 {',
            '                    uint32_t version;',
            '                    wchar_t settingName[2048];',
            '                    uint32_t settingId;',
            '                    uint32_t settingType;',
            '                    uint32_t settingLocation;',
            '                    uint32_t isCurrentPredefined;',
            '                    uint32_t isPredefinedValid;',
            '                    uint32_t u32PredefinedValue;',
            '                    uint8_t padPredefined[4092];',
            '                    uint32_t u32CurrentValue;',
            '                    uint8_t padCurrent[4092];',
            '                };',
            '                NvDrsSettingV1 setting{};',
            '                setting.version = static_cast<uint32_t>(sizeof(NvDrsSettingV1)) | (1u << 16);',
            '                setting.settingId = 0x20D690F8u; // OGL_CPL_PREFER_DXPRESENT_ID',
            '                setting.settingType = 0u;        // NVDRS_DWORD_TYPE',
            '                setting.u32CurrentValue = 1u;    // OGL_CPL_PREFER_DXPRESENT_PREFER_ENABLED',
            '                setting.u32PredefinedValue = 1u;',
            '                if (setSetting(hSession, hProfile, &setting) == 0) {',
            '                    saveSettings(hSession);',
            '                }',
            '            }',
            '        }',
            '        destroySession(hSession);',
            '    }',
            '',
            '    void initEngine() {',
            '        bool expected = false;',
            '        if (!workerRunning.compare_exchange_strong(expected, true)) return;',
            '',
            '        _putenv_s("OGL_CPL_PREFER_DXPRESENT", "1");',
            '        SetEnvironmentVariableA("OGL_CPL_PREFER_DXPRESENT", "1");',
            '',
            '        LARGE_INTEGER freq{}, now{};',
            '        QueryPerformanceFrequency(&freq);',
            '        QueryPerformanceCounter(&now);',
            '        qpcFreq = freq.QuadPart;',
            '        lastCallQpc = now.QuadPart;',
            '        lastPresentQpc = now.QuadPart;',
            '        avgCallIntervalQpc = qpcFreq / 240;',
            '',
            '        lastVBlankEdgeQpc.store(now.QuadPart, std::memory_order_relaxed);',
            '        refreshPeriodQpc.store(qpcFreq / 60, std::memory_order_relaxed);',
            '',
            '        if (HMODULE hWinmm = LoadLibraryA("winmm.dll")) {',
            '            if (auto pTimeBegin = reinterpret_cast<PFN_timeBeginPeriod>(GetProcAddress(hWinmm, "timeBeginPeriod"))) {',
            '                pTimeBegin(1);',
            '            }',
            '        }',
            '        if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '            pDwmExtendFrame = reinterpret_cast<PFN_DwmExtendFrameIntoClientArea>(GetProcAddress(hDwm, "DwmExtendFrameIntoClientArea"));',
            '        }',
            '        if (HMODULE hUser = GetModuleHandleA("user32.dll")) {',
            '            pChangeDisplaySettingsA = reinterpret_cast<PFN_ChangeDisplaySettingsA>(GetProcAddress(hUser, "ChangeDisplaySettingsA"));',
            '        }',
            '        if (HMODULE hGdi = GetModuleHandleA("gdi32.dll")) {',
            '            pGetDeviceCaps = reinterpret_cast<PFN_GetDeviceCaps>(GetProcAddress(hGdi, "GetDeviceCaps"));',
            '        }',
            '',
            '        // Background VBlank Listener Thread (0% CPU, sleeps on hardware VBlank via DwmFlush)',
            '        std::thread([]() {',
            '            enableNvidiaNativeDxgiProfile();',
            '',
            '            PFN_DwmFlush localDwmFlush = nullptr;',
            '            if (HMODULE hDwm = LoadLibraryA("dwmapi.dll")) {',
            '                localDwmFlush = reinterpret_cast<PFN_DwmFlush>(GetProcAddress(hDwm, "DwmFlush"));',
            '            }',
            '',
            '            LARGE_INTEGER f{};',
            '            QueryPerformanceFrequency(&f);',
            '            int64_t lFreq = f.QuadPart;',
            '            int64_t prevEdge = 0;',
            '            int64_t smoothPeriod = lFreq / 60;',
            '',
            '            while (true) {',
            '                if (localDwmFlush && localDwmFlush() == 0) {',
            '                    LARGE_INTEGER edge{};',
            '                    QueryPerformanceCounter(&edge);',
            '                    if (prevEdge > 0) {',
            '                        int64_t diff = edge.QuadPart - prevEdge;',
            '                        if (diff >= (lFreq / 360) && diff <= (lFreq / 40)) {',
            '                            smoothPeriod = (smoothPeriod * 7 + diff) / 8;',
            '                            refreshPeriodQpc.store(smoothPeriod, std::memory_order_relaxed);',
            '                        }',
            '                    }',
            '                    prevEdge = edge.QuadPart;',
            '                    lastVBlankEdgeQpc.store(edge.QuadPart, std::memory_order_release);',
            '                    vblankTicket.fetch_add(1, std::memory_order_release);',
            '                } else {',
            '                    std::this_thread::sleep_for(std::chrono::milliseconds(16));',
            '                    LARGE_INTEGER edge{};',
            '                    QueryPerformanceCounter(&edge);',
            '                    lastVBlankEdgeQpc.store(edge.QuadPart, std::memory_order_release);',
            '                    vblankTicket.fetch_add(1, std::memory_order_release);',
            '                }',
            '            }',
            '        }).detach();',
            '    }',
            '',
            '    // Configures the game window so Windows 11 DWM always uses Tear-Free VBlank Composition',
            '    // instead of promoting the window into tearing Direct-Flip mode',
            '    void ensureDwmComposedWindow(HDC hdc) {',
            '        if (!hdc) return;',
            '        HWND hwnd = WindowFromDC(hdc);',
            '        if (!hwnd || hwnd == configuredHwnd) return;',
            '        configuredHwnd = hwnd;',
            '        appliedSwapInterval = -999;',
            '',
            '        if (pGetDeviceCaps) {',
            '            int hz = pGetDeviceCaps(hdc, 116); // VREFRESH = 116',
            '            if (hz >= 30 && hz <= 360 && qpcFreq > 0) {',
            '                refreshPeriodQpc.store(qpcFreq / hz, std::memory_order_relaxed);',
            '            }',
            '        }',
            '',
            '        // 1. Exit legacy Exclusive Fullscreen so DWM controls VBlank scanout',
            '        HMONITOR hMon = MonitorFromWindow(hwnd, MONITOR_DEFAULTTONEAREST);',
            '        MONITORINFO mi{};',
            '        mi.cbSize = sizeof(MONITORINFO);',
            '        if (GetMonitorInfoA(hMon, &mi)) {',
            '            RECT wr{};',
            '            if (GetWindowRect(hwnd, &wr)) {',
            '                int monW = mi.rcMonitor.right - mi.rcMonitor.left;',
            '                int monH = mi.rcMonitor.bottom - mi.rcMonitor.top;',
            '                if ((wr.right - wr.left) >= monW - 4 && (wr.bottom - wr.top) >= monH - 4) {',
            '                    if (pChangeDisplaySettingsA) {',
            '                        pChangeDisplaySettingsA(nullptr, 0);',
            '                    }',
            '                    LONG_PTR style = GetWindowLongPtrA(hwnd, GWL_STYLE);',
            '                    style &= ~(WS_CAPTION | WS_THICKFRAME | WS_MINIMIZEBOX | WS_MAXIMIZEBOX | WS_SYSMENU);',
            '                    style |= WS_POPUP | WS_VISIBLE;',
            '                    SetWindowLongPtrA(hwnd, GWL_STYLE, style);',
            '                    SetWindowPos(',
            '                        hwnd, HWND_TOP,',
            '                        mi.rcMonitor.left, mi.rcMonitor.top,',
            '                        monW, monH,',
            '                        SWP_NOOWNERZORDER | SWP_NOACTIVATE | SWP_FRAMECHANGED | SWP_SHOWWINDOW',
            '                    );',
            '                }',
            '            }',
            '        }',
            '',
            '        if (pDwmExtendFrame) {',
            '            DwmMargins margins{-1, -1, -1, -1};',
            '            pDwmExtendFrame(hwnd, &margins);',
            '        }',
            '',
            '        // 2. Attach a 1x1 invisible click-through layered anchor window at (0,0)',
            '        // so Windows 11 DWM never puts the window into tearing Direct-Flip mode',
            '        if (compositionAnchorHwnd && IsWindow(compositionAnchorHwnd)) {',
            '            DestroyWindow(compositionAnchorHwnd);',
            '            compositionAnchorHwnd = nullptr;',
            '        }',
            '        compositionAnchorHwnd = CreateWindowExA(',
            '            0x00080000L | 0x00000020L | 0x00000080L | 0x08000000L, // WS_EX_LAYERED | WS_EX_TRANSPARENT | WS_EX_TOOLWINDOW | WS_EX_NOACTIVATE',
            '            "STATIC",',
            '            "",',
            '            0x80000000L, // WS_POPUP',
            '            0, 0, 1, 1,',
            '            hwnd,',
            '            nullptr,',
            '            GetModuleHandleA(nullptr),',
            '            nullptr',
            '        );',
            '        if (compositionAnchorHwnd) {',
            '            SetLayeredWindowAttributes(compositionAnchorHwnd, 0, 1, 0x00000002); // Alpha = 1/255 (completely invisible)',
            '            ShowWindow(compositionAnchorHwnd, 4); // SW_SHOWNOACTIVATE',
            '        }',
            '    }',
            '',
            '    bool shouldSwapInSafeZone() {',
            '        initEngine();',
            '',
            '        if (!apisResolved) {',
            '            apisResolved = true;',
            '            if (HMODULE hGl = GetModuleHandleA("opengl32.dll")) {',
            '                pGlFlush = reinterpret_cast<PFN_glFlush>(GetProcAddress(hGl, "glFlush"));',
            '                pGetCurrentDC = reinterpret_cast<PFN_wglGetCurrentDC>(GetProcAddress(hGl, "wglGetCurrentDC"));',
            '                pGetProcAddress = reinterpret_cast<PFN_wglGetProcAddress>(GetProcAddress(hGl, "wglGetProcAddress"));',
            '            }',
            '        }',
            '        if (!pSwapInterval && pGetProcAddress) {',
            '            pSwapInterval = reinterpret_cast<PFN_wglSwapIntervalEXT>(pGetProcAddress("wglSwapIntervalEXT"));',
            '        }',
            '        if (pGetCurrentDC) {',
            '            ensureDwmComposedWindow(pGetCurrentDC());',
            '        }',
            '',
            '        // Keep driver V-Sync at 0 so the main thread never stalls',
            '        if (pSwapInterval && appliedSwapInterval != 0) {',
            '            pSwapInterval(0);',
            '            appliedSwapInterval = 0;',
            '        }',
            '',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '',
            '        int64_t callDelta = now.QuadPart - lastCallQpc;',
            '        lastCallQpc = now.QuadPart;',
            '',
            '        int64_t period = refreshPeriodQpc.load(std::memory_order_relaxed);',
            '        if (callDelta > (qpcFreq / 2000) && callDelta < (period * 2)) {',
            '            avgCallIntervalQpc = (avgCallIntervalQpc * 7 + callDelta) / 8;',
            '        }',
            '',
            '        uint64_t curTicket = vblankTicket.load(std::memory_order_acquire);',
            '        int64_t lastEdge = lastVBlankEdgeQpc.load(std::memory_order_acquire);',
            '        int64_t sinceVBlankEdge = now.QuadPart - lastEdge;',
            '        if (sinceVBlankEdge < 0) sinceVBlankEdge = 0;',
            '        int64_t phaseInCycle = (period > 0) ? (sinceVBlankEdge % period) : 0;',
            '',
            '        // Detect whether Bismuth DifferenceMode (or 60 FPS cap) is already pacing swapBuffers calls',
            '        bool externalDividerActive = (avgCallIntervalQpc >= (period * 72) / 100);',
            '',
            '        if (!externalDividerActive) {',
            '            // Raw Unlock FPS (120 / 240 / 360 / 480 FPS):',
            '            // Only swap ONCE per VBlank ticket, and ONLY inside the Post-VBlank Safe Zone',
            '            // (the first 82% of the cycle right after DwmFlush, when DWM is NOT reading the surface)',
            '            int64_t safeZoneEnd = (period * 82) / 100;',
            '            int64_t sinceLastPresent = now.QuadPart - lastPresentQpc;',
            '',
            '            if (curTicket > lastPresentedTicket && phaseInCycle <= safeZoneEnd) {',
            '                lastPresentedTicket = curTicket;',
            '                lastPresentQpc = now.QuadPart;',
            '                if (pGlFlush) pGlFlush();',
            '                return true;',
            '            }',
            '',
            '            // Safety fallback if DwmFlush ticket was delayed for more than 1.25 refresh periods',
            '            if (sinceLastPresent >= (period * 125) / 100) {',
            '                lastPresentedTicket = curTicket;',
            '                lastPresentQpc = now.QuadPart;',
            '                if (pGlFlush) pGlFlush();',
            '                return true;',
            '            }',
            '',
            '            return false;',
            '        } else {',
            '            // Bismuth DifferenceMode is active (already calling swapBuffers at ~60Hz):',
            '            // Never skip frames! If Bismuth happens to call right inside the final 14% DWM read danger zone,',
            '            // wait ~1ms for DwmFlush to finish reading so the swap lands at 0.0ms of the new Safe Zone.',
            '            int64_t dangerZoneStart = (period * 86) / 100;',
            '            if (phaseInCycle >= dangerZoneStart && phaseInCycle < period) {',
            '                int64_t waitLimit = now.QuadPart + (period - phaseInCycle) + (qpcFreq / 2000);',
            '                while (vblankTicket.load(std::memory_order_acquire) == curTicket) {',
            '                    QueryPerformanceCounter(&now);',
            '                    if (now.QuadPart >= waitLimit) break;',
            '                    std::this_thread::yield();',
            '                }',
            '            }',
            '            lastPresentedTicket = vblankTicket.load(std::memory_order_relaxed);',
            '            lastPresentQpc = now.QuadPart;',
            '            if (pGlFlush) pGlFlush();',
            '            return true;',
            '        }',
            '    }',
            '    #endif',
            '}',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    static void onModify(auto& self) {',
            '        (void)self.setHookPriority("cocos2d::CCEGLView::swapBuffers", 1000000);',
            '    }',
            '',
            '    void swapBuffers() {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        if (!ZeroLagNoTearV9::shouldSwapInSafeZone()) {',
            '            return;',
            '        }',
            '        #endif',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    ZeroLagNoTearV9::initEngine();',
            '    #endif',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod for GD 2.2081 (Geode SDK v5.11.2)
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2

      - name: Verify and Package Complete .geode Archive for GD 2.2081
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null

          $geodeCandidate = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.geode" -Recurse |
                            Sort-Object Length -Descending |
                            Select-Object -First 1

          if (-not $geodeCandidate) {
            Write-Error "No .geode file found in build directory!"
            exit 1
          }

          $destGeode = Join-Path $PWD "artifact\yingseo.notear-fps-22081.geode"
          Copy-Item -Path $geodeCandidate.FullName -Destination $destGeode -Force

          $zip = [System.IO.Compression.ZipFile]::Open($destGeode, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $hasDll = $false
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -like "*.dll" -and $entry.Length -gt 4096) {
                $hasDll = $true
              }
            }

            if (-not $hasDll) {
              $dllFile = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.dll" -Recurse |
                         Where-Object { $_.Name -like "*NoTear*" -or $_.Name -like "*yingseo*" } |
                         Sort-Object Length -Descending |
                         Select-Object -First 1
              if ($dllFile) {
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $dllFile.FullName, "yingseo.notear-fps-22081.dll") | Out-Null
              }
            }

            foreach ($asset in @("mod.json", "logo.png", "about.md", "changelog.md")) {
              $assetPath = Join-Path $PWD $asset
              if (Test-Path $assetPath) {
                $existing = $zip.GetEntry($asset)
                if ($existing) { $existing.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $assetPath, $asset) | Out-Null
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTearFPS-GD-2.2081-v9.0.0
          path: artifact/*.geode
