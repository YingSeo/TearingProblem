            '                    HANDLE hDev = pWglDXOpenDeviceNV(testDev);',
            '                    if (hDev) {',
            '                        D3D11Texture2DDesc capDesc{};',
            '                        capDesc.Width = w; capDesc.Height = h; capDesc.MipLevels = 1; capDesc.ArraySize = 1;',
            '                        capDesc.Format = 87; capDesc.SampleDesc.Count = 1; capDesc.Usage = 0;',
            '                        capDesc.BindFlags = 0x20 | 0x08; capDesc.MiscFlags = 0;',
            '',
            '                        void* capTex = nullptr;',
            '                        if (reinterpret_cast<PFN_CreateTex2D>((*reinterpret_cast<void***>(testDev))[5])(testDev, &capDesc, nullptr, &capTex) >= 0 && capTex) {',
            '                            uint32_t rbo = 0, tex = 0;',
            '                            HANDLE hObj = nullptr;',
            '                            bool usingRbo = false;',
            '',
            '                            if (pGlGenRenderbuffers && pGlBindRenderbuffer && pGlFramebufferRenderbuffer) {',
            '                                int32_t prevRbo = 0;',
            '                                pGlGetIntegerv(kGL_RENDERBUFFER_BINDING, &prevRbo);',
            '                                pGlGenRenderbuffers(1, &rbo);',
            '                                pGlBindRenderbuffer(kGL_RENDERBUFFER, rbo);',
            '                                pGlBindRenderbuffer(kGL_RENDERBUFFER, static_cast<uint32_t>(prevRbo));',
            '                                hObj = pWglDXRegisterObjectNV(hDev, capTex, rbo, kGL_RENDERBUFFER, kWGL_ACCESS_READ_WRITE_NV);',
            '                                if (hObj) usingRbo = true;',
            '                            }',
            '',
            '                            if (!hObj && pGlGenTextures && pGlBindTexture && pGlFramebufferTexture2D) {',
            '                                if (rbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &rbo); rbo = 0; }',
            '                                pGlGenTextures(1, &tex);',
            '                                pGlBindTexture(kGL_TEXTURE_2D, tex);',
            '                                pGlBindTexture(kGL_TEXTURE_2D, 0);',
            '                                hObj = pWglDXRegisterObjectNV(hDev, capTex, tex, kGL_TEXTURE_2D, kWGL_ACCESS_READ_WRITE_NV);',
            '                            }',
            '',
            '                            if (hObj) {',
            '                                uint32_t fbo = 0;',
            '                                int32_t prevDrawFbo = 0;',
            '                                pGlGetIntegerv(kGL_DRAW_FRAMEBUFFER_BINDING, &prevDrawFbo);',
            '                                pGlGenFramebuffers(1, &fbo);',
            '                                if (pWglDXLockObjectsNV(hDev, 1, &hObj)) {',
            '                                    pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, fbo);',
            '                                    if (usingRbo) {',
            '                                        pGlFramebufferRenderbuffer(kGL_DRAW_FRAMEBUFFER, kGL_COLOR_ATTACHMENT0, kGL_RENDERBUFFER, rbo);',
            '                                    } else {',
            '                                        pGlFramebufferTexture2D(kGL_DRAW_FRAMEBUFFER, kGL_COLOR_ATTACHMENT0, kGL_TEXTURE_2D, tex, 0);',
            '                                    }',
            '                                    uint32_t status = pGlCheckFramebufferStatus ? pGlCheckFramebufferStatus(kGL_DRAW_FRAMEBUFFER) : kGL_FRAMEBUFFER_COMPLETE;',
            '                                    pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevDrawFbo));',
            '                                    pWglDXUnlockObjectsNV(hDev, 1, &hObj);',
            '',
            '                                    if (status == kGL_FRAMEBUFFER_COMPLETE) {',
            '                                        interopDevice = testDev; interopContext = testCtx; hInteropDevice = hDev;',
            '                                        interopCaptureTex = capTex; hInteropObject = hObj;',
            '                                        glInteropFbo = fbo; glInteropRbo = rbo; glInteropTex = tex;',
            '                                        matchedAdapter = cand;',
            '                                        break;',
            '                                    }',
            '                                }',
            '                                pGlDeleteFramebuffers(1, &fbo);',
            '                                pWglDXUnregisterObjectNV(hDev, hObj);',
            '                            }',
            '                            if (rbo && pGlDeleteRenderbuffers) pGlDeleteRenderbuffers(1, &rbo);',
            '                            if (tex && pGlDeleteTextures) pGlDeleteTextures(1, &tex);',
            '                            comRelease(capTex);',
            '                        }',
            '                        pWglDXCloseDeviceNV(hDev);',
            '                    }',
            '                    comRelease(testCtx); comRelease(testDev);',
            '                }',
            '                comRelease(cand);',
            '            }',
            '        }',
            '',
            '        if (!matchedAdapter || !interopDevice || !hInteropObject) {',
            '            comRelease(factory);',
            '            return false;',
            '        }',
            '',
            '        uint32_t flOut = 0;',
            '        bool dualOk = (pD3D11CreateDevice(matchedAdapter, 0, nullptr, 0x20, nullptr, 0, 7, &presentDevice, &flOut, &presentContext) >= 0) &&',
            '                      presentDevice && presentContext;',
            '',
            '        if (dualOk) {',
            '            D3D11Texture2DDesc ringDesc{};',
            '            ringDesc.Width = w; ringDesc.Height = h; ringDesc.MipLevels = 1; ringDesc.ArraySize = 1;',
            '            ringDesc.Format = 87; ringDesc.SampleDesc.Count = 1; ringDesc.Usage = 0;',
            '            ringDesc.BindFlags = 0x20 | 0x08; ringDesc.MiscFlags = 2; // D3D11_RESOURCE_MISC_SHARED',
            '',
            '            for (int i = 0; i < 3; ++i) {',
            '                void* dxgiRes = nullptr; HANDLE sharedHandle = nullptr;',
            '                if (reinterpret_cast<PFN_CreateTex2D>((*reinterpret_cast<void***>(interopDevice))[5])(interopDevice, &ringDesc, nullptr, &ringTexMain[i]) < 0 || !ringTexMain[i] ||',
            '                    comQI(ringTexMain[i], &kIID_IDXGIResource, &dxgiRes) < 0 || !dxgiRes ||',
            '                    reinterpret_cast<PFN_GetSharedHandle>((*reinterpret_cast<void***>(dxgiRes))[8])(dxgiRes, &sharedHandle) < 0 || !sharedHandle ||',
            '                    reinterpret_cast<PFN_OpenSharedRes>((*reinterpret_cast<void***>(presentDevice))[28])(presentDevice, sharedHandle, &kIID_ID3D11Texture2D, &ringTexPresent[i]) < 0 || !ringTexPresent[i]) {',
            '                    comRelease(dxgiRes);',
            '                    dualOk = false;',
            '                    break;',
            '                }',
            '                comRelease(dxgiRes);',
            '            }',
            '        }',
            '',
            '        if (!dualOk) {',
            '            for (int i = 0; i < 3; ++i) { comRelease(ringTexPresent[i]); comRelease(ringTexMain[i]); }',
            '            comRelease(presentContext); comRelease(presentDevice);',
            '            enableMTProtected(interopDevice);',
            '            presentDevice = interopDevice; presentContext = interopContext; singleDeviceMode = true;',
            '',
            '            D3D11Texture2DDesc ringDesc{};',
            '            ringDesc.Width = w; ringDesc.Height = h; ringDesc.MipLevels = 1; ringDesc.ArraySize = 1;',
            '            ringDesc.Format = 87; ringDesc.SampleDesc.Count = 1; ringDesc.Usage = 0;',
            '            ringDesc.BindFlags = 0x08; ringDesc.MiscFlags = 0;',
            '            for (int i = 0; i < 3; ++i) {',
            '                if (reinterpret_cast<PFN_CreateTex2D>((*reinterpret_cast<void***>(interopDevice))[5])(interopDevice, &ringDesc, nullptr, &ringTexMain[i]) < 0 || !ringTexMain[i]) {',
