            '        if (!hDxgi || !hD3D11 || !hGl) return (interopSupported = false);',
            '',
            '        pCreateDXGIFactory1 = reinterpret_cast<decltype(pCreateDXGIFactory1)>(GetProcAddress(hDxgi, "CreateDXGIFactory1"));',
            '        pD3D11CreateDevice  = reinterpret_cast<decltype(pD3D11CreateDevice)>(GetProcAddress(hD3D11, "D3D11CreateDevice"));',
            '        pGetProcAddress     = reinterpret_cast<decltype(pGetProcAddress)>(GetProcAddress(hGl, "wglGetProcAddress"));',
            '        pGetCurrentDC       = reinterpret_cast<decltype(pGetCurrentDC)>(GetProcAddress(hGl, "wglGetCurrentDC"));',
            '        pGetCurrentContext  = reinterpret_cast<decltype(pGetCurrentContext)>(GetProcAddress(hGl, "wglGetCurrentContext"));',
            '',
            '        pGlGetString       = reinterpret_cast<decltype(pGlGetString)>(GetProcAddress(hGl, "glGetString"));',
            '        pGlGetIntegerv     = reinterpret_cast<decltype(pGlGetIntegerv)>(GetProcAddress(hGl, "glGetIntegerv"));',
            '        pGlIsEnabled       = reinterpret_cast<decltype(pGlIsEnabled)>(GetProcAddress(hGl, "glIsEnabled"));',
            '        pGlEnable          = reinterpret_cast<decltype(pGlEnable)>(GetProcAddress(hGl, "glEnable"));',
            '        pGlDisable         = reinterpret_cast<decltype(pGlDisable)>(GetProcAddress(hGl, "glDisable"));',
            '        pGlReadBuffer      = reinterpret_cast<decltype(pGlReadBuffer)>(GetProcAddress(hGl, "glReadBuffer"));',
            '        pGlFlush           = reinterpret_cast<decltype(pGlFlush)>(GetProcAddress(hGl, "glFlush"));',
            '        pGlGenTextures     = reinterpret_cast<decltype(pGlGenTextures)>(GetProcAddress(hGl, "glGenTextures"));',
            '        pGlDeleteTextures  = reinterpret_cast<decltype(pGlDeleteTextures)>(GetProcAddress(hGl, "glDeleteTextures"));',
            '        pGlBindTexture     = reinterpret_cast<decltype(pGlBindTexture)>(GetProcAddress(hGl, "glBindTexture"));',
            '',
            '        if (!pCreateDXGIFactory1 || !pD3D11CreateDevice || !pGetProcAddress || !pGetCurrentDC || !pGetCurrentContext) {',
            '            return (interopSupported = false);',
            '        }',
            '',
            '        pWglSwapIntervalEXT      = reinterpret_cast<decltype(pWglSwapIntervalEXT)>(pGetProcAddress("wglSwapIntervalEXT"));',
            '        pWglDXOpenDeviceNV       = reinterpret_cast<decltype(pWglDXOpenDeviceNV)>(pGetProcAddress("wglDXOpenDeviceNV"));',
            '        pWglDXCloseDeviceNV      = reinterpret_cast<decltype(pWglDXCloseDeviceNV)>(pGetProcAddress("wglDXCloseDeviceNV"));',
            '        pWglDXRegisterObjectNV   = reinterpret_cast<decltype(pWglDXRegisterObjectNV)>(pGetProcAddress("wglDXRegisterObjectNV"));',
            '        pWglDXUnregisterObjectNV = reinterpret_cast<decltype(pWglDXUnregisterObjectNV)>(pGetProcAddress("wglDXUnregisterObjectNV"));',
            '        pWglDXLockObjectsNV      = reinterpret_cast<decltype(pWglDXLockObjectsNV)>(pGetProcAddress("wglDXLockObjectsNV"));',
            '        pWglDXUnlockObjectsNV    = reinterpret_cast<decltype(pWglDXUnlockObjectsNV)>(pGetProcAddress("wglDXUnlockObjectsNV"));',
            '',
            '        pGlGenFramebuffers         = reinterpret_cast<decltype(pGlGenFramebuffers)>(pGetProcAddress("glGenFramebuffers"));',
            '        pGlDeleteFramebuffers      = reinterpret_cast<decltype(pGlDeleteFramebuffers)>(pGetProcAddress("glDeleteFramebuffers"));',
            '        pGlBindFramebuffer         = reinterpret_cast<decltype(pGlBindFramebuffer)>(pGetProcAddress("glBindFramebuffer"));',
            '        pGlCheckFramebufferStatus  = reinterpret_cast<decltype(pGlCheckFramebufferStatus)>(pGetProcAddress("glCheckFramebufferStatus"));',
            '        pGlGenRenderbuffers        = reinterpret_cast<decltype(pGlGenRenderbuffers)>(pGetProcAddress("glGenRenderbuffers"));',
            '        pGlDeleteRenderbuffers     = reinterpret_cast<decltype(pGlDeleteRenderbuffers)>(pGetProcAddress("glDeleteRenderbuffers"));',
            '        pGlBindRenderbuffer        = reinterpret_cast<decltype(pGlBindRenderbuffer)>(pGetProcAddress("glBindRenderbuffer"));',
            '        pGlFramebufferRenderbuffer = reinterpret_cast<decltype(pGlFramebufferRenderbuffer)>(pGetProcAddress("glFramebufferRenderbuffer"));',
            '        pGlFramebufferTexture2D    = reinterpret_cast<decltype(pGlFramebufferTexture2D)>(pGetProcAddress("glFramebufferTexture2D"));',
            '        pGlBlitFramebuffer         = reinterpret_cast<decltype(pGlBlitFramebuffer)>(pGetProcAddress("glBlitFramebuffer"));',
            '',
            '        pGlFenceSync      = reinterpret_cast<decltype(pGlFenceSync)>(pGetProcAddress("glFenceSync"));',
            '        pGlClientWaitSync = reinterpret_cast<decltype(pGlClientWaitSync)>(pGetProcAddress("glClientWaitSync"));',
            '        pGlDeleteSync     = reinterpret_cast<decltype(pGlDeleteSync)>(pGetProcAddress("glDeleteSync"));',
            '',
            '        if (!pWglDXOpenDeviceNV || !pWglDXRegisterObjectNV || !pWglDXLockObjectsNV || !pWglDXUnlockObjectsNV ||',
            '            !pGlGenFramebuffers || !pGlBindFramebuffer || !pGlBlitFramebuffer) {',
            '            return (interopSupported = false);',
            '        }',
            '        return true;',
            '    }',
            '',
            '    void destroyResourcesLocked() {',
            '        bridgeActive.store(false, std::memory_order_release);',
            '        latestReadySlot.store(-1, std::memory_order_relaxed);',
            '        presentingSlot.store(-1, std::memory_order_relaxed);',
            '',
            '        if (blitFence && pGlDeleteSync) {',
            '            pGlDeleteSync(blitFence);',
            '            blitFence = nullptr;',
            '        }',
            '        if (blitInFlight && hInteropDevice && hInteropObject && pWglDXUnlockObjectsNV) {',
            '            pWglDXUnlockObjectsNV(hInteropDevice, 1, &hInteropObject);',
            '        }',
            '        blitInFlight = false;',
            '',
            '        if (hInteropDevice && hInteropObject && pWglDXUnregisterObjectNV) {',
            '            pWglDXUnregisterObjectNV(hInteropDevice, hInteropObject);',
            '        }',
            '        hInteropObject = nullptr;',
            '',
            '        if (glInteropFbo && pGlDeleteFramebuffers) { pGlDeleteFramebuffers(1, &glInteropFbo); glInteropFbo = 0; }',
            '        if (glInteropRbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &glInteropRbo); glInteropRbo = 0; }',
            '        if (glInteropTex && pGlDeleteTextures) { pGlDeleteTextures(1, &glInteropTex); glInteropTex = 0; }',
            '',
            '        if (hInteropDevice && pWglDXCloseDeviceNV) {',
            '            pWglDXCloseDeviceNV(hInteropDevice);',
            '        }',
            '        hInteropDevice = nullptr;',
            '',
            '        for (int i = 0; i < 3; ++i) {',
            '            if (singleDeviceMode) ringTexPresent[i] = nullptr;',
            '            else comRelease(ringTexPresent[i]);',
            '            comRelease(ringTexMain[i]);',
            '        }',
            '',
            '        comRelease(interopCaptureTex);',
            '        comRelease(dxgiSwapChain);',
            '',
            '        if (singleDeviceMode) { presentContext = nullptr; presentDevice = nullptr; }',
            '        else { comRelease(presentContext); comRelease(presentDevice); }',
            '        comRelease(interopContext);',
            '        comRelease(interopDevice);',
            '        singleDeviceMode = false;',
            '    }',
            '',
            '    void prepareBorderlessWindow(HWND hwnd, HDC hdc) {',
            '        if (hdc && pGetDeviceCaps) {',
            '            int hz = pGetDeviceCaps(hdc, 116);',
            '            if (hz >= 30 && hz <= 360 && qpcFreq > 0) {',
            '                refreshPeriodTicks.store(qpcFreq / hz, std::memory_order_relaxed);',
            '            }',
            '        }',
            '        HMONITOR hMon = MonitorFromWindow(hwnd, MONITOR_DEFAULTTONEAREST);',
            '        MONITORINFO mi{}; mi.cbSize = sizeof(MONITORINFO);',
            '        if (GetMonitorInfoA(hMon, &mi)) {',
            '            RECT wr{};',
            '            if (GetWindowRect(hwnd, &wr)) {',
            '                int monW = mi.rcMonitor.right - mi.rcMonitor.left;',
            '                int monH = mi.rcMonitor.bottom - mi.rcMonitor.top;',
            '                if ((wr.right - wr.left) >= monW - 4 && (wr.bottom - wr.top) >= monH - 4) {',
            '                    if (pChangeDisplaySettingsA) pChangeDisplaySettingsA(nullptr, 0);',
            '                    LONG_PTR style = GetWindowLongPtrA(hwnd, GWL_STYLE);',
            '                    style &= ~(WS_CAPTION | WS_THICKFRAME | WS_MINIMIZEBOX | WS_MAXIMIZEBOX | WS_SYSMENU);',
            '                    style |= WS_POPUP | WS_VISIBLE;',
            '                    SetWindowLongPtrA(hwnd, GWL_STYLE, style);',
            '                    SetWindowPos(hwnd, HWND_TOP, mi.rcMonitor.left, mi.rcMonitor.top, monW, monH,',
            '                                 SWP_NOOWNERZORDER | SWP_NOACTIVATE | SWP_FRAMECHANGED | SWP_SHOWWINDOW);',
            '                }',
            '            }',
            '        }',
            '        if (pDwmExtendFrame) {',
            '            DwmMargins margins{0, 0, 0, 1};',
            '            pDwmExtendFrame(hwnd, &margins);',
            '        }',
            '    }',
            '',
            '    HWND ensureChildSwapWindow(HWND hwndParent, uint32_t w, uint32_t h) {',
            '        HINSTANCE hInst = GetModuleHandleA(nullptr);',
            '        if (!childClassRegistered) {',
            '            WNDCLASSEXA wc{}; wc.cbSize = sizeof(WNDCLASSEXA); wc.style = CS_OWNDC;',
            '            wc.lpfnWndProc = ChildSwapWndProc; wc.hInstance = hInst;',
            '            wc.lpszClassName = "GeodeBypassTearV30Child";',
            '            RegisterClassExA(&wc);',
            '            childClassRegistered = true;',
            '        }',
            '        LONG_PTR parentStyle = GetWindowLongPtrA(hwndParent, GWL_STYLE);',
            '        if (!(parentStyle & WS_CLIPCHILDREN)) {',
            '            SetWindowLongPtrA(hwndParent, GWL_STYLE, parentStyle | WS_CLIPCHILDREN | WS_CLIPSIBLINGS);',
            '        }',
            '        if (!childSwapHwnd || !IsWindow(childSwapHwnd) || GetParent(childSwapHwnd) != hwndParent) {',
            '            if (childSwapHwnd && IsWindow(childSwapHwnd)) DestroyWindow(childSwapHwnd);',
            '            childSwapHwnd = CreateWindowExA(',
            '                WS_EX_NOPARENTNOTIFY | WS_EX_TRANSPARENT, "GeodeBypassTearV30Child", "",',
            '                WS_CHILD | WS_VISIBLE | WS_CLIPSIBLINGS | WS_DISABLED,',
            '                0, 0, static_cast<int>(w), static_cast<int>(h), hwndParent, nullptr, hInst, nullptr);',
            '        } else {',
            '            SetWindowPos(childSwapHwnd, HWND_TOP, 0, 0, static_cast<int>(w), static_cast<int>(h), SWP_NOACTIVATE | SWP_SHOWWINDOW);',
            '        }',
            '        return childSwapHwnd;',
            '    }',
            '',
            '    // Dedicated Background V-Sync Presenter Thread:',
            '    // Pinned to the last logical CPU core so it NEVER preempts the Main Thread on Core 0!',
            '    void presenterThreadLoop() {',
            '        SYSTEM_INFO sysInfo{};',
            '        GetSystemInfo(&sysInfo);',
            '        DWORD lastCore = (sysInfo.dwNumberOfProcessors > 1) ? (sysInfo.dwNumberOfProcessors - 1) : 0;',
            '        SetThreadIdealProcessor(GetCurrentThread(), lastCore);',
            '        SetThreadPriority(GetCurrentThread(), THREAD_PRIORITY_ABOVE_NORMAL);',
            '',
            '        while (true) {',
            '            WaitForSingleObject(hFrameReadyEvent, 30);',
            '',
            '            if (!bridgeActive.load(std::memory_order_acquire)) {',
            '                vblankReadyForCapture.store(true, std::memory_order_release);',
            '                continue;',
            '            }',
            '',
            '            int slot = latestReadySlot.exchange(-1, std::memory_order_acq_rel);',
            '            if (slot < 0 || slot >= 3) {',
            '                LARGE_INTEGER now{};',
            '                QueryPerformanceCounter(&now);',
            '                lastVBlankQpc.store(now.QuadPart, std::memory_order_release);',
            '                vblankReadyForCapture.store(true, std::memory_order_release);',
            '                continue;',
            '            }',
            '            presentingSlot.store(slot, std::memory_order_release);',
            '',
            '            std::unique_lock<std::mutex> lock(bridgeMutex);',
            '            if (!bridgeActive.load(std::memory_order_relaxed) || !dxgiSwapChain || !presentContext || !ringTexPresent[slot]) {',
            '                presentingSlot.store(-1, std::memory_order_release);',
            '                vblankReadyForCapture.store(true, std::memory_order_release);',
            '                continue;',
            '            }',
            '',
            '            void* backBuffer = nullptr;',
            '            if (reinterpret_cast<PFN_GetBuffer>((*reinterpret_cast<void***>(dxgiSwapChain))[9])(dxgiSwapChain, 0, &kIID_ID3D11Texture2D, &backBuffer) >= 0 && backBuffer) {',
            '                reinterpret_cast<PFN_CopyResource>((*reinterpret_cast<void***>(presentContext))[47])(presentContext, backBuffer, ringTexPresent[slot]);',
            '                comRelease(backBuffer);',
            '            }',
            '',
            '            void* sc = dxgiSwapChain;',
            '            comAddRef(sc);',
            '            presentingSlot.store(-1, std::memory_order_release);',
            '            lock.unlock();',
            '',
            '            LARGE_INTEGER beforePresent{}, afterPresent{};',
            '            QueryPerformanceCounter(&beforePresent);',
            '',
            '            // Hardware V-Sync Present(1, 0) on isolated presentDevice',
            '            reinterpret_cast<PFN_Present>((*reinterpret_cast<void***>(sc))[8])(sc, 1, 0);',
            '            comRelease(sc);',
            '',
            '            QueryPerformanceCounter(&afterPresent);',
            '            int64_t presentElapsed = afterPresent.QuadPart - beforePresent.QuadPart;',
            '            int64_t period = refreshPeriodTicks.load(std::memory_order_relaxed);',
            '',
            '            if (pDwmFlush && period > 0 && presentElapsed < (period / 4)) {',
            '                pDwmFlush();',
            '                QueryPerformanceCounter(&afterPresent);',
            '            }',
            '',
            '            lastVBlankQpc.store(afterPresent.QuadPart, std::memory_order_release);',
            '            vblankReadyForCapture.store(true, std::memory_order_release);',
            '        }',
            '    }',
            '',
            '    void ensurePresenterThreadStarted() {',
            '        bool expected = false;',
            '        if (presenterThreadStarted.compare_exchange_strong(expected, true)) {',
            '            hFrameReadyEvent = CreateEventA(nullptr, FALSE, FALSE, nullptr);',
            '            std::thread(presenterThreadLoop).detach();',
            '        }',
            '    }',
            '',
            '    uint32_t detectPreferredGlVendorId() {',
            '        if (!pGlGetString) return 0;',
            '        const char* v = reinterpret_cast<const char*>(pGlGetString(kGL_VENDOR));',
            '        if (!v) return 0;',
            '        if (std::strstr(v, "NVIDIA") || std::strstr(v, "nvidia")) return 0x10DE;',
            '        if (std::strstr(v, "Intel") || std::strstr(v, "INTEL")) return 0x8086;',
            '        if (std::strstr(v, "AMD") || std::strstr(v, "ATI")) return 0x1002;',
            '        return 0;',
            '    }',
            '',
            '    bool createFlipSwapChainOnWindow(void* factory, HWND hwnd, uint32_t w, uint32_t h) {',
            '        DxgiSwapChainDesc sd{};',
            '        sd.BufferDesc.Width = w;',
            '        sd.BufferDesc.Height = h;',
            '        sd.BufferDesc.RefreshRate.Numerator = 0;',
            '        sd.BufferDesc.RefreshRate.Denominator = 1;',
            '        sd.BufferDesc.Format = 87;          // DXGI_FORMAT_B8G8R8A8_UNORM',
            '        sd.SampleDesc.Count = 1;',
            '        sd.SampleDesc.Quality = 0;',
            '        sd.BufferUsage = 0x20;              // DXGI_USAGE_RENDER_TARGET_OUTPUT',
            '        sd.BufferCount = 3;                 // 3-buffer Flip-Discard',
            '        sd.OutputWindow = hwnd;',
            '        sd.Windowed = 1;',
            '        sd.SwapEffect = 4;                  // DXGI_SWAP_EFFECT_FLIP_DISCARD',
            '        sd.Flags = 0;                       // 0 = NO ALLOW_TEARING',
            '',
            '        auto createSc = reinterpret_cast<PFN_CreateSC>((*reinterpret_cast<void***>(factory))[10]);',
            '        long hr = createSc(factory, presentDevice, &sd, &dxgiSwapChain);',
            '        if (hr < 0 || !dxgiSwapChain) {',
            '            sd.SwapEffect = 3;',
            '            hr = createSc(factory, presentDevice, &sd, &dxgiSwapChain);',
            '        }',
            '        if (hr < 0 || !dxgiSwapChain) {',
            '            HWND child = ensureChildSwapWindow(hwnd, w, h);',
            '            if (child) {',
            '                sd.OutputWindow = child;',
            '                sd.SwapEffect = 4;',
            '                hr = createSc(factory, presentDevice, &sd, &dxgiSwapChain);',
            '                if (hr < 0 || !dxgiSwapChain) {',
            '                    sd.SwapEffect = 3;',
            '                    hr = createSc(factory, presentDevice, &sd, &dxgiSwapChain);',
            '                }',
            '            }',
            '        } else if (childSwapHwnd && IsWindow(childSwapHwnd)) {',
            '            ShowWindow(childSwapHwnd, SW_HIDE);',
            '        }',
            '',
            '        if (hr >= 0 && dxgiSwapChain) {',
            '            reinterpret_cast<PFN_MakeWinAssoc>((*reinterpret_cast<void***>(factory))[8])(factory, sd.OutputWindow, 1 | 2);',
            '            if (!singleDeviceMode) {',
            '                // Limit isolated presentDevice queue depth to 1 frame -> eliminates 3-buffer click lag!',
            '                setDeviceMaxLatency1(presentDevice);',
            '            }',
            '            return true;',
            '        }',
            '        return false;',
            '    }',
            '',
            '    bool tryInitTier1Interop(HWND hwnd, uint32_t w, uint32_t h) {',
            '        void* factory = nullptr;',
            '        if (pCreateDXGIFactory1(&kIID_IDXGIFactory1, &factory) < 0 || !factory) return false;',
            '',
            '        uint32_t preferredVendor = detectPreferredGlVendorId();',
            '        void* matchedAdapter = nullptr;',
            '',
            '        for (int pass = 0; pass < 2 && !matchedAdapter; ++pass) {',
            '            for (uint32_t idx = 0; ; ++idx) {',
            '                void* cand = nullptr;',
            '                if (reinterpret_cast<PFN_EnumAdapters1>((*reinterpret_cast<void***>(factory))[12])(factory, idx, &cand) < 0 || !cand) break;',
            '',
            '                DxgiAdapterDesc1 desc{};',
            '                reinterpret_cast<PFN_GetDesc1>((*reinterpret_cast<void***>(cand))[10])(cand, &desc);',
            '                bool isPref = (preferredVendor != 0 && desc.VendorId == preferredVendor);',
            '                if ((pass == 0 && !isPref) || (pass == 1 && isPref && preferredVendor != 0)) {',
            '                    comRelease(cand);',
            '                    continue;',
            '                }',
            '',
            '                void* testDev = nullptr;',
            '                void* testCtx = nullptr;',
            '                uint32_t flOut = 0;',
            '                if (pD3D11CreateDevice(cand, 0, nullptr, 0x20, nullptr, 0, 7, &testDev, &flOut, &testCtx) >= 0 && testDev) {',
            '                    HANDLE hDev = pWglDXOpenDeviceNV(testDev);',
            '                    if (hDev) {',
            '                        D3D11Texture2DDesc capDesc{};',
            '                        capDesc.Width = w; capDesc.Height = h; capDesc.MipLevels = 1; capDesc.ArraySize = 1;',
            '                        capDesc.Format = 87; capDesc.SampleDesc.Count = 1; capDesc.Usage = 0;',
            '                        capDesc.BindFlags = 0x20 | 0x08; capDesc.MiscFlags = 0;',
            '',
            '                        void* capTex = nullptr;',
            '                        if (reinterpret_cast<PFN_CreateTex2D>((*reinterpret_cast<void***>(testDev))[5])(testDev, &capDesc, nullptr, &capTex) >= 0 && capTex) {',
            '                            uint32_t rbo = 0, tex = 0;',
            '                            HANDLE hObj = nullptr;',
            '                            bool usingRbo = false;',
            '',
            '                            if (pGlGenRenderbuffers && pGlBindRenderbuffer && pGlFramebufferRenderbuffer) {',
            '                                int32_t prevRbo = 0;',
            '                                pGlGetIntegerv(kGL_RENDERBUFFER_BINDING, &prevRbo);',
            '                                pGlGenRenderbuffers(1, &rbo);',
            '                                pGlBindRenderbuffer(kGL_RENDERBUFFER, rbo);',
            '                                pGlBindRenderbuffer(kGL_RENDERBUFFER, static_cast<uint32_t>(prevRbo));',
            '                                hObj = pWglDXRegisterObjectNV(hDev, capTex, rbo, kGL_RENDERBUFFER, kWGL_ACCESS_READ_WRITE_NV);',
            '                                if (hObj) usingRbo = true;',
            '                            }',
            '',
            '                            if (!hObj && pGlGenTextures && pGlBindTexture && pGlFramebufferTexture2D) {',
            '                                if (rbo && pGlDeleteRenderbuffers) { pGlDeleteRenderbuffers(1, &rbo); rbo = 0; }',
            '                                pGlGenTextures(1, &tex);',
            '                                pGlBindTexture(kGL_TEXTURE_2D, tex);',
            '                                pGlBindTexture(kGL_TEXTURE_2D, 0);',
            '                                hObj = pWglDXRegisterObjectNV(hDev, capTex, tex, kGL_TEXTURE_2D, kWGL_ACCESS_READ_WRITE_NV);',
            '                            }',
            '',
            '                            if (hObj) {',
            '                                uint32_t fbo = 0;',
            '                                int32_t prevDrawFbo = 0;',
            '                                pGlGetIntegerv(kGL_DRAW_FRAMEBUFFER_BINDING, &prevDrawFbo);',
            '                                pGlGenFramebuffers(1, &fbo);',
            '                                if (pWglDXLockObjectsNV(hDev, 1, &hObj)) {',
            '                                    pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, fbo);',
            '                                    if (usingRbo) {',
            '                                        pGlFramebufferRenderbuffer(kGL_DRAW_FRAMEBUFFER, kGL_COLOR_ATTACHMENT0, kGL_RENDERBUFFER, rbo);',
            '                                    } else {',
            '                                        pGlFramebufferTexture2D(kGL_DRAW_FRAMEBUFFER, kGL_COLOR_ATTACHMENT0, kGL_TEXTURE_2D, tex, 0);',
            '                                    }',
            '                                    uint32_t status = pGlCheckFramebufferStatus ? pGlCheckFramebufferStatus(kGL_DRAW_FRAMEBUFFER) : kGL_FRAMEBUFFER_COMPLETE;',
            '                                    pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevDrawFbo));',
            '                                    pWglDXUnlockObjectsNV(hDev, 1, &hObj);',
            '',
            '                                    if (status == kGL_FRAMEBUFFER_COMPLETE) {',
            '                                        interopDevice = testDev; interopContext = testCtx; hInteropDevice = hDev;',
            '                                        interopCaptureTex = capTex; hInteropObject = hObj;',
            '                                        glInteropFbo = fbo; glInteropRbo = rbo; glInteropTex = tex;',
            '                                        matchedAdapter = cand;',
            '                                        break;',
            '                                    }',
            '                                }',
            '                                pGlDeleteFramebuffers(1, &fbo);',
            '                                pWglDXUnregisterObjectNV(hDev, hObj);',
            '                            }',
            '                            if (rbo && pGlDeleteRenderbuffers) pGlDeleteRenderbuffers(1, &rbo);',
            '                            if (tex && pGlDeleteTextures) pGlDeleteTextures(1, &tex);',
            '                            comRelease(capTex);',
            '                        }',
            '                        pWglDXCloseDeviceNV(hDev);',
            '                    }',
            '                    comRelease(testCtx); comRelease(testDev);',
            '                }',
            '                comRelease(cand);',
            '            }',
            '        }',
            '',
            '        if (!matchedAdapter || !interopDevice || !hInteropObject) {',
            '            comRelease(factory);',
            '            return false;',
            '        }',
            '',
            '        uint32_t flOut = 0;',
            '        bool dualOk = (pD3D11CreateDevice(matchedAdapter, 0, nullptr, 0x20, nullptr, 0, 7, &presentDevice, &flOut, &presentContext) >= 0) &&',
            '                      presentDevice && presentContext;',
            '',
            '        if (dualOk) {',
            '            D3D11Texture2DDesc ringDesc{};',
            '            ringDesc.Width = w; ringDesc.Height = h; ringDesc.MipLevels = 1; ringDesc.ArraySize = 1;',
            '            ringDesc.Format = 87; ringDesc.SampleDesc.Count = 1; ringDesc.Usage = 0;',
            '            ringDesc.BindFlags = 0x20 | 0x08; ringDesc.MiscFlags = 2;',
            '',
            '            for (int i = 0; i < 3; ++i) {',
            '                void* dxgiRes = nullptr; HANDLE sharedHandle = nullptr;',
            '                if (reinterpret_cast<PFN_CreateTex2D>((*reinterpret_cast<void***>(interopDevice))[5])(interopDevice, &ringDesc, nullptr, &ringTexMain[i]) < 0 || !ringTexMain[i] ||',
            '                    comQI(ringTexMain[i], &kIID_IDXGIResource, &dxgiRes) < 0 || !dxgiRes ||',
            '                    reinterpret_cast<PFN_GetSharedHdl>((*reinterpret_cast<void***>(dxgiRes))[8])(dxgiRes, &sharedHandle) < 0 || !sharedHandle ||',
            '                    reinterpret_cast<PFN_OpenSharedRes>((*reinterpret_cast<void***>(presentDevice))[28])(presentDevice, sharedHandle, &kIID_ID3D11Texture2D, &ringTexPresent[i]) < 0 || !ringTexPresent[i]) {',
            '                    comRelease(dxgiRes);',
            '                    dualOk = false;',
            '                    break;',
            '                }',
            '                comRelease(dxgiRes);',
            '            }',
            '        }',
            '',
            '        if (!dualOk) {',
            '            for (int i = 0; i < 3; ++i) { comRelease(ringTexPresent[i]); comRelease(ringTexMain[i]); }',
            '            comRelease(presentContext); comRelease(presentDevice);',
            '            enableMTProtected(interopDevice);',
            '            presentDevice = interopDevice; presentContext = interopContext; singleDeviceMode = true;',
            '',
            '            D3D11Texture2DDesc ringDesc{};',
            '            ringDesc.Width = w; ringDesc.Height = h; ringDesc.MipLevels = 1; ringDesc.ArraySize = 1;',
            '            ringDesc.Format = 87; ringDesc.SampleDesc.Count = 1; ringDesc.Usage = 0;',
            '            ringDesc.BindFlags = 0x08; ringDesc.MiscFlags = 0;',
            '            for (int i = 0; i < 3; ++i) {',
            '                if (reinterpret_cast<PFN_CreateTex2D>((*reinterpret_cast<void***>(interopDevice))[5])(interopDevice, &ringDesc, nullptr, &ringTexMain[i]) < 0 || !ringTexMain[i]) {',
            '                    comRelease(matchedAdapter); comRelease(factory); return false;',
            '                }',
            '                ringTexPresent[i] = ringTexMain[i];',
            '            }',
            '        }',
            '',
            '        comRelease(matchedAdapter);',
            '        bool scOk = createFlipSwapChainOnWindow(factory, hwnd, w, h);',
            '        comRelease(factory);',
            '        return scOk;',
            '    }',
            '',
            '    bool rebuildSurface(HWND hwnd, HDC mainDC, HGLRC hglrc, uint32_t w, uint32_t h) {',
            '        ensurePresenterThreadStarted();',
            '        std::lock_guard<std::mutex> lock(bridgeMutex);',
            '        destroyResourcesLocked();',
            '        prepareBorderlessWindow(hwnd, mainDC);',
            '        if (pWglSwapIntervalEXT) pWglSwapIntervalEXT(0);',
            '',
            '        if (!tryInitTier1Interop(hwnd, w, h)) {',
            '            destroyResourcesLocked();',
            '            return (interopSupported = false);',
            '        }',
            '',
            '        trackedHwnd = hwnd; cachedDC = mainDC; trackedGlrc = hglrc;',
            '        surfaceWidth = w; surfaceHeight = h;',
            '        vblankReadyForCapture.store(true, std::memory_order_release);',
            '        bridgeActive.store(true, std::memory_order_release);',
            '        return true;',
            '    }',
            '',
            '    int pickFreeWriteSlot() {',
            '        int busyPresent = presentingSlot.load(std::memory_order_acquire);',
            '        int busyLatest = latestReadySlot.load(std::memory_order_acquire);',
            '        for (int offset = 1; offset <= 3; ++offset) {',
            '            int cand = (lastWrittenSlot + offset) % 3;',
            '            if (cand != busyPresent && cand != busyLatest) {',
            '                lastWrittenSlot = cand;',
            '                return cand;',
            '            }',
            '        }',
            '        return (lastWrittenSlot + 1) % 3;',
            '    }',
            '',
            '    // Unlocks glInteropFbo and publishes to ringTexMain[writeSlot] BEFORE glClear() / visit() runs!',
            '    // Because glBlitFramebuffer(FBO 0 -> glInteropFbo) was already flushed at the end of Frame K',
            '    // and the inter-frame sleep has elapsed, pWglDXUnlockObjectsNV returns in 0.0001ms with ZERO GPU stall!',
            '    bool completeInFlightBlitPreVisit(uint64_t waitTimeoutNs) {',
            '        if (!blitInFlight) return true;',
            '',
            '        if (blitFence && pGlClientWaitSync) {',
            '            uint32_t flags = (waitTimeoutNs > 0ULL) ? 1u : 0u;',
            '            uint32_t res = pGlClientWaitSync(blitFence, flags, waitTimeoutNs);',
            '            if (res != kGL_ALREADY_SIGNALED && res != kGL_CONDITION_SATISFIED && waitTimeoutNs == 0ULL) {',
            '                return false; // Still finishing on GPU; onSchedulerPostUpdate will catch it!',
            '            }',
            '            pGlDeleteSync(blitFence);',
            '            blitFence = nullptr;',
            '        }',
            '',
            '        pWglDXUnlockObjectsNV(hInteropDevice, 1, &hInteropObject);',
            '        blitInFlight = false;',
            '',
            '        int writeSlot = pickFreeWriteSlot();',
            '        reinterpret_cast<PFN_CopyResource>((*reinterpret_cast<void***>(interopContext))[47])(interopContext, ringTexMain[writeSlot], interopCaptureTex);',
            '        reinterpret_cast<PFN_Flush>((*reinterpret_cast<void***>(interopContext))[111])(interopContext);',
            '',
            '        latestReadySlot.store(writeSlot, std::memory_order_release);',
            '        SetEvent(hFrameReadyEvent);',
            '        return true;',
            '    }',
            '',
            '    // Step 1 of Frame K+1: Runs at the START of CCScheduler::update(dt) (after inter-frame wait, BEFORE physics & visit)',
            '    void onSchedulerPreUpdate() {',
            '        if (!bridgeActive.load(std::memory_order_relaxed)) return;',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '        schedStartQpc = now.QuadPart;',
            '',
            '        if (blitInFlight && pGetCurrentContext && pGetCurrentContext() == trackedGlrc) {',
            '            completeInFlightBlitPreVisit(0ULL); // 0ns non-blocking check',
            '        }',
            '    }',
            '',
            '    // Step 2 of Frame K+1: Runs at the END of CCScheduler::update(dt) (RIGHT BEFORE glClear() & visit()!):',
            '    // Guarantees hInteropObject is 100% unlocked before visit() starts, and arms the 2-frame respawn shield!',
            '    void onSchedulerPostUpdate() {',
            '        if (!bridgeActive.load(std::memory_order_relaxed)) return;',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '',
            '        // If CCScheduler::update(dt) took >= 2.2ms on the CPU (e.g. PlayLayer::destroyPlayer or resetLevel),',
            '        // shield the current respawn frame + 1 recovery frame from starting a new WGL-DXGI capture!',
            '        if ((now.QuadPart - schedStartQpc) >= (qpcFreq * 22) / 10000) {',
            '            cooldownFramesAfterSpike = 2;',
            '        }',
            '',
            '        if (blitInFlight && pGetCurrentContext && pGetCurrentContext() == trackedGlrc) {',
            '            // Guarantee unlock completes BEFORE glClear() and visit() of Frame K+1 begin!',
            '            completeInFlightBlitPreVisit(600000ULL);',
            '        }',
            '    }',
            '',
            '    bool submitFrameV30() {',
            '        if (!interopSupported) return false;',
            '',
            '        // One-Time Startup Loading Screen Latch (0.000ms overhead once MenuLayer is reached):',
            '        if (!startupLoadingComplete) {',
            '            auto* dir = cocos2d::CCDirector::sharedDirector();',
            '            auto* scene = dir ? dir->getRunningScene() : nullptr;',
            '            if (!scene || scene->getChildByType<LoadingLayer>(0) != nullptr) {',
            '                return false;',
            '            }',
            '            startupLoadingComplete = true;',
            '        }',
            '',
            '        if (!loadAllApis()) return false;',
            '',
            '        HDC mainDC = pGetCurrentDC();',
            '        HGLRC hglrc = pGetCurrentContext();',
            '        if (!mainDC || !hglrc) return false;',
            '',
            '        uint32_t w = surfaceWidth;',
            '        uint32_t h = surfaceHeight;',
            '        HWND hwnd = trackedHwnd;',
            '',
            '        if (mainDC != cachedDC || !hwnd || (++rectCheckCounter & 31u) == 0u) {',
            '            hwnd = WindowFromDC(mainDC);',
            '            if (!hwnd) return false;',
            '            RECT rc{};',
            '            if (!GetClientRect(hwnd, &rc)) return false;',
            '            w = static_cast<uint32_t>(rc.right - rc.left);',
            '            h = static_cast<uint32_t>(rc.bottom - rc.top);',
            '        }',
            '        if (w == 0 || h == 0) return true;',
            '',
            '        if (!bridgeActive.load(std::memory_order_acquire) ||',
            '            hwnd != trackedHwnd || hglrc != trackedGlrc || w != surfaceWidth || h != surfaceHeight) {',
            '            if (!rebuildSurface(hwnd, mainDC, hglrc, w, h)) return false;',
            '        }',
            '',
            '        // Safety check in case CCDirector::isPaused() skipped CCScheduler::update',
            '        if (blitInFlight) {',
            '            completeInFlightBlitPreVisit(600000ULL);',
            '        }',
            '',
            '        LARGE_INTEGER now{};',
            '        QueryPerformanceCounter(&now);',
            '',
            '        int64_t callDelta = now.QuadPart - lastCallQpc;',
            '        lastCallQpc = now.QuadPart;',
            '        int64_t period = refreshPeriodTicks.load(std::memory_order_relaxed);',
            '',
            '        // 1. Level Load (onPlay) / Level Exit (onQuit) Gap Reset:',
            '        bool isLoadGap = (callDelta >= period * 2);',
            '        if (isLoadGap) {',
            '            consecutive60HzFrames = 0;',
            '            cooldownFramesAfterSpike = 0;',
            '            vblankReadyForCapture.store(true, std::memory_order_release);',
            '            lastVBlankQpc.store(now.QuadPart - period, std::memory_order_release);',
            '        }',
            '',
            '        // 2. 6-Frame Hysteresis Detector for 60Hz Callers vs Unlocked 240+ FPS:',
            '        if (callDelta >= (period * 72) / 100 && !isLoadGap) {',
            '            consecutiveHighRateFrames = 0;',
            '            if (++consecutive60HzFrames >= 6) {',
            '                is60HzCallerMode = true;',
            '            }',
            '        } else if (callDelta > 0 && callDelta <= (period * 58) / 100) {',
            '            consecutive60HzFrames = 0;',
            '            if (++consecutiveHighRateFrames >= 2) {',
            '                is60HzCallerMode = false;',
            '            }',
            '        }',
            '',
            '        // 3. 2-Tick Respawn Cooldown Shield (Eliminates repeated death/respawn stutter at unlocked FPS!):',
            '        if (cooldownFramesAfterSpike > 0) {',
            '            --cooldownFramesAfterSpike;',
            '            if (!is60HzCallerMode) {',
            '                if (pGlFlush) pGlFlush();',
            '                return true;',
            '            }',
            '        }',
            '',
            '        // 4. 40% VBlank Late-Latch Gate (Eliminates Click / Jump Delay):',
            '        //    Wait until 40% into the 60Hz VBlank cycle (~6.6ms after VBlank) before capturing at 240+ FPS,',
            '        //    so we capture a fresh frame and unlock it at the start of the next tick (~10.8ms) well before 16.67ms!',
            '        int64_t sinceVBlank = now.QuadPart - lastVBlankQpc.load(std::memory_order_acquire);',
            '        int64_t sinceLastCapture = now.QuadPart - lastCaptureQpc;',
            '        bool shouldCapture = is60HzCallerMode || isLoadGap ||',
            '            (vblankReadyForCapture.load(std::memory_order_acquire) && (sinceVBlank >= (period * 40) / 100)) ||',
            '            (sinceLastCapture >= (period * 95) / 100);',
            '',
            '        if (!shouldCapture) {',
            '            // Intermediate 240Hz tick: Flush OpenGL command stream smoothly so 4 frames never batch up on heavy levels!',
            '            if (pGlFlush) pGlFlush();',
            '            return true;',
            '        }',
            '',
            '        vblankReadyForCapture.store(false, std::memory_order_relaxed);',
            '        lastCaptureQpc = now.QuadPart;',
            '',
            '        int32_t prevReadFbo = 0, prevDrawFbo = 0;',
            '        pGlGetIntegerv(kGL_READ_FRAMEBUFFER_BINDING, &prevReadFbo);',
            '        pGlGetIntegerv(kGL_DRAW_FRAMEBUFFER_BINDING, &prevDrawFbo);',
            '        unsigned char scissorWasOn = pGlIsEnabled ? pGlIsEnabled(kGL_SCISSOR_TEST) : 0;',
            '        if (scissorWasOn && pGlDisable) pGlDisable(kGL_SCISSOR_TEST);',
            '',
            '        if (!pWglDXLockObjectsNV(hInteropDevice, 1, &hInteropObject)) {',
            '            if (scissorWasOn && pGlEnable) pGlEnable(kGL_SCISSOR_TEST);',
            '            vblankReadyForCapture.store(true, std::memory_order_release);',
            '            return false;',
            '        }',
            '',
            '        // Direct 1-Blit from FBO 0 -> glInteropFbo (Cuts VRAM bandwidth in half vs glStageFbo!)',
            '        pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, 0);',
            '        if (pGlReadBuffer) pGlReadBuffer(kGL_BACK);',
            '        pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, glInteropFbo);',
            '        pGlBlitFramebuffer(',
            '            0, 0, static_cast<int32_t>(w), static_cast<int32_t>(h),',
            '            0, static_cast<int32_t>(h), static_cast<int32_t>(w), 0,',
            '            kGL_COLOR_BUFFER_BIT, kGL_NEAREST',
            '        );',
            '',
            '        pGlBindFramebuffer(kGL_READ_FRAMEBUFFER, static_cast<uint32_t>(prevReadFbo));',
            '        pGlBindFramebuffer(kGL_DRAW_FRAMEBUFFER, static_cast<uint32_t>(prevDrawFbo));',
            '        if (scissorWasOn && pGlEnable) pGlEnable(kGL_SCISSOR_TEST);',
            '',
            '        // Queue non-blocking fence and flush; onSchedulerPreUpdate/PostUpdate unlocks it BEFORE the next visit()!',
            '        if (pGlFenceSync && pGlClientWaitSync && pGlDeleteSync) {',
            '            blitFence = pGlFenceSync(kGL_SYNC_GPU_COMMANDS_COMPLETE, 0);',
            '            blitStartQpc = now.QuadPart;',
            '            blitInFlight = true;',
            '            if (pGlFlush) pGlFlush();',
            '        } else {',
            '            blitInFlight = true;',
            '            completeInFlightBlitPreVisit(600000ULL);',
            '        }',
            '',
            '        return true;',
            '    }',
            '    #endif',
            '}',
            '',
            'class $modify(TearFixScheduler, cocos2d::CCScheduler) {',
            '    void update(float dt) {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        BypassScreenTearV30::onSchedulerPreUpdate();',
            '        #endif',
            '        CCScheduler::update(dt);',
            '        #ifdef GEODE_IS_WINDOWS',
            '        BypassScreenTearV30::onSchedulerPostUpdate();',
            '        #endif',
            '    }',
            '};',
            '',
            'class $modify(TearFixEGLView, cocos2d::CCEGLView) {',
            '    static void onModify(auto& self) {',
            '        (void)self.setHookPriority("cocos2d::CCEGLView::swapBuffers", 1000000);',
            '    }',
            '',
            '    void swapBuffers() {',
            '        #ifdef GEODE_IS_WINDOWS',
            '        if (BypassScreenTearV30::submitFrameV30()) {',
            '            return;',
            '        }',
            '        #endif',
            '        CCEGLView::swapBuffers();',
            '    }',
            '};',
            '',
            '$on_mod(Loaded) {',
            '    #ifdef GEODE_IS_WINDOWS',
            '    BypassScreenTearV30::cleanAllNvidiaProfiles();',
            '    #endif',
            '}'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD "src/main.cpp"), $cppLines, $utf8NoBom)

      - name: Build Geode Mod for GD 2.2081 (Geode SDK v5.11.2)
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2

      - name: Verify and Package yingseo.notear.fps.geode Archive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null

          $geodeCandidate = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.geode" -Recurse |
                            Sort-Object Length -Descending |
                            Select-Object -First 1

          if (-not $geodeCandidate) {
            Write-Error "No .geode file found in build directory!"
            exit 1
          }

          $destGeode = Join-Path $PWD "artifact\yingseo.notear.fps.geode"
          Copy-Item -Path $geodeCandidate.FullName -Destination $destGeode -Force

          $zip = [System.IO.Compression.ZipFile]::Open($destGeode, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $hasDll = $false
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -eq "yingseo.notear.fps.dll" -and $entry.Length -gt 4096) {
                $hasDll = $true
              }
            }

            if (-not $hasDll) {
              $dllFile = Get-ChildItem -Path (Join-Path $PWD "build") -Filter "*.dll" -Recurse |
                         Where-Object { $_.Name -like "*Bypass*" -or $_.Name -like "*yingseo*" } |
                         Sort-Object Length -Descending |
                         Select-Object -First 1
              if ($dllFile) {
                $oldDll = $zip.GetEntry("yingseo.notear.fps.dll")
                if ($oldDll) { $oldDll.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $dllFile.FullName, "yingseo.notear.fps.dll") | Out-Null
              }
            }

            foreach ($asset in @("mod.json", "logo.png", "about.md", "changelog.md")) {
              $assetPath = Join-Path $PWD $asset
              if (Test-Path $assetPath) {
                $existing = $zip.GetEntry($asset)
                if ($existing) { $existing.Delete() }
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $assetPath, $asset) | Out-Null
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bypass-Screen-Tear-v30.0.0
          path: artifact/yingseo.notear.fps.geode
